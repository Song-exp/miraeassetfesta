# 배포 스택 — api(FastAPI) + caddy(TLS 종료·리버스 프록시)
#
#   docker compose up -d --build
#   docker compose logs -f
#
# 🔴 caddy_data 볼륨을 지우지 마세요.
#    발급받은 인증서가 여기 있습니다. 날리고 재발급을 반복하면
#    Let's Encrypt 주간 발급 한도(도메인당 5회/주)에 걸려 HTTPS 가 막힙니다.

services:
  api:
    build: .
    env_file: .env
    environment:
      # 🔴 컨테이너 기본은 UTC 입니다 (python:3.12-slim). 호스트가 KST 여도 로그 타임스탬프는
      #    9시간 어긋나고, 질의 로그를 팀 대화·평가 시각과 맞춰 볼 때 헷갈립니다.
      TZ: Asia/Seoul
    # 호스트에 포트를 열지 않습니다. Caddy 만 외부에 노출됩니다.
    expose:
      - "8000"
    # DB 는 이미지에 들어가지 않습니다 (.dockerignore 의 *.db · data/).
    # 호스트의 data/ 를 마운트해서 넣습니다 — 반입 절차는 docs/DEPLOY.md §6.
    #
    # 🔴 :ro 인 이유 — 에이전트는 조회만 합니다. DB 가 journal_mode=delete 라
    #    읽기 전용이어도 SELECT 는 정상 동작합니다. (WAL 이었다면 -wal/-shm 을
    #    만들지 못해 조회 자체가 막혔을 것입니다. 재빌드 시 journal_mode 를 바꾸지 마세요.)
    # 📌 서버에 data/ 가 없어도 compose 가 빈 디렉터리로 만들어 줍니다.
    #    DB 가 아직 없으면 스텁은 그대로 뜨고, 에이전트를 붙일 때 걸립니다.
    volumes:
      - ./data:/app/data:ro
      # 질의 로그 — 실험의 산출물입니다. data 와 달리 쓰기 가능해야 합니다.
      # 오답을 골라 eval/questions_*.jsonl 로 승격하는 것이 루프의 마지막 단계입니다.
      - ./logs:/app/logs
      # 🔴 실험 루프용 — Dockerfile 이 ontology/ 를 이미지에 굽지만, 여기서 덮어씁니다.
      #    이게 없으면 query_rules 한 줄을 고쳐도 이미지 재빌드가 필요합니다.
      #    있으면 `git pull && docker compose restart api` (약 5초)로 끝납니다.
      #    ⚠️ enums/*.yaml(질의 규칙)만 해당합니다. shared/*.yaml(개체·alias)을 고치면
      #       kg_* 테이블을 다시 만들어야 하므로 DB 재반입이 필요합니다.
      #    제출물 재현성은 이미지 쪽 COPY 가 그대로 보장합니다 (마운트는 운영 편의).
      - ./ontology:/app/ontology:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      # .env 의 SITE_ADDRESS=<공인IP>.nip.io
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # 🔴 인증서. 절대 삭제 금지
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    depends_on:
      - api
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
