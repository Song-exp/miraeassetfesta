<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="12">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#555"/></marker>
  </defs>
  <rect width="900" height="440" fill="#fff"/>

  <!-- 오프라인 -->
  <text x="20" y="28" font-weight="bold" font-size="14">오프라인 — 적재 · 판정 · 색인</text>
  <rect x="20" y="45" width="140" height="60" rx="6" fill="#f4f4f4" stroke="#333" stroke-width="1.5"/>
  <text x="90" y="68" text-anchor="middle" font-weight="bold">마스터</text>
  <text x="90" y="86" text-anchor="middle" fill="#333" font-size="11">21,882행 × 58컬럼</text>
  <path d="M160,75 L195,75" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="198" y="45" width="180" height="60" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="288" y="63" text-anchor="middle" font-weight="bold">프로파일러 전수 스캔</text>
  <text x="288" y="80" text-anchor="middle" fill="#333" font-size="11">+ 사람이 컬럼마다 판정</text>
  <text x="288" y="96" text-anchor="middle" fill="#666" font-size="11">재현 SQL · 결측 7유형</text>
  <path d="M378,75 L413,75" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="416" y="35" width="170" height="80" rx="6" fill="#eef7ec" stroke="#2f855a" stroke-width="2"/>
  <text x="501" y="55" text-anchor="middle" font-weight="bold">선언 (사람이 쓰는 자리)</text>
  <text x="501" y="72" text-anchor="middle" fill="#333" font-size="11">enums/domestic_bonds.yaml</text>
  <text x="501" y="87" text-anchor="middle" fill="#333" font-size="11">shared/*.yaml</text>
  <text x="501" y="102" text-anchor="middle" fill="#333" font-size="11">코드북 CSV 1장</text>
  <path d="M586,75 L621,75" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="624" y="45" width="110" height="60" rx="6" fill="#fdf1e7" stroke="#c05621" stroke-width="2"/>
  <text x="679" y="65" text-anchor="middle" font-weight="bold">build</text>
  <text x="679" y="82" text-anchor="middle" fill="#7b3a12" font-size="11">검증 V1~V7</text>
  <text x="679" y="97" text-anchor="middle" fill="#7b3a12" font-size="11">실패 시 산출 거부</text>
  <path d="M734,75 L769,75" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="772" y="35" width="110" height="80" rx="6" fill="#e8f1fb" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="827" y="53" text-anchor="middle" font-weight="bold">산출물</text>
  <text x="827" y="70" text-anchor="middle" fill="#333" font-size="11">bond_kr.ttl 50줄</text>
  <text x="827" y="85" text-anchor="middle" fill="#333" font-size="11">KG 4테이블</text>
  <text x="827" y="100" text-anchor="middle" fill="#333" font-size="11">값 사전 vocab</text>
  <text x="827" y="130" text-anchor="middle" fill="#666" font-size="11">손대지 않는다</text>

  <line x1="20" y1="160" x2="880" y2="160" stroke="#ddd"/>

  <!-- 온라인 -->
  <text x="20" y="190" font-weight="bold" font-size="14">온라인 — 검색 · 생성</text>
  <text x="20" y="208" fill="#666" font-size="11">LLM 호출은 Plan 한 번뿐이다. 앞뒤는 전부 선언을 읽는 결정층이다.</text>

  <g>
    <rect x="20" y="230" width="90" height="70" rx="6" fill="#e8f1fb" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="65" y="252" text-anchor="middle" font-weight="bold">Route</text>
    <text x="65" y="270" text-anchor="middle" fill="#333" font-size="11">테이블 선택</text>
    <text x="65" y="290" text-anchor="middle" fill="#2b6cb0" font-size="11">LLM 0</text>
  </g>
  <path d="M110,265 L124,265" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <g>
    <rect x="126" y="230" width="90" height="70" rx="6" fill="#e8f1fb" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="171" y="252" text-anchor="middle" font-weight="bold">Ground</text>
    <text x="171" y="270" text-anchor="middle" fill="#333" font-size="11">낱말→개체→값</text>
    <text x="171" y="290" text-anchor="middle" fill="#2b6cb0" font-size="11">LLM 0</text>
  </g>
  <path d="M216,265 L230,265" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <g>
    <rect x="232" y="230" width="90" height="70" rx="6" fill="#fdf1e7" stroke="#c05621" stroke-width="1.5"/>
    <text x="277" y="252" text-anchor="middle" font-weight="bold">Gate</text>
    <text x="277" y="270" text-anchor="middle" fill="#333" font-size="11">부재·범위·표기</text>
    <text x="277" y="290" text-anchor="middle" fill="#c05621" font-size="10">LLM 0 · 기각 가능</text>
  </g>
  <path d="M322,265 L336,265" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <g>
    <rect x="338" y="230" width="100" height="70" rx="6" fill="#eef7ec" stroke="#2f855a" stroke-width="2"/>
    <text x="388" y="252" text-anchor="middle" font-weight="bold">Plan</text>
    <text x="388" y="270" text-anchor="middle" fill="#333" font-size="11">근거 25,750자</text>
    <text x="388" y="290" text-anchor="middle" fill="#2f855a" font-weight="bold" font-size="11">LLM 1 (SQL만)</text>
  </g>
  <path d="M438,265 L452,265" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <g>
    <rect x="454" y="230" width="90" height="70" rx="6" fill="#fdf1e7" stroke="#c05621" stroke-width="1.5"/>
    <text x="499" y="252" text-anchor="middle" font-weight="bold">Guard</text>
    <text x="499" y="270" text-anchor="middle" fill="#333" font-size="10">가드 36 · SQL 교정</text>
    <text x="499" y="290" text-anchor="middle" fill="#c05621" font-size="11">LLM 0</text>
  </g>
  <path d="M544,265 L558,265" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <g>
    <rect x="560" y="230" width="90" height="70" rx="6" fill="#e8f1fb" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="605" y="252" text-anchor="middle" font-weight="bold">Verify</text>
    <text x="605" y="270" text-anchor="middle" fill="#333" font-size="11">값 사전 대조</text>
    <text x="605" y="290" text-anchor="middle" fill="#2b6cb0" font-size="11">LLM 0</text>
  </g>
  <path d="M650,265 L664,265" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <g>
    <rect x="666" y="230" width="90" height="70" rx="6" fill="#f4f4f4" stroke="#333" stroke-width="1.5"/>
    <text x="711" y="252" text-anchor="middle" font-weight="bold">Execute</text>
    <text x="711" y="270" text-anchor="middle" fill="#333" font-size="11">SQLite 읽기</text>
    <text x="711" y="290" text-anchor="middle" fill="#666" font-size="11">상한 30행</text>
  </g>
  <path d="M756,265 L770,265" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <g>
    <rect x="772" y="230" width="108" height="70" rx="6" fill="#eef7ec" stroke="#2f855a" stroke-width="1.5"/>
    <text x="826" y="252" text-anchor="middle" font-weight="bold">Answer</text>
    <text x="826" y="270" text-anchor="middle" fill="#333" font-size="11">기계 조립</text>
    <text x="826" y="290" text-anchor="middle" fill="#2f855a" font-size="11">LLM 0</text>
  </g>

  <!-- 어느 층을 읽나 -->
  <text x="20" y="335" fill="#666" font-size="11">읽는 층 —</text>
  <text x="95" y="335" fill="#1a4a7a" font-size="11">■ 1층 값 사전 (Route·Ground·Verify)</text>
  <text x="330" y="335" fill="#1f5c3a" font-size="11">■ 2층 규칙 문서 (Plan·Answer)</text>
  <text x="530" y="335" fill="#7b3a12" font-size="11">■ 3층 게이트·가드 (Gate·Guard)</text>

  <rect x="20" y="360" width="860" height="60" rx="6" fill="#fafafa" stroke="#ccc"/>
  <text x="35" y="382" fill="#333" font-size="11">Gate 에서 끝나는 질의 — "투자지역이 미국인 채권" · "위험등급 7등급" · "신용등급 AAAA" · "금리가 요즘 어떻게 움직였어" → LLM 호출 0회로 기각·되묻기</text>
  <text x="35" y="402" fill="#333" font-size="11">think_trace 는 각 단계가 실제로 한 일의 로그이고 LLM 생성물이 아니다 — "왜 그렇게 답했나"를 사후에 재생할 수 있다</text>
</svg>
