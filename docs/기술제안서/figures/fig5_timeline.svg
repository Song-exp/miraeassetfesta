<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="12">
  <rect width="900" height="400" fill="#fff"/>
  <text x="450" y="26" text-anchor="middle" font-weight="bold" font-size="14">오답이 설계를 바꾼 순서 — 다시 읽기 → 선언 → 실측</text>

  <!-- 축 -->
  <line x1="40" y1="200" x2="870" y2="200" stroke="#333" stroke-width="2"/>
  <!-- 구간 표시 -->
  <rect x="40" y="192" width="200" height="16" fill="#eef7ec" opacity="0.9"/>
  <rect x="240" y="192" width="120" height="16" fill="#e8f1fb" opacity="0.9"/>
  <rect x="360" y="192" width="510" height="16" fill="#fdf1e7" opacity="0.9"/>
  <text x="140" y="228" text-anchor="middle" fill="#1f5c3a" font-size="11" font-weight="bold">다시 읽기 · 판정</text>
  <text x="300" y="228" text-anchor="middle" fill="#1a4a7a" font-size="11" font-weight="bold">선언 · 빌드</text>
  <text x="615" y="228" text-anchor="middle" fill="#7b3a12" font-size="11" font-weight="bold">서버 실측 — 사고 96건 → 설계 수정</text>

  <!-- 위쪽 이벤트 -->
  <g stroke="#333" stroke-width="1.2">
    <line x1="60" y1="200" x2="60" y2="120"/>
    <line x1="150" y1="200" x2="150" y2="150"/>
    <line x1="230" y1="200" x2="230" y2="100"/>
    <line x1="330" y1="200" x2="330" y2="150"/>
    <line x1="430" y1="200" x2="430" y2="110"/>
    <line x1="560" y1="200" x2="560" y2="150"/>
    <line x1="690" y1="200" x2="690" y2="100"/>
    <line x1="830" y1="200" x2="830" y2="140"/>
  </g>
  <g fill="#333">
    <circle cx="60" cy="200" r="4"/><circle cx="150" cy="200" r="4"/><circle cx="230" cy="200" r="4"/><circle cx="330" cy="200" r="4"/>
    <circle cx="430" cy="200" r="4"/><circle cx="560" cy="200" r="4"/><circle cx="690" cy="200" r="4"/><circle cx="830" cy="200" r="4"/>
  </g>

  <g font-size="11">
    <text x="60" y="100" text-anchor="middle" font-weight="bold">① 1차 데이터</text>
    <text x="60" y="114" text-anchor="middle" fill="#333">1차 EDA 시작</text>
    <text x="60" y="88" text-anchor="middle" fill="#666" font-size="10">42,394행 × 40컬럼</text>

    <text x="150" y="132" text-anchor="middle" font-weight="bold">② 선언</text>
    <text x="150" y="146" text-anchor="middle" fill="#333">yaml 신설 · 코드북 1장</text>

    <text x="230" y="80" text-anchor="middle" font-weight="bold">③ 2차 데이터</text>
    <text x="230" y="94" text-anchor="middle" fill="#333">2차 데이터 — 판정 전면 재작성</text>
    <text x="230" y="68" text-anchor="middle" fill="#666" font-size="10">종목명 정규식 4종 폐기 → 전용 컬럼</text>

    <text x="330" y="132" text-anchor="middle" font-weight="bold">④ 첫 실측</text>
    <text x="330" y="146" text-anchor="middle" fill="#333">선언이 프롬프트에 안 실린 것 발견</text>

    <text x="430" y="90" text-anchor="middle" font-weight="bold">⑤ 라운드 1</text>
    <text x="430" y="104" text-anchor="middle" fill="#333">등급 서열 오답 — 596 중 49행</text>
    <text x="430" y="78" text-anchor="middle" fill="#666" font-size="10">NULL 논리식 · 날짜 뺄셈 1999</text>

    <text x="560" y="132" text-anchor="middle" font-weight="bold">⑥ 라운드 2</text>
    <text x="560" y="146" text-anchor="middle" fill="#333">답변 문장을 LLM 에서 뺌 · 되묻기</text>

    <text x="690" y="80" text-anchor="middle" font-weight="bold">⑦ 라운드 4~5</text>
    <text x="690" y="94" text-anchor="middle" fill="#333">축 치환 · 가드의 오답 · 부재 4건 추가</text>
    <text x="690" y="68" text-anchor="middle" fill="#666" font-size="10">"틀린 티가 안 나는 오답"이 문제 정의로</text>

    <text x="810" y="122" text-anchor="middle" font-weight="bold">⑧ 라운드 6~7</text>
    <text x="810" y="136" text-anchor="middle" fill="#333">구멍 선제 발견 · 10문항 3/10</text>
    <text x="810" y="110" text-anchor="middle" fill="#666" font-size="10">부재 선제 선언 → 11건</text>
  </g>

  <!-- 아래쪽: 무엇이 쌓였나 -->
  <g font-size="11" fill="#333">
    <text x="40" y="270" font-weight="bold">쌓인 것</text>
    <text x="40" y="290">결측 7유형 판정 · 58컬럼 전건</text>
    <text x="40" y="308">컬럼을 읽는 판정만 살아남음</text>
    <text x="260" y="290">alias 1,840 · 노드 1,839</text>
    <text x="260" y="308">ttl 50줄 · 빌드 검증 7종</text>
    <text x="380" y="290">규칙 49 · 답변 규칙 21 · 되묻기 14 · 가드 37 · 부재 11</text>
    <text x="380" y="308">비-LLM 답변 81% · 환각 방지 9/9 · 회귀 1,355 passed</text>
  </g>
  <text x="450" y="360" text-anchor="middle" fill="#666" font-size="11">앞의 것들은 전부 서버가 틀린 답을 낸 뒤 고친 것이고, 마지막 하나는 틀리기 전에 찾은 것이다 — 오답 기록을 부류 목록으로 쓴 결과</text>
</svg>
