# 규칙 전달 감사 §4-3 — 조건 B (교정판) 의 규칙 본문
#
# 지시서 docs/rule_delivery_audit_2026-09-03.md §4-3-2 의 네 가지를 적용한 판본이다.
#   (i)  SQL 조각 형식 — "'몇 개' → COUNT(DISTINCT 펀드키)" 꼴. 산문 대신 대응표.
#   (ii) 사고 이력·강조 기호 제거 — 날짜·"실측"·"재발"·🔴·🆕 등.
#   (iii) 모순 쌍은 한쪽을 triggered 로 — 종목단위/펀드단위 가 개수 질문에 동시 주입되던 것을 끊는다.
#   (iv) 규칙 블록 상한 ≈2,500자.
#
# 🔴 이 파일은 **측정 전용**이다. ontology/enums/public_funds.yaml 을 고치지 않는다 —
#    eval/rule_delivery_paired.py 가 인메모리로만 덮어쓴다. 서버 배포 대상이 아니다.
#
# 근거: DK-1 Table VI(구조화 형식 > 평문) · ENT-1(짧은 evidence > 긴 문서) ·
#       SL-1(효과를 본 문서 ≈2,200토큰).

domain: public_funds

# ── 1. 대상 5개 규칙의 교정 본문 ─────────────────────────────────────────
replace:
  기본모수: |
    WHERE sale_yn='판매중' AND prvo_pbff_desc='공모'  (집계·Top-N 필수)
    모수 8,969행 / 3,040펀드를 답에 밝힌다.

  # (i) 질문 표현 → SQL 조각 대응표. (iii) 종목단위와 겹치던 지시를 여기 하나로 모은다.
  펀드단위: |
    펀드키 = or_co_xtn_itt_cd, COALESCE(CASE WHEN length(mtco_itm_no)>=7 THEN mtco_itm_no
            ELSE substr('0000000'||mtco_itm_no,-7) END, itm_no)
    '펀드 몇 개' → COUNT(DISTINCT 펀드키) · '클래스 몇 개' → COUNT(*)
    '몇 개'(미지정) → 둘 다 낸다 · 'N개' 랭킹 → GROUP BY 펀드키, 펀드당 1행(정렬컬럼 MAX)
    순자산 → 펀드 단위 MAX. SUM(fd_nast_suma) 금지(클래스 중복 기재)
    JOIN 시 itm_no 는 별칭 한정(p.itm_no)

  대표행: |
    랭킹·Top-N·집계 → GROUP BY 펀드키, 펀드당 1행. 역외(ofsfd_yn=1)만 행 단위.
    답에 '클래스 n개' + 대표 클래스 itm_no 병기.

  국가태그: |
    국가 조건 → ',' || prfd_attr_cds || ',' LIKE '%,<ISO3>,%'
    중국 CHN·미국 USA·인도 IND·베트남 VNM·일본 JPN·러시아 RUS·브라질 BRA·홍콩 HKG·한국 KOR·독일 DEU·인도네시아 IDN
    fd_ivst_rgn_desc 는 권역 컬럼 — 국가 조건에 쓰지 않는다.
    목록 밖 국가는 itm_nm LIKE 로 풀고 그 사실을 답에 밝힌다.

# ── 2. 모순 쌍 해소 — 종목단위를 triggered 로 내린다 (iii) ────────────────
# 근거: §4-2 실측 — '삼성자산운용이 운용하는 공모펀드는 몇 개야?' 프롬프트에
#       `종목단위: 행 = itm_no` 와 `펀드단위: GROUP BY …` 가 동시에 always_on 으로 실린다.
#       개수 질문에서 행 단위와 펀드 단위를 함께 지시받는 형태다.
retrigger:
  종목단위:
    triggers: [클래스, 종류형, 종류 X, 클래스별, 판매 단위]
    text: "행 = itm_no (클래스 단위). 클래스를 세는 질문일 때만 COUNT(*) 를 쓴다."

# ── 3. answer_rules 등급 방향 — 이력 문구 제거판 (i)(ii) ──────────────────
answer_replace:
  위험등급: |
    위험등급 zrin_fd_ivst_risk_gcd 는 1~6 이고 숫자가 작을수록 위험하다
    (1 = 매우 높은 위험, 6 = 매우 낮은 위험). 방향을 답에 밝힌다.
    NULL 은 '평가 데이터가 제공되지 않았습니다' 로 답하고 사유를 지어내지 않는다.

# ── 4. 이력·강조 기호 제거 (ii) 와 상한 (iv) 는 스크립트가 기계로 적용한다 ──
strip:
  # (a) 토큰 제거 — 강조 기호
  patterns:
    - '[🔴🆕✅⛑🟢🟡⚠️]'
  # (b) 🔴 문장 단위 제거 — 사고 이력이 문장째 들어 있어 토큰만 지우면 분량이 안 준다.
  #     이 표지가 든 문장을 통째로 뺀다. 규칙의 **지시**는 남고 **사연**만 사라진다.
  sentence_markers: '20\d\d-\d\d-\d\d|실측|재발|판정|이력|시점|\d+R |오답이|사고|원인|때문에|밤 '
  block_char_cap: 2500
