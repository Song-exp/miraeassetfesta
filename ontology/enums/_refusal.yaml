# 답변불가 규칙 — 플래너 프롬프트 층 (2026-08-30 개선 R-5 · 근거 LatentRefusal 부록 A 의 답변불가 유형을 우리 제약에 맞춰 5종으로)
#
# 거절 3단 구조에서 ② 층이다:
#   ① 스키마 부재·enum 밖·상수 컬럼 위반 = gate (HCX 호출 0회)          ← src/runtime/gate.py
#   ② 범위 밖(실시간·기준일 이후·DB 밖·인과·기준 없는 추천) = 이 파일     ← 플래너가 SQL 대신 "REFUSE: <사유>" 를 낸다
#   ③ 값 부재 = 실행 후 0행 + 조건별 진단                                 ← guard.diagnose_zero_rows
#
# 🔴 PROJECT.md 가드 — 주최는 "모호한 질의는 최대한 내지 않는다". 답변 가능한 문항에 오발동하면 그 문항은 오답이다.
#    · '추천' 은 정렬 축·모수가 질문에 있으면 **답변 가능**이다 ("보수 낮은 ETF 3개 추천" = Top-N). 기준이 전혀 없을 때만 CLARIFY 로.
#    · 아래 사유는 **질문이 DB 밖을 요구하는 것이 분명할 때만** 쓴다. 조금이라도 SQL 로 답할 수 있으면 SQL 을 낸다.
refusal_rules:
  실시간_시세: >-
    "지금·현재·실시간·오늘 시세/가격/환율" 처럼 기준일(2026-08-22) 이후의 실시간 값을 요구하면 REFUSE.
    단 "현재 판매 가능한"·"현재 위험등급" 처럼 **스냅샷 상태**를 묻는 것은 기준일 값으로 답한다 (REFUSE 아님).
  미래_예측: >-
    수익률 전망·향후 금리·주가 예측·"오를까/떨어질까"·"앞으로" 는 데이터에 없다 → REFUSE.
    단 "2027년 만기" 처럼 미래 연도가 **만기 조건**이면 답변 가능(mat_dt 조건).
  DB밖_정보: >-
    뉴스·공시 원문·애널리스트 의견·세금 계산·계좌 개설 방법·타사 상품 등 4개 마스터와 ext_* 테이블에 없는 정보 → REFUSE.
    설명서 사실(ext_fund_page)·구성종목(ext_*_holdings)은 있다 — 그건 JOIN 으로 답한다.
  인물_정보: >-
    펀드매니저·운용역·담당자 등 **사람**을 묻는 질의는 마스터에도 ext_* 에도 수록되어 있지 않다 → REFUSE.
    사유는 "제공된 데이터에 운용역 정보가 수록되어 있지 않습니다" 로 적는다 — 🔴 '개인정보 보호법'·'비공개 정책'
    같은 **법적·정책적 사유를 지어내지 않는다**(2026-08-31 실측 오답). 운용**사**(회사)는 수록돼 있으므로
    "운용사는 조회 가능하다" 는 대체 안내는 허용한다.
  인과_설명: >-
    "왜 수익률이 떨어졌나"·"원인이 뭔가" 처럼 수치의 **이유**를 묻는 것은 데이터에 없다 → REFUSE.
    수치 자체("수익률이 얼마인가")는 답한다.
  주관_판단: >-
    "좋은/안전한/괜찮은 상품 하나 골라줘" 처럼 정렬 축(보수·수익률·위험등급·순자산)도 모수(상품군·지역)도 없으면
    REFUSE 가 아니라 **CLARIFY** 로 되묻는다(되묻기 규칙). 축이 하나라도 있으면 그 축으로 Top-N 을 답한다.
출력_형식: >-
  REFUSE 를 낼 때는 "REFUSE: <사유 한 문장>" 한 줄만 낸다(SQL 없이). 사유는 위 다섯 가운데 하나를 가리킨다.
