  EB: 교환
  신주인수권부사채: 신주        # GLOB '*[0-9]BW*' (구조표시 '신주인수권부' 열, 32행)
  BW: 신주
  스트립: 분리채권              # pd_nm '분리채권' 209행 (원금·이자분리 STRIPS — 종류필터 ① 국고채 확정식의 결측 21행 포함)
  STRIPS: 분리채권
  유동화: 유동화회사채          # bd_knd '유동화회사채' — 일상어 '유동화 채권'(ABS) 은 낱말이 갈라져 라우팅에 걸리지 않았다
  콜옵션: 콜                    # pd_nm '콜' (구조표시 '콜옵션부' 열 — '콜마' 제외)
  풋옵션: 풋                    # pd_nm '(풋' (구조표시 '풋옵션부' 열)
  국고채: 국고채권              # 🔄 2026-08-31 리드 결정 — 실제 필터는 STRIPS 결측 21행 포함 확장식 (종류필터 ①, 295종목)
  회사채: 회사채                # 🔄 2026-08-31 리드 결정 — std_pd_mcls_nm 대분류가 정본 (옛 bd_knd '일반회사채' 폐기: 일상어 '회사채' 는 금융채·유동화·보험사채 포함 62→599종목 차이). '일반회사채' 라는 말이 그대로 나올 때만 bd_knd='일반회사채'
  특수채: 특수채                # std_pd_mcls_nm
  국공채: 국공채                # std_pd_mcls_nm
  MBS: MBS                      # bd_knd
  신용등급: 적용신용등급        # crd_grd 의 한글 컬럼명
  듀레이션: 듀레이션            # duration
