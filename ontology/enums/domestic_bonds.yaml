    text: "범주형·이름 컬럼은 항상 TRIM 후 비교 (bd_knd·pd_pbcm·영문명 고정폭 패딩 잔존). 🔴 비교(=·<>·IN)뿐 아니라 **집계·정렬 키(GROUP BY·ORDER BY)와 그 키를 그대로 실은 SELECT 항목**도 TRIM 한다 — 무TRIM GROUP BY pd_pbcm 은 같은 기관을 패딩으로 갈라 한국산업은행 503→500·한국토지주택공사 499→498 로 세고 2·3위 순서를 뒤집는다(2026-09-04 실측 #63). 별칭 자리(AS 뒤)는 감싸지 않는다. 런타임 가드가 =·<>·IN 을 교정하지만 처음부터 TRIM 을 쓴다. 존재하지 않는 테이블명(bonds_master 환각)은 normalize_table_names 가, 질문의 종류 낱말이 SQL 에 없으면 ensure_kind_filter 가 받는다"
    evidence: "⛑ 2026-08-31 저녁 재발(무TRIM bd_knd IN = 16행 vs TRIM 2,031행) → 런타임 가드 pipeline.ensure_trimmed_compare 가 =·<>·IN 을 교정. 2026-09-04 확장: 같은 가드가 집계·정렬 키도 감싼다(대상은 패딩으로 실제 쪼개지는 _KEY_TRIM_COLS = bd_knd·pd_pbcm 둘 — 펀드·ETF 후보는 raw = trim 이라 이득이 없고, 펀드단위 확정식 안까지 감싸면 뒤 가드가 식을 못 알아본다)."
  위험등급방향:
    text: "pd_risk_gcd 는 문자열 '11'~'16'·'00'. 뒷자리가 등급이며 숫자가 클수록 안전: 11=매우높은위험(1등급) · 12=높은위험 · 13=다소높은위험 · 14=보통위험 · 15=낮은위험 · 16=매우낮은위험(6등급) · 00=해당없음. 🔴 최상급·안정형은 '16' 단독 — '가장(제일) 안전한·위험이 가장(매우) 낮은·원금 최우선·안정형' = pd_risk_gcd = '16'. 부도-공포 서술형('망하지 않을 회사'·'돈/원금 떼일 걱정 없는'·'원금 잃기 싫은')도 같은 의도 = '16' 단독. 15를 섞으면 오답이다 (⛑ 런타임 가드 pipeline.ensure_top_safety 가 교정하지만 처음부터 '16' 단독으로 쓴다. '16' 단독이면 전 행 동급이라 수익률 내림차순은 동점자 처리로 허용). 최상급 없는 '안전한·위험 낮은·안정추구' = pd_risk_gcd IN ('15','16') — 근거 ① 협회 6등급 명칭이 5=낮은위험·6=매우낮은위험 ② 적합성 매핑에서 안정추구형은 5~6등급까지 권유 가능(4등급 '보통위험' 은 위험중립형부터) ③ 이 데이터의 5등급 = AA- 이상 회사채만(주최 예시 문항의 안전선 'AA- 이상' 과 같은 집합), 6등급 = 국공채·특수채(회사채 0). '위험중립·보통' = IN ('14','15','16'). 6등급 최고 applied_yield 는 6.23% — 질문이 그보다 높은 수익률 하한이나 6등급이 없는 종류(회사채 대분류·일반은행채·카드채·캐피탈채·보험사채·증권사채 — 2026-08-31 실측. 은행채 통칭·특수은행채는 6등급이 있어 해당 아님(구매가능 모수 1,241행·전체 1,248행 — 2026-09-02 모수 명시))를 함께 요구해 '16' 단독이 0행이 될 때만 IN ('15','16') 폴백으로 조회하고 답변에 '6등급엔 없어 5등급까지 포함' 을 밝힌다. SELECT 에 pd_risk_nm 을 넣는다. '위험 높은' = '11'(넓게 IN ('11','12','13')). '1등급' 은 최위험이지 최우량이 아니다. '0등급' 질의 = '00' 해당없음 19종목 — 정식 등급이 아니라 등급 미부여임을 밝히고 답한다. COUNT 19 를 받고 '없다' 로 답하는 것은 오답이다. 답변엔 pd_risk_nm 문구를 그대로 인용. 신용등급(crd_grd)과 별개 축 — '등급' 만 있으면 어느 쪽인지 밝힌다. 국공채는 거의 전부 '16'. 🔴 코드(pd_risk_gcd)만 SELECT 하면 답변에 '위험등급 16등급' 같은 없는 등급이 나온다 — pd_risk_nm 을 반드시 함께 넣는다."
    evidence: "(2026-09-01 실측: '망하지 않을 회사가 발행한 채권' 이 안전 어휘 밖 사각 — 가드 어휘 보강) · 2026-08-31 실측: '가장 안전한 채권 3개' 가 IN ('15','16') + 수익률 내림차순으로 나가 5등급 은행 콜옵션부 7.1% 가 1~3위 — 안전 버킷에서 가장 덜 안전한 구석이 뽑혔다. · (2026-09-02 서버 실측 ⛑ ensure_positive_count_answered 부정 단정 확장) · ⛑ 2026-08-31 저녁 실측: 코드만 SELECT 되자 답변이 '위험등급 16등급'(존재하지 않는 등급)으로 나감 → SELECT 에 pd_risk_gcd 만 있으면 런타임이 pd_risk_nm 을 붙인다(pipeline.ensure_risk_name_column)."
  수익최상급조회:
    text: "수익률·금리 최상급 조회('수익률이 가장/제일 높은·낮은 채권')에는 질문에 없는 위험등급·안전 필터를 넣지 않는다 — 최상급 '가장/제일' 은 수익률 축이지 안전 축이 아니다. 전 모수(구매가능 규칙과 같은 모수 — curr_cd='KRW' AND mat_dt >= 20260824)에서 정렬하면 1위는 신보 유동화 728.524%(C0·매우높은위험 1등급)가 사실이고, 조회는 그대로 보여주되 주의 문구(C0 부실등급·원금 손실 위험)를 단다. 조회에서는 제외하지 않는다(고위험제외 규칙). 🔴 이 원칙은 최상급 문형만이 아니라 추천·구매의향 문형('~ 사면 돼?'·'골라줘')에도 똑같다 — 질문에 안전·위험 어휘가 없으면 위험등급 필터 금지, 기본 안전장치는 고위험제외 3종(1등급·C0·사모)뿐이다 (부도-공포 서술형('망하지 않을'·'떼일 걱정 없는')은 '16' 이 정답이라 불개입). 6등급으로 좁히는 게 낫다고 판단되면 필터 적용 사실을 답변에 반드시 공지한다 — '몰래' 가 오답이다"
    evidence: "(2026-09-01 서버 실측: '수익률이 제일 높은 채권' 에 pd_risk_gcd = '16' 이 날조되어 6등급 최고 6.231% 오답. ⛑ 런타임 가드 pipeline.strip_fabricated_risk_filter 가 위험 어휘 없는 질문의 위험등급 절을 제거하지만 처음부터 넣지 않는다) · 2026-09-02 서버 실측: '1년만 굴릴 건데 어떤 채권 사면 돼?' 에 '16' 날조 — 정답 상위 이랜드월드 6.618% 등이 통째로 사라짐. ⛑ 가드 발동 범위를 추천·구매의향까지 확장."
  등급서열:
    text: "🔴 등급 낱말에 이상·이하가 붙으면 crd_grd 조건은 반드시 TRIM(crd_grd) IN (서열 확장 목록) 으로 쓴다 — '=' 단일 등급은 오답이고, >= '' 부등호는 문자열 사전순이라 서열이 아니다. 서열(높→낮): AAA > AA+ > AA0 > AA- > A+ > A0 > A- > BBB+ > BBB0 > BBB- > BB0 > BB- > B+ > B- > C0 (데이터 15종). 'AA- 이상' = TRIM(crd_grd) IN ('AAA','AA+','AA0','AA-') · 'A 이상' = 앞 7종(A- 포함 — 접미사 없는 통칭은 그 급 전체). IN 을 쓰더라도 목록이 불완전하면 오답이다 · '투자등급(BBB- 이상)' = 앞 10종 · '투기등급' = BB0 이하 5종. 사용자 표기 AA·A·BBB·BB·B 는 DB 의 AA0·A0·BBB0·BB0·B0. 표준 등급 중 BB+·B0·CCC·CC·D 는 데이터 0건 — '존재하지 않는 등급' 이 아니라 '해당 채권 없음'. 무등급(NULL) 4,020행(국공채 2,840 전부 + 특수채 254 + 회사채 926)은 등급 조건에서 빠진다 — 국공채는 '신용등급 미부여' 로 답하고 결측을 '낮은 등급' 으로 취급하지 않는다."
    evidence: "(2026-08-31 서버 실측: 'A등급 이상 회사채 표면금리 5% 초과' 가 crd_grd='A-' 로 나가 모수 599종목 중 49행만 조회·상위 금리 전부 누락) · (⛑ 2026-08-31 밤 실측: 'a등급 이상' 이 IN ('AA-','AA0',…) 로 나가 상위 표면금리 209종목 누락 — expand_grade_comparison 이 불완전 IN 도 서열 목록으로 교정)"
