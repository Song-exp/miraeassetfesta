      bd_inrt_tcd='변동금리' 830행의 srfc_irt 는 기준일 현재 적용 금리 스냅샷 — 고정금리와의 유불리 질의는
      "현재 기준금리 수준"을 역질문한 뒤 조건부 비교로 답변.

