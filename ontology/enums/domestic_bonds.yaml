  만기: 상환일자                # mat_dt
  국채: 국고채권                # 2자 통칭 — 라우팅 어휘(경계 검사로 '미국채권' 엔 안 걸림)
  물가채: 물가                  # pd_nm '%물가%' (물가연동국고채) — 구조표시 '물가연동'
  물가연동국채: 물가
  신종자본증권: 신종            # 영구채와 같은 것
  후순위채: 후순위              # pd_nm '(후)' — 구조표시 '후순위'
  녹색채권: (녹)                # ESG 라벨 — name_encoding.esg_labels
  사회적채권: (사)
  지속가능채권: (지)
