# ── 이름·코드 인코딩 — 파생 컬럼이 아니라 규칙으로 선언 (NEXT_STEPS 3원칙 ②) ──
name_encoding:
  isin_prefix:                             # pd_no 앞 3자리 → 대분류 보완 (§5.2) — 2026-08-25 2차 실측
    KR6: 회사채                            # 12,834 (단일)
    KR3: 특수채                            # 6,177 + 회사채 3 (✅ 검수 C — 국민은행 일반은행채 1·산금채 2 — 금융채라 접두 KR3 이 맞고 대분류가 예외. 접두→대분류 보완 시 이 3행은 std_pd_mcls_nm 우선)
    KR2: 국공채                            # 2,239 (단일)
    KR1: 국공채                            # 392 (단일) — 1차의 개인투자용국채 49 소멸
    KRC: 국공채                            # 209 (단일)
    KRB: 회사채                            # 27 (단일)
    XS3: 회사채                            # 1행 — XS=Euroclear. 대분류 보완값은 '회사채'
  govt_bond_name: "국고채권 SRFCX-YYMM(회차) — 숫자부 = 표면금리·만기 (srfc_irt·mat_dt 와 일치)"
  special_structure_flags:                 # 🔴 판정은 종목명 파싱 — 구분자 기준 정규식. count = 2차 실측 (2026-08-25)
    is_callable:    { pattern: "(?<![가-힣])콜(?![가-힣])", count: 2678 }   # 🔄 2026-08-30 경계식 — 옛 "[(/]콜[)/]" 2,673 은 '(신종-영구-10콜)'·'이영구5콜A'·'변/콜' 5건을 놓쳤다. 한국콜마 5건은 제외됨. 영구채 266 중 콜 265(나머지 1 은 전환사채)
    is_puttable:    { pattern: "[(/]풋[)/]",   count: 529 }
    is_convertible: { pattern: "\\d+CB|[(/]전환[)/]", count: 389 }
    is_subordinated: { pattern: "[(/]후[)/]",  count: 530 }
    is_perpetual:   { pattern: "신종|영구", count: 266, count_pd_no: 237 }   # ✅ 재검증 2026-08-25: 행 266 / 종목(pd_no) 237. 1차 450 은 재현 불가 → 종결. 차집합 41건 전부 조건부자본증권(AT1)=영구
    is_exchangeable: { pattern: "\\d+EB", count: 137 }
    is_stripped:    { pattern: "분리채권", count: 209 }         # 🔴 bd_knd 로는 식별 불가 — 유일 수단. 전부 bd_intp_tcd='할인채'
    is_bw:          { pattern: "\\d+BW", count: 32 }
    is_coco:        { pattern: "코코(?!리아)|조건부자본|조건상각|조건부\\(상\\)", count: 266 }   # 🔄 2026-08-30 — 설명용(판정 아님). 옛 187 은 '조건상각'·'조건부(상)'(영문 PWD=원금상각) 71행을 놓쳤다. 🔴 판정은 query_rules.구조표시 의 컬럼 신호(은행 3종 + 위험등급 1~3 = 278행, 코코 266 중 264 포함·나머지 2 는 bd_knd 결측)로 한다. 등급 분포 AA- 152·AA0 82·AA+ 19·A+ 12
    is_inflation_linked: { pattern: "물가", count: 6 }          # = std_pd_scls_nm '물가채' 6
    unresolved_PB:  { pattern: "\\d+PB", count: 0 }             # 2차 소멸
  esg_labels:                              # 🆕 2026-08-30 — ESG 라벨. 한글 괄호 ↔ 영문명 괄호 1:1 (G/S/T), 한 종목에 두 라벨 동시 출현 0건. ✅ 해석 확정 — 주최 무응답, 데이터 실측 근거로 팀 결정 (2026-08-31)
    is_green:          { pattern: "[(/]녹[)/]", count: 356,  eng: "(G)" }   # 녹색채권 — 영문 (G) 355/356 (1건은 영문에 표기 누락)
    is_social:         { pattern: "[(/]사[)/]", count: 1984, eng: "(S)" }   # 사회적채권 — 영문 (S) 1,982/1,984. 🔴 사모가 아니다(공모 1,981). 주금공은 2019-03 부터 MBS 를 소셜본드로 발행(공사 보도자료) — 2009~2018 발행 MBS 에 (사) 0건, 2019-03 이후 발행분은 (사)·(녹)·(지) 중 하나
    is_sustainability: { pattern: "[(/]지[)/]", count: 159,  eng: "(T)" }   # 지속가능채권 — 영문 (T) 159/159
    note: >
      판정은 한글 라벨로만 한다 — 영문 (S) 는 중소기업은행(단)·제주지역개발(특) 에도 쓰여 다의적(영문만 (S) 39행).
      "ESG 채권·녹색채권·사회적채권·지속가능채권" 질의는 이 세 패턴(합 2,499행)으로 답하고 "종목명 표기 기준" 을 병기한다. ✅ 해석 확정(2026-08-31 팀 결정) — 주최 무응답으로 데이터 실측 근거 채택: 한↔영 라벨 1:1(G/S/T) · 동시 출현 0 · (사) 1,984 중 공모 1,981 · 주금공 소셜본드 발행시기 정합.
      LIKE 형: (pd_nm LIKE '%(녹)%' OR pd_nm LIKE '%(녹/%' OR pd_nm LIKE '%/녹)%' OR pd_nm LIKE '%/녹/%') — 사·지 도 같은 4형 (각 356 · 1,984 · 159 재현).
      근거: docs/review_2026-08-26/채권_전수조사_2026-08-30.md §7-3.
  # ✅ 2차부터 전용 컬럼으로 대체된 플래그 (이름 파싱 회귀 금지):
  #    is_private → bd_ofr_tcd='사모' (2,007) · is_frn → bd_inrt_tcd IN ('변동금리','고정+변동금리') (978) ·
  #    coupon_form(이표/할인/복리) → bd_intp_tcd
  note: >
    특수구조 합집합 = 3,578행 / 3,517종목 (2차 실측 2026-08-30, LIKE 조건식 11종 ↔ 정규식 count 전부 일치). 🔴 단어 목록으로 구조를 판정하지 않는다 — 은행 자본성증권은 컬럼 신호(query_rules.구조표시), 나머지 플래그는 경계식. 플래그는 겹침(영구채에 콜·후순위 동반)이라 단일 '종류' 컬럼 불가 — O/X 플래그 (§3.1).

# ── 정규화 (문자열 비교 시 TRIM 전면) ──
normalization:
  trim_columns:
  - pd_nm
  - pd_abrv_nm
  - pd_eng_nm
  - pd_abrv_eng_nm
  - std_pd_mcls_nm
  - std_pd_scls_nm
  - bd_knd
  - pd_pbcm
  - pd_exg_mkt
  - curr_cd
  - pd_ctry_cd
  - crd_grd
  - exg_close_price_base_dt
  grade_suffix: "사용자 'AA' → 'AA0' (한국식 중간값 0 표기). 'AA'·'A'·'BBB' 단독 표기는 DB 에 0건"
  issuer: "'(주)' 위치 앞뒤 제각각 — 정규화 매핑은 kg_organization (§5.1-①)"
  bd_knd_alias: "'통화안정증권'(통칭) → '통화안정채권'(실값 33행) (§5.1-⑧)"
  zero_as_missing:                         # 주최 공지(8/24): 0/결측은 의도된 값 → 정렬·필터에서 빼고, 조회 시 "없음" 응답
    기본: "수치 컬럼 정렬·필터는 IS NOT NULL AND <> 0 기본 — 아래 zero_is_value 컬럼만 예외"
    # 🔴 2026-08-26 주최 답변으로 예외 축소 — "수익률·총보수 같은 컬럼을 질의했을 때 그 컬럼의 값이 0 인 행들은
    #     아예 포함하지 않는 게 맞다 (값이 0 이니 당연히 기준이 없음)".
    #     srfc_irt(표면금리 0값 579행) · exrt_grte_ern_r(만기보장수익률 0값 21,626행) 해제 — 둘 다 수익률·금리 랭킹 축이고
    #     각 컬럼의 answer_policy 가 이미 '>0 한정' 을 지시하고 있어 플래그가 정책과 모순 상태였다.
    #     0 이 "이자 없는 구조(CB·EB)" · "만기보장 없음" 이라는 관측 사실은 각 컬럼 trap/note 에 유지한다.
    zero_is_value:
    - bdbns_abl_chnl_tcd                   # 코드 0 = '온오프 겸용' — 범주 코드값이지 수치 랭킹 축이 아님
    zero_as_missing_columns:
    - exg_close_price                      # 0 = 거래 없음(종가 없음) 16,476
    - exg_close_yield
    - applied_yield                        # 0 = YTM 산출 대상 아님 201
    - isu_dt                               # 0 = 미수록 25
    - mat_dt                               # 0 = 미수록 4
    - isu_bal_amt                          # 0 = 잔액 없음/미기입 325
    - bd_tisu_a
    - dur                                  # 0(잔존>0) = 산출 불능
    - ndy_eval_price
    - ndy_applied_yield
    - avg_annual_tax_yield                 # 전량 0
    # 🔑 2026-08-27 전수 재현 — 위 11컬럼의 0 건수가 yaml 기재와 전부 일치.
    #   목록에 없지만 0 을 가진 수치 컬럼: cov 102 · ndy_dur 72 · ndy_cov 121 · ndy_dirty 16 · exrt_rpy_r 1 ·
    #   remaining_days 49(만기 도래 — 실제 값. columns.remaining_days.note 참조).
    #   '기본' 규칙이 모든 수치 컬럼에 걸리므로 목록 누락은 결함이 아니라 기록 누락이다 — 위 건수는 참고용.
    #   ⚠️ 이 배제 동작을 검증하는 gold 문항은 아직 없다(eval 63문항 중 remaining_days 사용 0건) — 플래너 연결 후 실측 필요.

# ── 쿼리 가드레일 ──
query_rules:
  # ── 2026-08-30 밤 압축본 — SQL 생성기용: 조건식 + 한 줄 이유만. 이력·근거·검증 수치는 docs/review_2026-08-26/채권_규칙_원문_2026-08-30.md ──
  대표행:     "종목 수 집계는 COUNT(DISTINCT pd_no) 또는 GROUP BY pd_no — 1,078종목이 장내·장외 2~4행. 속성 답변에서 '장내행 우선' 으로 한 줄만 고르지 말 것: 장외행은 종류·등급·발행사·위험등급·듀레이션이 NULL 일 수 있다. 값이 다르면 두 줄을 병기(같으면 한 번), 장외 가격엔 '액면가 수준' 단서. 결측을 옆 줄 값으로 채우지 않는다."
  판매행:     "판매 조건(매수수익률·매매단가·세후수익률) 질의는 buy_yield IS NOT NULL (634행, 전부 장외 LOT) — 복수 LOT 종목 307(2개 306 · 3개 1)은 조건 N건으로 병기"
  구매가능:    "buyable_quantity 는 무효(사용 금지). '살 수 있나' = curr_cd='KRW' AND mat_dt >= 20260822 (21,828행) 면 구매가능. 판매 조건(수익률·단가)이 수록된 것은 그중 634행(판매행) — 나머지는 '구매 가능하나 당사 판매 조건은 미수록'."
  문자열비교:   "범주형·이름 컬럼은 항상 TRIM 후 비교 (bd_knd·pd_pbcm·영문명 고정폭 패딩 잔존). ⛑ 2026-08-31 저녁 재발(무TRIM bd_knd IN = 16행 vs TRIM 2,031행) → 런타임 가드 pipeline.ensure_trimmed_compare 가 =·<>·IN 을 교정. 그래도 처음부터 TRIM 을 쓴다. 존재하지 않는 테이블명(bonds_master 환각)은 normalize_table_names 가, 질문의 종류 낱말이 SQL 에 없으면 ensure_kind_filter 가 받는다"
  위험등급방향:  "pd_risk_gcd 는 문자열 '11'~'16'·'00'. 뒷자리가 등급이며 숫자가 클수록 안전: 11=매우높은위험(1등급) · 12=높은위험 · 13=다소높은위험 · 14=보통위험 · 15=낮은위험 · 16=매우낮은위험(6등급) · 00=해당없음. 🔴 최상급·안정형은 '16' 단독 — '가장(제일) 안전한·위험이 가장(매우) 낮은·원금 최우선·안정형' = pd_risk_gcd = '16'. 15를 섞으면 오답이다 (2026-08-31 실측: '가장 안전한 채권 3개' 가 IN ('15','16') + 수익률 내림차순으로 나가 5등급 은행 콜옵션부 7.1% 가 1~3위 — 안전 버킷에서 가장 덜 안전한 구석이 뽑혔다. ⛑ 런타임 가드 pipeline.ensure_top_safety 가 교정하지만 처음부터 '16' 단독으로 쓴다. '16' 단독이면 전 행 동급이라 수익률 내림차순은 동점자 처리로 허용). 최상급 없는 '안전한·위험 낮은·안정추구' = pd_risk_gcd IN ('15','16') — 근거 ① 협회 6등급 명칭이 5=낮은위험·6=매우낮은위험 ② 적합성 매핑에서 안정추구형은 5~6등급까지 권유 가능(4등급 '보통위험' 은 위험중립형부터) ③ 이 데이터의 5등급 = AA- 이상 회사채만(주최 예시 문항의 안전선 'AA- 이상' 과 같은 집합), 6등급 = 국공채·특수채(회사채 0). '위험중립·보통' = IN ('14','15','16'). 6등급 최고 applied_yield 는 6.23% — 질문이 그보다 높은 수익률 하한이나 6등급이 없는 종류(회사채 대분류·일반은행채·카드채·캐피탈채·보험사채·증권사채 — 2026-08-31 실측. 은행채 통칭·특수은행채는 6등급 1,241행이 있어 해당 아님)를 함께 요구해 '16' 단독이 0행이 될 때만 IN ('15','16') 폴백으로 조회하고 답변에 '6등급엔 없어 5등급까지 포함' 을 밝힌다. SELECT 에 pd_risk_nm 을 넣는다. '위험 높은' = '11'(넓게 IN ('11','12','13')). '1등급' 은 최위험이지 최우량이 아니다. 답변엔 pd_risk_nm 문구를 그대로 인용. 신용등급(crd_grd)과 별개 축 — '등급' 만 있으면 어느 쪽인지 밝힌다. 국공채는 거의 전부 '16'. ⛑ 2026-08-31 저녁 실측: 코드만 SELECT 되자 답변이 '위험등급 16등급'(존재하지 않는 등급)으로 나감 → SELECT 에 pd_risk_gcd 만 있으면 런타임이 pd_risk_nm 을 붙인다(pipeline.ensure_risk_name_column). 그래도 처음부터 pd_risk_nm 을 넣는다."
  등급서열:    "🔴 등급 낱말에 이상·이하가 붙으면 crd_grd 조건은 반드시 TRIM(crd_grd) IN (서열 확장 목록) 으로 쓴다 — '=' 단일 등급은 오답이고(2026-08-31 서버 실측: 'A등급 이상 회사채 표면금리 5% 초과' 가 crd_grd='A-' 로 나가 모수 599종목 중 49행만 조회·상위 금리 전부 누락), >= '' 부등호는 문자열 사전순이라 서열이 아니다. 서열(높→낮): AAA > AA+ > AA0 > AA- > A+ > A0 > A- > BBB+ > BBB0 > BBB- > BB0 > BB- > B+ > B- > C0 (데이터 15종). 'AA- 이상' = TRIM(crd_grd) IN ('AAA','AA+','AA0','AA-') · 'A 이상' = 앞 7종(A- 포함 — 접미사 없는 통칭은 그 급 전체) · '투자등급(BBB- 이상)' = 앞 10종 · '투기등급' = BB0 이하 5종. 사용자 표기 AA·A·BBB·BB·B 는 DB 의 AA0·A0·BBB0·BB0·B0. 표준 등급 중 BB+·B0·CCC·CC·D 는 데이터 0건 — '존재하지 않는 등급' 이 아니라 '해당 채권 없음'. 무등급(NULL) 4,020행(국공채 2,840 전부 + 특수채 254 + 회사채 926)은 등급 조건에서 빠진다 — 국공채는 '신용등급 미부여' 로 답하고 결측을 '낮은 등급' 으로 취급하지 않는다."
  등급정규화:   "crd_grd 조회 시 'AA'→'AA0' 등 접미사 변환 후 비교. 국공채는 등급 없음 = 정상"
  영값배제:    "수치 정렬·필터 기본 IS NOT NULL AND <> 0 (normalization.zero_as_missing). 예외 컬럼은 zero_is_value. 0 인 행은 '해당 값이 수록되어 있지 않습니다'로 응답 (주최 공지)"
  수익률정상:   "applied_yield > 0 — =0 201행은 주식연계채 등 YTM 산출 대상 아님"
  듀레이션정상:  "dur IS NOT NULL AND dur != 99 AND dur != 0 AND remaining_days > 0 (99·0 은 결측 표기 · 만기 경과 행 제외). 익일 질의의 ndy_dur 도 같은 조건."
  익일값:     "ndy_* 컬럼은 '익일' 질의에만. 일반 질의는 당일 컬럼."
  과세수익률금지: "avg_annual_tax_yield 사용 금지 (전량 0)"
  더티금지:    "dirty·ndy_dirty 사용 금지 — 99.0%가 eval_price 동일값(정보량 0). '실제 결제금액' 답변 금지"
  등급일사용금지: "crd_grd_dt 로 등급 최신성·신선도 판단 금지 — 스키마: '등급 미변경 시 과거 일자로 유지될 수 있음'"
  이자유형분리:  "표면금리 정렬은 bd_intp_tcd·bd_inrt_tcd 로 유형 분리 — 할인채(발행 할인율)·변동금리(스냅샷)·srfc_irt=0(구조) 을 고정 이표채와 한 축에 놓지 말 것"
  장내종가:    "exg_close_price/yield 는 장내 17,746행 중 값이 0 이 아닌 1,270행만 유효(0 = 거래 없음 16,476행) — 기준일(exg_close_price_base_dt) 필수 병기. 장외 4,136행은 NULL(해당없음)"
  구조표시:    "추천·랭킹에서 특수구조(콜·풋·후순위·전환·영구·코코·분리채권·물가채)를 제외하지 않는다 — 빼는 것은 고위험제외 규칙뿐(분리채권 209 는 전부 국고채 6등급). 대신 채권 목록 SELECT 에 아래 식을 '구조' 열로 그대로 붙인다(LIKE 만 사용 · 우선순위 순): CASE WHEN TRIM(bd_knd) IN ('특수은행채','일반은행채','금융지주회사채') AND pd_risk_gcd IN ('11','12','13') THEN '은행 자본성증권(후순위·조건부자본·영구)' WHEN pd_nm LIKE '%신종%' OR pd_nm LIKE '%영구%' THEN '영구채' WHEN pd_nm LIKE '%(후)%' OR pd_nm LIKE '%(후/%' OR pd_nm LIKE '%/후)%' OR pd_nm LIKE '%/후/%' THEN '후순위' WHEN pd_nm GLOB '*[0-9]CB*' OR pd_nm LIKE '%(전환%' OR pd_nm LIKE '%/전환%' THEN '전환사채' WHEN pd_nm GLOB '*[0-9]EB*' THEN '교환사채' WHEN pd_nm GLOB '*[0-9]BW*' THEN '신주인수권부' WHEN pd_nm LIKE '%분리채권%' THEN '국고채 STRIPS' WHEN pd_nm LIKE '%물가%' THEN '물가연동' WHEN pd_nm LIKE '%콜%' AND pd_nm NOT LIKE '%콜마%' THEN '콜옵션부' WHEN pd_nm LIKE '%(풋)%' OR pd_nm LIKE '%(풋/%' OR pd_nm LIKE '%/풋)%' OR pd_nm LIKE '%/풋/%' THEN '풋옵션부' ELSE '' END AS 구조 첫 줄(은행 자본성증권)은 이름이 아니라 컬럼 두 개(발행 종류 + 위험등급 1~3)로 판정한다 — 이름의 코코/조건상각/(상) 은 판정에 쓰지 않는다. 콜은 '콜' 앞뒤에 한글이 없을 때만(한국콜마 제외). 답변에서 이 열의 값을 종목 옆에 한 단어로 붙이고, 영구채는 '만기일 = 콜 개시일', 은행 자본성증권은 '원금 상각·이자 미지급 조건 가능' 을 덧붙인다. ESG 라벨 (녹)/(사)/(지) 는 name_encoding.esg_labels. 조회·사실확인 질의는 아무것도 빼지 않는다."
  ESG라벨:        "종목명의 ESG 라벨은 컬럼이 없어 이름으로만 판정한다(표기 기준): 녹색채권 = (pd_nm LIKE '%(녹)%' OR pd_nm LIKE '%(녹/%' OR pd_nm LIKE '%/녹)%' OR pd_nm LIKE '%/녹/%') · 사회적채권 = (pd_nm LIKE '%(사)%' OR pd_nm LIKE '%(사/%' OR pd_nm LIKE '%/사)%' OR pd_nm LIKE '%/사/%') · 지속가능채권 = (pd_nm LIKE '%(지)%' OR pd_nm LIKE '%(지/%' OR pd_nm LIKE '%/지)%' OR pd_nm LIKE '%/지/%') (각 356 · 1,984 · 159행). 'ESG 채권' = 셋의 OR. 답변에 '종목명 표기 기준' 병기(해석 확정 — 주최 무응답, 데이터 실측 근거 팀 결정 2026-08-31). (사)는 사모가 아니다 — 공모/사모는 bd_ofr_tcd."
  추천개수정렬:  "추천·랭킹 질의는 LIMIT 5 가 기본이다 — 질문에 개수가 있으면(n개·n종목·top n·n가지) 그 수(상한 30). 조회·집계·사실확인 질의는 LIMIT 30 상한 그대로. 추천은 GROUP BY pd_no 로 종목당 한 줄, ORDER BY applied_yield DESC(수익률정상·고위험제외와 함께)가 기본 정렬이고 사용자가 다른 축(만기 짧은·듀레이션·표면금리·안전한 순)을 말하면 그 축으로 정렬한다. '가장 안전한 N개' 는 위험등급방향의 '16' 단독 필터가 정렬을 대신한다(전 행 동급 — 그 안의 수익률 내림차순은 동점자 처리로 허용). 정렬 없는 임의 30행은 추천이 아니다 (2026-08-30 실측: '위험 낮고 2% 이상' 에 6등급 임의 30행이 나감 — 같은 모수의 상위는 7.12·7.10·6.38%)."
  고위험제외:   "추천·랭킹 질의는 WHERE 에 pd_risk_gcd <> '11' AND COALESCE(TRIM(crd_grd), '') <> 'C0' AND bd_ofr_tcd <> '사모' 를 넣는다. ❌ NOT (pd_risk_gcd='11' OR crd_grd='C0') 금지 — crd_grd 가 NULL 인 4,020행(국공채 전부)이 통째로 빠진다. 이유: 수익률 50% 초과 96행(최고 728.5%)은 전부 C0·1등급 부실채(평가가가 액면의 27~45%)이고, 사모는 일반 투자자가 살 수 없다. 제외 사실을 답변에 밝힌다: '위험등급이 매우 높은(1등급) 채권과 사모 채권은 제외했습니다.' 조회·사실확인 질의에서는 제외하지 않는다(728.5% 는 사실) — 신용등급·위험등급을 함께 답한다. 주의 문구: 답변에 실린 종목 중 applied_yield > 6% 또는 pd_risk_gcd IN ('12','13') 이 있으면 '수익률이 높은 채권은 원금을 돌려받지 못할 위험도 높을 수 있습니다. 신용등급·위험등급을 함께 확인하세요.' 를 붙인다(조회 답변도). 추천 모수 약 19,400행 · 최고 9.82% · 국공채 최고 4.89%. ❌ 가격 기준 필터 금지 · ❌ 유동화 전체 제외 금지. ⛑ 2026-08-31 저녁 재발('AA등급 이상 추천'에 사모 3건 1~3위 혼입) → 런타임 가드: 추천·랭킹 신호 질의에 제외 절이 빠지면 pipeline.ensure_reco_exclusions 가 주입(질문이 사모·C0·고위험을 명시하면 그 절은 건너뜀). 그래도 처음부터 조건을 그대로 쓴다."
  신용보강:    "🔴 '정부가 책임지는/보증하는/나라가 갚는/안전한 공공 채권' 류 질의는 반드시 WHERE 에 아래 필터를 그대로 넣는다 — 국공채 단독 필터는 오답이다(2026-08-31 서버 실측: 국공채만 조회해 1위 토지주택채권 330(변) 5.859% 등 C층 전부 누락): (TRIM(std_pd_mcls_nm)='국공채' OR COALESCE(TRIM(pd_pbcm),'')='한국은행' OR pd_nm LIKE '%(정부보증)%' OR TRIM(pd_pbcm) IN ('한국주택금융공사','한국토지주택공사','한국산업은행','(주)중소기업은행')). SELECT 에는 아래 식을 '보강' 열로 붙여 층을 함께 답한다(컬럼 3개만 · 단어 필터 없음): CASE WHEN TRIM(std_pd_mcls_nm)='국공채' OR COALESCE(TRIM(pd_pbcm),'')='한국은행' THEN 'A 정부·지자체·한은 직접 발행' WHEN pd_nm LIKE '%(정부보증)%' THEN 'B 정부보증 명시' WHEN TRIM(pd_pbcm) IN ('한국주택금융공사','한국토지주택공사','한국산업은행','(주)중소기업은행') THEN 'C 법정 손실보전 기관' WHEN TRIM(std_pd_mcls_nm)='특수채' THEN 'D 특별법 공공기관(정부 보증 표기 없음)' WHEN COALESCE(TRIM(bd_knd),'') IN ('MBS','유동화회사채','Conduit회사채') OR COALESCE(pd_pbcm,'') LIKE '%유동화%' OR COALESCE(pd_pbcm,'') LIKE '%신용보증%' OR COALESCE(pd_pbcm,'') LIKE '%기술보증%' OR pd_nm LIKE '%유동화%' THEN 'E 유동화(기초자산 담보)' ELSE 'F 민간 회사채' END AS 보강 분포: A 2,873 · B 7 · C 2,968 · D 3,171 · E 2,648 · F 10,215. A = 국공채 + 한국은행 통안채. C = 법정 손실보전이 확인된 4곳(주금공 MBS 포함). D = 특수채 발행 공공기관(한전·도로공사·수출입은행 등) — 손실보전 조항 미확인. 답변 규약: ① D 에 '정부 보증' 이라 말하지 않는다('특별법 공공기관 발행, 정부 보증 표기 없음') ② 구조 열이 은행 자본성증권·후순위·영구채면 A·B·C 라도 '손실보전 대상 아님' 병기 ③ 발행사 칸이 빈 행은 '발행사 미수록' 병기 ④ E 는 정부와 무관(담보는 기초자산). ⛑ 2026-08-31 저녁 서버 재발(지시문 승격 후에도 C층 탈락·고위험제외 누락 → 1위 5.859% 누락·사모 14.05% 혼입) → 런타임 가드 신설: HCX 가 층·제외를 빠뜨리면 pipeline.ensure_credit_backstop 이 주입한다. 그래도 처음부터 완성식 그대로 쓴다."
  시장집계금지:  "pd_exg_mkt 단독 group-by 금지 — 구성 효과 교란 (§9.5). 같은 종목이 양 시장에 있을 수 있음"
  장외등급해석:  "장외 등급 결측 48.9%(2,023/4,136)는 미평가 — 저품질·고위험으로 해석 금지 (장내는 11.3%)"
  유동화위험금지: "유동화 = TRIM(bd_knd) IN ('MBS','유동화회사채','Conduit회사채') OR pd_pbcm LIKE '%유동화%' OR pd_pbcm LIKE '%신용보증%' OR pd_pbcm LIKE '%기술보증%' OR pd_nm LIKE '%유동화%' (4,045행). 발행자가 SPC 라 발행사명으로 위험·원회사를 판단하지 않는다."
  외화채없음:   "모든 채권 질의에 curr_cd='KRW' 를 기본 조건으로 건다(원화채 21,881행이 모수). curr_cd='000' 외국발행채 1행은 정보 미비로 사용 불가. '외화채권·해외채권' 질의는 '수록 없음' 으로 답한다(해외ETF 로 유도 금지). curr_cd 값은 KRW·'000' 두 개뿐 — 'USD'·'XS' 등 다른 값을 쓰지 않는다(2026-08-31 서버 실측: '달러 채권' 이 curr_cd='XS' 로 나감 — ISIN 접두사를 통화로 환각. vocab 등재로 check_values 가 차단)."
  기준일:     "답변의 데이터 기준일 = info_base_dt 20260821 (영업일) / 대회 기준 2026-08-22"
  종류필터:    "🔴 채권 종류 낱말(국고채·국채·은행채·카드채·회사채·지방채·통안채·MBS 등)은 동의어 표의 컬럼·값으로 정확히 필터한다. 다의 통칭 3종은 아래 확정식 그대로(2026-08-31 리드 결정 — 도메인 관행 근거): ① 국고채·국채 = (TRIM(bd_knd)='국고채권' OR (COALESCE(TRIM(bd_knd),'')='' AND TRIM(std_pd_scls_nm)='국고채')) — 원금분리채권(STRIPS) 21행은 종류 결측이나 기재부 STRIPS 제도(「국고채권의 발행 및 국고채전문딜러 운영에 관한 규정」)에 따라 국고채에서 분리된 정부 원리금 지급 채권이고, 데이터 자체도 소분류 '국고채'·위험 6등급으로 분류하며 같은 이름 패턴 188행은 bd_knd='국고채권' 이므로 포함(295종목). 목록엔 구조 열의 '국고채 STRIPS' 라벨 병기 ② 은행채 = TRIM(bd_knd) IN ('일반은행채','특수은행채') — 특수은행채 발행사는 전부 은행(산은·기은·수출입·농협·수협 5곳 실측)이고 소분류명 자체가 '특수은행채'(2,031행). 단 발행주체 분류에선 특수채로도 불리므로 답변에 '특수은행채(산금채 등) 포함' 을 병기. 금융지주회사채는 은행이 아니라 제외 ③ 지방채 = TRIM(bd_knd) IN ('모집지방채','지역개발채','도시철도공채') — 3종 발행사 전부 광역지자체 실측(서울·부산·경기 등). 지역개발채권(지방공기업법 §19·시도 조례)·도시철도채권(도시철도법)은 지자체 발행 매출공채(2,239행). 지방공사채 2종은 발행사가 지방공사(경기주택도시공사 등)라 제외. 단일 통칭은 동의어 표 값 그대로 — 회사채 = TRIM(std_pd_mcls_nm)='회사채' (대분류가 정본 — 2026-08-31 리드 결정 · 이 조건을 빼먹는 것도 오답: 'A등급 이상 회사채' 실측에서 종류 조건이 통째로 빠졌다). 종류 낱말 없이 발행 주체로 풀어 쓴 질의도 같은 필터다: '회사(기업)가 발행한 채권'=회사채 대분류 · '은행이 발행한'=은행채 2종 · '카드사가 발행한'=신용카드채 · '캐피탈사'=할부금융채 · '보험사'=보험회사채 · '증권사'=투자매매.중개채 · '지자체가 발행한'=지방채 3종 · '한국은행이 발행한'=통화안정채권 · '정부(나라)가 발행한'=국공채 대분류. 단 특정 회사명을 지칭하면(삼성전자라는 회사가 발행한) 발행사조회로 — 종류 필터를 덧씌우지 않는다. 대분류(std_pd_mcls_nm)로 넓혀 대체하면 오답이다 (2026-08-31 실측: '국고채' 를 std_pd_mcls_nm IN ('국공채','특수채') 로 조회 → 임의 30행에 국고채 0건 → '데이터에 없다' 오답. 대분류 국공채엔 지방채·통안채가 섞이고 특수채는 다른 분류다). ⛑ 2026-08-31 저녁 재발('국고채 몇 종목'→국공채 행수 2,840 오답) → 런타임 가드: 국고채·국채 질의가 대분류로 뭉개지면 pipeline.ensure_ktb_kind 가 확정식 ①로 교체하고, 종목 수 질의의 COUNT(*) 는 ensure_distinct_count 가 COUNT(DISTINCT pd_no) 로 교정. 그래도 처음부터 확정식대로 쓴다."
  날짜표기:    "날짜 컬럼(*_dt)은 정수 YYYYMMDD (REAL 적재). 조건식은 반드시 하이픈·따옴표 없는 정수로: mat_dt <= 20290822. ❌ 2029-08-22 (무따옴표) 는 SQLite 뺄셈=1999 — mat_dt<=1999 가 되어 만기일 미수록(0값) 행만 통과한다 (2026-08-31 실측 사고: '3년 안에 만기' 질의 오답) · ❌ '2029-08-22' (문자열) 은 REAL<TEXT 타입 서열로 전 행 통과. 런타임이 치환 보정하지만(pipeline.normalize_date_literals) 처음부터 정수로 쓴다."
  만기윈도우:   "'N년 안에 만기·만기까지 N년' = mat_dt > 20260822 AND mat_dt <= 기준일+N년(YYYYMMDD 정수 — 3년이면 20290822). 하한 필수 — 없으면 만기일 미수록 0값 4행·만기 경과 49행이 섞인다. SELECT 에 mat_dt·remaining_days 를 함께 넣고, 잔존 기간은 remaining_days 로만 말한다(dur 은 듀레이션이지 잔존일수가 아니다). 만기 도래 조회·목록은 ORDER BY mat_dt (만기 빠른 순) — 정렬 없는 임의 30행은 목록이 아니다. 🔴 '만기가 가장 긴/짧은' 정렬도 ORDER BY mat_dt — dur 정렬은 오답이다(2026-08-31 서버 실측: '한전 만기 최장' 이 dur DESC 로 999(2049년)를 답함, 실제 최장은 1184(2052년) — 이표율 차이로 듀레이션·만기 순위가 역전된다). ⛑ 런타임 가드 pipeline.ensure_maturity_sort 가 교정하지만 처음부터 mat_dt 로 쓴다."
  발행사조회:   "발행사 질의는 KG 매핑값이 있으면 TRIM(pd_pbcm) 정확 일치, 없으면 pd_pbcm LIKE '%이름%' ('(주)' 위치·꼬리 공백이 제각각: 한국전력 → '한국전력공사(주)' · 산업은행 → '한국산업은행' · 기업은행 → '(주)중소기업은행'). 약칭(한전·LH·산은·기은·주금공)은 동의어 표. MBS·유동화는 발행자가 SPC 라 원회사 이름으로 검색되지 않는다. 발행사 빈 행은 '발행사 미수록'. 다른 상품군의 같은 이름 값을 끌어오지 않는다."
  공모사모판정:  "공모/사모는 bd_ofr_tcd 로만(공모 19,875 · 사모 2,007). 종목명으로 추론 금지 — 이름의 '(사)' 는 사모가 아니라 사회적채권 라벨(99.8% 가 공모)."

# ── 동의어 — 사용자 통칭 → DB 표기 (2026-08-30 전수조사 §9 ③) ──
# 라우팅 ② 겹 어휘(src/runtime/router.py)와 플래너 안내판에 실린다. 어휘는 코드가 아니라 온톨로지가 소유한다.
# DB 에 글자가 그대로 있는 값(국공채·특수채·MBS…)은 ② 겹이 컬럼값으로도 잡는다 — 여기 두는 이유는 가중치·플래너 LIKE 표기.
synonyms:
  통안채: 통화안정채권          # bd_knd. 한국은행 33행 — 데이터 분류는 특수채
  지방채: 모집지방채            # 🔄 2026-08-31 리드 결정 — 실제 필터는 3종 IN (종류필터 ③: +지역개발채·도시철도공채 = 매출공채, 2,239행). 이 값은 라우팅 대표값
  영구채: 신종                  # pd_nm '(신종…' · 구조표시 규칙의 '영구채' 열
  코코본드: 조건부자본          # pd_nm '조건부자본증권' — 판정은 구조표시 규칙(은행 종류 + 위험등급 1~3)
  은행채: 일반은행채            # 🔄 2026-08-31 리드 결정 — 실제 필터는 2종 IN (종류필터 ②: +특수은행채 = 산금채·중금채, 2,031행). 이 값은 라우팅 대표값
  카드채: 신용카드채            # bd_knd
  국고채: 국고채권              # 🔄 2026-08-31 리드 결정 — 실제 필터는 STRIPS 결측 21행 포함 확장식 (종류필터 ①, 295종목)
  회사채: 회사채                # 🔄 2026-08-31 리드 결정 — std_pd_mcls_nm 대분류가 정본 (옛 bd_knd '일반회사채' 폐기: 일상어 '회사채' 는 금융채·유동화·보험사채 포함 62→599종목 차이). '일반회사채' 라는 말이 그대로 나올 때만 bd_knd='일반회사채'
  특수채: 특수채                # std_pd_mcls_nm
  국공채: 국공채                # std_pd_mcls_nm
  MBS: MBS                      # bd_knd
  신용등급: 적용신용등급        # crd_grd 의 한글 컬럼명
  듀레이션: 듀레이션            # duration
  표면금리: 표면이자율            # srfc_irt (한글 컬럼명 '표면이자율/쿠폰금리' — 2026-08-30 밤 정정: '표면금리' 는 스키마 어디에도 없는 표기였다)
  잔존만기: 잔존일수            # remaining_days
  만기: 상환일자                # mat_dt
  국채: 국고채권                # 2자 통칭 — 라우팅 어휘(경계 검사로 '미국채권' 엔 안 걸림)
  물가채: 물가                  # pd_nm '%물가%' (물가연동국고채) — 구조표시 '물가연동'
  물가연동국채: 물가
  신종자본증권: 신종            # 영구채와 같은 것
  후순위채: 후순위              # pd_nm '(후)' — 구조표시 '후순위'
  녹색채권: (녹)                # ESG 라벨 — name_encoding.esg_labels
  사회적채권: (사)
  지속가능채권: (지)
  # 발행사 약칭 → pd_pbcm 표기 (E: KG 에 짧은 이름 노드가 없어 매핑이 비면 발행사조회 규칙의 LIKE 가 받는다)
  한전: 한국전력공사            # pd_pbcm '한국전력공사(주)' 403행
  LH: 한국토지주택공사
  산은: 한국산업은행
  기은: 중소기업은행            # pd_pbcm '(주)중소기업은행'
  주금공: 한국주택금융공사      # 1,558행 (그중 MBS 1,396 = MBS 전부 · 나머지 162 는 주택금융공사채권)
  현대차: 현대자동차

# ── 답변 규칙 — 조회 결과를 **어떻게 말할지** (2026-08-30 전수조사 §3-H). 답변 생성기(compose_answer)에만 실린다 ──
# query_rules 는 SQL 생성기만 보므로, 거기 적힌 '말하기' 규약을 여기 짧게 다시 둔다. 새 사실이 아니라 결과를 읽는 방법이다.
answer_rules:
  - "주의 문구·고정 문구는 발동 조건일 때만 붙인다 — 원금 주의 문구는 목록에 수익률 6% 초과 또는 2·3등급이 있을 때, '더 안전한 6등급' 문구는 안전 추천의 목록이 전부 5등급이거나 6등급이 0건일 때. 조건이 아니면 붙이지 않는다 (2026-08-31 실측: 전부 6등급 목록에 두 문구가 다 붙어 나감)."
  - "🔴 최우선 — 조회 결과에 없는 종목명·날짜·숫자·등급을 만들지 않는다(환각 = 대회 최대 감점). 칸이 비어 있으면 '미수록' 이라 말하고, 종목명 속 숫자('25-02-01' 등)로 만기일·금리를 추측해 채우지 않는다."
  - "잔존일수·잔존만기는 remaining_days 값으로만 말한다. dur(듀레이션)을 잔존일수로 표기하지 않는다 (2026-08-31 실측: dur 1.4647 이 '잔존일수 1.46년' 으로 나간 사고). 만기일(mat_dt) 칸이 0·빈 값이면 '만기일 미수록' 이라 말한다."
  - "국공채(대분류 '국공채')는 신용등급이 부여되지 않는다. crd_grd 가 비어 있어도 '등급 없음·신뢰도 낮음' 이라 말하지 않는다 — '국공채는 신용등급 미부여' 로 말한다."
  - "안전·위험 낮은 조건으로 답할 때 어느 위험등급을 썼는지 라벨로 밝힌다 — '5·6등급(낮은위험·매우낮은위험, 신용등급 AA- 이상 또는 국공채) 기준' 또는 '6등급(매우낮은위험, 국공채·특수채) 기준'. 5등급이 섞여 있으면 '6등급만으로는 조건에 맞는 채권이 없어 5등급까지 포함' 을 말한다."
  - "위험등급은 숫자가 클수록 안전하다: 6등급(매우낮은위험)=가장 안전, 1등급(매우높은위험)=가장 위험. '낮은 위험등급' 을 '위험이 낮다' 로 읽지 않는다."
  - "답변에 실린 종목 중 수익률(applied_yield) 6% 초과 또는 위험등급 2·3등급(pd_risk_gcd '12'·'13')이 있으면 '수익률이 높은 채권은 원금을 돌려받지 못할 위험도 높을 수 있습니다. 신용등급·위험등급을 함께 확인하세요.' 를 붙인다."
  - "추천·랭킹 답변이면 '위험등급이 매우 높은(1등급) 채권과 사모 채권은 제외했습니다.' 를 밝힌다. 조회·사실확인 답변에는 붙이지 않는다."
  - "'보강' 열이 있으면 층을 함께 말한다. D(특별법 공공기관)를 '정부 보증' 이라 말하지 않는다 — '정부 보증 표기 없음'. 은행 자본성증권·후순위·영구채는 A·B·C 층이라도 '손실보전 대상 아님' 을 병기한다."
  - "'구조' 열이 있으면 종목 옆에 한 단어로 붙인다. 영구채는 '만기일 = 콜 개시일', 은행 자본성증권은 '원금 상각·이자 미지급 조건 가능' 을 덧붙인다."
  - "발행사(pd_pbcm)가 비어 있으면 '발행사 미수록' 이라 말하고 추정하지 않는다."
  - "국공채가 아닌데 crd_grd 가 비어 있으면(특수채 254·회사채 926행) '신용등급 미수록(미평가)' 로 말한다 — 낮은 등급·고위험으로 읽지 않는다."
  - "종목명의 (녹)·(사)·(지) 는 녹색·사회적·지속가능 채권 라벨이다(종목명 표기 기준). (사)를 사모로 읽지 않는다 — 공모/사모는 bd_ofr_tcd 값으로만 말한다."
  - "수익률·가격·잔존일수는 기준일 2026-08-22 시점 값이다. 만기 조건 질의의 연도는 만기일이지 전망 시점이 아니다."
  - "조회 결과에 없는 종목을 예로 들지 않는다."
  - "추천 목록은 조회 결과에 있는 행만, 기본 5개. 질문에 개수가 있으면 그 개수까지. 정렬 기준(수익률 높은 순 등)을 한 마디 밝힌다."
  - "'안전한' 추천인데 목록이 전부 5등급이거나 6등급(국공채·특수채)이 하나도 없으면 마지막에 한 줄 덧붙인다: '수익률은 이보다 낮지만 더 안전한 6등급(매우낮은위험 — 국고채·지방채·공사채)도 있습니다(기준일 현재 6등급 최고 수익률 6.23%). 가장 안전한 채권만 원하시면 그렇게 말씀해 주세요.' — 이 문장은 고정 문구다. 조회 결과에 없는 종목명·수치를 새로 만들어 붙이지 않는다."

# ── 역질문 분기 — 되묻기는 답변불가 문항의 정답 형태 중 하나 (주최 확인 8/25) · 모호 질의는 최소 출제 ──
clarify:
  다의어:                                  # (B) 용어 자체가 다의적 — 동반 신호 없으면 되묻기
    수익률: "표면금리 / 민평 YTM / 매수수익률 / 세후 / 예금환산 — 기본값: 개인 세후(after_tax_yield) + 명시. 투자 주체 미상이면 역질문: 개인(15.4%)/법인/종합과세(49.5%)/세금우대"
    위험:   "부도위험(국공채 최저) / 금리위험(국공채 최고) — 정반대 (§9.3)"
    등급:   "신용등급(crd_grd) / 위험등급(pd_risk_nm) — 별개 축"
    만기:   "만기일 / 잔존만기 / 듀레이션 — 영구채 266행은 mat_dt 가 콜 개시일"
    싸다:   "🔴 가격 낮음 / 수익률 높음 — 정반대라 기본값 금지, 되묻기. ⛑ 2026-08-31 서버 실측(제일 싼 채권 → 되묻지 않고 가격 해석 단정 + 근거 없는 15·16 필터) → 결정층 가드 pipeline.price_ambiguity_clarify 가 단서 낱말(가격·수익률 등) 없는 싸다·저렴·비싸다 질의를 HCX 호출 전에 되묻는다"
    가격:   "민평 평가단가(eval_price) / 매매단가(trade_price, 634행) / 장내 종가(exg_close_price, 1,270행) — 셋이 다름"
  사람의_선택:                             # (A) 사용자가 정해야 답이 정해짐
    보유기간: "만기 보유 → 신용위험만 / 중도 매도 → 듀레이션 1순위"
    안전의_정의: "부도위험 → 국공채 / 금리위험 → 단기 회사채"
    투자기간: "기간에 맞는 만기·듀레이션 선택"
    답변모수: "시장 전체(20,497종목) / 당사 판매 조건 있는 것(634 LOT)"
  조건부_계산:
    FRN_금리비교: >-
      bd_inrt_tcd='변동금리' 830행의 srfc_irt 는 기준일 현재 적용 금리 스냅샷 — 고정금리와의 유불리 질의는
      "현재 기준금리 수준"을 역질문한 뒤 조건부 비교로 답변.

