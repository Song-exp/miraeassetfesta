# domestic_bonds — 사람의 판단을 담는 파일
# 기계적 사실(결측률·distinct·값 목록)은 domestic_bonds.auto.yaml 에 있습니다. 여기엔 판정과 규칙만 씁니다.
# 런타임 가드레일이 이 파일을 읽습니다.
#
# 이력:
#   2026-08-25  🔄 2차 데이터(8/24 배포 · 기준일 2026-08-22) 기준 전면 재작성.
#               1차(7/11) 42,394행×40컬럼 → 2차 21,882행×58컬럼. 컬럼명 전부 소문자(1차 채권만 대문자였음).
#               삭제 pd_evco_crd_grd · 신규 19컬럼 · PK 복합화. 1차 판정 중 데이터로 해소/무효화된 항목은
#               각 항목에 "1차:" 로 남겨 왜 바뀌었는지 추적 가능하게 했다.
#               근거: docs/DATA_V2_2026-08-24_impact.md §2.1·§6 + DB 전수 실측(2026-08-25).
#   2026-08-18  감사 확정 (1차 기준)
#
# 범위: 2단계(결측 판정 · 컬럼 판단 · 쿼리 규칙 · 축 유도).
#   개체·관계 매핑(entities/class_hierarchy)은 4단계. → docs/domain/domestic_bonds_graph.md §0·§4 참조.
# 근거: docs/domain/domestic_bonds_graph.md (§ 번호 인용) · docs/eda/domestic_bonds_notes.md (노트 §, 1차 기준)
# 미확정은 파일 끝 workshop: 절에 모았습니다.

domain: domestic_bonds

# ── 행의 낟알 (2026-08-25 2차 재판정) ──
row_grain:
  구조: >-
    행 = 종목 × 거래시장 × 기준일 × 판매LOT (pd_no + pd_exg_mkt + info_base_dt + info_seq — 스키마 NOT NULL 4개가 PK).
    21,882행 / pd_no distinct 20,497. 동일 pd_no 2~4행 = 1,078종목(2행 772 · 3행 305 · 4행 1).
  evidence_grade: A
  구성: >-
    장내 17,746행(전부 pd_no 유일) + 장외 4,136행(pd_no 3,828). 중복 1,078종목 중 1,077은 "장내 1행 + 장외 1~3행"
    (같은 종목이 두 시장에 모두 수록) · 1종목만 장외 LOT 2개. info_base_dt 는 전 행 20260821 단일값이라 현 스냅샷에선 키 역할 없음.
  대표행: >-
    종목 속성(이름·등급·만기·평가가)은 중복행 간 동일(eval_price 가 다른 종목은 8건뿐) → 종목 단위 질의는 GROUP BY pd_no 또는
    장내행 우선. 판매 정보(buy_yield·trade_price·buyable_quantity)는 장외 LOT 행에만 있음 → 판매 질의는 buy_yield IS NOT NULL 행.
  note: >-
    1차: "행 = 종목 (PD_NO 완전 유일)" — 폐기. COUNT(*) 를 종목 수로 쓰면 1,385행 과대 계상.
    🔴 1차 42,394행 → 2차 21,882행: 소멸 25,429종목 중 67.5%가 만기 경과분, 나머지는 장외 정리(17,645→4,136행).
    신규 3,532종목 중 7/11 이후 발행은 18% — 나머지 82%는 1차 스냅샷에 없던 기존 발행 종목(발행일 ≤ 7/11 실측). 주최가 공지한 1차 "정합성 이슈"의 실체로 보이나 주최 확인은 없음(검수 C 2026-08-25).

columns:

  # ── 1.1 식별 (6) — 📌 불변 ─────────────────────────────────────────
  pd_no:
    korean_name: 종목코드 (ISIN)
    missing_reason: none
    answerable_n: 20497                    # distinct — 행 수(21,882) 아님
    note: >
      12자리 ISIN. 결측 0 · 🔴 행 유일 아님(row_grain 참조) — 종목 식별자이지 행 식별자가 아니다.
      🔑 앞 3자리 대분류 인코딩 (2차 실측): KR6 회사채 12,834 / KR3 특수채 6,177(+회사채 3) / KR2 국공채 2,239 /
      KR1 국공채 392 / KRC 국공채 209 / KRB 회사채 27 / XS3 회사채 1. 1차의 KRZ·개인투자용국채 소멸.
      bd_knd 결측 152건의 분류 보완 수단 (§5.2). name_encoding.isin_prefix 참조.
  pd_nm:
    korean_name: 종목명
    missing_reason: none
    answerable_n: 20497
    trap: >
      🔴 패딩 684행(3.1%) 혼재 — TRIM 없으면 종목마다 검색 성패가 갈림. 공백 흔들림 3종(붙임/띄움/괄호 앞 공백) —
      파싱 전 정규화 필수 (§5.1-⑥).
    note: >
      🔑 이름 자체가 구조화 데이터 (§5.2): 국고채 '01125-3909(19-6)' = 표면 1.125%·만기 2039-09·2019년 6회차.
      특수구조 플래그(콜·풋·후순위·CB 등)는 여전히 종목명이 유일한 식별 수단 → name_encoding: 절.
      ✅ 2차부터 이자지급 방식(이표/할인/복리/단리)·금리 구분(고정/변동)·공모/사모는 전용 컬럼이 생겨 이름 파싱 불필요
      (bd_intp_tcd · bd_inrt_tcd · bd_ofr_tcd).
  pd_abrv_nm:
    korean_name: 종목약어명
    missing_reason: missing
    missing_semantics:
      "": missing                          # TRIM 후 빈 문자열 — NULL 12 + 빈 2 = 14행
    answer_policy: 약어명이 없으면 정식명(pd_nm)으로 대체 표기.
    note: 1차 결측 365건 → 2차 14행. 고유 정보 없음(정식명의 축약+패딩).
  pd_eng_nm:
    korean_name: 종목영문명
    missing_reason: missing
    missing_semantics:
      "": missing                          # NULL 3 + 빈 2 = 5행
    answer_policy: 영문명 없으면 정식명(pd_nm)으로 대체 표기.
    note: 1차 결측 324건 → 2차 5행.
  pd_abrv_eng_nm:
    korean_name: 종목영문약어명
    missing_reason: missing
    missing_semantics:
      "": missing                          # NULL 12 + 빈 2 = 14행
    answer_policy: 영문약어명 없으면 정식명(pd_nm)으로 대체 표기.
    note: 1차 결측 370건 → 2차 14행.
  pd_ctry_cd:
    korean_name: 발행국가코드
    missing_reason: none
    value_semantics:
      "KR": 한국 — 21,881행 (사실상 상수)
      "XS": 🔸 국제예탁결제기구(Euroclear/Clearstream) 코드 — 국가 아님. 1행
    kg_entity: null                        # 사실상 상수 → KG 개체 무의미 (§4.1)
    note: 상수에 가까움. XS 1건은 enum 화이트리스트에서 '국가'로 등재 금지.

  # ── 1.2 분류 (3) — 📌 불변 · 🔴 3층이 트리가 아님 (§7.1) ────────────
  std_pd_mcls_nm:
    korean_name: 표준상품 대분류명
    missing_reason: none
    answerable_n: 21882
    value_semantics:
      "회사채": 일반 기업(은행·카드·캐피탈 포함) — 12,865행(58.8%). 부도위험 기업별 상이
      "특수채": 법률로 설립된 공기업(한전·LH·주금공·산은) — 6,177행(28.2%). 정부가 사실상 보증
      "국공채": 정부(국고채)·지자체(지방채)·한국은행(통안채) — 2,840행(13.0%). 부도위험 최저
    kg_entity: null                        # 채권 전용 → SQL 컬럼으로 충분
    note: >
      ✅ 분류 3층 중 유일하게 안전한 층 — axis_issuerType 매핑은 여기만 (§7.1). 2차는 3종뿐.
      🔴 1차의 '개인투자용국채'(49건)·'외화채권-회사채/금융채'(6건)는 2차에서 소멸 — 관련 질의는
      "이 데이터에 수록되어 있지 않습니다" (1차 lookups/ktb_individual_structure.md 는 배경 지식으로만).
      🔴 소분류·채권종류에서 대분류 역추적 금지 — 일반사채 = 회사채 12,133 + 특수채 614.
      📖 금리는 안전도의 역순(신용스프레드), 듀레이션은 안전도의 정순 — 두 위험이 상충 (§6.1·§9.3).
  std_pd_scls_nm:
    korean_name: 표준상품 소분류명
    missing_reason: none                   # 1차 결측 13건(외화채·미부여) → 2차 0
    answerable_n: 21882
    note: >
      13종. 🔴 두 대분류에 걸치는 소분류 2종 — 일반사채(회사채 12,133 / 특수채 614) · 특수은행채(특수채 1,322 / 회사채 2)
      → 상위 역추적 금지 (§7.1). 국고채 371 · 국민주택 210 · 지역개발 1,679 · 도시철도 452 · 물가채 6 · 중앙은행채 33.
  bd_knd:
    korean_name: 채권종류 (예탁원 기준)
    missing_reason: missing
    missing_semantics:
      "": missing                          # 공백 패딩 — TRIM 후 빈 문자열 포함
    answerable_n: 21730
    answer_policy: 결측 152행은 "채권종류가 수록되어 있지 않습니다" + pd_no 앞 3자리로 대분류 수준 보완 (§5.2).
    trap: >
      🔴 ① 고정폭 공백 패딩 — TRIM 필수 (TRIM 후 32종). ② 통안증권의 실값은 '통화안정채권'(33행) — '통화안정증권'으로
      조회 시 0건 (§5.1-⑧). ③ 분리채권(STRIPS) 209건이 평범한 '국고채권'으로 묻힘 — 종목명 파싱만이 식별 수단 (§9.1).
    note: 1차 결측 924·39종 → 2차 결측 152·32종. 결측 152 중 149는 pd_pbcm 결측과 같은 행. 상위(소분류) 특정 불가 (§7.1).

  # ── 1.3 발행자·시장 (3) — 📌 불변 ──────────────────────────────────
  pd_pbcm:
    korean_name: 발행사
    missing_reason: missing
    missing_semantics:
      "": missing
    answerable_n: 21733
    answer_policy: 결측 149행(0.7%)은 "발행사 정보가 수록되어 있지 않습니다" (bd_knd 결측과 149행 동일).
    trap: >
      🔴 ① '(주)' 위치 제각각((주)신한은행 vs 하이트진로(주)) — 정규화 전 동일사가 갈라짐 (raw distinct 1,837 → TRIM 1,818).
      ② 종목 수 ≠ 규모 — 규모는 isu_bal_amt 합계로 (§9.6).
      ③ MBS·유동화는 발행자 = 자산(SPC) — 원 회사 위험과 다름. pd_pbcm 만으로 위험 판단 금지.
      식별은 TRIM(bd_knd) IN ('MBS','유동화회사채','Conduit회사채') = 3,949행
      (MBS 1,396 + 유동화회사채 1,528 + Conduit회사채 1,025 — 2차 실측 2026-08-26).
      🔴 2026-08-26 정정 — Conduit회사채는 '코드 밖 SPC' 가 아니라 bd_knd 의 정식 값이다(distinct 33종 중 1,025행).
      옛 판정은 이를 발행사명 패턴으로만 회수해 1,025행 중 16행만 걸렸다 (SPC 상호는 '뉴스텔라제십팔차(주)'
      '아이테르누스(주)' 처럼 고유명사라 '유동화' 문자열이 없다). eda/domestic_bonds 브랜치 B8 판정이 옳았다.
    kg_entity: Organization                # 4테이블 교차 → kg_organization (§5.1-①)
    note: 1차 distinct 8,018 → 2차 1,818 (만기 경과분 정리 효과). 발행사 재무·계열 정보는 없음 (§11).
  pd_exg_mkt:
    korean_name: 거래구분 (장내/장외)
    missing_reason: none
    value_semantics:
      "장내": 한국거래소 — 17,746행(pd_no 유일). 표준화·등급 있는 우량채 위주
      "장외": 증권사 1:1 상대 거래 — 4,136행(pd_no 3,828). 🔑 당사 판매 LOT(buy_yield 634행)는 전부 여기
    trap: >
      🔴 1차 "종목당 한쪽만 기록" 폐기 — 2차는 1,077종목이 장내·장외 양쪽에 수록(종목 속성 + 판매 채널의 혼합).
      "장내 채권 수" = COUNT(DISTINCT pd_no) WHERE 장내 (17,746) / "장외" 3,828 — 합이 20,497 을 넘음(1,077 중복).
      단독 group-by 금지: 장외 평균 적용수익률 8.59% vs 장내 4.13% 는 시장 효과가 아니라 구성 효과
      (사모 1,981행 전부 장외·장외 등급결측 48.9%) — 대분류·등급·잔존만기 통제 후 비교 (§9.5).
    kg_entity: null
    note: 1차 개인투자용국채 49건 "전부 장외" 서술은 2차에 해당 대분류가 없어 무효.
  curr_cd:
    korean_name: 통화코드
    missing_reason: none
    value_semantics:
      "KRW": 원화 — 21,881행 (사실상 상수)
      "000": 🔴 오염값 1행 — 통화 아님. enum 등재 금지
    kg_entity: Currency                    # 공유 개체 (shared/currency.yaml — USD/JPY/EUR alias 는 pending 유지)
    note: >
      🔴 1차 외화채 21건(USD 19·JPY 1·EUR 1) 은 2차에서 전부 소멸 — '외화채권' 질의는 "국내채권 데이터에
      외화표시 채권이 수록되어 있지 않습니다"로. 해외ETF 와 혼동 유도 금지.

  # ── 1.4 발행조건 (9) — 📌 발행 시 확정 (🔴 예외: FRN) — 2차 신규 5 ──
  bd_intp_tcd:
    korean_name: 이자지급구분                # 🆕 2차
    missing_reason: none
    answerable_n: 21882
    value_semantics:
      "이표채": 정기 이자 지급 — 18,059행(82.5%)
      "복리채": 이자 재투자 후 만기 일시 지급 — 2,867행
      "할인채": 무이표 — 발행 시 할인 매각 — 689행 (종목명 '분리채권' 209 + '할인' 50 포함)
      "단리채": 단리 누적 후 만기 지급 — 267행
    answer_policy: >
      ✅ couponType(ZeroCoupon 등) 판정의 공식 근거 — 1차의 종목명 파싱 + 가격 구조 추정(노트 §D.15) 을 대체.
      "할인채/무이표 채권" 질의는 bd_intp_tcd='할인채' 로 grounding.
    note: >
      🔑 1차 "할인채 srfc_irt 수수께끼" 해소: 할인채 689행 중 668행이 srfc_irt > 0 — 할인채의 표면금리는
      '지급 이자율'이 아니라 '발행 할인율'(명목값). 표면금리 정렬 시 할인채는 별도 유형으로 분리 (srfc_irt.trap).
  bd_inrt_tcd:
    korean_name: 금리구분                    # 🆕 2차
    missing_reason: none
    answerable_n: 21882
    value_semantics:
      "고정금리": 20,904행(95.5%)
      "변동금리": FRN — 830행. srfc_irt 는 기준일 현재 적용 금리 스냅샷
      "고정+변동금리": "148행 — ✅ 실측(검수 C 2026-08-25) 신종·영구·후순위 0건. Conduit 회사채 76·카드/할부금융채 35·은행채 20·특수법인채 13 (사모 76·콜 26) — 일정 기간 고정 후 변동인 ABS·금융채 구조. 답변 시 '고정+변동' 은 스키마 값 그대로 인용"
    answer_policy: ✅ FRN 판정의 공식 근거 — 1차 종목명 '변' 파싱(643건) 대체. '변' 이름 431행 중 393이 변동·37이 고정+변동·1이 고정.
