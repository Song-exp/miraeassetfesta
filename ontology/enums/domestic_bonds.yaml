  # ── 1.8 매수·수익률 (8) — 🕐 유통시장: 미래에셋 진열대 정보 ──────────
  BUY_YIELD:
    korean_name: 매수수익률
    missing_reason: not_applicable
    answerable_n: 881                      # 실질 254 (수량 0 · 만기 도래 제외 — §2.3 모수 사다리)
    answer_policy: >
      결측 97.9% = "현재 판매 중이 아닙니다"(당사 진열대 기준) — "값을 모른다" ❌.
      🔴 주어는 시장이 아니라 미래에셋 — 진열대에 없는 채권은
      "당사 판매 목록에는 현재 없습니다. 타사 판매 여부는 이 데이터에 수록되어 있지 않습니다" (§11.1).
      추천·실거래 질의의 진짜 모수는 254건(0.6%) — 반드시 명시.
      ✅ 검토(seohynun/08-21) [B4]: 진열대 해석 **지지**. 근거 4종 —
      ① 결측 구조가 all-or-nothing: BUY 7컬럼의 결측 조합이 2^7=128 중 **단 2가지**
         (전 7컬럼 결측 41,513 · 전 7컬럼 존재 881). 수집 실패라면 컬럼별로 흩어져야 하므로
         '값을 모른다' 가설은 기각되고 레코드 단위 존재/부재 = 진열 여부로 확정.
      ② 사모 배제: 전체 36.0% → 254 중 **0.4%(1건)**. 개인 판매 불가 상품이 사라진다.
      ③ 특수구조 배제: 콜 28.6%→1.2% · 전환CB 5.5%→0.0% · 코코 0.2%→0.4%.
      ④ 소매채권 편중: 지역개발채 42.5% + 도시철도공채 24.0% + 국민주택1종 6.7% = **73.2%**
         (첨가소화채권 3종 — 전체 비중 3.8% 대비 19배 집중). 일반회사채는 33.0%→7.1%.
      🔧 정정(seohynun/08-21) [B4] — 다만 이 컬럼은 "미래에셋이 파는 전부"가 아니라 **소매채권 재고(2차 시장 매물)**다.
      반례: **개인투자용국채 49건이 매수정보 전건 결측**(BUY_YIELD 0 · 수량 0)인데, 이 상품은
      미래에셋 단독 판매대행이다. 청약형(신규 발행)이라 재고 개념이 없고 유통시장도 없어서 빠진 것.
      ⛔ 따라서 254 밖 종목에 "미래에셋에서 못 삽니다"라고 단정하면 개인투자용국채가 오답이 된다.
      → 답변 문구는 "이 데이터의 **매수 가능 목록(254건)**에 없습니다. 청약형 상품(개인투자용국채 등)이나
      타사 취급 여부는 이 데이터로 확인할 수 없습니다"로 할 것.
      부수 실측: 254 중 장내 253 / 장외 1 (유일한 장외 = LG전자 75(사모), 254 중 유일한 사모이기도 함).
      잔존만기 중앙 980일(2.7년) — 개인 투자 기간대와 정합.
      ✅ 외부 대조 완료(seohynun/08-21) [B4-2] — 웹 관측으로 세 가지가 확증됐다.
      ⓐ 거래 단위 정확 일치 — 미래에셋 채권안내 페이지 "**1,000원 단위로 1,000원부터 매수 가능**" vs
         254건 실측 **전건(254/254)이 1,000 의 배수, 최솟값 정확히 1,000**. 10,000 배수는 39건뿐이므로
         이 컬럼은 계좌 수량이 아니라 **원 단위 액면금액**이고, 리테일 최소 단위와 맞물린다.
      ⓑ 취급 품목 일치 — 같은 페이지가 소액채권(국민주택채권·도시철도채권·지역개발채권) 취급을 명시.
         254 의 상위 3종(73.2%)과 정확히 같은 계열. 첨가소화채권은 소액채권시장에서 시장조성자(증권사)가
         의무 매수호가를 대므로 개인이 언제든 현금화 가능 — '진열대' 성격의 도메인 근거.
      ⓒ 개인투자용국채 반례의 원인 확정 — 미래에셋증권은 기재부가 선정한 **단독 판매대행사**가 맞다
         (2024-02 우선협상대상자 선정, 전 금융권 유일). 그런데도 254 에 없는 이유는 판매 여부가 아니라
         상품 구조다: **청약형**(M-STOCK 청약, 최소 10만원~최대 2천만원)이고 유통시장이 없으며
         중도 매도는 만기 1년 후 환매청구뿐이다 → 증권사 재고라는 개념 자체가 성립하지 않는다.
         출처: securities.miraeasset.com/hks/hks4046/n01.do · mw/mks/mks4036/n01.do · 한국경제 2024-03-04.
    unit: percent
    layer:
      scale: "1.71 ~ 5.57 (%)"
      direction: "높을수록 수익"
      note: >
        🔴 YTM("지금 사서 만기까지 보유 시 세전 연환산") — ETF du_er_1y · 펀드 fd_yr1_ern_r 의
