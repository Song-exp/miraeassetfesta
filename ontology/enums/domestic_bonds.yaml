    answerable_n: 42070
    answer_policy: 영문명 없으면 정식명(PD_NM)으로 대체 표기.
    note: NULL 26건 + 빈 문자열 298건 = 실제 결측 324건.
  PD_ABRV_ENG_NM:
    korean_name: 종목영문약어명
    missing_reason: missing
    missing_semantics:
      "": missing
    answerable_n: 42024
    answer_policy: 영문약어명 없으면 정식명(PD_NM)으로 대체 표기.
    note: NULL 72건 + 빈 문자열 298건 = 실제 결측 370건.
  PD_CTRY_CD:
    korean_name: 발행국가코드
    missing_reason: none
    answerable_n: 42394
    value_semantics:
