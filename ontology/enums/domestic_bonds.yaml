name_encoding:
  isin_prefix:                             # pd_no 앞 3자리 → 대분류 보완 (§5.2) — 2026-08-25 2차 실측
    KR6: 회사채                            # 12,834 (단일)
    KR3: 특수채                            # 6,177 + 회사채 3 (✅ 검수 C — 국민은행 일반은행채 1·산금채 2 — 금융채라 접두 KR3 이 맞고 대분류가 예외. 접두→대분류 보완 시 이 3행은 std_pd_mcls_nm 우선)
    KR2: 국공채                            # 2,239 (단일)
    KR1: 국공채                            # 392 (단일) — 1차의 개인투자용국채 49 소멸
    KRC: 국공채                            # 209 (단일)
    KRB: 회사채                            # 27 (단일)
    XS3: 회사채                            # 1행 — XS=Euroclear. 대분류 보완값은 '회사채'
  # 발행사 통칭 — 사람은 '한국산업은행' 을 '산업은행', '한국도로공사' 를 '도로공사' 라 부른다 (2026-09-04 실측:
  #   대표 발행사 23표기 중 6표기가 KG 접지 0건이었고 전부 이 꼴이었다). 통칭을 손으로 6개만 적어 두면
  #   나머지 1,811 발행사는 통칭이 없다 — **변환 규칙을 선언하고 값은 데이터에서 만든다.**
  #   안전장치: ① 생성 표기가 4자 미만이면 버린다 ② 다른 개체(종목·운용사)의 라벨과 같으면 버린다
  #   (실측: 1,816 발행사에서 90개 생성 · 발행사끼리 충돌 0 · 다른 개체와 충돌 4건 → 그 4개만 제외).
  #   접두 기계 제거를 종목(Security)에 쓰지 않는 이유는 _synonym_keys 주석 참조 — 여기는 발행사 한정이다.
  issuer_colloquial:
    node_type: Organization
    alias_table: domestic_bonds
    drop_prefix: ["한국"]
    drop_suffix: ["공사", "공단"]
    min_len: 4
    skip_if_other_type_label: true
  govt_bond_name: "국고채권 SRFCX-YYMM(회차) — 숫자부 = 표면금리·만기 (srfc_irt·mat_dt 와 일치)"
  special_structure_flags:                 # 🔴 판정은 종목명 파싱 — 구분자 기준 정규식. count = 2차 실측 (2026-08-25)
    is_callable:    { pattern: "(?<![가-힣])콜(?![가-힣])", count: 2678 }   # 🔄 2026-08-30 경계식 — 옛 "[(/]콜[)/]" 2,673 은 '(신종-영구-10콜)'·'이영구5콜A'·'변/콜' 5건을 놓쳤다. 한국콜마 5건은 제외됨. 영구채 266 중 콜 265(나머지 1 은 전환사채)
    is_puttable:    { pattern: "[(/]풋[)/]",   count: 529 }
    is_convertible: { pattern: "\\d+CB|[(/]전환[)/]", count: 389 }
    is_subordinated: { pattern: "[(/]후[)/]",  count: 530 }
    is_perpetual:   { pattern: "신종|영구", count: 266, count_pd_no: 237 }   # ✅ 재검증 2026-08-25: 행 266 / 종목(pd_no) 237. 1차 450 은 재현 불가 → 종결. 차집합 41건 전부 조건부자본증권(AT1)=영구
    is_exchangeable: { pattern: "\\d+EB", count: 137 }
    is_stripped:    { pattern: "분리채권", count: 209 }         # 🔴 bd_knd 로는 식별 불가 — 유일 수단. 전부 bd_intp_tcd='할인채'
    is_bw:          { pattern: "\\d+BW", count: 32 }
    is_coco:        { pattern: "코코(?!리아)|조건부자본|조건상각|조건부\\(상\\)", count: 266 }   # 🔄 2026-08-30 — 설명용(판정 아님). 옛 187 은 '조건상각'·'조건부(상)'(영문 PWD=원금상각) 79행을 놓쳤다(266−187, 2026-09-02 재계수). 🔴 판정은 query_rules.구조표시 의 컬럼 신호(은행 3종 + 위험등급 1~3 = 278행, 코코 266 중 264 포함·나머지 2 는 bd_knd 결측)로 한다. 등급 분포 AA- 152·AA0 82·AA+ 19·A+ 12
    is_inflation_linked: { pattern: "물가", count: 6 }          # = std_pd_scls_nm '물가채' 6
    unresolved_PB:  { pattern: "\\d+PB", count: 0 }             # 2차 소멸
  esg_labels:                              # 🆕 2026-08-30 — ESG 라벨. 한글 괄호 ↔ 영문명 괄호 1:1 (G/S/T), 한 종목에 두 라벨 동시 출현 0건. ✅ 해석 확정 — 주최 무응답, 데이터 실측 근거로 팀 결정 (2026-08-31)
    is_green:          { pattern: "[(/]녹[)/]", count: 356,  eng: "(G)" }   # 녹색채권 — 영문 (G) 355/356 (1건은 영문에 표기 누락)
    is_social:         { pattern: "[(/]사[)/]", count: 1984, eng: "(S)" }   # 사회적채권 — 영문 (S) 1,982/1,984. 🔴 사모가 아니다(공모 1,981). 주금공은 2019-03 부터 MBS 를 소셜본드로 발행(공사 보도자료) — 2009~2018 발행 MBS 에 (사) 0건, 2019-03 이후 발행분은 (사)·(녹)·(지) 중 하나
    is_sustainability: { pattern: "[(/]지[)/]", count: 159,  eng: "(T)" }   # 지속가능채권 — 영문 (T) 159/159
    note: >
      판정은 한글 라벨로만 한다 — 영문 (S) 는 중소기업은행(단)·제주지역개발(특) 에도 쓰여 다의적(영문만 (S) 39행).
      "ESG 채권·녹색채권·사회적채권·지속가능채권" 질의는 이 세 패턴(합 2,499행)으로 답하고 "종목명 표기 기준" 을 병기한다. ✅ 해석 확정(2026-08-31 팀 결정) — 주최 무응답으로 데이터 실측 근거 채택: 한↔영 라벨 1:1(G/S/T) · 동시 출현 0 · (사) 1,984 중 공모 1,981 · 주금공 소셜본드 발행시기 정합.
      LIKE 형: (pd_nm LIKE '%(녹)%' OR pd_nm LIKE '%(녹/%' OR pd_nm LIKE '%/녹)%' OR pd_nm LIKE '%/녹/%') — 사·지 도 같은 4형 (각 356 · 1,984 · 159 재현).
      근거: docs/review_2026-08-26/채권_전수조사_2026-08-30.md §7-3.
  # ✅ 2차부터 전용 컬럼으로 대체된 플래그 (이름 파싱 회귀 금지):
  #    is_private → bd_ofr_tcd='사모' (2,007) · is_frn → bd_inrt_tcd IN ('변동금리','고정+변동금리') (978) ·
  #    coupon_form(이표/할인/복리) → bd_intp_tcd
  note: >
    특수구조 합집합 = 3,581행 / 3,520종목 (🔄 2026-09-02 재실측 — 구조 플래그 10종 정규식 전부의 합집합. 옛 3,578/3,517 은
    코코 이름식 제외 등 계산 기준 미명시 수치였다: 코코 제외 시 3,578행/3,518종목. 개별 플래그 count 는 전부 재현 일치). 🔴 단어 목록으로 구조를 판정하지 않는다 — 은행 자본성증권은 컬럼 신호(query_rules.구조표시), 나머지 플래그는 경계식. 플래그는 겹침(영구채에 콜·후순위 동반)이라 단일 '종류' 컬럼 불가 — O/X 플래그 (§3.1).

# ── 정규화 (문자열 비교 시 TRIM 전면) ──
normalization:
  trim_columns:
  - pd_nm
  - pd_abrv_nm
  - pd_eng_nm
  - pd_abrv_eng_nm
  - std_pd_mcls_nm
  - std_pd_scls_nm
  - bd_knd
  - pd_pbcm
  - pd_exg_mkt
  - curr_cd
  - pd_ctry_cd
  - crd_grd
  - exg_close_price_base_dt
  grade_suffix: "사용자 'AA' → 'AA0' (한국식 중간값 0 표기). 'AA'·'A'·'BBB' 단독 표기는 DB 에 0건"
  issuer: "'(주)' 위치 앞뒤 제각각 — 정규화 매핑은 kg_organization (§5.1-①)"
  bd_knd_alias: "'통화안정증권'(통칭) → '통화안정채권'(실값 33행) (§5.1-⑧)"
  zero_as_missing:                         # 주최 공지(8/24): 0/결측은 의도된 값 → 정렬·필터에서 빼고, 조회 시 "없음" 응답
    기본: "수치 컬럼 정렬·필터는 IS NOT NULL AND <> 0 기본 — 아래 zero_is_value 컬럼만 예외"
    # 🔴 2026-08-26 주최 답변으로 예외 축소 — "수익률·총보수 같은 컬럼을 질의했을 때 그 컬럼의 값이 0 인 행들은
    #     아예 포함하지 않는 게 맞다 (값이 0 이니 당연히 기준이 없음)".
    #     srfc_irt(표면금리 0값 579행) · exrt_grte_ern_r(만기보장수익률 0값 21,626행) 해제 — 둘 다 수익률·금리 랭킹 축이고
    #     각 컬럼의 answer_policy 가 이미 '>0 한정' 을 지시하고 있어 플래그가 정책과 모순 상태였다.
    #     0 이 "이자 없는 구조(CB·EB)" · "만기보장 없음" 이라는 관측 사실은 각 컬럼 trap/note 에 유지한다.
    zero_is_value:
    - bdbns_abl_chnl_tcd                   # 코드 0 = '온오프 겸용' — 범주 코드값이지 수치 랭킹 축이 아님
    zero_as_missing_columns:
    - exg_close_price                      # 0 = 거래 없음(종가 없음) 16,476
    - exg_close_yield
    - applied_yield                        # 0 = YTM 산출 대상 아님 201
    - isu_dt                               # 0 = 미수록 25
    - mat_dt                               # 0 = 미수록 4
    - isu_bal_amt                          # 0 = 잔액 없음/미기입 325
    - bd_tisu_a
    - dur                                  # 0(잔존>0) = 산출 불능
    - ndy_eval_price
    - ndy_applied_yield
    - avg_annual_tax_yield                 # 전량 0
    # 🔑 2026-08-27 전수 재현 — 위 11컬럼의 0 건수가 yaml 기재와 전부 일치.
    #   목록에 없지만 0 을 가진 수치 컬럼: cov 102 · ndy_dur 72 · ndy_cov 121 · ndy_dirty 16 · exrt_rpy_r 1 ·
    #   remaining_days 49(만기 도래 — 실제 값. columns.remaining_days.note 참조).
    #   '기본' 규칙이 모든 수치 컬럼에 걸리므로 목록 누락은 결함이 아니라 기록 누락이다 — 위 건수는 참고용.
    #   ⚠️ 이 배제 동작을 검증하는 gold 문항은 아직 없다(eval 63문항 중 remaining_days 사용 0건) — 플래너 연결 후 실측 필요.

