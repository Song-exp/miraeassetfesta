    text: "buyable_quantity 는 무효(사용 금지). '살 수 있나' = curr_cd='KRW' AND mat_dt >= 20260824 (21,814행) 면 구매가능. 🔴 구매가능 판정 기준일은 **2026-08-24(월)** — 데이터 as-of(8/22 토)와 다르다(리드 결정 2026-09-02): 8/22·8/23 만기 14종목은 8/24 엔 만기 경과라 모수 밖. 하한은 >= (8/24 당일 만기 20종목은 모수). 판매 조건(수익률·단가)이 수록된 것은 그중 634행(판매행) — 나머지는 '구매 가능하나 당사 판매 조건은 미수록'."
    evidence: "⛑ pipeline.ensure_cutoff_inclusive 가 옛 기준일(8/20~8/23) 하한·> 리터럴을 mat_dt >= 20260824 로 교정한다."
