  발행시점축:
    text: "🔴 '발행된·새로 나온·신규 발행' 시점 질의는 **isu_dt(발행일자)** 로만 판단한다 — mat_dt 는 만기일이라 발행 시점을 대신할 수 없다. 조건에 isu_dt > 0 을 함께 넣는다(0·NULL 26행이 미수록이고, 모수에서 뺀 것을 답변에 밝힌다). '최근·지난 N개월' 은 **과거 방향**이다: 질문 시점(2026-08-24)에서 뒤로 센다 — '최근 6개월' = isu_dt BETWEEN 20260224 AND 20260824. 발행일이 판정일보다 뒤인 29종목(최대 20260910)은 발행예정이라 '최근 발행' 이 아니다."
    triggers: ['발행', '신규', '새로', '나온', '출시']
    evidence: "2026-09-05 서버 실측(오답기록 #66): '최근 6개월 안에 새로 발행된 회사채 중 표면금리 높은 5개' 가 답한 5종목의 실제 발행일은 2024-06-28·2024-06-28·2025-09-02·2025-09-24·2023-09-15 로 **5/5 전부 6개월 밖**이었다. 창이 mat_dt BETWEEN 20260824 AND 20270224(만기 6개월)로 갔고, 답변은 실행 SQL 에 isu_dt 가 없는데도 '모두 최근 6개월 내 발행되었으며' 라고 단언했다. 정답 모수는 2,348종목(isu_dt BETWEEN 20260224 AND 20260824 · 회사채 · 구매가능)이고 표면금리 상위는 중진공2026제1차…3-1/3-2(20.0%, 2026-06-26 발행)·성보파워텍3·태림페이퍼4(10.8%)다. ⛑ 런타임: build_grounding 발행 질의 분기 + enforce_relative_window ④ 가 짝이다."
  등급일사용금지: "crd_grd_dt 로 등급 최신성·신선도 판단 금지 — 스키마: '등급 미변경 시 과거 일자로 유지될 수 있음'. 🔴 등급 상향·하향·변동·추이 질의의 대체 축으로도 쓰지 말 것 — 등급 이력은 미수록(absent_properties.hasCreditGradeHistory)이고, 등급일은 78%(13,957/17,810)가 발행일과 같아 '최근 등급일' 은 '등급이 올랐다' 가 아니라 '최근에 발행됐다' 이다 (2026-09-04 서버 실측: '최근 6개월 신용등급이 오른 채권' → crd_grd_dt BETWEEN 20260701 AND 20260824 로 679종목을 냈고 그중 640종목이 7월 이후 발행분이었다). 이 문형은 게이트가 SQL 이전에 끊는다"
  이자유형분리:
    text: "표면금리 정렬은 bd_intp_tcd·bd_inrt_tcd 로 유형 분리 — 할인채(발행 할인율)·변동금리(스냅샷)·srfc_irt=0(구조) 을 고정 이표채와 한 축에 놓지 말 것. 🔴 분리 절(TRIM(bd_intp_tcd)='이표채' AND TRIM(bd_inrt_tcd)='고정금리' AND srfc_irt > 0)은 추천·랭킹 질의에만 넣는다 — 조건검색('표면금리 5% 넘는 것')에 넣으면 모수가 599→497종목으로 줄어 오답이다. 분리했으면 답변에 '고정금리 이표채 기준' 을 밝힌다. 🔴 **밝히지 않고 좁히는 것이 가장 나쁘다** — 이자유형을 조건에 넣었으면 모수 문장도 그 모수여야 한다."
    evidence: "(2026-09-04 실측 · gold BND-D-012 는 분리 O, BND-D-028 은 분리 X) · ⛑ pipeline.ensure_coupon_type_split · 2026-09-04 재배포 후 실측(#62): 규칙만 읽은 HCX 가 제 나름대로 bd_intp_tcd IN ('이표채','복리채') 를 넣어 88종목(단리채 63·할인채 25)이 조용히 빠진 모수 10,057 이 나갔다(조건 모수 10,145 · 규칙 정본으로 분리하면 9,532). 가드는 SELECT 표시 컬럼의 bd_intp_tcd 를 '이미 유형 절' 로 오인해 정규화하지 못했다 — 판정은 WHERE 범위로 한정."
  정렬축:
    text: "🔴 질문의 금리 낱말은 정렬·비교 컬럼으로 고정한다 — 표면금리·표면이자율·쿠폰 = srfc_irt · 수익률 = applied_yield · 세후수익률 = after_tax_yield · 매수수익률 = buy_yield. 질문에 없는 축으로 정렬하지 않고, 답변의 정렬 축 이름은 질문 낱말 그대로 쓴다(조립기는 ORDER BY 컬럼에서 축 이름을 뽑는다). 정렬 컬럼은 SELECT 에도 넣는다(필터컬럼표시). 단독 '금리·이자율' 은 다의라 두 축 중 하나로 단정하지 않는다 — 질문이 두 축을 함께 말하면 그대로 둔다. ⛑ pipeline.ensure_sort_axis 가 축을 교정하고, ORDER BY 자체가 없으면(ensure_reco_sort 는 표면금리 질의에 정렬을 주입하지 않는다) 주입한다. 🔴 **동률에는 2차 정렬을 붙인다** — 1차 축 값이 같으면 ① 신용등급 서열 높은 순(무등급 마지막) ② 만기 이른 순 ③ pd_no 오름차순으로 가른다. 2차 키 없이 ORDER BY 하나로 끝내면 등수가 DB 가 준 우연이라 같은 질문에 두 번 다른 순위가 나간다. 답변에는 동률을 무엇으로 갈랐는지 한 줄로 밝힌다. ⛑ pipeline.ensure_tie_break"
    evidence: "2026-09-04 서버 실측: 'A등급 이상 회사채 표면금리 높은 순 5개' 가 ORDER BY MAX(applied_yield) 로 나가 답변까지 '수익률 높은 순' 으로 축을 바꿔 적었다(1·2위의 표면금리는 7.1·3.0 — 정답 1위는 우리금융캐피탈458 7.5). 값이 전부 실제 행이라 환각 검사에 안 걸리는 축 치환이다. · 2026-09-04 재배포 후 실측(#62): 축은 고쳐졌는데 표면금리 7.5% 동률 두 종목(우리금융캐피탈458 AA- · 엠캐피탈355 A0)의 1·2위가 오전 실측과 뒤바뀌었다 — 값·축·모수가 다 맞아도 순서가 재현되지 않으면 오답이다."
  장내종가:    "exg_close_price/yield 는 장내 17,746행 중 값이 0 이 아닌 1,270행만 유효(0 = 거래 없음 16,476행) — 기준일(exg_close_price_base_dt) 필수 병기. 장외 4,136행은 NULL(해당없음)"
  구조표시:    "추천·랭킹에서 특수구조(콜·풋·후순위·전환·영구·코코·분리채권·물가채)를 제외하지 않는다 — 빼는 것은 고위험제외 규칙뿐(분리채권 209 는 전부 국고채 6등급). 대신 채권 목록 SELECT 에 아래 식을 '구조' 열로 그대로 붙인다(LIKE 만 사용 · 우선순위 순): CASE WHEN TRIM(bd_knd) IN ('특수은행채','일반은행채','금융지주회사채') AND pd_risk_gcd IN ('11','12','13') THEN '은행 자본성증권(후순위·조건부자본·영구)' WHEN pd_nm LIKE '%신종%' OR pd_nm LIKE '%영구%' THEN '영구채' WHEN pd_nm LIKE '%(후)%' OR pd_nm LIKE '%(후/%' OR pd_nm LIKE '%/후)%' OR pd_nm LIKE '%/후/%' THEN '후순위' WHEN pd_nm GLOB '*[0-9]CB*' OR pd_nm LIKE '%(전환%' OR pd_nm LIKE '%/전환%' THEN '전환사채' WHEN pd_nm GLOB '*[0-9]EB*' THEN '교환사채' WHEN pd_nm GLOB '*[0-9]BW*' THEN '신주인수권부' WHEN pd_nm LIKE '%분리채권%' THEN '국고채 STRIPS' WHEN pd_nm LIKE '%물가%' THEN '물가연동' WHEN pd_nm LIKE '%콜%' AND pd_nm NOT LIKE '%콜마%' THEN '콜옵션부' WHEN pd_nm LIKE '%(풋)%' OR pd_nm LIKE '%(풋/%' OR pd_nm LIKE '%/풋)%' OR pd_nm LIKE '%/풋/%' THEN '풋옵션부' ELSE '' END AS 구조 첫 줄(은행 자본성증권)은 이름이 아니라 컬럼 두 개(발행 종류 + 위험등급 1~3)로 판정한다 — 이름의 코코/조건상각/(상) 은 판정에 쓰지 않는다. 콜은 '콜' 앞뒤에 한글이 없을 때만(한국콜마 제외). 답변에서 이 열의 값을 종목 옆에 한 단어로 붙이고, 영구채는 '만기일 = 콜 개시일', 은행 자본성증권은 '원금 상각·이자 미지급 조건 가능' 을 덧붙인다. ESG 라벨 (녹)/(사)/(지) 는 name_encoding.esg_labels. 조회·사실확인 질의는 아무것도 빼지 않는다."
  ESG라벨:
    text: "종목명의 ESG 라벨은 컬럼이 없어 이름으로만 판정한다(표기 기준): 녹색채권 = (pd_nm LIKE '%(녹)%' OR pd_nm LIKE '%(녹/%' OR pd_nm LIKE '%/녹)%' OR pd_nm LIKE '%/녹/%') · 사회적채권 = (pd_nm LIKE '%(사)%' OR pd_nm LIKE '%(사/%' OR pd_nm LIKE '%/사)%' OR pd_nm LIKE '%/사/%') · 지속가능채권 = (pd_nm LIKE '%(지)%' OR pd_nm LIKE '%(지/%' OR pd_nm LIKE '%/지)%' OR pd_nm LIKE '%/지/%') (각 356 · 1,984 · 159행). 'ESG 채권' = 셋의 OR. 답변에 '종목명 표기 기준' 병기. (사)는 사모가 아니다 — 공모/사모는 bd_ofr_tcd."
    evidence: "(해석 확정 — 주최 무응답, 데이터 실측 근거 팀 결정 2026-08-31)"
  추천개수정렬:
    text: "추천·랭킹 질의는 LIMIT 5 가 기본이다 — 질문에 개수가 있으면(n개·n종목·top n·n가지) 그 수(상한 30). 조회·집계·사실확인 질의는 LIMIT 30 상한 그대로. 추천은 GROUP BY pd_no 로 종목당 한 줄, ORDER BY applied_yield DESC(수익률정상·고위험제외와 함께)가 기본 정렬이고 사용자가 다른 축(만기 짧은·듀레이션·표면금리·안전한 순)을 말하면 그 축으로 정렬한다. '가장 안전한 N개' 는 위험등급방향의 '16' 단독 필터가 정렬을 대신한다(전 행 동급 — 그 안의 수익률 내림차순은 동점자 처리로 허용). 정렬 없는 임의 30행은 추천이 아니다. ⛑ 2026-09-01 실측 재발('망하지 않을 회사 채권만 골라줘' 가 정렬 없는 임의 5행 — 상위 6.23% 누락) → 런타임 가드 pipeline.ensure_reco_sort 가 ORDER BY 부재 추천에 기본 정렬을 주입. '골라줘' 도 추천 신호다."
    evidence: "(2026-08-30 실측: '위험 낮고 2% 이상' 에 6등급 임의 30행이 나감 — 같은 모수의 상위는 7.12·7.10·6.38%)"
  개수질문:
    text: "'몇 개·몇 종목·개수' 질문은 SELECT COUNT(DISTINCT pd_no) 로 집계해 수를 답한다 — 목록 SELECT 의 LIMIT 행을 세거나 임의 N행을 보여주는 것은 오답이다(LIMIT 30 상한 아래서는 행을 세어도 개수가 아니다). '몇 개만 골라줘' 는 개수 지정 추천이지 개수 질문이 아니다(추천개수정렬). 모수를 밝힌다 — '지금 살 수 있는' = 구매가능 모수(curr_cd·mat_dt), 판매 조건 수록분(판매행)은 다르면 병기. (⛑ 런타임 가드 pipeline.ensure_count_query 가 COUNT 없는 목록 SELECT 를 집계로 교체하지만 처음부터 COUNT 로 쓴다)"
    evidence: "2026-09-01 서버 실측: '수익률 5% 넘는 건 몇 개야' 에 잔존일수순 임의 3행 목록 — 정답 1,406종목 부재."
  등급별집계:
    text: "'위험등급별 몇 종목·등급별 분포' 질의는 SELECT pd_risk_gcd, pd_risk_nm, COUNT(DISTINCT pd_no) FROM domestic_bonds GROUP BY pd_risk_gcd, pd_risk_nm — WHERE 로 등급을 거르지 않는다. 🔴 '00'(해당없음 19종목) 행을 결과에서 떨어뜨리면 불완전 답변이다 — 1~6등급 합 20,486 ≠ 전체 20,497 로 검증에서 바로 걸린다. 7줄 전부 답하고 '해당없음(등급 미부여) 19종목' 으로 말한다. 합계 주의: 8종목(KR352502GG80 등)이 '00' 행과 '15'/'16' 행을 둘 다 가져 등급별 DISTINCT 합(20,505)이 전체(20,497)보다 8 크다 — '00' 전용은 11종목. 합계를 물으면 전체 20,497 로 답하고, 등급별 수를 단순 합산해 전체라고 말하지 않는다. 다른 축(신용등급별·종류별) 분포 질의도 같은 원리 — NULL·해당없음 버킷을 빼지 않고 '미수록 N종목' 으로 포함한다."
    evidence: "(2026-09-01 실측: 6줄만 답해 19종목 누락)"
  존재질문:
    text: "'~채권 있어?/있나요?' 존재 질문은 COUNT(DISTINCT pd_no) 집계 또는 목록 SELECT 어느 쪽도 유효하다 — 단 COUNT(*) 는 행수라 종목 수가 아니다(대표행). 🔴 집계 결과가 양수면 정답은 '네, N종목 있습니다'(+예시·모수) 이고 0이면 '없다' 다 — 양수 숫자를 '정보가 없다' 로 읽는 것은 오거절 오답이다"
    evidence: "(2026-09-02 서버 실측: '퇴직연금으로 살 수 있는 채권 있어?' 에 COUNT(*)=1,929 정상 반환에도 '정보 미포함' 거절 — 정답 843종목·구매가능 모수. ⛑ 가드 2건: ensure_distinct_count 어휘 확장('있어?' 문형에도 DISTINCT 교정) + ensure_positive_count_answered 가 양수 집계 오거절을 기계 조립으로 교체)"
  금리유형:
    text: "'변동금리 채권' 질의 = TRIM(bd_inrt_tcd)='변동금리' 830종목을 답하되 '고정+변동금리' 148종목(일정 기간 고정 후 변동 — ABS·금융채 구조)을 반드시 병기한다. FRN 전체를 물으면 IN ('변동금리','고정+변동금리') 978종목. '고정금리' = 19,519종목(20,904행). 값은 스키마 표기 그대로 인용('고정+변동금리')."
    evidence: "(name_encoding is_frn 정의와 동일 — 2026-09-02 서버 실측: 830 단독 답변은 148 버킷 누락으로 불완전)"
  고위험제외:
    text: "추천·랭킹 질의는 WHERE 에 pd_risk_gcd <> '11' AND COALESCE(TRIM(crd_grd), '') <> 'C0' AND bd_ofr_tcd <> '사모' 를 넣는다. ❌ NOT (pd_risk_gcd='11' OR crd_grd='C0') 금지 — crd_grd 가 NULL 인 4,020행(국공채 전부)이 통째로 빠진다. 이유: 수익률 50% 초과 96행(최고 728.5%)은 전부 C0·1등급 부실채(평가가가 액면의 27~45%)이고, 사모는 일반 투자자가 살 수 없다. 제외 사실을 답변에 밝힌다: '위험등급이 매우 높은(1등급) 채권과 사모 채권은 제외했습니다.' 조회·사실확인 질의에서는 제외하지 않는다(728.5% 는 사실) — 신용등급·위험등급을 함께 답한다. 주의 문구: 답변에 실린 종목 중 applied_yield > 6% 또는 pd_risk_gcd IN ('12','13') 이 있으면 '수익률이 높은 채권은 원금을 돌려받지 못할 위험도 높을 수 있습니다. 신용등급·위험등급을 함께 확인하세요.' 를 붙인다(조회 답변도). 추천 모수 약 19,400행 · 최고 9.82% · 국공채 최고 4.89%. ❌ 가격 기준 필터 금지 · ❌ 유동화 전체 제외 금지. 런타임 가드가 빠진 제외 절을 주입하지만, 처음부터 조건을 그대로 쓴다."
    evidence: "⛑ 2026-08-31 저녁 재발('AA등급 이상 추천'에 사모 3건 1~3위 혼입) → 런타임 가드: 추천·랭킹 신호 질의에 제외 절이 빠지면 pipeline.ensure_reco_exclusions 가 주입(질문이 사모·C0·고위험을 명시하면 그 절은 건너뜀)."
  신용보강:
    text: "🔴 '정부가 책임지는/보증하는/나라가 갚는/안전한 공공 채권' 류 질의는 반드시 WHERE 에 아래 필터를 그대로 넣는다 — 국공채 단독 필터는 오답이다: (TRIM(std_pd_mcls_nm)='국공채' OR COALESCE(TRIM(pd_pbcm),'')='한국은행' OR pd_nm LIKE '%(정부보증)%' OR TRIM(pd_pbcm) IN ('한국주택금융공사','한국토지주택공사','한국산업은행','(주)중소기업은행')). SELECT 에는 아래 식을 '보강' 열로 붙여 층을 함께 답한다(컬럼 3개만 · 단어 필터 없음): CASE WHEN TRIM(std_pd_mcls_nm)='국공채' OR COALESCE(TRIM(pd_pbcm),'')='한국은행' THEN 'A 정부·지자체·한은 직접 발행' WHEN pd_nm LIKE '%(정부보증)%' THEN 'B 정부보증 명시' WHEN TRIM(pd_pbcm) IN ('한국주택금융공사','한국토지주택공사','한국산업은행','(주)중소기업은행') THEN 'C 법정 손실보전 기관' WHEN TRIM(std_pd_mcls_nm)='특수채' THEN 'D 특별법 공공기관(정부 보증 표기 없음)' WHEN COALESCE(TRIM(bd_knd),'') IN ('MBS','유동화회사채','Conduit회사채') OR COALESCE(pd_pbcm,'') LIKE '%유동화%' OR COALESCE(pd_pbcm,'') LIKE '%신용보증%' OR COALESCE(pd_pbcm,'') LIKE '%기술보증%' OR pd_nm LIKE '%유동화%' THEN 'E 유동화(기초자산 담보)' ELSE 'F 민간 회사채' END AS 보강 분포: A 2,873 · B 7 · C 2,968 · D 3,171 · E 2,648 · F 10,215. A = 국공채 + 한국은행 통안채. C = 법정 손실보전이 확인된 4곳(주금공 MBS 포함). D = 특수채 발행 공공기관(한전·도로공사·수출입은행 등) — 손실보전 조항 미확인. 답변 규약: ① D 에 '정부 보증' 이라 말하지 않는다('특별법 공공기관 발행, 정부 보증 표기 없음') ② 구조 열이 은행 자본성증권·후순위·영구채면 A·B·C 라도 '손실보전 대상 아님' 병기 ③ 발행사 칸이 빈 행은 '발행사 미수록' 병기 ④ E 는 정부와 무관(담보는 기초자산). 그래도 처음부터 완성식 그대로 쓴다."
    evidence: "(2026-08-31 서버 실측: 국공채만 조회해 1위 토지주택채권 330(변) 5.859% 등 C층 전부 누락) · ⛑ 2026-08-31 저녁 서버 재발(지시문 승격 후에도 C층 탈락·고위험제외 누락 → 1위 5.859% 누락·사모 14.05% 혼입) → 런타임 가드 신설: HCX 가 층·제외를 빠뜨리면 pipeline.ensure_credit_backstop 이 주입한다."
  시장집계금지:  "pd_exg_mkt 단독 group-by 금지 — 구성 효과 교란 (§9.5). 같은 종목이 양 시장에 있을 수 있음"
  장외등급해석:  "장외 등급 결측 48.9%(2,023/4,136)는 미평가 — 저품질·고위험으로 해석 금지 (장내는 11.3%)"
  유동화위험금지: "유동화 = TRIM(bd_knd) IN ('MBS','유동화회사채','Conduit회사채') OR pd_pbcm LIKE '%유동화%' OR pd_pbcm LIKE '%신용보증%' OR pd_pbcm LIKE '%기술보증%' OR pd_nm LIKE '%유동화%' (4,045행). 발행자가 SPC 라 발행사명으로 위험·원회사를 판단하지 않는다."
  외화채없음:
    text: "🔴 스코프 규칙 — 이 적재분의 통화 스코프는 `scope.currency: [KRW]` 하나다(21,881행). 모든 채권 질의에 curr_cd='KRW' 를 기본 조건으로 걸고, 달러·엔·유로·외화 질의는 '없는 상품' 이 아니라 **'이 데이터의 수록 범위 밖'** 으로 답한다 — 해외ETF 로 유도하지 않는다. curr_cd='000' 1행은 통화 미수록 오염값이라 값으로 쓰지 않는다(다른 통화 코드를 지어내지 말 것). 스코프가 넓어지면(외화채 적재) `scope.currency` 에 값을 더하는 것으로 끝이다 — 이 규칙도 게이트도 고치지 않는다. 1차 데이터엔 실제로 USD 19·JPY 1·EUR 1 이 있었다."
    evidence: "2026-08-31 실측: HCX 가 curr_cd='XS' 를 날조해 0행을 '조건 교집합 없음' 으로 포장"
  기준일:
    text: "세 날짜를 구분한다 (원천: shared/dataset.yaml `dates` — 코드·규칙이 같은 선언을 읽는다) — ① 데이터 스냅샷 종가일 info_base_dt 20260821(금): remaining_days·가격·수익률의 산출 기준 ② 주최 as-of 8/22(토, 영업일 아님): 데이터 설명에만 ③ 질문 시점(오늘) = 2026-08-24(월, 주최 명시 기준일·배포일·첫 결제 가능 영업일): 답변의 '기준일' 표기·구매가능 판정(mat_dt >= 20260824)·오늘/내일/올해/내년 같은 상대 시점의 기준. 잔존일수를 말할 때는 컬럼 원값을 쓰되 '8/21 산출' 을 병기한다(재계산 금지)."
