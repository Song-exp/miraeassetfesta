  종류필터:
    text: "🔴 채권 종류 낱말(국고채·국채·은행채·카드채·회사채·지방채·통안채·MBS 등)은 동의어 표의 컬럼·값으로 정확히 필터한다. 다의 통칭 3종은 아래 확정식 그대로: ① 국고채·국채 = (TRIM(bd_knd)='국고채권' OR (COALESCE(TRIM(bd_knd),'')='' AND TRIM(std_pd_scls_nm)='국고채')) — 원금분리채권(STRIPS) 21행은 종류 결측이나 기재부 STRIPS 제도(「국고채권의 발행 및 국고채전문딜러 운영에 관한 규정」)에 따라 국고채에서 분리된 정부 원리금 지급 채권이고, 데이터 자체도 소분류 '국고채'·위험 6등급으로 분류하며 같은 이름 패턴 188행은 bd_knd='국고채권' 이므로 포함(295종목). 목록엔 구조 열의 '국고채 STRIPS' 라벨 병기 ② 은행채 = TRIM(bd_knd) IN ('일반은행채','특수은행채') — 특수은행채 발행사는 전부 은행이고 소분류명 자체가 '특수은행채'(2,031행). 단 발행주체 분류에선 특수채로도 불리므로 답변에 '특수은행채(산금채 등) 포함' 을 병기. 금융지주회사채는 은행이 아니라 제외 ③ 지방채 = TRIM(bd_knd) IN ('모집지방채','지역개발채','도시철도공채') — 3종 발행사 전부 광역지자체 실측(서울·부산·경기 등). 지역개발채권(지방공기업법 §19·시도 조례)·도시철도채권(도시철도법)은 지자체 발행 매출공채(2,239행). 지방공사채 2종은 발행사가 지방공사(경기주택도시공사 등)라 제외. 단일 통칭은 동의어 표 값 그대로 — 회사채 = TRIM(std_pd_mcls_nm)='회사채' (대분류가 정본 — 2026-08-31 리드 결정 · 이 조건을 빼먹는 것도 오답: 'A등급 이상 회사채' 실측에서 종류 조건이 통째로 빠졌다). 종류 낱말 없이 발행 주체로 풀어 쓴 질의도 같은 필터다: '회사(기업)가 발행한 채권'=회사채 대분류 · '은행이 발행한'=은행채 2종 · '카드사가 발행한'=신용카드채 · '캐피탈사'=할부금융채 · '보험사'=보험회사채 · '증권사'=투자매매.중개채 · '지자체가 발행한'=지방채 3종 · '한국은행이 발행한'=통화안정채권 · '정부(나라)가 발행한'=국공채 대분류 · '여전채(여신전문금융채)'=TRIM(bd_knd) IN ('신용카드채','할부금융채','시설대여채(리스)') — 리스채 실값은 괄호 포함 '시설대여채(리스)'(괄호 없는 등호는 0행. 2026-09-02) · 🔴 통안채는 대분류가 특수채라 '국공채 대분류' 필터에 안 잡힌다 — 국공채+통안채를 함께 원하는 질의는 OR TRIM(bd_knd)='통화안정채권' 을 덧붙인다. 단 특정 회사명을 지칭하면(삼성전자라는 회사가 발행한) 발행사조회로 — 종류 필터를 덧씌우지 않는다. 대분류(std_pd_mcls_nm)로 넓혀 대체하면 오답이다. ⛑ 2026-08-31 저녁 재발('국고채 몇 종목'→국공채 행수 2,840 오답) → 런타임 가드: 국고채·국채 질의가 대분류로 뭉개지면 pipeline.ensure_ktb_kind 가 확정식 ①로 교체하고, 종목 수 질의의 COUNT(*) 는 ensure_distinct_count 가 COUNT(DISTINCT pd_no) 로 교정. ⛑ 같은 날 밤 3차 재발: 이번엔 bd_knd='국고채권' 은 맞았는데 TRIM(pd_pbcm)='한국은행' 을 날조해 0행 '미수록' → ensure_ktb_kind 확장: 질문에 없는 발행사 등호 절 제거 + bd_knd 단독(STRIPS 21종목 누락, 274≠295)을 확정식으로 확장. 그래도 처음부터 확정식대로 쓴다."
