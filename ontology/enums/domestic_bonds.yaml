    text: "🔴 WHERE 에 쓴 판단 컬럼(crd_grd·pd_risk_gcd·bd_knd 등)은 SELECT 에도 넣는다 — 답변기는 SELECT 된 컬럼만 보므로, 필터 근거가 결과에 없으면 '그 정보가 없다' 오거절이 나온다 (⛑ 런타임 가드 pipeline.ensure_grade_select_column 이 crd_grd 를 주입하지만 처음부터 넣는다). '등급' 낱말만 있는 질문은 신용/위험 어느 축인지 밝히거나 되묻는다(clarify.다의어.등급)"
