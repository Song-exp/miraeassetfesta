    note: >
      모수 사다리: 881(호가 있음) → 325(수량>0) → 254(만기도 안 지남). 881건 중 277건이 이미 만기 도래.
      평가X 매수O 는 0건 — 매수 정보는 평가 정보의 부분집합.
      📖 결측률이 채권의 생애 단계를 반영 (2026-08-20 실측): 발행조건(SRFC_IRT·MAT_DT) 결측 0%
      ← 채권이 존재하면 반드시 존재 / 평가정보(EVAL_PRICE·APPLIED_YIELD) 24.9% ← 평가사가 값을
      매겨야 존재 / 매수정보(BUY 7종) 97.9% ← 증권사가 "지금 팝니다" 해야 존재.
      결측은 오류가 아니라 "그 단계에 없음"이라는 도메인 정보.
