# ── 상수 컬럼 게이트 (R-5 ① 층 · HCX 0회) — 2026-09-03 서버 실측: '달러로 발행된 채권 알려줘' 를 HCX 가 curr_cd = '000'
#    (통화 미수록 오염값 1행 BAC 0 05/14/55 Corp) 로 풀어 규칙 외화채없음이 '사용 불가' 로 못 박은 행을 SELECT * 로 답으로 냄.
#    값 검사는 '000' 이 DB 에 실재해 통과한다 — 어휘 층에서 HCX 앞에 끊는다. 트리거는 DB 어휘와 충돌하지 않는 것만
#    ('외국환평형기금채권'·'해외인프라도시개발채권' 은 안 걸리게 — 2026-09-03 실측 외국 12행·해외 5행).
gate_constants:
# 🔴 value 는 스코프 선언에서 온다 — `scope_key: currency` (loader.scope_values). 스코프 값이 둘 이상이 되면
#    (외화채가 적재되면) 이 게이트는 로더가 자동으로 뺀다. "없다" 가 아니라 "지금 수록 범위가 원화뿐" 이기 때문이다.
- column: curr_cd
  scope_key: currency
  value: KRW                      # 스코프에서 채워진다(선언이 없을 때의 안전값)
  triggers:
  - '달러'
  - '\bUSD\b'
  - '외화'
  - '외국\s*(?:채|통화)'
  - '엔화'
  - '유로(?:화|\s*표시)'
  - '위안'
  - '해외\s*(?:채권|에서\s*발행)'
  - '외국에서\s*발행'
  reason: "domestic_bonds.curr_cd 스코프가 [KRW] 하나(21,881/21,882 — 나머지 1행은 통화 미수록 오염값 '000') · 외화 표시 채권은 이 적재분의 수록 범위 밖 (scope.currency · 규칙 외화채없음)"
  answer: "국내채권 데이터는 원화(KRW) 표시 채권만 수록하고 있어, 달러 등 외화 표시 채권은 이 데이터의 수록 범위에 없습니다 (기준일 2026-08-24). 통화가 수록되지 않은 1행(BAC 0 05/14/55 Corp)은 표면금리·만기일도 없어 답변에 쓰지 않습니다."

# ── 부재 속성 선언 (2026-09-02 KG 1R S5 — 4도메인 같은 형식. build → bond_kr.ttl ABSENT · gate 어휘) ──
absent_properties:
  - property: hasCreditGradeHistory
    why: "채권 신용등급은 기준일 현재 등급(crd_grd)만 있고 등급 추이·변동 이력(상향·하향)은 수록되어 있지 않습니다."
    # ⛑ 2026-09-04 서버 실측 — "최근 6개월 사이에 신용등급이 오른 채권들 정리해줘" 가 이 선언을 통과했다.
    #    옛 어휘는 '신용등급' + 명사(추이·변동·상향…)가 **붙어 있을 때만** 잡아 구어 동사형(오른·올라간·떨어진·강등된)을
    #    전부 놓쳤다(이력 문형 10개 중 4개만 매칭). 게이트가 열리자 HCX 가 없는 축(등급 이력)을 있는 컬럼(crd_grd_dt)으로
    #    대체해 679종목 목록을 냈다 — 등급일은 78%(13,957/17,810)가 발행일과 같아 '최근 등급일' = '최근 발행'이다.
    # 🔴 이음은 조사·부사만 허용한다(와일드카드 금지) — '.{0,8}' 형은 "신용등급 대비 수익률이 오른 채권"을 오폭했다.
    #    확장 후 실측: 이력 문형 14/14 매칭 · 오폭 후보 19/19 통과('등급 낮은'·'신용등급 AA- 이상'·'신용등급 변동성'·
    #    '변동금리'·'수익률이 오른' 포함) · 기존 문항 266개(eval/*.jsonl 4도메인 + probe 2종) 전수 대조 신규 기각 0건.
    vocab: ['(?:신용|위험)?등급(?:[이은을가의도들])?\s*(?:(?:크게|많이|한|두|세|\d+)\s*)?(?:단계\s*)?(?:오른|올라|올랐|올린|상향|승격|상승|떨어진|떨어졌|내려간|내렸|하향|강등|낮아진|높아진|좋아진|나빠진|바뀐|바뀌|변동(?!성)|변화|추이|이력|히스토리)']
    # substitute 는 note 만 둔다 — column 을 넣으면 build_ontology 가 ttl ABSENT 주석을 "(대체: …)" 로 바꿔
    # bond_kr.ttl 과 제안서 부록(04_도메인_채권.md §E.1) 원문이 함께 바뀐다. 거절로 끝내지 않는 것이 목적이다.
    substitute: {note: "수록된 것은 기준일 현재 등급과 그 부여일(crd_grd_dt)입니다 — 현재 등급 기준 조회나 최근 발행된 채권 조회로는 답할 수 있습니다."}
