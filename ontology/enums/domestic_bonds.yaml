# domestic_bonds — 사람의 판단을 담는 파일
# 기계적 사실(결측률·distinct·값 목록)은 domestic_bonds.auto.yaml 에 있습니다. 여기엔 판정과 규칙만 씁니다.
# 런타임 가드레일이 이 파일을 읽습니다.
#
# 범위: 2단계(결측 판정 · 컬럼 판단 · 쿼리 규칙 · 축 유도).
#   개체·관계 매핑(entities/class_hierarchy)은 4단계(워크샵 후). → docs/domain/domestic_bonds_graph.md §0·§4 참조.
# 근거: docs/domain/domestic_bonds_graph.md (§ 번호 인용) · docs/eda/domestic_bonds_notes.md (노트 §)
# 미확정(워크샵 안건)은 파일 끝 workshop: 절에 모았습니다.

domain: domestic_bonds

# ── 행의 낟알 (2026-08-18 감사 확정) ──
row_grain:
  구조: 행 = 종목 (PD_NO 완전 유일 — 42,394행 = 42,394 distinct · NULL 0)
  evidence_grade: A
  note: 공모펀드(행=종목×속성태그)와 달리 행이 곧 종목이다. COUNT(*) 그대로 사용 가능.

columns:

  # ── 1.1 식별 (6) — 📌 불변 ─────────────────────────────────────────
  PD_NO:
    korean_name: 종목코드
    missing_reason: none
    answerable_n: 42394
    note: >
      PK — 결측 0 · 중복 0. 12자리 ISIN.
      🔑 앞 3자리에 대분류 인코딩: KR6 회사채 31,327 / KR3 특수채 8,812 / KR2 국공채 1,631 /
      KR1 국공채·개인국채 333 / KRC 222 · KRB 49 · KRZ 19 · XS3 1.
      분류 트리가 깨져 있고(§7.1) BD_KND 결측 924건이라 사실상 유일한 분류 보완 수단 (§5.2).
      🔴 단 1:1 아님 — KR3 에 회사채 57 혼재 등 (name_encoding.isin_prefix 교차표, 2026-08-20 실측).
  PD_NM:
    korean_name: 종목명
    missing_reason: none
    trap: >
      🔴 패딩 3.3% 혼재(다른 컬럼처럼 일괄 패딩이 아님) — TRIM 없으면 종목마다 검색 성패가 갈림.
      공백 흔들림 3종(붙임/띄움/괄호 앞 공백) — 파싱 전 정규화 필수 (§5.1-⑥).
    note: >
      🔑 이름 자체가 구조화 데이터 (§5.2): 국고채 '01875-5103(21-2)' = 표면 1.875%·만기 2051-03·2021년 2회차
      (SRFC_IRT·MAT_DT 와 일치 검증됨). 특수구조 플래그 13종·분리채권 221건·이표/할인/복리는
      종목명이 유일한 식별 수단 → name_encoding: 절.
  PD_ABRV_NM:
    korean_name: 종목약어명
    missing_reason: missing
    missing_semantics:
