  한전: 한국전력공사            # pd_pbcm '한국전력공사(주)' 403행
  한국전력: 한국전력공사        # 🆕 2026-09-04 — 자동 통칭 규칙은 종목(주식 한국전력) 라벨과 겹쳐 만들지 않는다. 채권 질의에선 대상 테이블 우선순위로 발행사 노드가 이긴다
  기업은행: 중소기업은행        # 🆕 2026-09-04 — 접두 제거로는 안 나오는 통칭. 사람은 '기업은행' 이라 부른다
  LH: 한국토지주택공사
  산은: 한국산업은행
  기은: 중소기업은행            # pd_pbcm '(주)중소기업은행'
  주금공: 한국주택금융공사      # 1,558행 (그중 MBS 1,396 = MBS 전부 · 나머지 162 는 주택금융공사채권)
