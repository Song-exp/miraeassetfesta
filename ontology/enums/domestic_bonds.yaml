      "XS": 🔸 국제예탁결제기구(Euroclear/Clearstream) 코드 — 국가 아님. 1건
    kg_entity: null                        # 사실상 상수 → KG 개체 무의미 (§4.1)
    note: 상수에 가까움. XS 1건은 enum 화이트리스트에서 '국가'로 등재 금지.

  # ── 1.2 분류 (3) — 📌 불변 · 🔴 3층이 트리가 아님 (§7.1) ────────────
  STD_PD_MCLS_NM:
    korean_name: 표준상품 대분류명
    missing_reason: none
    answerable_n: 42394
    value_semantics:
      "회사채": 일반 기업(은행·카드·캐피탈 포함) — 31,447건(74.2%). 부도위험 기업별 상이
      "특수채": 법률로 설립된 공기업(한전·LH·주금공·산은) — 8,755건(20.7%). 정부가 사실상 보증
      "국공채": 정부(국고채)·지자체(지방채)·한국은행(통안채) — 2,137건(5.0%). 부도위험 최저
      "개인투자용국채": >-
        정부 발행 개인 전용 — 49건. 🔴 전부 '장외'. ✅ 2026-08-20 확정 — 미래에셋증권 단독
        판매대행(전용계좌 청약)·소유권 이전 불가·유통시장 부존재 → 장내 거래가 제도적으로 불가
        (근거: data/external/lookups/ktb_individual_structure.md. 이전 '직접판매 추정 🔸' 승격)
      "외화채권-회사채": 5건
      "외화채권-금융채": 1건
    kg_entity: null                        # 채권 전용 → SQL 컬럼으로 충분
    note: >
      ✅ 분류 3층 중 유일하게 안전한 층 — axis_issuerType 매핑은 여기만 (§7.1).
      🔴 소분류·채권종류에서 대분류 역추적 금지(842건 오류). 📖 금리는 안전도의 역순(신용스프레드),
      듀레이션은 안전도의 정순 — 두 위험이 상충 (§6.1·§9.3).
      🔴 '외화채권' 질의를 이 컬럼으로 grounding 금지 — 실제 외화 21건(USD 19+JPY 1+EUR 1,
      2026-08-18 감사 정정: 오염값 '000' 제외) vs 여기 6건 (노트 §D.16-④).
  STD_PD_SCLS_NM:
    korean_name: 표준상품 소분류명
    missing_reason: mixed
    answerable_n: 42381
    answer_policy: >
      결측 13건 = 외화채권 6건(소분류 체계 자체가 없음 — "부여되지 않습니다") +
      회사채 7건(미부여 — "수록되어 있지 않습니다"). 두 문구를 구분해 답합니다.
    note: >
      실제 16종(NULL 을 고유값으로 세면 17로 과장). 🔴 소분류 3종이 두 대분류에 걸침
      (일반사채 = 회사채 30,116 + 특수채 842) → 상위 역추적 금지 (§7.1).
  BD_KND:
    korean_name: 채권종류
    missing_reason: missing
    answerable_n: 41470
    answer_policy: 결측 924건은 "채권종류가 수록되어 있지 않습니다" + PD_NO 앞 3자리로 대분류 수준 보완 (§5.2).
    trap: >
      🔴 ① 공백 패딩으로 39종이 51종으로 갈라짐 — TRIM 필수.
      ② 통안증권의 실값은 '통화안정채권' — '통화안정증권'으로 조회 시 0건 (§5.1-⑧).
      ③ 분리채권(STRIPS) 221건이 평범한 '국고채권'으로 묻힘 — 종목명 파싱만이 식별 수단 (§9.1).
    note: 실제 39종(결측 제외). 값 전수는 auto.yaml values 참조. 상위(소분류) 특정 불가 (§7.1).

  # ── 1.3 발행자·시장 (3) — 📌 불변 ──────────────────────────────────
  PD_PBCM:
    korean_name: 발행사
    missing_reason: missing
    answerable_n: 41476
    answer_policy: 결측 2.2%(918건)는 "발행사 정보가 수록되어 있지 않습니다" (BD_KND 결측과 거의 같은 행 🔸).
    trap: >
      🔴 ① '(주)' 위치 제각각((주)신한은행 vs 하이트진로(주)) — 정규화 전 동일사가 갈라짐.
      ② 종목 수 ≠ 규모 (대한민국 535종목 < 하나캐피탈 541종목 — 규모는 ISU_BAL_AMT 로, §9.6).
      ③ MBS·유동화는 발행자 = 자산(SPC) — 원 회사 위험과 다름. PD_PBCM 만으로 위험 판단 금지.
      🔧 정정(seohynun/08-21) [B8]: 식별 범위를 **7,952건**으로 확장 (이전 4,957 은 과소).
      BD_KND IN ('MBS' 2,159 · 'SLBS' 34 · '유동화회사채' 2,798 · 'Conduit회사채' 2,792)
      OR PD_NM LIKE '%유동화%' OR PD_PBCM LIKE '%유동화%' (BD_KND 공란 169건 회수).
      ✅ **'7,749건' 폐기 취소** — 재현 불가가 아니었다. 7,749 = MBS + 유동화회사채 + **Conduit회사채**
      로 정확히 재현된다. 이전 재현 시도가 Conduit 을 빼놓았을 뿐이다(도메인 문서 §6 은 이미
      "유동화회사채 / Conduit회사채 = ABS 5,590" 으로 한 묶음 취급). 담보축 collateralType 이 쓰는
      SPC 4종 7,783(= 7,749 + SLBS 34)과도 같은 계열 — 같은 파일 안의 두 규칙이 어긋나 있었다.
    kg_entity: Organization                # 4테이블 교차 → kg_organization (§5.1-①)
    note: >
      ✅ 2026-08-20 규명 (워크샵 #4 해소) — 8,018 = 전체 distinct TRIM(PD_PBCM) /
      8,015 = 만기일 유효(MAT_DT>0) 채권 기준 distinct (그중 만기 종료에만 존재 2,291 = 28.6%,
      노트 §표와 정확 일치). 두 수 모두 정당 — 서술 시 모수(전체 vs 만기일 유효)를 병기할 것.
      raw distinct 는 8,103 (TRIM 미적용). 발행사 재무·계열 정보는 없음 (§11).
  PD_EXG_MKT:
    korean_name: 거래시장
    missing_reason: none
    answerable_n: 42394
    value_semantics:
      "장내": 한국거래소 — 24,749건. 개인도 참여, 표준화·등급 있는 우량채 위주
      "장외": 증권사·기관 1:1 상대 거래 — 17,645건. 소액 사모·특수구조 몰림
    trap: >
      🔴 거래 방식이 아니라 종목 속성 — 종목당 한쪽만 기록(같은 종목 장내/장외 비교 불가).
      단독 group-by 금지: 장외 YTM 6.1% vs 장내 3.2% 는 시장 효과가 아니라 구성 효과 —
      대분류·등급·잔존만기 통제 시 0.03~0.2%p 로 소멸 (§9.5).
    kg_entity: null
    note: >-
      개인투자용국채 49건 전부 장외 — "개인 = 장내" 대응 없음. ✅ 확정(2026-08-20): 단독 판매대행
      청약 전용 + 유통시장 부존재라 장외 분류가 제도적 필연 (lookups/ktb_individual_structure.md).
  CURR_CD:
    korean_name: 통화코드
    missing_reason: none
    answerable_n: 42394
    value_semantics:
      "KRW": 원화 — 42,372건 (사실상 상수)
      "USD": 미국달러 19건
      "JPY": 엔화 1건
      "EUR": 유로 1건
      "000": 🔴 오염값 1건 — 통화 아님. enum 등재 금지
    kg_entity: Currency                    # 공유 개체 6종에 포함 (§4.1)
    note: >
      🔴 '외화채권' grounding 은 이 컬럼 기준 — 실제 외화는 **21건**(USD 19+JPY 1+EUR 1)이고
      대분류가 '외화채권-*'인 건 6건뿐, USD/EUR 다수가 그냥 '회사채'로 분류돼 있음 (노트 §D.16-④).
      ⚠️ 2026-08-18 감사 정정 — 이전 "≠KRW 22건" 은 오염값 '000' 1건을 외화로 센 것.

  # ── 1.4 발행조건 (4) — 📌 발행 시 확정 (🔴 예외: FRN) ───────────────
  SRFC_IRT:
    korean_name: 표면금리
    missing_reason: none
    answerable_n: 42392
    unit: percent
    trap: >
      🔴 한 컬럼에 네 의미 (§9.1): 일반채 = 발행 시 약속(불변) / FRN 643건 = 기준일 현재 적용 금리
      스냅샷 🔸 (구형 84건은 스탬프-값 불일치 — 사용 금지) / 분리채권 221건 = 모체의 명목값(실제 무이표) /
      할인채 172건 = 발행 시 할인율 ✅. 넷을 한 축에 놓고 정렬 금지.
      🔴 '=0' 2,758건은 결측 아님 — 53.2%가 전환사채(이자 대신 전환권). ZeroCoupon 판정은
      SRFC_IRT 가 아니라 종목명('할인'·'분리채권') + 가격 구조로 (노트 §D.15).
      ✅ 검토(seohynun/08-21) [B6]: 할인채 판정 **지지**. 근거를 단일 종목 1건에서 **살아있는 전건 69건**으로 확대 재현.
      ① 요청서 지정 검정(무이표 가격식, 할인율=SRFC_IRT) — 무작위 10건 **10/10** ±0.5% 이내
         (합격 기준 9건). seed 0~4 로 5회 반복해도 전부 10/10 — 표본 운이 아니다.
      ② 전건 69건 모델 비교 — 이 판정의 결정적 증거:
           무이표(SRFC_IRT)      중앙오차 0.079%  ±0.5% 이내 69/69 (100%)
           무이표(APPLIED_YIELD) 중앙오차 0.008%  ±0.5% 이내 69/69 (100%)
           이표채(쿠폰=SRFC_IRT) 중앙오차 0.837%  ±0.5% 이내 15/69 (21.7%)  ← 기각
         SRFC_IRT 가 쿠폰이라면 가격이 액면 근처(9,980)여야 하는데 실제는 9,852 다.
         SRFC_IRT 를 **할인율로 넣었을 때만** 가격이 재현되므로 '표면이율란에 할인율 기재' 가 확정된다.
      ③ 액면 미만 100% — 살아있는 69건 전부 EVAL_PRICE < 10,000. 10,000 이상 103건은 전건 만기 도래분.
      ④ '박제 vs 시세' 구조도 재현 — APPLIED_YIELD − SRFC_IRT 중앙 **+0.234%p**, 60/69 에서 양수.
         발행 시 할인율(고정)과 현재 시세의 차이로 정합. 잔존만기 중앙 123일의 단기물이다.
      ⚠️ 주의 — ①의 SRFC_IRT 검정이 통과한 것은 단기물(중앙 123일)이라 두 이자율의 가격 차가
         ±0.5% 안에 들어오기 때문이다. **현재가 계산에는 APPLIED_YIELD 를 쓸 것** (오차 10배 작음).
    answer_policy: >
      "표면금리 높은/낮은 채권" 정렬 시 FRN·분리채권·할인채를 제외하거나 유형별로 나눠 답하고,
      유형(고정/변동/무이표)을 명시합니다.
    note: >
      FRN 643건 — 판정 규칙은 name_encoding.is_frn 의 정규식 `(?<!천)변` (B3/08-21 확정).
      "표기 4종"은 결과 내역((변) 271 · (콜/변) 232 · (변동)류 29 · 그 외 111)이지 판정 규칙이 아니다.
  ISU_DT:
    korean_name: 발행일
    missing_reason: missing
    missing_semantics:
