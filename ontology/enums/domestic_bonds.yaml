      근거: 338건이 전부 1,000 배수이고 발행잔액(isu_bal_amt) 이하 (검토 B-3-02, 2026-08-27).
      unit 은 기존 어휘 krw 를 쓰고 "액면금액" 이라는 구분은 여기에만 적는다 — 새 어휘를 만드는 것은 B-4(리드) 소관이다.
  bdbns_abl_chnl_nm:
    korean_name: 채권매매가능채널구분명         # 🆕 2차
    missing_reason: not_applicable
    value_semantics:
      "온오프 겸용": 634행 (판매 LOT 전부, 코드 bdbns_abl_chnl_tcd = 0)
    note: 상수 — "온라인으로 살 수 있나" 질의에 "판매 조건이 있는 634건은 전부 온·오프 겸용" 으로.
  bdbns_abl_chnl_tcd:
    korean_name: 채권매매가능채널구분코드       # 🆕 2차
