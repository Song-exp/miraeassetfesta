    #    오탐 0건 — 표본 30건 육안 + '사모' 앞뒤 문맥 540가지 전수 점검에서 회사명 오탐 없음.
    #    괄호·슬래시와 무관한 문맥은 3가지뿐이고 전부 진짜 사모('우리카드172사모신종' 등 결합 표기).
    #    🔧 정정(seohynun/08-21) [B1]: "넣으면 추천 모수가 궤멸" 은 실측상 오판 — **제외 비용은 254 중 1건**
    #    (LG전자 75(사모), 사모 중 유일하게 매수정보를 가진 종목). 사모 전건이 장외이고 매수정보 보유는 1건뿐.
    #    → query_rules.사모제외 로 분리 신설(추천 제외 · 조회 허용).
    is_puttable:    { pattern: "[(/]풋[)/]",   count: 2150 }   # 2026-08-16 신규 (노트 §D.14-②)
    is_convertible: { pattern: "\\d+CB|[(/]전환[)/]", count: 2337 }
    # ✅ 2026-08-20 규명 — 이전 패턴 '전환?' 의 '?' 가 '전'을 단독 허용해 '(전)' 표기 18건을 오탐(2,355).
    #    '?' 제거로 주장 count 2,337 정확 재현 — 감사 '차이 18건 미규명' 해소.
    is_subordinated: { pattern: "[(/]후[)/]",  count: 1210 }   # 🔴 '(후)'만 찾으면 218건 — 992건 누락
    is_frn:         { pattern: "(?<!천)변", count: 643 }
    # 🔧 정정(seohynun/08-21) [B3]: pattern 이 산문("변 계열 4종 — '천변' 오탐 1건 제외")이라 런타임이 실행할 수 없었다.
    #    실행 가능한 정규식으로 교체 — 643 정확 재현, '대전천변고속도로5'(川邊) 미매칭 확인.
    #    노트 §D.8 의 산출식이 실제로는 4개 패턴이 아니라 단일 규칙이었다:
    #      '%변%' 644 − '%천변%' 1 = 643. "표기 4종"은 결과의 내역 설명이지 판정 규칙이 아님
    #      ((변) 271 · (콜/변) 232 · (변동)·(K변동) 29 · 그 외 111 = 643).
    #    lookbehind 로 옮긴 이유 — SQL 의 NOT LIKE '%천변%' 는 행 전체를 배제하지만 정규식은 해당 '변'만
    #    배제한다. 두 방식이 갈리는 행(천변 + 다른 변 동시 포함)은 실측 0건이라 결과가 동일하다.
    #    오탐 전수 점검: '변' 앞뒤 문맥 77가지 중 구분자와 무관한 것은 6가지이고 '천변' 외 전부 진짜 FRN —
    #      산금채 '25변이0100-1104-1M'(변동금리 이표채, 괄호 없음) · 농협 '(K변동)' · 하나은행 'KOFR변'.
    is_perpetual:   { pattern: "신종(?!합)|영구", count: 471 }
    # 🔧 정정(seohynun/08-21) [B2]: "신종|영구" 473 → "신종(?!합)|영구" 471. count 450 → 471.
    #    ① 450 의 출처 규명 — eda/domestic_bonds_notes.md §D.11 표(788행)의 "'신종자본' 296 + '(신종)'"
    #       = `'신종자본' in n or '(신종)' in n` → 정확히 450행. 미재현 상태 해소(워크샵 C-1 종결).
    #    ② 그러나 450 은 오답 — 괄호로 닫힌 '(신종)'만 봐서 아래 3종을 놓친다:
    #       · 슬래시 표기 '(신종/콜/후)' 17건 (신한·부산·경남·대구·광주은행, 농금채, 수산금융 등)
    #       · 괄호 없는 결합 표기 '우리카드172사모신종(사모/콜/후)' 3건
    #       · '영구' 표기 '대한항공92CB(영구전환채)(사모/전환/콜)' 1건
    #       차집합 전 행 육안 판정 결과 21건 전부 진짜 영구채(은행·카드 신종자본증권 / 영구전환사채).
    #    ③ 현행 '신종|영구' 473 의 오탐은 정확히 2건 — '성신종합유통5·6(PCBO사모/콜)'('성신'+'종합').
    #       lookahead (?!합) 로 제외. '신종' 뒤 글자 전수 조사 결과 잔여 오탐 0건.
    #    ④ 부수 해소 — 노트 §H-11 'MAT_DT=99991231 4건이 영구채인가' → 4건 전부 '(신종)' 표기로 확정 포함
    #       (참엔지니어링10 · 엠케이전자 6EB·7CB · 퀀타매트릭스 3CB).
    #    ⚠️ B5 연결 — 이 471건 중 DUR=0 AND 잔존>0 은 83건뿐(16.6%). "DUR=0 = 영구채 산출 불능"(500건)
    #       판정의 합격 기준 90% 에 크게 미달 → B5 에서 나머지 417건 성격 규명 필요.
    is_exchangeable: { pattern: "\\d+EB", count: 391 }
    is_stripped:    { pattern: "분리채권", count: 221 }         # 🔴 BD_KND 로는 식별 불가 — 유일 수단
    is_bw:          { pattern: "\\d+BW", count: 133 }           # 2026-08-16 신규
    is_coco:        { pattern: "코코(?!리아)|조건부자본", count: 96 }   # 🔴 전부 AA급 — 원금 소각 가능인데 등급 필터 통과
    # ✅ 2026-08-20 반영 — 감사 지적 '아세코코리아'(회사명) 오탐 2건을 lookahead 로 제외. 실측 96 정확 재현.
    is_inflation_linked: { pattern: "물가", count: 6 }
    unresolved_PB:  { pattern: "\\d+PB", count: 50 }            # 🔴 의미 미해독 (§9.7 TODO-8)
  coupon_form: "이표 437 / 할인 172 / 복리 8 — 종목명 명시분만"
  note: >
    플래그는 겹침(영구채 296 중 콜 295·후순위 250)이라 단일 '종류' 컬럼 불가 — O/X 플래그 방식 (§3.1).
    🔧 정정(B1·B3/08-21): 특수구조 합집합 **15,306 → 16,155행(38.1%)** — 확정.
    기재값 15,306 은 {콜·CB·후순위·FRN·영구채·EB·코코} 7종만의 합집합이었고, 이후 추가된
    is_puttable(2,150)·is_bw(133)·is_stripped(221)·is_inflation_linked(6)가 미반영이었다 —
    이 note 가 예고한 "is_bw·is_puttable 반영 시 증가"가 실현된 값.
    산출 경과: 10종(FRN 제외) 15,796 → B3 에서 is_frn 정규식 확정 후 11종 **16,155**
    (FRN 643 중 359행이 단독 추가분, 284행은 콜·후순위 등과 이미 겹침).
    사모(발행 방식)까지 넣으면 19,670행이나 사모는 query_rules.사모제외 로 분리했으므로 이 합집합에 넣지 않는다.
    unresolved_PB(50, 의미 미해독)도 제외 — 구조 여부 자체가 미확정이다.

# ── 정규화 (문자열 비교 시 TRIM 전면) ──
normalization:
  trim_columns:
  - PD_NM
  - PD_ABRV_NM
  - PD_ENG_NM
  - PD_ABRV_ENG_NM
  - STD_PD_MCLS_NM
  - STD_PD_SCLS_NM
  - BD_KND
  - PD_PBCM
  - PD_EXG_MKT
  - CURR_CD
  - PD_CTRY_CD
  - CRD_GRD
  - PD_EVCO_CRD_GRD
  grade_suffix: "사용자 'AA' → 'AA0' (한국식 중간값 0 표기). PD_EVCO 쪽은 'AA' — 컬럼 간 규칙이 다름 (§3.3)"
  issuer: "'(주)' 위치 앞뒤 제각각 — 정규화 매핑은 워크샵 후 kg_organization (§5.1-①)"
  bd_knd_alias: "'통화안정증권'(통칭) → '통화안정채권'(실값) (§5.1-⑧)"

# ── 쿼리 가드레일 ──
query_rules:
  문자열비교:     "범주형·이름 컬럼은 항상 TRIM 후 비교 (패딩 96~98%)"
  등급정규화:     "CRD_GRD 조회 시 'AA'→'AA0' 등 접미사 변환 후 비교"
  등급병합:       "등급 조건은 COALESCE(CRD_GRD, PD_EVCO_CRD_GRD 정규화) — 병합 안 하면 1,600건 누락"
  수익률정상:     "APPLIED_YIELD > 0                     -- =0 은 위장결측 1,289건 (만기도래 550건 포함, 7-11 기준). 수익률 0인 투자는 성립 불가(10,024원에 사서 이익 0) — 값이 아니라 미기입"
  # ✅ B4/08-21 검토 — '진열대' 해석 지지(근거는 BUY_YIELD.answer_policy). 단 이 254 는 소매채권 재고이고
  #   청약형 상품(개인투자용국채 49건)은 여기 없다 — "미래에셋에서 못 삽니다"로 단정 금지.
  매수가능:       "BUYABLE_QUANTITY > 0 AND 만기 전       -- 실거래 모수 254"
  # ✅ B5/08-21 검토 — 제외 조치는 유지, 근거만 교체. 500건의 98.0%가 조기상환권부(콜·풋·강제상환)이고
  #   전건 COV 도 0 = 평가사 산출 포기 표기. "신종자본 500건"은 오서술(영구채 부합 16.6%)이라 폐기.
  #   ⚠️ 이 규칙은 DUR=0 만 막는다 — DUR/잔존연수 < 0.5 인 1,101건은 통과 (columns.DUR.note 신규 발견 참조).
  듀레이션정상:   "DUR IS NOT NULL AND DUR != 99 AND NOT (DUR = 0 AND REMAINING_DAYS > 0)  -- 조기상환권부 500건 제외"
  익일값금지:     "NDY_EVAL_PRICE · NDY_DIRTY · NDY_APPLIED_YIELD 사용 금지 (NDY_DUR·NDY_COV 는 주의)"
  과세수익률금지: "AVG_ANNUAL_TAX_YIELD 사용 금지 (전량 0)"
  더티보류:       "DIRTY 사용 보류 — 워크샵 #7 결정 전 '실제 결제금액' 답변 금지"
  # ✅ B1/08-21 결정 — is_private 은 '구조'가 아니라 '발행 방식'이므로 이 규칙에 섞지 않고 아래 사모제외로 분리.
  # ✅ B3/08-21 확정 — is_frn 정규식화로 합집합 확정: 구조 플래그 **11종 16,155행(38.1%)**.
  #   (기재값 15,306 → 10종 15,796 → FRN 포함 16,155. 산출 경과는 name_encoding.note 참조)
  특수구조제외:   "추천·랭킹 질의는 name_encoding 구조 플래그 11종 기본 제외 + 제외 사실 명시. 구조 합집합 16,155행(38.1%). is_private 은 별도 규칙 사모제외로 분리"
  # 🆕 B1/08-21 신설 — 근거: ①재현 일치(패턴 15,261 = '사모' 부분일치 15,261 — '사모'는 전부 괄호 안에만 등장)
  #   ②오탐 0건 (표본 30건 육안 + '사모' 앞뒤 문맥 540가지 전수 점검, 회사명 오탐 없음)
  #   ③제외 비용 = 추천 모수 254 중 단 1건(LG전자 75(사모)) — "제외하면 모수 궤멸" 우려는 실측상 기각
  #   ④사모 15,261건 전건(100%) 장외이고 매수정보 보유는 1건뿐 — 이미 사실상 추천 대상 밖
  #   조회 질의에서는 제외하지 말 것(사실 조회는 가능해야 함). 대신 "사모 발행" 을 답변에 표시.
  사모제외:       "추천·랭킹 질의는 is_private 15,261건 제외 + '사모 발행분 제외' 명시. 조회 질의는 제외하지 않고 사모 여부만 표시 (제외 비용 254→253)"
  만기상태:       "추천은 상태 ①(254건)만 · 조회는 전 상태 + 상태 표시 — 경계 = 기준일 20260711 (✅ B7/08-21 확정)"
  # 🆕 B7/08-21 — REMAINING_DAYS 원값은 2026-02-24 기준이라 137일 과대. 아래 식으로 재계산할 것.
  # MAT_DT 는 REAL(20260711.0) 이라 julianday(MAT_DT) 직접 호출 불가 — CAST 2단계 필수.
  # 산출값 = 잔존일수. >0 이면 7-11 시점 살아있음(25,888건). 원값 대비 -137일(84.0% 정확 일치 검증).
  # ⚠️ 이 값은 SQL 식 그대로 실행되므로 끝에 `--` 주석을 붙이지 말 것 (폴딩 시 뒤 구문을 삼킴).
  잔존만기재계산: >-
    CAST(julianday(substr(CAST(CAST(MAT_DT AS INTEGER) AS TEXT),1,4)||'-'||
    substr(CAST(CAST(MAT_DT AS INTEGER) AS TEXT),5,2)||'-'||
    substr(CAST(CAST(MAT_DT AS INTEGER) AS TEXT),7,2)) - julianday('2026-07-11') AS INTEGER)
  시장집계금지:   "PD_EXG_MKT 단독 group-by 금지 — 구성 효과 교란 (§9.5). 장내/장외 수익률 비교는 원시 평균 금지 — 종류(대분류·등급·잔존만기) 통제 시 차이 소멸을 병기"
  장외등급해석:   "장외 등급 결측 83.3%(14,696/17,645)는 not_evaluated(미평가) — 저품질·고위험으로 해석 금지 (장내는 11.9%). 장외 필터와 특수구조 필터는 독립 아님(장외에 사모·특수구조 몰림) — 겹쳐 걸 때 모수 명시"   # 2026-08-20 신설
  # 🔧 B8/08-21 — 범위 확장 4,957 → 7,952. Conduit회사채 2,792 누락이 가장 큰 구멍이었다(요청서가 지목한
  #   '규칙 밖 200건'의 14배). 판정 근거: 도메인 문서 §6 이 '유동화회사채/Conduit회사채 = ABS' 로 한 묶음이고,
  #   담보축 collateralType 은 이미 SPC 4종 7,783 을 쓰고 있었다 — 같은 파일 안에서 두 규칙이 어긋나 있었음.
  #   요청서 제안(OR PD_PBCM LIKE '%유동화%')만으로는 200건 중 31건만 잡힌다 — 169건은 발행사명이 공란이고
  #   종목명에만 '유동화'가 있다(티월드제일백이십차유동화전문 등). 그래서 PD_NM 조건을 함께 넣었다.
  #   표본 점검: 규칙 밖 200건 전건(100%)이 SPC 작명('유동화전문'·'제○차'). 확장 후 오탐 점검에서
  #   SPC 작명 미부합 308건이 나오나 전부 BD_KND='Conduit회사채' 로 선언된 도관체(링스켑코리아·코스모스그린 등)라
  #   작명 규칙만 다를 뿐 오탐이 아니다.
  #   ⚠️ BD_KND 는 패딩이 있어 TRIM 필수 — 생략하면 7,952 가 아니라 3,014 가 나온다(query_rules.문자열비교).
  유동화위험금지: >-
    TRIM(COALESCE(BD_KND,'')) IN ('MBS','SLBS','유동화회사채','Conduit회사채')
    OR PD_NM LIKE '%유동화%' OR PD_PBCM LIKE '%유동화%'
    → 7,952건은 발행사명(PD_PBCM)으로 위험 판단 금지 — 발행자가 회사가 아니라 SPC(자산)라
    등급이 원 회사보다 높을 수 있음 (columns.PD_PBCM.trap ③)

# ── 역질문 분기 — 되묻기는 유효한 답변 (노트 §I) ──
clarify:
