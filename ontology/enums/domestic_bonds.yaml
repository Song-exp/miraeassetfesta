# ── 종류 확정식 (기계 판독본) ── 2026-09-04 신설
# query_rules.종류필터 가 사람에게 설명하는 것을, 여기서는 코드가 그대로 읽는다. 종전엔 같은 표가 pipeline._KIND_FILTERS
# 코드 상수로도 있어 이원화돼 있었다 — 새 종류(전단채·CP 등)를 붙일 때 코드를 고쳐야 했다. 이제 여기 한 줄이면 된다.
# tokens: 질문 낱말 → 확정식. 긴 낱말부터 소진 탐색하므로 순서가 곧 우선순위다.
# paraphrases: 종류 낱말 없이 발행 주체로 풀어 쓴 질의('은행이 발행한 채권'). {P} = 조사+'발행' 정규식(코드가 채운다).
kind_filters:
  tokens:
    - {token: 일반회사채,   sql: "TRIM(bd_knd)='일반회사채'"}
    - {token: 일반은행채,   sql: "TRIM(bd_knd)='일반은행채'"}
    - {token: 특수은행채,   sql: "TRIM(bd_knd)='특수은행채'"}
    - {token: 통화안정채권, sql: "TRIM(bd_knd)='통화안정채권'"}
    - {token: 통화안정증권, sql: "TRIM(bd_knd)='통화안정채권'"}
    - {token: 통안채,      sql: "TRIM(bd_knd)='통화안정채권'"}
    - {token: 신용카드채,   sql: "TRIM(bd_knd)='신용카드채'"}
    - {token: 카드채,      sql: "TRIM(bd_knd)='신용카드채'"}
    # 국고채·국채 확정식 — STRIPS 21행(종류 결측·소분류 국고채)을 포함해 295종목 (종류필터 ①, 리드 결정 2026-08-31)
    - {token: 국고채, regex: '(?<![가-힣])국채',
       sql: "(TRIM(bd_knd)='국고채권' OR (COALESCE(TRIM(bd_knd),'')='' AND TRIM(std_pd_scls_nm)='국고채'))"}
    - {token: 국공채,      sql: "TRIM(std_pd_mcls_nm)='국공채'"}
    - {token: 특수채,      sql: "TRIM(std_pd_mcls_nm)='특수채'"}
    - {token: 지방채,      sql: "TRIM(bd_knd) IN ('모집지방채','지역개발채','도시철도공채')"}
    - {token: 은행채,      sql: "TRIM(bd_knd) IN ('일반은행채','특수은행채')"}
    - {token: 회사채,      sql: "TRIM(std_pd_mcls_nm)='회사채'"}
    - {token: MBS,        sql: "TRIM(bd_knd)='MBS'"}
  paraphrases:   # 구체적인 주체 먼저 — '한국은행이 발행' 이 '은행이 발행' 으로 잡히지 않게. 정규식이라 작은따옴표 스칼라
    - {pattern: '한국은행{P}',                        sql: "TRIM(bd_knd)='통화안정채권'"}
    - {pattern: '(?:지자체|지방자치단체|지방\s*정부){P}', sql: "TRIM(bd_knd) IN ('모집지방채','지역개발채','도시철도공채')"}
    - {pattern: '카드[사회]?[사]?{P}',                 sql: "TRIM(bd_knd)='신용카드채'"}
    - {pattern: '캐피[탈털][사회]?[사]?{P}',            sql: "TRIM(bd_knd)='할부금융채'"}
    - {pattern: '보험[사회]?[사]?{P}',                 sql: "TRIM(bd_knd)='보험회사채'"}
    - {pattern: '증권[사회]?[사]?{P}',                 sql: "TRIM(bd_knd)='투자매매.중개채'"}
    - {pattern: '은행{P}',                           sql: "TRIM(bd_knd) IN ('일반은행채','특수은행채')"}
    - {pattern: '(?:정부|나라|국가){P}',               sql: "TRIM(std_pd_mcls_nm)='국공채'"}
    - {pattern: '(?:회사|기업){P}',                    sql: "TRIM(std_pd_mcls_nm)='회사채'"}
  # {P} = 조사 + '발행' (pipeline._P). 조사 목록을 한 곳에서 바꾸려고 자리표시자로 둔다.
  particle_placeholder: "{P}"

