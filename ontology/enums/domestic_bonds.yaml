  다의어:                                  # (B) 용어 자체가 다의적 — 동반 신호 없으면 되묻기
    수익률: "표면금리 / YTM / 세후 / 예금환산 — 같은 채권이 갈림(실측: 대상144-2 는 표면 1.55 · 매수YTM 2.291 · 개인세후 2.0374 · 예금환산 2.4083). 기본값: 개인 세후(AFTER_TAX_YIELD) + 산출 기준 명시. 투자 주체 미상이면 역질문: 개인(15.4% 원천징수)/법인(법인세)/세금우대 계좌 — 수익률 7컬럼 = '누가 사느냐'의 경우의 수 (§9.4)"
    위험:   "부도위험(국공채 최저) / 금리위험(국공채 최고) — 정반대 (§9.3). 실측 재확인(B9): 평균 듀레이션 국공채 4.52 > 특수채 4.01 > 회사채 2.05. 기본값: 부도위험(신용등급) 기준으로 답하되 금리위험 방향을 한 줄 병기 — 일반 사용자의 '위험'은 원금 손실을 뜻하는 것이 통상"
    등급:   "신용등급 / 위험등급 / 평가사별·최저·다수결 — 258건에서 갈림. 기본값: CRD_GRD 병합값(query_rules.등급병합) + 평가사 의견이 갈린 종목은 그 사실을 표시"
    만기:   "만기일 / 잔존만기 / 듀레이션 — 🔧 정정(seohynun/08-21) [B9] 영구채 450 → **471건**(B2). 기본값: 잔존만기(query_rules.잔존만기재계산 식으로 산출 — REMAINING_DAYS 원값은 137일 과대). 영구채 471건은 최대 57.3년으로 잡히므로 만기 정렬에서 분리 표시"
    싸다:   "🔴 가격 낮음 / 수익률 높음 — 기본값 금지, 무조건 되묻기 (노트 §I.3-1). 근거 강화(B9): 두 정렬의 **Top-20 겹침 0건** — 가격 낮은 쪽은 주택금융공사 MBS, 수익률 높은 쪽은 신보 유동화전문으로 완전히 다른 종목이 나온다. 기본값을 두면 절반이 오답"
  사람의_선택:                             # (A) 사용자가 정해야 답이 정해짐
    보유기간: "만기 보유 → 신용위험만 / 중도 매도 → 듀레이션 1순위. 기본값: 만기 보유 가정 + 명시 ('만기까지 보유하신다고 가정했습니다')"
    안전의_정의: "부도위험 → 국공채 / 금리위험 → 단기 회사채. 기본값: 부도위험 (다의어.위험 과 동일 기준으로 통일)"
    투자기간: "기간에 맞는 만기·듀레이션 선택 — '안전한 채권' 질의의 3번째 미지수 (안전의_정의·보유기간과 세트, §9.3). 기본값: 단일 기간을 임의로 고르지 말고 **구간별로 나눠 제시**(1년 이내 / 1~3년 / 3년 초과) — 되묻되 무응답이어도 답이 나간다"   # 2026-08-20 신설
    답변모수: >-
      🔧 정정(seohynun/08-21) [B9]: '시장 전체 16,349' 표기를 폐기하고 조회 모수 **25,888** / 추천·매수 모수 **254** 로 교체.
      기본값: 질의 어휘로 자동 판정(추천·매수·'살 수 있는' → 254, 그 외 조회 → 25,888)하고 어느 모수인지 답변에 명시.
      254 는 소매채권 재고라 청약형(개인투자용국채 49건) 미포함 (B4).
      ⚠️ 폐기 사유 재조사(08-21 2차) — 16,349 는 출처 미상이 아니다. 노트 §D.13-⑤ 에 사다리 정의가 있다:
      전체 42,394 → DUR 유효(0<DUR<99) 20,748 → 잔존>0 20,701 → 이론 위반 제거 19,666 →
      특수구조 제거 18,472 → 등급 정보 있음 16,349.
      재현 결과 **앞 3단계는 정확 일치**(20,748 / 20,701 / 19,666)하나 4단계(특수구조 제거 −1,194)가
      어떤 플래그 집합으로도 재현되지 않아 최종 16,349 도 재현 불가다(확정 11종으로는 −3,717 → 15,949,
      등급까지 걸면 **13,958**). 폐기의 진짜 이유는 재현 실패가 아니라 **의미 오용**이다 —
      16,349 는 '시장 전체'가 아니라 **듀레이션 분석용 클린 모수**(등급 없는 국공채가 2건만 남는 편향 표본)이고,
      노트 자신이 "시장 구조 설명용"이라고 못박았다. 답변 모수로 쓰면 국공채가 사라진 표본으로 답하게 된다.
      🔴 같은 오용이 docs/domain/domestic_bonds.md·domestic_bonds_graph.md 에도 남아 있다 — 문서 정정 필요.
  조건부_계산:                             # (C) 사용자 답을 받아 계산 후 답하는 유형 — 2026-08-20 신설
    FRN_금리비교: >-
      FRN 643건의 SRFC_IRT 는 '기준일 현재 적용 금리 스냅샷'(다음 재설정일에 바뀜) — 고정금리와의
      유불리 질의는 "현재 기준금리 수준"을 역질문한 뒤 "기준금리가 X%보다 높으면 FRN 유리, 낮으면
      고정금리 유리" 형태의 조건부 비교로 답변. 구형 84건(스탬프-값 불일치)은 사용 금지 (§9.1-⑶).
      ✅ 검토(seohynun/08-21) [B9] — 실제 종목으로 계산 성립 확인. 적용 모수와 손익분기 산출법:
      · 적용 가능 모수 = 살아있는 FRN 354건 중 갱신일 2026-02-24 인 **217건**(전건 잔존 90일 초과).
      · ⛔ **매수 가능한 FRN 은 0건** — 이 역질문은 조회 질의 전용이다. 추천 모수 254 에 FRN 이 없으므로
        "지금 살 수 있는 FRN" 질의에는 되묻지 말고 "당사 매수 가능 목록에 변동금리채는 없습니다"로 답할 것.
      · 손익분기 = 같은 등급·유사 잔존의 고정금리채 평균 표면금리. FRN 적용금리가 그 아래로 내려가면 고정채가 유리.
      · 작동 예시 — 한국주택금융공사 MBS2019-1(1-1)(콜/변) · AAA · 잔존 27.9년 · SRFC_IRT 3.400 · YTM 3.805
        vs 같은 등급·잔존 ±30% 고정채 532건 평균 표면 3.042% → 손익분기 3.042%, 현재 여유 +0.358%p.
        답변: "표면금리 3.400%는 2026-02-24 시점 적용 금리이고 다음 재설정일에 바뀝니다.
        같은 등급·만기대 고정금리채 평균이 3.042%이므로, 이 채권의 적용금리가 3.042% 아래로 내려가면
        고정금리채가 유리해집니다. 현재는 0.358%p 여유가 있습니다."
      · ⚠️ 이 예시 종목은 MBS 이므로 query_rules.유동화위험금지 도 함께 적용된다(발행사명으로 위험 판단 금지).
      · 기본값: 사용자가 기준금리를 답하지 않아도 위 손익분기 형태로 **답이 나간다** — 되묻기는 정밀화용.

