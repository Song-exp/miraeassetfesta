  trim_columns:
  - pd_nm
  - pd_abrv_nm
  - cu_fund_mgmt_co
  - cu_base_index
  - wu_inv_ast_type
  - wu_inv_rgn
  - pd_exg_mkt_nm
  - pd_mkt_nm
  - pd_dvid_cycl       # ETN 422건 '  ' 공백 패딩
  # 수치 정렬·필터 기본값: <컬럼> IS NOT NULL AND <컬럼> <> 0 (주최 공지 "0/결측은 의도된 값 — 빼고 보여주거나 없다고 응답").
  # 0 이 실제값인 컬럼은 columns.<col>.zero_is_value: true 로 예외 선언 (cu_lev_fector · 분배금 3종).
  zero_as_missing_default: true
  zero_is_value_columns:
  - cu_lev_fector      # 배수 없음 = 1.0 (0 은 부재)
  - pd_divd_amt_pshr   # 0 = 수록값(주최 공지) — 정렬 제외하되 "분배금 0으로 수록"으로 응답
  - pd_divd_amt_ann
  - pd_dvid_yield

