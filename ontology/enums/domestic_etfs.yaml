# 답변 생성 규약 — loader.answer_context() 가 답변 단계에 싣는다.
# query_rules 는 SQL 생성기만 본다. "조회 결과를 **어떻게 말할지**" 는 여기에 적어야 반영된다.
# 채권(16개)·펀드(12개)에는 있었고 ETF 에만 없던 블록이다(2026-08-31 신설).
answer_rules:
  - 🔴 최우선 — 조회 결과에 없는 상품명·수치·날짜를 만들지 않는다(환각 = 대회 최대 감점). 칸이 비어 있으면 '수록되지 않음' 이라 말하고, 상품명 속 숫자(`TOP10`·`3년`·`2X`)로 수익률·만기·배수를 추측해 채우지 않는다.
  - '총보수(cu_charge_rt)는 유효 67건뿐이다 — ETF 1,235건 기준 5.4%(NULL 1,018 · 0값 150). ETN 545건은 전건 NULL 인데 이건 결측이 아니라 **ETN 은 보수 개념이 다르기 때문**이라 미수록으로 말하지 않는다. 나머지는 0 이지만 그건 무료가 아니라 미입력이다 — 🔴 ''0%'' 나 ''보수 없음'' 이라 말하면 오답이다. ''총보수가 수록되지 않았습니다'' 로 답한다. 해외ETF 는 반대로 5,618/6,037(93%) 이 유효하니 같은 말을 쓰지 않는다.'
  - '위험등급(pd_risk_nm)은 1,780건 전건 유효하고 **숫자가 작을수록 위험**하다(1등급=매우높은위험, 6등급=매우낮은위험). 분포가 한쪽으로 쏠려 있다 — 1등급 775 · 2등급 691 로 **82%가 1~2등급**이고 6등급은 21건뿐이다. ''안전한 ETF'' 질의에 6등급만 내놓으면 21건 안에서만 답하게 되므로, 어느 등급을 기준으로 골랐는지 라벨로 밝히고 등급을 넓혔으면 넓혔다고 말한다.'
  - '수익률은 기간을 반드시 밝힌다. 국내는 6종(du_er_1d·1m·3m·6m·ytd·1y)이 있고 기간 미지정이면 1년(du_er_1y, 유효 1,396/1,780) 기준으로 답한 뒤 다른 기간도 있다고 안내한다 — 되묻고 끝내지 않는다(펀드와 같은 방침, 리드 결정 2026-08-31).'
  - 🔴 인버스 상품의 배수를 그대로 말하지 않는다. `cu_lev_fector` 는 **부호가 88% 소실**돼 이름이 `인버스 2X` 인데 값이 `+2.0` 이다. 배수만 보고 '2배 상승 추종' 이라 말하면 방향이 뒤집힌 오답이 된다. 이름에 인버스가 있으면 '지수가 내릴 때 2배로 오르는 상품' 으로 말한다.
  - '`레버리지`·`인버스` 상품이 답변 목록에 있으면 붙인다: ''레버리지·인버스 상품은 일간 수익률을 배수로 추종해 장기 보유 시 지수 등락률과 크게 달라질 수 있습니다.'' 조건이 아니면 붙이지 않는다(발동 조건일 때만 — 채권 방식과 동일).'
  - 롱숏 2건(KODEX 200롱코스닥150숏선물 · KODEX 코스닥150롱코스피200숏선물)은 인버스도 레버리지도 아니다. **두 지수의 상대 성과**로 수익이 나는 스프레드 전략이라고 말한다. '시장이 내리면 버는 상품' 이라 말하지 않는다.
  - 상품명에 `선물` 이 있으면(403건) '지수를 그대로 추종한다' 고 말하지 않는다. 선물 롤오버 비용 때문에 현물 지수와 수익률이 벌어질 수 있다는 점을 한 줄 덧붙인다.
  - '상품명 끝의 `(H)` 는 환헤지다(235건). `(UH)`·''언헤지'' 표기는 0건이므로 **(H) 가 없으면 환노출**이라고 말한다 — ''환헤지 여부가 수록되지 않았다'' 고 말하지 않는다.'
  - '분배주기(pd_dvid_cycl)는 Q 분기 698 · A 연 306 · M 월 196 · S 반기 8 이고 **결측이 572건**(공백 422 + NULL 150)이다. 결측을 ''분배하지 않음'' 으로 말하지 않는다. 월배당 질의는 M 196건이 답이다 — 상품명에 ''월배당'' 표기는 0건이라 이름으로 찾으면 못 찾는다.'
  - '기초지수(ref_base_index)는 유효 1,208/1,780 이고 결측 572건은 대부분 ETN 이다. 지수가 없다고 ''추종 지수 없음'' 이라 단정하지 말고 ''기초지수가 수록되지 않았습니다'' 로 말한다.'
  - '🔴 국내ETF 테이블에는 ETN 545건이 섞여 있다(pd_grp_no). ''ETF'' 를 물었으면 ETF 1,235건만으로 답하고, 목록에 ETN 이 섞였으면 ETN 임을 표시한다. `cu_strtegy` 값 ''C'' 422건은 전략이 아니라 **ETN 행에만 붙는 표기**이므로 운용전략으로 말하지 않는다(전건이 pd_grp_no=''ETN'').'
  - 약어명(pd_abrv_nm)은 키가 아니다 — 중복 7건이 있고 전부 ETN 쌍이다(한투 인버스은선물 ETN 등). 상품을 특정할 때는 종목코드(pd_itm_no)를 함께 적는다. 정식명(pd_nm)은 중복 0 이다.
  - '🔴 브랜드로 운용사를 말하지 않는다. KODEX·TIGER 는 브랜드고 운용사는 `cu_fund_mgmt_co` 가 정본이다(대응표는 name_encoding.brand_prefix).'
  - '기준일을 병기한다 — 순자산·NAV 는 du_nav_base_dt(2026-08-21 이 1,534건), 기초지수는 ref_base_dt(2026-08-22 이 1,208건)다. 상품마다 기준일이 다를 수 있으므로 목록 답변에는 대표 기준일을 한 번 밝힌다.'
  - '규모를 물으면 순자산(du_last_aum, 유효 1,170/1,780)으로 답하고 그 기준임을 밝힌다. 결측 610건은 순위에서 빠진다는 점을 Top-N 답변에 한 줄로 밝힌다.'
  - 추천·랭킹 답변은 기본 5개, 질문에 개수가 있으면 그 개수까지. 정렬 기준(순자산 큰 순 등)을 한 마디 밝힌다. 조회 결과에 없는 상품을 예로 들지 않는다.
  - '🔴 상품명은 조회 결과 문자열을 **그대로** 옮긴다. 띄어쓰기를 임의로 넣지 않는다 — 서버 실측 2026-08-31: ''브이아이 FOCUS ESG Leaders150…'' 이 ''브이 아이 FOCUS ESG Leaders 150…'' 으로, ''중장기국공채액티브증권상장지수투자신탁'' 이 ''중장기 국공채 액티브 증권 상장 지수 투자신탁'' 으로 나갔다. 종목명 변조다.'
  - '유효 모수를 밝혀야 하는 답변에서 빠뜨리지 않는다 — 서버 실측 2026-08-31: ''총보수 낮은 국내 ETF 5개'' 답변에 **유효 67건**이 안 적혔다(columns.cu_charge_rt.answer_policy 가 요구하는 사항). Top-N 답변은 무엇 중에서 고른 것인지 한 줄로 밝힌다.'
  - '🔴 투자 권유로 읽히는 표현을 쓰지 않는다 — 서버 실측 2026-08-31: ''투자자들에게 유리한 상품들입니다'' 가 나갔다. 우리는 데이터를 전달하는 것이지 권유하지 않는다. 수치와 사실만 말하고, 판단은 사용자에게 남긴다.'
  - '🔴 조회 결과를 마음대로 줄이지 않는다. 질문에 개수가 없으면 **조회된 전부**를 싣거나, 줄일 거면 **몇 건 중 몇 건인지 반드시 밝힌다** — "총 18건이며 순자산 상위 5개는 다음과 같습니다". 서버 실측 2026-08-31: "Li Auto를 담은 국내 ETF" 가 18행을 조회하고도 답변에 4개만 싣고 ''다음과 같습니다'' 라고 해 나머지 14건을 숨겼다. 개수를 밝히지 않은 부분 목록은 사실 왜곡이다.'
  - '구성종목·설명서로 답하는 교차질의는 **그 외부 데이터의 기준일을 병기**한다 — 국내 구성종목은 ext_etf_holdings.as_of, 해외는 report_date. 마스터 기준일(2026-08-22)과 다를 수 있다.'
  - '🔴 조회 결과가 **빈 값(NULL)** 이면 숫자로 바꿔 말하지 않는다 — 0 도 아니고 "해당 없음" 도 아니다. "수록되어 있지 않습니다" 로 말한다. 총보수는 유효 67건뿐이라 개별 조회에서 자주 빈다. 서버 실측 2026-08-31: "KODEX 200 총보수" 에 **"0.0%"** 라고 답했다 — 0 은 무료가 아니라 미입력이다.'
  - '개수만 주고 기준이 없는 질의("인버스 ETF 3개")에 답할 때 **무엇을 기준으로 골랐는지** 한 마디 밝힌다 — "순자산이 큰 순으로 3개". 서버 실측 2026-08-31: 기준 없이 3개만 나열해 왜 그 3개인지 알 수 없었다.'

# ── 게이트 상수 컬럼 (R-5 ① 층 — gate.py ④ 가 읽는다. 라우팅이 이 테이블 하나일 때만 발동) ──
# 2026-08-31 paired v2 실측(UNANS-005): '기타비용이 가장 낮은 상품' 이 전부0 컬럼(cu_charge_etc_rt)으로
# 랭킹을 만들어 무의미한 목록이 나갔다. 전부0컬럼금지 규칙은 실렸으나 무시됨 → 게이트로 승격(HCX 0회 기각).
gate_constants:
- column: cu_charge_etc_rt
  value: 0(미수록)
  triggers:
  - '기타\s*비용'
  - '기타비용'
  answer: "국내 ETF·ETN 의 기타비용요율(cu_charge_etc_rt)은 전 종목 미수록(0)이라 기타비용 기준의 조회·비교는 제공할 수 없습니다. 총보수(cu_charge_rt) 기준을 원하시면 다시 질문해 주세요."
