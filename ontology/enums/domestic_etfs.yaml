# ── 파생 규칙 (DB 컬럼으로 만들지 않고 규칙으로 선언 — NEXT_STEPS 원칙 2) ──
derivation_rules:
  inverse_direction:
    규칙: "CASE WHEN pd_abrv_nm LIKE '%인버스%' THEN 'Inverse' ELSE 'Long' END"
    근거: >-
      🔴 2026-08-25 — cu_lev_fector 부호 소실(columns.cu_lev_fector.trap). 상품명 '인버스' 225건 vs 음수 22건.
      음수인데 이름에 '인버스' 없는 행 1건(ETN)은 이름 규칙이 놓치나, 부호 있는 22건은 OR 조건으로 추가 포착 가능:
      `pd_abrv_nm LIKE '%인버스%' OR cu_lev_fector < 0`.
    축: leverageType 의 방향 성분
  leverage_multiple:
    규칙: "ABS(cu_lev_fector) — 1.0 Standard · 2.0 2X · 3.0 3X · 0.5/1.5 소수배수(ETN 6건)"
    근거: 부호와 무관하게 절댓값은 2차에서도 신뢰 가능 (상품명 '2X'/'레버리지' 314건 중 |값|=2 가 305건, 3 이 9건).
    축: leverageType 의 배수 성분

