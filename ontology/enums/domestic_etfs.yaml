# domestic_etfs — 사람의 판단을 담는 파일
# 기계적 사실은 *.auto.yaml 에 있습니다. 여기엔 판정과 규칙만 씁니다.
# 런타임 가드레일이 이 파일을 읽습니다.
#
# 범위: 2단계(결측 판정 · 컬럼 판단 · 쿼리 규칙 · 검증된 축 유도).
#   개체·관계 매핑(entities/class_hierarchy)은 4단계(워크샵 후). → docs/eda/domestic_etfs_notes.md §F 참조.

domain: domestic_etfs

# ── 행의 낟알 (2026-08-18 감사 확정) ──
row_grain:
  구조: 행 = 상품 (pd_itm_no 완전 유일 — 1,734행 = 1,734 distinct)
  evidence_grade: A
  note: 공모펀드(행=종목×속성태그 8.6배 중복)와 달리 이 테이블은 행이 곧 상품이다. COUNT(*) 를 그대로 쓸 수 있다.

columns:
  # ── 규모 (단위 주의) ──
  du_last_aum:
    korean_name: 최종AUM(순자산총액)
    missing_reason: missing
    answer_policy: "AUM 질의 답변 가능(결측 16.2%). 단위 KRW(원). 해외ETF(USD)와 통합 정렬 금지 — 상품군별 분리 제시."
    note: "단위 KRW 확정 (KODEX200 = 28.4조원, 실제값 일치). 해외ETF du_last_aum은 USD라 숫자 직접 비교 시 순위 역전(함정②). 0값 411건은 미거래/신규."
    unit: krw
    layer:
      scale: KRW (원)
      cross_sort: "해외ETF du_last_aum(USD)와 나란히 정렬 불가. 7/11 환율(코드북⑤) 확정 후에만 통합 가능."

  # ── 보수 ──
  cu_charge_rt:
    korean_name: 총보수요율
    missing_reason: missing
    answer_policy: "'보수 낮은 ETF' 질의는 `cu_charge_rt > 0 AND pd_grp_no='ETF'` 로 한정하고 **유효 모수 67건** 명시. 0값은 미입력이므로 정렬에서 제외."
    note: 결측 87.5%. non-null 217건 중 150건이 0(미입력). 실질 유효 67건(3.9%). 배당형 상품명 113건도 보수 0 → 0=미입력 확증. ETN 532건은 전부 NULL(ETN은 보수 개념 다름).
    unit: percent
  cu_charge_etc_rt:
    korean_name: 기타비용요율
    missing_reason: missing
    answer_policy: "'데이터 미제공'. 기타비용 질의 불가."
    note: non-null 1,553건이 전부 0. 통째 미입력.
    unit: percent

  # ── 배당 (전부 0 = 미입력) ──
  pd_divd_amt_pshr:
    korean_name: 주당배당금
    missing_reason: missing
    answer_policy: "'배당 많이 주는 ETF' 질의 → 정확한 배당액은 '데이터 미제공' 명시. 단 상품명에 '배당'/'커버드콜'/'고배당' 포함 ETF 113건은 '배당형 상품 목록'으로 조건부 안내 가능."
    note: non-null 1,551건 전부 0. 배당형 상품명 113건도 전부 0 → 무배당이 아니라 미입력.
  pd_dvid_yield:
    korean_name: 배당수익률
    missing_reason: missing
    answer_policy: "'데이터 미제공'. 배당수익률 순위 질의 불가."
    note: non-null 1,551건 전부 0. 미입력.
  pd_dvid_cycl:
    korean_name: 배당주기
    missing_reason: missing
    answer_policy: "월배당/분기배당 질의 → '데이터 미제공'. 상품명 '위클리'/'월배당' 등으로만 부분 유추."
    note: >-
      🔴 2026-08-18 감사 정정 — **유효 0건이다.** 현행 DB 전 행이 공백('  ') 또는 NULL, distinct 1.
      이전 "유효 183건" 은 재현되지 않는다 (구 빌드 관측이거나 오독). 100% 결측 컬럼으로 취급할 것.

  # ── 전부 0 (미입력) ──
  du_chas_errt:
    korean_name: 추적오차율
    missing_reason: missing
    answer_policy: "'데이터 미제공'. 추적오차 질의 불가."
    note: non-null 1,551건 전부 0.
  du_diff_rt:
    korean_name: 괴리율
    missing_reason: missing
    answer_policy: "'데이터 미제공'. 괴리율 질의 불가."
    note: non-null 1,517건 전부 0.

  # ── 기초지수 ──
  cu_base_index:
    korean_name: 기초지수
    missing_reason: missing
    answer_policy: 기초지수 질의는 유효 58건 한정 + 모수 명시. 결측 대부분 공백문자열.
    note: 결측 89.4%(유효 19종/58건). NULL 125 + 공백문자열 1,551. 상품명으로 부분 유추 가능.

  # ── 수익률 (센티넬 + 이상치) ──
  du_er_1y:
    korean_name: 1년수익률
    missing_reason: missing
    answer_policy: "Top-N 질의 시 `du_er_1y > -100 AND du_er_1y IS NOT NULL` 로 센티넬 제외. 2,000% 초과 이상치는 단서 부기."
    trap: "-100.0 이 98건 — 실제 -100%가 아니라 수치형 센티넬(상장폐지/미산출). max 2,738.95%(TIGER 200IT레버리지) 이상치."
    note: 결측 20.6%. -100 센티넬 + 레버리지 이상치 동시 존재.
    unit: percent

  # ── 100% 결측 (스냅샷 · 미수록) ──
  ru_mkt_price:
    korean_name: 현재가
    missing_reason: not_applicable
    answer_policy: "현재가 질의 → '데이터 미제공'. 대신 종가(du_clpr)로 안내. 7/11 마감 스냅샷이라 실시간가 없음."
    note: 100% 결측. ru_(실시간) 접두사 — EOD 스냅샷이라 구조적으로 부재.
  ru_mkt_volume:
    korean_name: 실시간거래량
    missing_reason: not_applicable
    answer_policy: "실시간 거래량 → '데이터 미제공'. 대신 du_vol_1d(일거래량)로 안내."
    note: 100% 결측. ru_ 실시간 접두사.
  nru_mkt_inav:
    korean_name: 장중iNAV
    missing_reason: not_applicable
    answer_policy: "장중 iNAV → '데이터 미제공'. 대신 du_last_nav(최종NAV)로 안내."
    note: 100% 결측. nru_ 장중실시간 접두사.
  nru_mkt_diff_rt:
    korean_name: 장중괴리율
    missing_reason: not_applicable
    answer_policy: "'데이터 미제공'."
    note: 100% 결측. nru_ 장중실시간 접두사.
  pd_sect_nm:
    korean_name: ETF섹터명
    missing_reason: missing
    answer_policy: "섹터명 질의 → '데이터 미제공'. pd_sect_cd는 섹터가 아니라 상품유형 구분임(아래)."
    note: 100% 결측. 🔴 섹터명이 없는 게 아니라 pd_sect_cd 자체가 섹터가 아님(상품구조 코드).
  pd_sect_cd:
    korean_name: ETF섹터코드(실제=상품유형구분)
    missing_reason: present
    answer_policy: "'섹터' 질의에 이 코드로 답하지 말 것 — 섹터가 아니라 상품유형 구분임."
    note: "🔴 교차대조로 해독: 섹터 아님. 2=일반ETF(1,126) / 3=일반ETN(406) / 8=단일종목ETF(16, 삼성전자·SK하이닉스) / 4·9=ETN소수 / NULL=ETF60+ETN123. pd_grp_no와 거의 대응."
    value_semantics:
      "2.0": 일반 ETF
      "3.0": 일반 ETN
      "4.0": 특수구조 ETN — KRX금현물 Auto-KO(조기종료형) 1건   # 2026-08-20 코드북 etf_sector.csv 와 일치시킴 (실측 재확인)
      "8.0": 단일종목ETF(상품명에 '단일종목')  # ⚠️ underlyingScope=SingleStock 과는 불일치(아래)
      "9.0": 단일종목(레버리지) ETN 2건 — 삼성전자·SK하이닉스   # 2026-08-20 코드북과 일치시킴 (실측 재확인)
    cross_use: "🔴 코드 8 ≠ axis_underlyingScope SingleStock. 실측(샘플 100건 재채점): 코드8을 SingleStock 규칙으로 넣으면 87→83%로 하락. 코드8인데 정답 SectorTheme(예: KODEX SK하이닉스단일종목레버리지), 코드2인데 정답 SingleStock(예: 테슬라밸류체인)이 다수. underlyingScope는 규칙으로 유도 불가 → 워크샵 안건."

  # ── 운용사 (약칭 함정 + 상품명 오염) ──
  cu_fund_mgmt_co:
    korean_name: 운용사
    missing_reason: present
    trap: "① 약칭 표기 — '미래에셋자산운용' 조회 시 0건(실제 '미래에셋'). ② 상품명 오염 54건 — '삼성KODEX철강증권상장지수투자신탁[주식]'이 운용사 자리에. ③ 정식명(메리츠증권 주식회사)·'.' 1건 혼재."
    answer_policy: "운용사 질의는 약칭 기준. 목록/집계 시 상품명 오염 행 제외(cu_fund_mgmt_co NOT LIKE '%상장지수%'). 정규화 매핑은 워크샵 §F-4."
    note: "정상 약칭 32종(삼성·미래에셋·KB) + 상품명 오염 54건 = DISTINCT 97종으로 부풀려짐. ETN 발행 증권사와 ETF 운용사 혼재."

  # ── 전일NAV·등락금액 (🔴 ETF만 깨짐 — ETN은 정상. 2026-08-18 감사 정정) ──
  du_nav_yday:
    korean_name: 전일NAV
    missing_reason: broken_etf_only
    answer_policy: >-
      🔴 그룹별로 판정이 갈린다 (2026-08-18 감사) —
      ETF: 사용 금지 (전일값 아닌 오늘 NAV 복사). 일간 등락은 du_er_1d 사용.
      ETN: 사용 가능 (정상 전일 NAV).
    note: >-
      2026-08-18 전수 분해 — 비교가능 1,517건 중 ETF 1,137건은 전부 du_last_nav(오늘NAV) 복사(깨짐),
      **ETN 379건은 전일값 ≠ 오늘값이며 du_nav_rnf_amt = (오늘−전일) 등락이 380건 정확히 성립 → 정상**.
      이전 판정 "1,137건 전부 복사"는 ETF 몫만 본 것이었다. D.6 정정.
    # ✅ 검토(이병철/08-21): 재현 일치 — ETN 등락정합 380, ETF 복사깨짐 1137. 교차검증서 비대칭 결정적: ETF 등락정합 0건(단 하나도 정상 아님)·ETN 복사깨짐 1건뿐. 그룹 분리 판정 승인.
    # 💬 서술 제안: ETF 전일NAV/등락 질의 → "당일 NAV가 복사돼 전일값 미제공, 일간 등락률(du_er_1d)로 안내"; ETN → 정상 제공. 상품군 확인 후 답변 분기.
  du_nav_rnf_amt:
    korean_name: 전일NAV등락금액
    missing_reason: broken_etf_only
    answer_policy: >-
      🔴 ETF: 사용 금지 (실제 등락이 아니라 -전일NAV). ETN: 사용 가능 (실제 등락 = 오늘−전일 NAV).
    note: >-
      2026-08-18 정정 — ETF 1,137건은 = -du_nav_yday (깨짐). ETN 380건은 du_last_nav - du_nav_yday
      와 오차 0.01 미만으로 일치(정상). "실제등락인 종목 0건"은 ETF 한정에서만 참이었다.

  # ── 종가 (0값 = 미거래) ──
  du_clpr:
    korean_name: 종가
    missing_reason: present
    answer_policy: "가격 기반 Top-N/조회 시 du_clpr > 0 필터. 0값은 만기채권ETF·신규상장 미거래."
    note: >-
      🔴 2026-08-18 감사 정정 — 0값은 50건이 아니라 **167건 = ETF 50 + ETN 117**이다
      (이전 수치는 ETF만 센 것). du_clpr > 0 필터의 영향 범위가 3.3배다. AUM은 있으나 종가 0인 종목 존재.

# ── ETF/ETN 구분 (핵심) ──
product_group:
  column: pd_grp_no
  values:
    ETF: 1202
    ETN: 532
  note: "'국내ETF마스터'에 ETN 30.7% 혼입. ETF 전용 질의는 pd_grp_no='ETF' 필수. 보조신호: cu_strtegy='C'(409건 전부 ETN), ETN은 cu_charge_rt 전부 NULL."
  workshop: ETF/ETN 별도 클래스 vs 공통상위 → §F-1

# ── 정규화 (문자열 비교 시 TRIM) ──
normalization:
  trim_columns:
  - pd_nm
  - pd_abrv_nm
  - cu_fund_mgmt_co
  - cu_base_index
  - wu_inv_ast_type
  - wu_inv_rgn
  - pd_exg_mkt_nm
  - pd_mkt_nm

# ── 쿼리 가드레일 ──
query_rules:
  ETF만: pd_grp_no = 'ETF'
  ETN만: pd_grp_no = 'ETN'
  보수유효: cu_charge_rt > 0            # 0은 미입력 (유효 67건)
  수익률정상: <질의 대상 기간 컬럼> > -100 AND <동일 컬럼> IS NOT NULL   # 🔴 2026-08-18 개정
  수익률정상_개정근거: >-
    🔴 -100 센티넬은 du_er_1y 만이 아니라 **전 기간에 있다** (2026-08-18 전수) —
    1m 20 · 3m 37 · 6m 53 · ytd 44 · 1y 98건. 전건이 du_clpr=0 동반(거래중단·상폐 확인).
    이전 규칙은 1y 고정이라 다른 기간 Top-N 이 무방비였다. 정렬·필터에 쓰는 바로 그 기간
    컬럼에 건다 — public_funds.query_rules.수익률정상과 동일 형태 (도메인 간 통일).
  # ✅ 검토(이병철/08-21): 재현 일치 — m1=20·m3=37·m6=53·ytd=44·y1=98, y1=-100&종가≠0=0건(전건 상폐 확인). 매개변수형 타당.
  # 💡 형식 제안(SQL생성기용): `{er_col} > -100 AND {er_col} IS NOT NULL`, 치환표 {1개월:du_er_1m, 3개월:du_er_3m, 6개월:du_er_6m, 연초이후/YTD:du_er_ytd, 1년:du_er_1y}. 기간 미지정 질의는 du_er_1y 기본.
  종가정상: du_clpr > 0                 # 🔴 =0 은 167건 = ETF 50 + ETN 117 (2026-08-18 정정 — 이전 '50건' 은 ETF만 센 것)
  NAV등락금지_ETF만: "ETF 는 du_nav_yday / du_nav_rnf_amt 사용 금지 · 🔴 ETN 은 정상이므로 사용 가능"   # 2026-08-18 정정 — ETN 379건은 전일값·등락이 정확 (columns.du_nav_yday)
  전부0컬럼금지: "pd_divd_amt_pshr · pd_dvid_yield · du_chas_errt · du_diff_rt · cu_charge_etc_rt · pd_net_ast_pshr · pd_net_prft_pshr · pd_net_rt_ast_pshr · pd_lst_price 사용 금지"  # 9종 non-null 전부 0 = 미제공
  판매중만: pd_sale_yn = '1'
  거래정상: pd_tr_yn = '0'
  레버리지: cu_lev_fector > 1             # 🔴 2026-08-20 정정 — 이전 '>= 2' 는 +1.5X ETN 2건(미래에셋 1.5X 천연가스·1.5X S&P500 VIX)을 놓침. 감사 ⑤에서 ±1.5 를 값매핑에 받고 규칙은 미개정이었던 것
  # ✅ 검토(이병철/08-21): 재현 일치 — >1 은 201건(1.5→2·2.0→190·3.0→9). 1.5X 2건 전부 ETN이고 상품명에 '1.5X' 명시 → 배수>1 전부 레버리지(도메인 통설) 타당, >1 개정 승인. 인버스레버리지(-2X 105·-3X 7·-1.5X 1)는 '인버스' 규칙(<0)이 잡으므로 여기서 누락 아님 — 단 leverageType 축에선 -2X=Inverse2X(레버리지성 인버스)라 "레버리지 상품 전부" 질의 시 축과 규칙 경계는 워크샵서 1줄 정리 권장
  인버스: cu_lev_fector < 0

# ── 축 유도 규칙 (샘플 100건 검증, docs/eda/domestic_etfs_notes.md §B) ──
axis_derivation:
  confirmed:            # 검증 완료 — 바로 사용 가능
    strategy:
      accuracy: 100/100
      rule: cu_strtegy='액티브' → Active, else Passive
    leverageType:
      accuracy: 100/100
      rule: cu_lev_fector 값매핑 (1→Standard, 2→Leveraged2X, -1→Inverse1X, -2→Inverse2X, ±3→Lev/Inv3X, ±0.5/±1.5→Lev/Inv 소수배수)
      rule_보강: >-
        🔴 2026-08-18 감사 — 매핑에 없던 소수 배수가 실재한다: -0.5(3건)·+1.5(2건)·-1.5(1건) 총 6건
        (2026-08-20 실측 재확인 — 이전 표기 '±0.5 4건·±1.5 2건'은 내역 오기, 총 6건은 동일). 전부 ETN
        (인버스0.5X VIX · 1.5X 천연가스 등). 샘플 100건에 없어 정확도 100/100 이 유지됐던 것.
        소수 배수도 매핑에 받을 것 — 안 받으면 6건이 leverageType 미분류로 남는다.
    distributionType:
      accuracy: 100/100
      rule: 상품명에 'TR'/'Total Return' → TotalReturn, else Distributing
    replicationMethod:
      accuracy: 99/100
      rule: cu_strtegy 실물복제→Physical / 합성복제→Synthetic
    region:
      accuracy: 94/100
      rule: wu_inv_rgn='국내'→Domestic, else Overseas (+ '미국달러/엔선물' 통화는 Overseas 보정)
  pending_workshop:     # 주최 기준이 특이 — 워크샵 확정 필요
    assetType:
      accuracy: 92/100
      issue: 주최 정답이 wu_inv_ast_type·legacy_leaf 와 상충 (국고채→Equity, MMF/통화 별도). §F-2
    underlyingScope:
      accuracy: 87/100
      issue: 독립축. 상품명 기초자산(대표지수/단일종목/섹터)으로 결정. legacy_leaf 계층으로는 안 나옴. §F-3
