  국내는_지역필터가_아니다: >-
    🔴🔴 질문의 `국내`·`국내 상장` 을 **`wu_inv_rgn` 조건으로 절대 옮기지 않는다.**
    domestic_etfs 테이블은 이미 **전건이 국내 상장 ETF·ETN(1,780행)** 이라 별도 필터가 필요 없다.
    붙이면 해외에 투자하는 상품이 통째로 빠진다 — "국내 ETF" 를 물었는데 답에서 미국·중국 투자 상품이 사라진다.
    서버 실측 2026-08-31 — "총보수 낮은 국내 ETF 5개" 가 `WHERE wu_inv_rgn='국내'` 를 붙여 **8건이 잘렸고**,
    "Li Auto를 담은 국내 ETF" 는 중국 기업이라 **0건**이 됐다.
    ✅ `wu_inv_rgn` 을 쓰는 유일한 경우 — 문장이 **투자 대상**을 가리킬 때다:
       "국내**에 투자하는** ETF" · "국내 **주식형** ETF" · "미국에 투자하는 ETF"(`wu_inv_rgn='미국'`).
    ❌ 쓰지 않는 경우 — "국내 ETF" · "국내 상장 ETF" · "국내 ETF 중 …" · "국내 상장 상품".
    같은 이유로 `ref_geo_focus='Korea'` 도 붙이지 않는다.
  보수개별조회: >-
    🔴 개별 상품의 총보수를 물으면 **`NULLIF(cu_charge_rt, 0)` 으로 감싸서** SELECT 한다.
    형식: `SELECT pd_abrv_nm, NULLIF(cu_charge_rt, 0) AS cu_charge_rt FROM domestic_etfs
    WHERE TRIM(pd_abrv_nm) = '<호칭>'`
    서버 실측 2026-08-31 — "KODEX 200 총보수 알려줘" 가 `SELECT cu_charge_rt` 로 `0.0` 을 받아
    **"총보수는 0.0%입니다"** 라고 답했다. 0 은 무료가 아니라 **미입력**이다(유효 67건뿐).
    말로만 "0이면 미수록이라 말하라" 고 적어 두면 답변 생성기가 무시한다 —
    실제로 answer_rules 3,065자가 적용된 상태에서도 0.0% 로 나갔다.
    NULLIF 로 **빈 값을 넘기면** 답변이 "수록되어 있지 않습니다" 로 나온다.
    ⚠️ 정렬·Top-N 은 이것 말고 query_rules.보수유효(`cu_charge_rt > 0`)를 쓴다 — 목적이 다르다.
    같은 이유로 상품명(pd_abrv_nm)을 항상 함께 SELECT 한다. 답변이 어느 상품인지 밝힐 수 있어야 한다.
  환헤지: >-
    pd_nm LIKE '%H)%'
    🔴 **닫는 괄호까지 붙여서** 찾는다. `%H%` 로 찾으면 372건이 나오는데 그중 113건이 오탐이다 —
    운용사 브랜드 `HANARO`·`DAISHIN` 안의 H 다.
    실측 2026-08-31 — `H)` 로 끝나는 것 **259건** = `(H)` 230 + `(합성 H)` 30 (겹침 0 · 나머지 0).
    `(합성 H)` 는 합성복제와 환헤지를 함께 표기한 것이라 **빠뜨리면 안 된다**.
    🔴 `(UH)`·'언헤지'·'환헤지' 표기는 **0건**이다 → **`H)` 가 없으면 환노출**로 말한다.
    "환헤지 여부가 수록되지 않았다" 고 답하지 않는다.
    ⚠️ 어느 통화를 헤지했는지는 데이터에 없다. `엔화노출(합성 H)` 같은 상품이 4건 있어
    "원화 기준 환위험을 제거했다" 고 단정하지 말고 표기 사실만 전한다.
  선물: >-
    pd_nm LIKE '%선물%'
    대응 컬럼이 없어 상품명이 유일 근거다. 지수명 `Futures` 는 25건뿐이라 지수로는 못 찾는다
    (상품명 401건 · 지수명에 Futures 없는 것이 376건 · 반대 방향 오탐 0건).
    🔴 401건 중 **311건이 ETN** 이다. "선물 **ETF**" 를 물었으면 `AND pd_grp_no = 'ETF'` 를 함께 건다(ETF 90건).
    🔴 답변에 한 줄 덧붙인다 — 선물은 만기마다 갈아타므로(롤오버) 현물 지수와 수익률이 벌어질 수 있다.
    "지수를 그대로 추종한다" 고 말하면 안 된다.
    ⚠️ ETF 90건 중 52건이 레버리지·인버스다. 레버리지 주의 문구가 함께 필요할 때가 많다.
  단일종목: >-
    pd_nm LIKE '%단일종목%'
    18건뿐이고 전수 확인했다 — 기초자산은 **삼성전자·SK하이닉스 둘뿐**이고 **18건 전부 배수 2.0**
    (레버리지 16 · 인버스2X 2). 자산군은 대체투자 16 · 주식 2(ETN).
    🔴 분산 상품이 아니다. "ETF 니까 분산 투자" 라고 말하면 안 된다 — 한 종목에 2배로 걸린다.
    레버리지 주의 문구를 반드시 함께 붙인다(query_rules.레버리지_인버스혼입경고).
  총수익지수_TR: >-
    ref_base_index LIKE '%TR%' (총수익) · LIKE '%PR%' (가격)
    실측 — 지수명에 TR 255건 · PR 93건. 상품명에는 표기가 거의 없어 **지수명으로만** 판별한다.
    🔴 TR 은 분배금을 지수에 재투자한 것이고 PR 은 가격만 본다. **수익률을 비교할 때 섞으면 안 된다** —
    TR 이 구조적으로 높게 나온다. 같은 기초자산인데 한쪽만 TR 이면 답변에 그 사실을 밝힌다.
    ⚠️ 두 글자라 부분일치 위험이 있다. 앞뒤에 영문이 붙지 않는 자리인지 확인하고 쓴다.
  개수만_준_질의: >-
    🔴 `LIMIT N` 을 쓸 때 **`ORDER BY` 없이 두지 않는다.**
    질문이 개수만 주고 기준을 안 주면("인버스 ETF **3개** 알려줘") 기본 정렬은
    **순자산 내림차순** `ORDER BY du_last_aum DESC` 이고, 답변에 그 기준을 한 마디 밝힌다.
    서버 실측 2026-08-31 — "인버스 ETF 3개 알려줘" 가 `LIMIT 3` 만 붙여 DB 저장 순서대로 집었다.
    조건식은 맞았지만 ① 무슨 기준으로 3개를 골랐는지 답변에 없고
    ② 정렬이 없으면 같은 질문에 다른 답이 나올 수 있다 — 채점에서 재현되지 않는다.
    ⚠️ 순자산은 유효 1,170/1,780 이라 결측이 뒤로 밀린다. Top-N 답변에 그 사실을 한 줄로 밝힌다.
    다른 축이 문장에 있으면(보수·수익률·거래대금) 그 축을 쓴다 — 이 규칙은 **축이 없을 때의 기본값**이다.
  섹터_한영대응: >-
    🔴 주최가 출제 축으로 지목한 **"섹터 - 상품"** 질의용 대응표(8/31 공지).
    섹터 컬럼은 **없다** — `pd_sect_cd` 는 섹터가 아니라 상품유형(일반ETF 1,126 · 일반ETN 406 ·
    단일종목 18 · 미분류 183)이고 해외ETF 는 컬럼 자체가 없다. query_rules.섹터테마질의 대로 우회한다.
    🔴 그런데 **한글 섹터어를 지수명에 걸면 0건**이다 — 지수명은 전건 영문이다.
    상품명만 보면 놓치는 양이 섹터마다 다르다(ETF 기준 실측):
      의료 3→17 · 배터리 3→16 · 소비재 6→14 · 2차전지 18→23 · 전력 14→19 · 헬스케어 11→15 · 로봇 14→18
    형식: `replace(pd_nm,' ','') LIKE '%한글%' OR replace(ref_base_index,' ','') LIKE '%영문%'`
    ✅ 검증된 대응 — 반도체=Semiconductor · 2차전지/배터리=Battery · 바이오=Bio ·
       헬스케어/의료=Healthcare · 전력=Power · 원자력=Nuclear · 에너지=Energy · 로봇=Robot ·
       소비재/소비=Consumer · 방산=Defense · 우주항공=Aerospace · 리츠=REIT · 은행=Bank ·
       게임=Game · 소프트웨어=Software · 조선=Ship · 통신=Telecom
    🔴 쓰면 안 되는 대응 (실측 오탐):
       자동차 → `Auto` **금지**. 지수명의 Auto 는 대부분 `Auto Rollover`·`Auto-Mat Ext`
         (만기**자동**연장 채권)이다 — 자동차 ETF 가 아니다. 자동차는 상품명 `자동차`·`전기차`·`모빌리티` 로 찾는다.
       금융 → `Financial` 은 `Nasdaq Financial Bond`(채권혼합)를 물어온다. 상품명 `금융` 을 우선하고
         지수명은 확인 후 쓴다.
    🟡 `유통` 은 상품명·지수명 모두 0건이다 — 해당 섹터 상품이 없다고 답한다(억지로 Consumer 로 바꾸지 않는다).
    ⚠️ 답변에 **어느 축으로 찾았는지** 밝힌다 — "상품명과 기초지수명 기준입니다"(섹터테마질의).

# ── 파생 규칙 (DB 컬럼으로 만들지 않고 규칙으로 선언 — NEXT_STEPS 원칙 2) ──
derivation_rules:
  inverse_direction:
    규칙: "CASE WHEN pd_abrv_nm LIKE '%인버스%' THEN 'Inverse' ELSE 'Long' END"
    근거: >-
      🔴 2026-08-25 — cu_lev_fector 부호 소실(columns.cu_lev_fector.trap). 상품명 '인버스' 225건 vs 음수 22건.
      음수인데 이름에 '인버스' 없는 행 1건(ETN)은 이름 규칙이 놓치나, 부호 있는 22건은 OR 조건으로 추가 포착 가능:
      `pd_abrv_nm LIKE '%인버스%' OR cu_lev_fector < 0`.
    축: leverageType 의 방향 성분
  leverage_multiple:
    규칙: "ABS(cu_lev_fector) — 1.0 Standard · 2.0 2X · 3.0 3X · 0.5/1.5 소수배수(ETN 6건)"
    근거: 부호와 무관하게 절댓값은 2차에서도 신뢰 가능 (상품명 '2X'/'레버리지' 314건 중 |값|=2 가 305건, 3 이 9건).
    축: leverageType 의 배수 성분

# ── 축 유도 규칙 (샘플 100건 검증은 1차 데이터 기준 — docs/eda/domestic_etfs_notes.md §B. 2차 재검증 필요 항목 표시) ──
axis_derivation:
  confirmed:            # 검증 완료 — 바로 사용 가능
    strategy:
      accuracy: 100/100
      rule: cu_strtegy='액티브' → Active, else Passive   # 'C'(ETN) 는 Passive 로 흡수되나 ETN 은 원래 지수형
    leverageType:
      accuracy: 100/100 (1차 기준 — 🔴 2차 재검증 필요)
      rule: >-
        🔴 2026-08-25 개정 — 방향은 derivation_rules.inverse_direction, 배수는 derivation_rules.leverage_multiple 의 조합.
        (구 규칙 "cu_lev_fector 값매핑 1→Standard, -1→Inverse1X …" 는 부호 소실로 인버스를 전부 Standard/Leveraged 로 오분류한다.)
      rule_보강: >-
        소수 배수 -0.5(3건)·+1.5(3건) 실재 — 전부 ETN. 매핑에 받을 것.
        2차 실측 부호 분포: ETF -1.0 1건 / ETN -2.0 16 · -1.0 6 — 나머지 인버스는 양수.
    distributionType:
      accuracy: 100/100
      rule: 상품명에 'TR'/'Total Return' → TotalReturn, else Distributing   # 🟢 2차 pd_dvid_cycl 로 교차검증 가능(TR 이면 분배주기 무관)
    replicationMethod:
      accuracy: 99/100
      rule: cu_strtegy 실물복제→Physical / 합성복제→Synthetic / 'C'·NULL → 미분류
    region:
      accuracy: 94/100
      rule: wu_inv_rgn='국내'→Domestic, else Overseas (+ '미국달러/엔선물' 통화는 Overseas 보정)   # 🟢 2차 ref_geo_focus 로 교차검증 가능
  pending_workshop:     # 주최 기준이 특이 — 워크샵 확정 필요
    _recheck_2026-08-25: "2차 재현(review_recheck §E7): 주최 정답 샘플 100건 중 2차 조인 91건 · ref_ast_type 과 주최 정답 일치 69%(국고채→Equity 는 ref 도 Bond) → 규칙 유도 불가 유지 · 인버스 10/10 양수 배수 = cu_lev_fector 부호 소실 확증 · 섹터코드 8→SingleStock recall 20% 사용 금지 유지"
    assetType:
      accuracy: 92/100
      issue: 주최 정답이 wu_inv_ast_type·legacy_leaf 와 상충 (국고채→Equity, MMF/통화 별도). §F-2. 🟢 2차 ref_ast_type(Equity/Bond/Alternatives…)이 제3의 근거 — 셋을 대조해 확정
    underlyingScope:
      accuracy: 87/100
      issue: 독립축. 상품명 기초자산(대표지수/단일종목/섹터)으로 결정. legacy_leaf 계층으로는 안 나옴. §F-3. 🟢 2차 ref_base_index(905종)로 지수 기반 판정 가능성 재검토
  # 🔶 E7 재현(이병철/08-21, **1차 데이터 기준**): assetType 충돌 재현됨 — 국고채 4종이 주최 정답 Equity,
  #    단기채권은 MoneyMarket. 정답지 컬럼밀림 아님(나머지 6축 정상) → 주최 문의 근거.
  #    underlyingScope 는 '코드8 넣으면 87→83' 의 정확 수치가 키워드셋 의존이라 재현 안 됨. 2차 기준 재실험 필요.

# ── 외부 구성종목 조인 (2026-08-27 A-3-01·A-4-03 검토 확정) ──
external_join:
  ext_etf_holdings:
    key: "ext_etf_holdings.etf_code = domestic_etfs.pd_itm_no"
    as_of: "2026-08-21"          # 전건 단일 · 마스터 기준일(2026-08-22) 대비 1일 전
    coverage: >-
      🔴 '1,160 / 1,780 = 65.2%' 로 답하지 말 것 — 오해를 부르는 모수다.
      안 붙는 620건은 ETN 545(구성종목 개념이 없는 발행사 신용 증권) + 판매종료 ETF 75건이고,
      **판매중 ETF 1,160건은 미수집 0건**(1,160/1,160 = 100%).
      답변 모수는 '판매중 국내ETF' 로 밝힌다.
    answer_policy: >-
      구성종목 답변에 **'2026-08-21 기준' 을 병기**한다(1일 전이라 '현재 구성' 으로 서술해도 무방하나 기준일은 밝힌다).
      ETN 질의에는 '구성종목 개념이 없는 상품' 이라고 답한다 — '데이터 없음' 이 아니다.

# ── 역질문 분기 — 되묻기는 답변불가 문항의 정답 형태 중 하나 (주최 확인 8/25) ──
#    주최 원문: "'확인할 수 없음' 명시 또는 필요한 조건 역질문이 정답 처리됩니다"
#    🔴 2026-08-30 키움 챗봇 대조 12번에서 나온 것.
#       "코스피300 지수를 추종하는 ETF" 질의에 키움은 **KRX300 ETF 3개**를 주면서
#       "코스피300 지수를 추종하는 국내 ETF를 조회했습니다" 라고 단정했다.
#       코스피300 은 존재하지 않는 지수이고 KRX300 은 실재하는 **다른** 지수다.
#       바꿔 답한 사실을 밝히지 않았으므로 감점 대상이다.
#       — 키움은 KRX300 을 찾아냈으니 역질문 재료를 다 갖고 있었는데도 되묻지 않았다.
clarify:
  # (A) 존재하지 않는 개체 — 유사 후보가 있어도 **조용히 치환하지 않는다**
  존재하지_않는_개체:
    원칙: >-
      🔴 정확 일치가 없으면 **답하지 않는다.** 유사 이름으로 대체 조회해 놓고
      원래 이름으로 답하면 감점이다(주최: 답변불가 질의에 답을 생성하면 감점).
      유사 후보를 찾았으면 **버리지 말고 역질문으로 제시**한다 — 그게 정답 처리되는 형태다.
    답변형태: >-
      "○○ 은(는) 제공 데이터에 없습니다. 혹시 △△ 를 말씀하신 건가요?"
      (유사 후보가 없으면 "확인할 수 없습니다" 단문)
    실측_사례:
      코스피300: "존재하지 않음(0건). 유사 후보 — KRX300(7건, 다른 지수) · KOSPI 200(95건). 치환 금지, 되묻기"
      KODEX_AI로봇: "정확 일치 0건. 유사 후보 — KODEX 로봇액티브·KODEX 글로벌로봇(합성)·KODEX 차이나휴머노이드로봇·KODEX 미국휴머노이드로봇 4건. 단정 금지"
      위험등급_7등급: "등급은 1~6 뿐(매우높은위험1 ~ 매우낮은위험6). 유사 후보 없음 → '확인할 수 없음' 단문"
    금지: >-
      🔴 유사도만 보고 KG 노드를 붙이지 말 것. `코스피300` → `KRX300` 처럼
      **한 글자 차이로 실재하는 다른 개체**가 있으면 그대로 오답이 된다.
  # (B) 용어가 다의적 — 동반 신호가 없으면 되묻는다
  다의어:
    안전한: >-
      🔴 **되묻고 끝내지 않는다.** 위험등급(pd_risk_nm)으로 **먼저 답하고**, 그 기준이었음을 밝힌 뒤
      다른 기준도 가능하다고 **안내**한다. 순서가 중요하다 — 답변 → 기준 명시 → 안내.
      (펀드 도메인 리드 결정 2026-08-31 과 같은 방침 — "되묻고 끝내지 않는다")
      서버 실측 2026-08-31 — "안전한 etf상품 추천좀" 이 답 없이 CLARIFY 만 하고 끝났다.
      `_refusal.yaml` 의 `주관_판단`("정렬 축도 모수도 없으면 CLARIFY")을 잘못 적용한 것이다 —
      **"ETF" 라는 모수가 있으므로 그 규칙 대상이 아니다.**
      🔴 위험등급 컬럼이 있어 **답변 가능한 질의**다. 답변불가 문항이 아닌데 되묻기만 하면 채점에서 0점이다.
      형식: pd_grp_no='ETF' AND pd_risk_nm IN ('매우낮은위험(6등급)','낮은위험(5등급)')
      ORDER BY du_last_aum DESC LIMIT 5
      ⚠️ ETF 6등급은 21건뿐이라 5등급까지 넓히게 된다 — **넓혔으면 넓혔다고 말한다.**
      안내할 다른 기준: 변동성(du_vlty_1y) / 자산군(채권·단기자금) / 레버리지 아님 / 순자산 규모.
    수익률: "기간 미지정이면 du_er_1y 기본 + 기간 명시. 치환표는 query_rules 의 형식 제안 참조"
    국내: >-
      🔴 **"국내 상장" ≠ "국내 투자"** — 컬럼이 다르다.
      · "국내 **상장** ETF" = domestic_etfs 테이블 전체(1,780행). 별도 필터가 필요 없다.
      · "국내에 **투자하는** ETF" = wu_inv_rgn='국내'(1,069행).
      2026-08-30 로컬 Ground 실측: "채권형 **국내** ETF" · "**국내 상장** ETF 중 **미국**에 투자하는" 에서
      `국내` 가 Region_Korea(투자지역)로 매핑됐다. 개체 매핑 자체는 맞으나
      **SQL 에서 wu_inv_rgn 필터로 쓰면 틀린다** — 앞의 것은 해외채권형이 빠지고,
      뒤의 것은 `국내 AND 미국` 이라는 모순 조건이 된다.
      → 문장에 '상장' 이 붙으면 지역 필터로 쓰지 않는다.
    규모:   "순자산(du_last_aum) / 거래대금 / 상장주식수 — 셋이 다름. 기본은 순자산"
    레버리지: "🔴 배수만 보면 인버스가 섞인다(324건 중 117건). query_rules.레버리지_인버스혼입경고 참조"

# ── 이름 인코딩 — 상품명에 박혀 있는 정보 (2026-08-31 신설) ──
#    리드 지시(08-31): "온톨로지 검토북 들어가서 각자 도메인 살펴보고 부족한 거 채워나가면 될 듯"
#      → 규칙북 대조 결과 채권엔 name_encoding(42건)이 있는데 ETF 엔 없었다. 그 빈 곳을 채운다.
#    리드 지시(08-31): "문자열 매칭은 좋은데 규칙을 더 세분화해서 전부 온톨로지에 박아놔야 될 듯. 안 걸리는 거 없게"
#      → 상품명에 든 정보를 전수 조사해 **대응 컬럼이 있는지**까지 함께 적는다.
#    🔴 원칙 — **대응 컬럼이 있으면 컬럼을 쓴다.** 이름은 컬럼이 없거나 값이 소실된 경우에만 쓴다.
#    전수 근거: docs/rule_audit/README.md §3
name_encoding:
  # ① 대응 컬럼이 있음 — 이름을 쓰지 말 것
  has_column:
    레버리지:   {count: 390, column: cu_lev_fector, note: "배수 절댓값으로 판별. 이름 불필요"}
    액티브:     {count: 359, column: "cu_strtegy='액티브'", note: 값매핑 정상}
    합성:       {count: 104, column: "cu_strtegy='합성복제'", note: "이름의 '(합성)' 과 일치"}
    월배당:     {count: 0,   column: "pd_dvid_cycl='M'",     note: "이름엔 '월배당' 표기가 없다 — 컬럼만 쓴다"}

  # ② 대응 컬럼이 없거나 값이 소실됨 — 이름이 유일 근거
  name_only:
    인버스:
      count: 235
      pattern: "pd_abrv_nm LIKE '%인버스%' OR pd_nm LIKE '%인버스%'"
      why: >-
        🔴 cu_lev_fector 부호가 **88% 소실**됐다 — 이름이 '인버스 2X' 인데 배수가 +2.0.
        음수는 235건 중 23건뿐이라 부호로 판별하면 212건을 놓친다.
        해외엔 cu_inverse_short_yn 플래그가 있으나 국내엔 없다.
      verified: "전수 검토 오탐 0 · 누락 0 (docs/rule_audit/inverse_domestic_2026-08-31.csv)"
      rule: query_rules.인버스
    환헤지:
      count: 235
      pattern: "pd_abrv_nm LIKE '%(H)%' OR pd_nm LIKE '%(H)%'"
      why: >-
        환헤지 여부 컬럼이 **없다.** 표기는 `(H)` 하나로 정형적이다 —
        실측 2026-08-31: `(H)` 235건 · `(UH)` **0건** · '언헤지' 0건 · '환헤지' 0건.
        즉 **`(H)` 가 붙으면 헤지, 안 붙으면 미헤지**로 읽는다(UH 표기는 국내에 없다).
      caution: >-
        ⚠️ 괄호를 포함해 매칭한다. `H` 만 찾으면 'HANARO'·'HBM' 등에 오탐이 난다.
      rule: 🔴 아직 없음 — 환헤지 질의가 오면 신설 필요
    선물:
      count: 403
      pattern: "pd_abrv_nm LIKE '%선물%' OR pd_nm LIKE '%선물%'"
      why: 파생상품 여부 컬럼이 없다. 기초자산을 현물이 아니라 선물로 담는 상품이다.
      caution: >-
        ⚠️ 선물 ETF 는 롤오버 비용이 있어 장기 수익률이 기초지수와 벌어진다.
        '지수를 그대로 추종한다'고 답하면 안 된다.
      rule: 🔴 아직 없음
    단일종목:
      count: 18
      pattern: "pd_abrv_nm LIKE '%단일종목%' OR pd_nm LIKE '%단일종목%'"
      why: >-
        한 종목에 집중 투자하는 ETF. 분산 효과가 없다.
        실측: 삼성전자 편입비중 상위 5개가 전부 단일종목 레버리지(71~96%)다.
      caution: "'ETF 는 분산투자' 라는 통념이 깨지는 상품 — 편입비중 질의에서 상위를 독점한다"
      rule: query_rules.편입비중상위_레버리지경고 가 일부 대응
    롱숏:
      count: 2
      pattern: "pd_abrv_nm LIKE '%롱%숏%' OR pd_nm LIKE '%롱%숏%'"
      why: 인버스도 레버리지도 아닌 스프레드 전략. 누락 사냥(08-31)에서 발견.
      rule: query_rules.롱숏

  # ③ 기초지수명에 있음 — 상품명이 아니라 ref_base_index 를 본다
  in_index_name:
    커버드콜: {count: 63, index_pattern: "'Covered Call'", rule: query_rules.지수추종_순수}
    혼합형:   {count: 70, index_pattern: "'Blend' · '50/50'", rule: query_rules.지수추종_순수}
    TR_PR:    {count: 32, index_pattern: "'TR' · 'PR'", note: "총수익/가격 지수 구분. 규칙 없음 — 수익률 비교 시 섞이면 안 된다"}

  # ④ 브랜드 접두어 → 운용사 (실측 2026-08-31, 1:1 대응)
  brand_prefix:
    KODEX:  {운용사: 삼성,     count: 243}
    TIGER:  {운용사: 미래에셋,  count: 237}
    RISE:   {운용사: KB,       count: 150}
    ACE:    {운용사: 한국투자,  count: 120}
    PLUS:   {운용사: 한화,     count: 92}
    KIWOOM: {운용사: 키움,     count: 81}
    SOL:    {운용사: 신한,     count: 81}
    HANARO: {운용사: NH-Amundi, count: 64}
    note: >-
      🔴 브랜드로 운용사를 판정하지 말 것 — cu_fund_mgmt_co 컬럼이 정본이다.
      이 표는 **사용자가 브랜드명으로 물었을 때 운용사로 잇기 위한 것**이다
      ("KODEX 상품 알려줘" → 삼성자산운용). 반대 방향(운용사→브랜드)은 코드북 asset_manager.csv.

