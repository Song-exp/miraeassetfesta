    note: "'PD_RISK_GCD_11'~'_16' 문자열 — 뒤 2자리-10 = 등급 (shared/risk_grade.yaml alias 6/6)"
  pd_risk_nm:
    korean_name: 상품위험등급명
    kg_entity: RiskGrade                # 2026-08-25 포인터 기입 (stub — 판정 본문은 auto.yaml·shared alias 참조)
    missing_reason: none
    note: "'매우높은위험(1등급)' 등 6종"
  wu_inv_rgn:
    korean_name: 투자지역
    kg_entity: Region                # 2026-08-25 포인터 기입 (stub — 판정 본문은 auto.yaml·shared alias 참조)
    missing_reason: none
    note: "11종 (국내 1,069 · 미국 466 · 글로벌 76 …) — shared/region.yaml 11/11"
  wu_inv_ast_type:
    korean_name: 투자자산유형
    kg_entity: AssetClass                # 2026-08-25 포인터 기입 (stub — 판정 본문은 auto.yaml·shared alias 참조)
    missing_reason: none
    note: "9종 — 7/9 매핑 ('대체투자' 132·'기타' 37 미매핑)"
  pd_curr_cd:
    korean_name: 통화코드
    kg_entity: Currency                # 2026-08-25 포인터 기입 (stub — 판정 본문은 auto.yaml·shared alias 참조)
    missing_reason: mixed   # 🔧 정정(이병철/08-27) [A절]: none → mixed
    note: "'CURR_CD_KRW' 1,775 · 'CURR_CD_000' 1 (센티넬)"

    # ✅ 검토(이병철/08-27) [A절]: 결측 3건 = 전부 판매종료 ETF(du_clpr 결측분과 동일 상품). 통화코드는 상품 속성인데도 판매종료면 비어 있음.
product_group:
  column: pd_grp_no
  values:
    ETF: 1235
    ETN: 545
  note: "'국내ETF마스터'에 ETN 30.6% 혼입 (2차). ETF 전용 질의는 pd_grp_no='ETF' 필수. 보조신호: cu_strtegy='C'(422건 전부 ETN), ETN은 cu_charge_rt·ref_*·pd_ticker·분배정보 전부 NULL."
  _closed_2026-08-25: "ETF/ETN 클래스 구조 — ontology.ttl 에 :ETF owl:disjointWith :ETN 으로 확정(build_ontology emit_ttl). 공통상위는 :DomesticETF 테이블 클래스"

# ── 정규화 (문자열 비교 시 TRIM) ──
normalization:
  trim_columns:
  - pd_nm
  - pd_abrv_nm
  - cu_fund_mgmt_co
  - cu_base_index
  - wu_inv_ast_type
  - wu_inv_rgn
  - pd_exg_mkt_nm
  - pd_mkt_nm
  - pd_dvid_cycl       # ETN 422건 '  ' 공백 패딩
  # 수치 정렬·필터 기본값: <컬럼> IS NOT NULL AND <컬럼> <> 0 (주최 공지 "0/결측은 의도된 값 — 빼고 보여주거나 없다고 응답").
  # 🔴 2026-08-26 주최 답변으로 예외 축소 — "수익률·총보수 같은 컬럼을 질의했을 때 그 컬럼의 값이 0 인 행들은
  #     아예 포함하지 않는 게 맞다 (값이 0 이니 당연히 기준이 없음)".
  #     → 분배금 3종(pd_divd_amt_pshr · pd_divd_amt_ann · pd_dvid_yield) 예외 해제.
  #     남는 예외는 0 이 랭킹 축이 아니라 분류 정보인 컬럼뿐.
  zero_as_missing_default: true
  zero_is_value_columns:
  - cu_lev_fector      # 배수 없음 = 1.0 (0 은 부재) — 랭킹 축 아님, 필터 전용

# ── 쿼리 가드레일 ──
query_rules:
  편입비중상위: >-
    "○○를 가장 많이 편입한 ETF" 는 **상품명이 아니라 실측 비중**으로 답한다 —
    ext_etf_holdings 를 external_join 키(etf_code = pd_itm_no)로 JOIN 하고 weight_pct 로 정렬한다.
    🔴 키움 챗봇이 여기서 틀렸다(2026-08-30 대조): 'KODEX 삼성전자채권혼합'(28.56%)을 1위로 답했는데
    실제 1위는 'KODEX 삼성전자단일종목레버리지' 96.64% 다 — 이름에 '삼성전자' 가 든다고 고른 것이고
    그 상품은 절반이 채권이다. 삼성전자 편입 국내ETF 는 239개다.
    🔴 "레버리지 제외" 같은 말이 없으면 레버리지·단일종목을 **빼지 않는다** — 그게 정답이다.
    빼지 않되 편입비중상위_레버리지경고 의 주의 문구를 붙인다(회의 공통 패턴).
  ETF만: pd_grp_no = 'ETF'
  ETN만: pd_grp_no = 'ETN'
  구매가능: pd_lste_dt = 99991231 AND pd_sale_yn = 1        # 🔴 2026-08-25 신설 — 주최 공지: 상장폐지/리스팅 종료 제외 전부 "구매가능". ETF 1,160 · ETN 374. (pd_lste_dt<99991231 242건은 전부 pd_sale_yn=0)
  보수유효: >-
    cu_charge_rt > 0 AND pd_grp_no = 'ETF'
    총보수 정렬·필터·Top-N('총보수 낮은 ETF' 등)은 **두 조건을 함께** WHERE 에 넣는다.
    · `cu_charge_rt > 0` — 0(=미입력)·NULL 이 1,713행이라 조건 없이 ASC 정렬하면 미입력 행이 상위를 도배한다
      (유효 67건 · 서버 실검증 2026-08-31 오답 사례)
    · `pd_grp_no = 'ETF'` — ETN 545건은 총보수가 전건 NULL 이다. 보수 개념이 달라 모수에 들어가면 안 된다
      (서버 실측 2026-08-31: 이 조건이 빠진 SQL 이 나왔다)
    🔴 답변에 **유효 모수 67건**을 반드시 밝힌다 — "총보수가 수록된 67개 ETF 중에서" (answer_policy 요구사항).
    🔴 `wu_inv_rgn` 은 붙이지 않는다 — query_rules.국내는_지역필터가_아니다 참조.
  # 🆕 2026-08-31 리드 확답(ask_lead §5) — 섹터·테마 질의는 섹터 컬럼으로 못 푼다.
  #    pd_sect_cd 는 섹터가 아니라 상품유형 구분(columns.pd_sect_cd 참조)이고, 해외ETF 는 섹터 컬럼 자체가 없다.
  #    → 우회 3축을 함께 쓴다: ① 기초지수명(ref_base_index LIKE — 예: '%Aerospace%'·'%Semiconductor%')
  #      ② 상품명(pd_nm·pd_abrv_nm LIKE — 예: '%우주항공%'·'%반도체%')  ③ 구성종목(ext_*_holdings 조인 — 대표 종목 보유 여부).
  #    답변에 판정 근거 축을 밝힌다("기초지수명 기준입니다"). 외부 섹터 데이터 수집은 후속 검토(보류).
  섹터테마질의: >-
    pd_sect_cd 사용 금지 — ref_base_index·상품명·ext_*_holdings 3축 우회로 풀고 근거 축을 답변에 밝힌다
    🔴 `wu_inv_ast_type` 도 섹터가 아니다 — 자산군(주식·채권·원자재·대체투자·단기자금…)뿐이라
    `LIKE '%반도체%'` 를 걸면 0건이다(서버 실측 2026-09-01, 공식 예시 #3 캠브리콘이 이걸로 실패).
    섹터는 오직 3축 — ① 상품명 ② ref_base_index(섹터_한영대응 표) ③ ext_*_holdings 구성종목.
  수익률정상: <질의 대상 기간 컬럼> > -100 AND <동일 컬럼> IS NOT NULL
  수익률정상_근거: >-
    -100 센티넬은 전 기간에 있다 (2차 실측 2026-08-25) — 1d 1 · 1m 16 · 3m 45 · 6m 66 · ytd 69 · 1y 110건.
    1y 110건 전건이 du_clpr=0 동반(거래중단·상폐). 정렬·필터에 쓰는 바로 그 기간 컬럼에 건다 — public_funds 와 동일 형태.
  종가정상: du_clpr > 0                 # =0 은 192건 = ETF 58 + ETN 134 (2차)
  수치기본배제: "<수치 컬럼> IS NOT NULL AND <수치 컬럼> <> 0 — normalization.zero_is_value_columns 는 예외"   # 🔴 2026-08-25 신설 (주최 공지)
  전부0컬럼금지: "cu_charge_etc_rt · pd_dvid_inc_dist · fn_average_maturity · fn_effective_duration · fn_modified_duration 사용 금지"  # 2차: 100% 결측/전부 0 — 5종 (1차 9종 중 배당·추적오차·괴리율은 채워졌고 pd_net_*·pd_lst_price 는 삭제)
  분배질의_ETF만: pd_grp_no = 'ETF' AND pd_divd_amt_pshr > 0     # 🟢 2026-08-25 신설 — ETN 은 분배정보 구조상 없음
  월분배: pd_dvid_cycl = 'M'                                     # 🟢 신설 — 196건
  기초지수: "COALESCE(NULLIF(TRIM(ref_base_index),''), NULLIF(TRIM(cu_base_index),''))"   # 🟢 신설 — ref 1순위, cu 보조
  복제방식_모수: pd_grp_no = 'ETF' AND cu_strtegy IN ('실물복제','합성복제','액티브')     # 'C' 422건(ETN) 미분류 제외
  판매중만: pd_sale_yn = 1
  거래정상: pd_tr_yn = 0
  # 🆕 2026-08-29 회의 결정 — 공통 패턴 "살 수 없는 건 제외, 살 수는 있는데 위험한 건 알린다".
  #    빼지 않고 주의 문구를 붙인다(채권 domestic_bonds.query_rules.고위험제외 와 같은 방침).
  레버리지: ABS(cu_lev_fector) > 1
  # 🔴 레버리지 질의 주의 문구 — `레버리지`(ABS>1) 324건 중 113건이 인버스다.
  #    "레버리지 ETF 알려줘" 에 하락 베팅 상품이 섞여 나가므로, 결과는 그대로 주되
  #    답변에 인버스가 포함되면 밝힌다 —
  #    "이 중 N건은 지수가 **내릴 때** 수익이 나는 인버스 상품입니다. 방향이 반대이니 확인하세요."
  #    제외하지 않는 이유: 인버스도 살 수 있는 정상 상품이고, 배수 자체는 사실이다.
  레버리지_인버스혼입경고: >-
    ABS(cu_lev_fector) > 1 AND (pd_abrv_nm LIKE '%인버스%' OR pd_nm LIKE '%인버스%' OR cu_lev_fector < 0)
    이 조건에 걸리는 상품이 결과에 있으면 **빼지 말고 인버스 포함 사실을 답변에 밝힌다**.
    레버리지(ABS>1) 324건 중 113건이 인버스다 — 부호가 88% 소실돼 `cu_lev_fector < 0` 만으로는
    22건만 잡힌다(실제 225건). 그래서 이름 조건이 함께 붙어 있다 — **조건을 줄이지 말 것**.
  # 🔴 2026-08-25 개정 — 'cu_lev_fector < 0' 만으로는 22건만 잡힌다(실제 225건). derivation_rules.inverse_direction 참조.
  # 🆕 2026-08-30 확장 — 약어명만 보면 4건을 놓친다. 실측:
  #    `미래에셋 -2X 홍콩H 선물 ETN(H)` 처럼 약어엔 '-2X' 로만 적히고 정식명(pd_nm)에 '인버스' 가 있다
  #    (정식: "미래에셋 인버스 레버리지 홍콩H 선물 상장지수증권"). 4건 전부 진짜 인버스이며 오탐 0.
  #    → 약어명 OR 정식명 OR 음수배수. 기존 225건 누락 0 확인.
  인버스: >-
    (pd_abrv_nm LIKE '%인버스%' OR pd_nm LIKE '%인버스%' OR cu_lev_fector < 0)
    🔴 질문이 "인버스 **ETF**" 면 여기에 `AND pd_grp_no = 'ETF'` 를 **반드시** 함께 건다.
