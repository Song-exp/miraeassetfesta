    missing_reason: mixed   # 🔧 정정(이병철/08-27) [A절]: present → mixed
    answer_policy: "🟢 사용 가능 (= 오늘 NAV − 전일 NAV, ETF·ETN 전건 성립)."
    note: 2차 정정 — 1차 "ETF = -du_nav_yday (깨짐)" 는 2차에서 0건.

    # ✅ 검토(이병철/08-27) [A절]: 결측 182 = ETN 123 + ETF 59, 전부 판매종료(pd_sale_yn=0). du_nav_yday·pd_sect_cd 와 동일 집합. 판매종료 상품은 시세 갱신이 멈춰 결측.
  # ── 종가 (0값 = 미거래) ──
  du_clpr:
    korean_name: 종가
    missing_reason: mixed   # 🔧 정정(이병철/08-27) [A절]: present → mixed
    answer_policy: "가격 기반 Top-N/조회 시 du_clpr > 0 필터. 0값은 만기채권ETF·신규상장·거래중단 미거래."
    note: 2차 실측 — 0값 192건 = ETF 58 + ETN 134. -100 센티넬 110건 전부 이 집합에 포함.

    # ✅ 검토(이병철/08-27) [A절]: 결측 4건 = 판매종료 3건 + ETN 1건(판매중인데 시세 부재 — 확인 필요). 시세 질의는 pd_sale_yn=1 한정.
  # ── 레버리지 배수 (🔴 2차 회귀 — 부호 소실) ──
  cu_lev_fector:
    korean_name: 레버리지배수
    missing_reason: mixed
    trap: >-
      🔴 2026-08-25 2차 **회귀** — 인버스 상품의 음수 부호가 대부분 사라졌다.
      1차: -2.0 105건 · -1.0 65건 → 2차: -2.0 16건 · -1.0 7건 (전부 ETN 이거나 ETF 1건).
      'KODEX 인버스'·'ACE 인버스'·'RISE 국고채3년선물인버스' 가 **1.0**, 'KIWOOM 200선물인버스2X'·'TIGER 미국달러선물인버스2X' 가 **2.0** 으로 수록.
      상품명에 '인버스' 225건(ETF 46 · ETN 179) 중 음수는 22건뿐. 반대로 음수인데 이름에 '인버스' 없는 행은 1건.
      → 이 컬럼의 **부호는 신뢰 불가, 절댓값(배수)만 신뢰**.
    answer_policy: >-
      방향(인버스 여부)은 derivation_rules.inverse_direction(상품명 '인버스' 키워드)으로, 배수는 ABS(cu_lev_fector)로 판정.
      답변에는 "상품명 기준 인버스 · 배수 2X" 처럼 이름 근거를 병기한다. 주최 우선 원칙과 충돌 아님 — 값이 틀린 게 아니라 부호 정보가 빠진 것.
    note: 유효 1,598 (ETF 1,176 · ETN 422). NULL 182. 1.0 = 레버리지 없음(실제값). 소수 배수 0.5·1.5 는 ETN 6건.
    zero_is_value: true   # 해당 없음 — 1.0 이 기본값이며 0 은 존재하지 않는다. 정렬·필터에서 배제 규칙 적용 금지

  # ── 복제 전략 ('C' 미분류) ──
  cu_strtegy:
    korean_name: 복제방식/운용전략
    missing_reason: mixed
    answer_policy: >-
      복제방식 질의는 ETF 한정 — 실물복제 763 · 합성복제 82 · 액티브 358 (+ ETF NULL 32).
      'C' 422건은 **전부 ETN** 이며 코드북 미제공(주최 확정)이라 의미 불명 → **미분류** 로 두고 복제방식 질의 모수에서 제외·명시 (✅ 검수 C — 'C' 422 = du_last_aum 0 · du_chas_errt 0 · cu_charge_rt NULL 인 ETN 집단과 422/422 일치 — ETN 공통 더미값 확정, 코드 의미는 배제).
    note: 2차 실측 — C 422(ETN) · NULL 155(ETF 32 + ETN 123). 'C' 집단 = du_last_aum 0 · du_chas_errt 0 ETN 422건과 완전 일치(검수 C 2026-08-25 확정).
    value_semantics:
      "실물복제": Physical
      "합성복제": Synthetic
      "액티브": Active
      "C": 미분류 (ETN 전용 더미 코드 — 의미 미제공, 답변 배제)

# ── ETF/ETN 구분 (핵심) ──
  # ── 2026-08-25 kg_entity 포인터용 stub (재작성 때 누락된 축 컬럼) ──
  pd_risk_cd:
    korean_name: 상품위험등급코드
    kg_entity: RiskGrade                # 2026-08-25 포인터 기입 (stub — 판정 본문은 auto.yaml·shared alias 참조)
