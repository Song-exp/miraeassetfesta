query_rules:
  ETF만: pd_grp_no = 'ETF'
  ETN만: pd_grp_no = 'ETN'
  구매가능: pd_lste_dt = 99991231 AND pd_sale_yn = 1        # 🔴 2026-08-25 신설 — 주최 공지: 상장폐지/리스팅 종료 제외 전부 "구매가능". ETF 1,160 · ETN 374. (pd_lste_dt<99991231 242건은 전부 pd_sale_yn=0)
  보수유효: cu_charge_rt > 0            # 0은 미입력 (유효 67건 — 2차도 동일)
