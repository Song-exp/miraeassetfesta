# domestic_etfs — 사람의 판단을 담는 파일
# 기계적 사실은 *.auto.yaml 에 있습니다. 여기엔 판정과 규칙만 씁니다.
# 런타임 가드레일이 이 파일을 읽습니다.
#
# 범위: 2단계(결측 판정 · 컬럼 판단 · 쿼리 규칙 · 검증된 축 유도).
#   개체·관계 매핑(entities/class_hierarchy)은 4단계(워크샵 후). → docs/eda/domestic_etfs_notes.md §F 참조.
#
# 이력:
#   2026-08-18 감사 (1차 데이터 7/11) — docs/eda/etf_audit_2026-08-18.md
#   🔴 2026-08-25 **2차 데이터(8/24 배포 · 기준일 2026-08-22) 기준 재작성** — docs/DATA_V2_2026-08-24_impact.md §2.2·§6
#      · 행 1,734 → 1,780 (신규 46 = ETF 33 + ETN 13 · 소멸 0 · 신규 중 28건이 7/11 이후 상장)
#      · 컬럼 73 → 98 (+33 신규 / −8 삭제)
#      · 1차에서 "데이터 미제공"으로 판정했던 배당·추적오차·괴리율·현재가·전일NAV 가 2차에서 채워짐 → 판정 전면 갱신
#      · 🔴 회귀 1건: cu_lev_fector 부호 소실 (아래 trap)
#      · 삭제 8종(pd_sect_nm · pd_nav_pshr · pd_net_ast_pshr · pd_net_prft_pshr · pd_net_rt_ast_pshr · nru_mkt_inav · nru_mkt_diff_rt · pd_lst_price) 항목 제거
#   수치는 전부 2차 DB 실측(2026-08-25). "추정"이라 적은 것만 추정.

domain: domestic_etfs

# ── 행의 낟알 (2026-08-25 2차 재확인) ──
row_grain:
  구조: 행 = 상품 (pd_itm_no 완전 유일 — 1,780행 = 1,780 distinct)
  evidence_grade: A
  note: >-
    이 테이블은 행이 곧 상품이다. COUNT(*) 를 그대로 쓸 수 있다.
    (공모펀드도 2차에서 itm_no 유일로 정상화됐으므로 "펀드와 달리" 서술은 폐기.)
    ETF 1,235 · ETN 545 (30.6%) 혼입 — 상품군 분리는 pd_grp_no (product_group 참조).

columns:
  # ── 식별자 (2차 신규 — 외부 조인 키) ──
  pd_ticker:
    korean_name: 티커(6자리)
    missing_reason: mixed
    answer_policy: "외부 Holdings·시세 데이터 조인 키. ETN 545건은 전부 NULL(구조상 정상), ETF 27건 NULL."
    note: >-
      2차 신규. 1,208건 유효 = pd_itm_no_ma 의 앞 'A' 를 뗀 값과 1,208/1,208 일치.
      build_db.py CODE_COLUMNS 로 문자열 고정 — 선행 0 (예: '0000Z0') 보존됨. 정수 비교 금지.
  pd_isin_cd:
    korean_name: ISIN
    missing_reason: mixed
    note: 2차 신규. 유효 1,208건 = pd_itm_no 와 1,208/1,208 동일 → 중복 정보. 조인 키는 pd_itm_no 를 쓴다. ETN 545 NULL.
  pd_ric:
    korean_name: RIC(로이터 코드)
    missing_reason: mixed
    note: 2차 신규. 유효 1,208건 ('0000Z0.KS' 형태 = pd_ticker + '.KS'). ETN 545 NULL.

  # ── 규모 (단위 주의) ──
  du_last_aum:
    korean_name: 최종AUM(순자산총액)
    missing_reason: mixed
    answer_policy: "AUM 질의 답변 가능 — ETF 기준 결측 4.8%(59건)·0값 6건. 단위 KRW(원). 해외ETF(USD)와 통합 정렬 금지 — 상품군별 분리 제시."
    note: >-
      단위 KRW 확정 (1차 KODEX200 = 28.4조원 실제값 일치). 해외ETF du_last_aum은 USD라 숫자 직접 비교 시 순위 역전(함정②).
      🔴 2026-08-25 2차 — 결측·0값이 **ETN 에 몰려 있다**: ETN NULL 123 + 0값 422 (= cu_strtegy 'C' 422건과 동일 집단 — ✅ 검수 C 실측 422/422 완전 일치).
      ETF 는 NULL 59 · 0값 6 뿐. 1차의 "결측 16.2%·0값 411" 은 ETN 몫이었다.
    unit: krw
    layer:
      scale: KRW (원)
      cross_sort: "해외ETF du_last_aum(USD)와 나란히 정렬 불가. 8/21 환율(코드북⑤ 갱신 후)로만 통합 가능."

  # ── 보수 (2차에서도 개선 없음) ──
  cu_charge_rt:
    korean_name: 총보수요율
    missing_reason: missing
    answer_policy: "'보수 낮은 ETF' 질의는 `cu_charge_rt > 0 AND pd_grp_no='ETF'` 로 한정하고 **유효 모수 67건** 명시. 0값은 미입력이므로 정렬에서 제외. 개별 조회('KODEX 200 총보수')에서 0 이면 '0%'가 아니라 **'수록되어 있지 않습니다'** 로 답한다(주최 답변 준수 — ask_lead §6 리드 확답 08-31). 외부 보완(운용사 공시)은 후속 검토."
    note: >-
      2차 실측 동일 — ETF: NULL 1,018 · 0값 150 · 유효 67 (5.4%). ETN 545건 전부 NULL(ETN은 보수 개념 다름).
      2차 데이터로도 개선되지 않은 몇 안 되는 컬럼.
    unit: percent
  cu_charge_etc_rt:
    korean_name: 기타비용요율
    missing_reason: missing
    answer_policy: "'데이터 미제공'. 기타비용 질의 불가."
    note: 2차도 non-null 217건 전부 0. 통째 미입력.
    unit: percent

  # ── 배당/분배 (🟢 2차에서 채워짐 — 1차 "전부 0 = 미입력" 판정 폐기) ──
  pd_divd_amt_pshr:
    korean_name: 주당분배금
    missing_reason: mixed
    answer_policy: >-
      '분배금 많이 주는 ETF' Top-N 답변 가능 — `pd_grp_no='ETF' AND pd_divd_amt_pshr > 0` (유효 967건 = ETF 78.3%).
      🔴 2026-08-26 주최 답변 확정 — 0값 241건은 **결과에서 아예 제외**한다("값이 0 이니 당연히 기준이 없음").
      옛 지침("분배금 0으로 수록"으로 응답)은 폐기. 모수(967건)만 밝히고 0값 행은 언급하지 않는다.
      ✅ 검수 C — 0값 241건도 pd_dvid_cycl(A 87·Q 148·M 6)·pay_cnt 는 있음(주기는 있으나 금액 0).
      무분배인지 미입력인지 확정 불가라는 사실은 유지하되, 이제 어느 쪽이든 제외 대상이라 답변에 영향 없음.
    note: >-
      🟢 2026-08-25 2차 — ETF: 유효 967 · 0값 241 · NULL 27. 상품명 '배당'/'커버드콜' 119건 중 0값은 3건뿐
      → 1차의 "배당형도 전부 0 = 미입력" 근거가 사라졌으므로 0 을 실제 수록값으로 취급(주최 공지). 🔴 단위 주의(검수 C): pd_dvid_yield(%) = pd_divd_amt_ann / pd_dvid_nav 가 588/588 정확 일치 → 분배금 절대액이 NAV 대비 100배 스케일(원 단위 아닐 가능성). **분배금 절대액 답변 금지, 분배수익률(%)·지급월만 답한다.**
      기준일 pd_dvid_base_dt = 2026-08-22, 가격 기준 pd_dvid_prc_base_dt = 2026-08-20 (1,161건).
    unit: krw
    # zero_is_value 해제 (2026-08-26 주최 답변) — 0값 241건은 결과에서 제외
  pd_divd_amt_ann:
    korean_name: 연간분배금(주당)
    missing_reason: mixed
    answer_policy: "연간 분배금 질의 가능 — 유효 588건. NULL 951건(ETN 545 + ETF 406)은 '데이터 미제공'."
    note: 2차 신규. 유효 588 · 0값 241 · NULL 951. ✅ 검수 C 2026-08-25 — pd_divd_amt_ann = pd_divd_amt_pshr × pd_dvid_pay_cnt 가 588/588 정확 일치(스키마 코멘트 "연간 추정 분배금") — 회당 × 연간 지급횟수. 절대액은 단위 미확정이라 답변 금지(pd_divd_amt_pshr 참조).
    unit: krw
    # zero_is_value 해제 (2026-08-26 주최 답변)
  pd_dvid_yield:
    korean_name: 분배수익률
    missing_reason: mixed
    answer_policy: "분배수익률 순위 질의 가능 — `pd_dvid_yield > 0` (ETF 967건). 단위 % (✅ 검수 C — = pd_divd_amt_ann / pd_dvid_nav, 588건 정확 일치 · 범위 0.004~27.8). 0값 241 = 분배금 0 수록, ETN NULL."
    note: 🟢 2차 — ETF 유효 967 · 0값 241 · NULL 27. pd_divd_amt_pshr 와 유효/0 집합이 동일.
    unit: percent
    # zero_is_value 해제 (2026-08-26 주최 답변)
  pd_dvid_cycl:
    korean_name: 분배주기
    missing_reason: mixed
    answer_policy: >-
      🟢 월배당/분기배당 질의 **직답 가능** — ETF 1,208건 전건 유효. 'M' = 월분배 196건.
      ETN 은 공백('  ') 422 + NULL 123 = 전부 결측(구조상 정상) → 분배 질의에서 ETN 제외.
    note: >-
      🟢 2026-08-25 2차 정정 — 1차 "유효 0건·100% 결측" 판정 폐기. ETF: Q 698 · A 306 · M 196 · S 8 (+ NULL 27).
      pd_dvid_pay_cnt(연 지급 횟수 4/1/12/2)와 1:1 대응. ETN 의 '  ' 공백문자열은 TRIM 후 빈값 → 결측 처리.
    value_semantics:
      "M": 월분배 (연 12회)
      "Q": 분기분배 (연 4회)
      "S": 반기분배 (연 2회)
      "A": 연분배 (연 1회)
      "  ": missing   # ETN 422건 — 공백 패딩
  pd_dvid_pay_cnt:
    korean_name: 연간분배횟수
    missing_reason: mixed
    note: 2차 신규. 12/4/2/1 = pd_dvid_cycl M/Q/S/A 와 완전 대응. NULL 572 (ETN 545 + ETF 27).
  pd_dvid_pay_months:
    korean_name: 분배지급월
    missing_reason: mixed
    answer_policy: "'N월에 분배하는 ETF' 질의 직답 가능 — 영문 월명 콤마 구분('January,April,July,October' 675건). LIKE '%April%' 로 검색."
    note: 2차 신규. 15종 패턴. 12개월 전부 = 월분배 196건. NULL 572.
  pd_dvid_nav:
    korean_name: 분배기준NAV
    missing_reason: mixed
    note: 2차 신규. 유효 1,208 (ETF). ✅ 분배수익률 산출 분모 확정 — pd_dvid_yield = pd_divd_amt_ann / pd_dvid_nav (검수 C 2026-08-25, 588/588).
  pd_dvid_tax_basis:
    korean_name: 분배금과세기준
    missing_reason: mixed
    note: 2차 신규. 유효값이 'Gross' 1종뿐(1,208건) → 판별 정보 없음. 질의 대상 아님.
  pd_dvid_base_dt:
    korean_name: 분배정보기준일
    missing_reason: mixed
    note: 2차 신규. 단일값 20260822 (1,208건). 답변 시 "2026-08-22 기준" 병기.
  pd_dvid_prc_base_dt:
    korean_name: 분배가격기준일
    missing_reason: mixed
    note: 2차 신규. 20260820 이 1,161건, 나머지 31종 소수. 기준일 이질 시 답변에 병기.
  pd_dvid_inc_dist:
    korean_name: 분배소득구분
    missing_reason: missing
    answer_policy: "'데이터 미제공'."
    note: 2차 신규이지만 100% 결측.

  # ── 추적오차 · 괴리율 (🟢 2차에서 채워짐) ──
  du_chas_errt:
    korean_name: 추적오차율
    missing_reason: mixed
    answer_policy: "🟢 추적오차 질의 가능 — ETF 유효 1,160건(93.9%). `pd_grp_no='ETF' AND du_chas_errt > 0`. ETN 은 0값 422 + NULL 123 = 전부 무의미(구조상 정상)."
    note: "🟢 2026-08-25 2차 정정 — 1차 \"전부 0\" 폐기. ETF: 유효 1,160 · 0값 16 · NULL 59. 기준일 du_chas_errt_base_dt = 20260821."
    unit: percent
  du_diff_rt:
    korean_name: 괴리율
    missing_reason: mixed
    answer_policy: "🟢 괴리율 질의 가능 — ETF 유효 1,131건(91.6%). 음수 정상(시장가 < NAV). 0값 45건은 '괴리 없음'인지 미입력인지 구분 불가 → 정렬에서 제외."
    note: "🟢 2차 정정 — ETF: 유효 1,131 · 0값 45 · NULL 59. ETN 도 360건 유효. 기준일 du_diff_rt_base_dt = 20260821."
    unit: percent
  du_chas_errt_base_dt:
    korean_name: 추적오차기준일
    missing_reason: mixed
    note: 2차 신규. 20260821 대다수, 22종 소수 기준일. NULL 182.
  du_diff_rt_base_dt:
    korean_name: 괴리율기준일
    missing_reason: mixed
    note: 2차 신규. du_chas_errt_base_dt 와 동일 분포.
  du_nav_base_dt:
    korean_name: NAV기준일
    missing_reason: mixed
    note: 2차 신규. 20260821 이 1,534건, 20260723 10 · 20260521 8 등 구식 기준일 소수 → NAV 답변 시 기준일 병기.

  # ── 변동성 (2차 신규 — "변동성 낮은 ETF" 질의 신규 가능) ──
  du_vlty_1y:
    korean_name: 1년변동성
    missing_reason: mixed
    answer_policy: "'변동성 낮은/높은 ETF' 질의 가능 — 유효 1,289건(72.4%). `du_vlty_1y > 0` (0값 20건은 du_er_1y=0 동반·상장 5~15년 된 종목 = 거래정지 집단, 미산출로 배제 — 검수 C). 상장 1년 미만은 NULL."
    note: 2차 신규. NULL 471 · 0값 20 · 범위 0~128. 기준일 du_vlty_base_dt = 20260821 (1,584건).
    unit: percent
  du_vlty_6m:
    korean_name: 6개월변동성
    missing_reason: mixed
    note: 2차 신규. 결측 16.5%.
    unit: percent
  du_vlty_3m:
    korean_name: 3개월변동성
    missing_reason: mixed
    note: 2차 신규. 결측 10.4%.
    unit: percent
  du_vlty_1m:
    korean_name: 1개월변동성
    missing_reason: mixed
    note: 2차 신규. 결측 5.8%.
    unit: percent
  du_vlty_base_dt:
    korean_name: 변동성기준일
    missing_reason: mixed
    note: 2차 신규. 20260821 1,584건 · 49종 소수 기준일.

  # ── 채권형 ETF 지표 (fn_* · 2차 신규 · 채권/혼합 ETF 에만) ──
  fn_average_coupon:
    korean_name: 평균쿠폰
    missing_reason: not_applicable
    answer_policy: "채권 ETF 질의에만 사용 — 유효 199건(채권 122 · 혼합자산 63 · 기타 14). 주식형 ETF 는 개념 자체가 없으므로 '해당 없음'."
    note: "2차 신규. 결측 88.8% 는 자산군상 해당 없음. fn_base_dt = 20260822."
    unit: percent
  fn_effective_maturity:
    korean_name: 실효만기(년)
    missing_reason: not_applicable
    answer_policy: "채권 ETF 만기 질의 가능 — 유효 215건. 'fn_nominal_maturity' 와 값 동일(212종)."
    note: 2차 신규.
  fn_nominal_maturity:
    korean_name: 명목만기(년)
    missing_reason: not_applicable
    note: 2차 신규. fn_effective_maturity 와 동일값 — 중복.
  fn_average_quality:
    korean_name: 평균신용등급(수치)
    missing_reason: not_applicable
    answer_policy: "유효 75건뿐. 스케일 정의 없음(코드북 미제공) → 수치 자체를 답하지 말고 상대 비교('평균 신용품질이 더 높다/낮다')만. ✅ 방향 확정(검수 C): 미국30년국채 ETF 1.0~1.9 · 하이일드 ETF 5.5~5.6 → 낮을수록 우량."
    note: 2차 신규. 스케일 숫자 의미 미확정(답변 배제) · 방향은 실측 확정.
  fn_portfolio_dt:
    korean_name: 포트폴리오기준일
    missing_reason: mixed
    note: 2차 신규. 20260630 683 · 20260331 217 · 20250831 91 등 17종 — ETF 별로 이질. fn_* 답변 시 병기.
  fn_base_dt:
    korean_name: fn지표기준일
