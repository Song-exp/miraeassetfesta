# overseas_etfs — 사람의 판단을 담는 파일
# 기계적 사실은 *.auto.yaml 에 있습니다. 여기엔 판정과 규칙만 씁니다.
# 런타임 가드레일이 이 파일을 읽습니다.
#
# 범위: 2단계(결측 판정 · 컬럼 판단 · 쿼리 규칙).
#   개체·관계 매핑은 4단계(워크샵 후). → docs/eda/overseas_etfs_notes.md §F 참조.
#   ⚠️ 국내ETF(domestic_etfs.yaml)와 비대칭이 큼 — 위험등급·기간수익률 컬럼 자체가 없음.

domain: overseas_etfs

# ── 행의 낟알 (2026-08-18 감사 확정) ──
row_grain:
  구조: 행 = 상품 (pd_itm_no 완전 유일 — 5,646행 = 5,646 distinct)
  evidence_grade: A
  note: >-
    🔴 유일 키는 pd_itm_no **뿐이다.** pd_isin_cd·pd_lipper_id 는 각각 50종이 2개 상품에 걸려
    (예: 같은 ISIN 이 OEUR.K/OEFA.K 두 티커에) 단독 조인 키로 쓰면 안 된다 (columns._identifier_dup).

# ── 컬럼 한글명 49종 (schema_metadata 공란 대체) ──
#   36종: 국내ETF schema Sheet1_Schema 에서 매핑 (공유 컬럼)
#   13종: 해외ETF 전용 — 컬럼명 의미로 직접 확정
# ✅ 검토(이병철/08-21): 13종 자체명명 전부 값 부합 확인 — repl_mthd=Optimized/Swap/Full/Other, isin=US+10자, cik/lipper=숫자ID, trd_ccy=USD, etn/inverse/tracking/match_yn=Y/N, clpr_src=경로문자열, *_base_dt=날짜. du_opr=시가는 [저가,고가] 정합 99.77%(13/5636 경계반올림). 정정 없음.
column_korean_names:
  # 식별자
  pd_itm_no: 상품번호(티커)
  pd_itm_no_ma: 상품번호_미래에셋
  pd_isin_cd: ISIN코드                 # 해외전용
  pd_lipper_id: Lipper식별자           # 해외전용(글로벌 펀드평가사)
  pd_us_cik: 미국SEC등록번호(CIK)      # 해외전용
  pd_nm: 상품명
  pd_abrv_nm: 상품약어명
  # 분류·속성
  pd_grp_no: 상품군종류
  wu_inv_ast_type: 투자자산군
  wu_inv_rgn: 투자지역
  wu_core_yn: 핵심ETF여부
  cu_strtegy: 운용전략
  cu_lev_fector: 배수
  cu_base_index: 기초지수
  cu_etn_yn: ETN여부                   # 해외전용
  cu_inverse_short_yn: 인버스/숏여부   # 해외전용
  cu_index_repl_mthd: 지수복제방법     # 해외전용(Optimized/Swap/Full)
  cu_index_tracking_yn: 지수추종여부   # 해외전용
  # 운용사·보수
  cu_fund_mgmt_co: 운용사
  cu_charge_rt: 총보수요율
  # 시장·통화
  pd_exg_mkt_cd: 거래소코드
  pd_mkt_id: 상품거래시장코드
  pd_curr_cd: 상품통화코드
  pd_trd_ccy: 거래통화                 # 해외전용(전부 USD)
  # 가격·시세
  du_clpr: 종가
  du_clpr_base_dt: 종가기준일          # 해외전용
  du_clpr_src: 종가출처                # 해외전용
  du_opr: 시가                         # 해외전용(국내는 du_lpr)
  du_hpr: 고가
  du_lpr: 저가
  du_bpr: 기준가
  du_last_nav: 최종NAV
  du_nav_base_dt: NAV기준일            # 해외전용
  du_base_dt_match_yn: 기준일일치여부  # 해외전용
  ru_mkt_price: 현재가
  pd_lst_price: 상품액면가
  # 규모·거래
  du_last_aum: 최종AUM(순자산총액)
  du_val_1d: 일거래대금
  du_vol_1d: 일거래량
  ru_mkt_volume: 거래량
  pd_lst_stk_cnt: 상품상장주식수
  # 수익률·기타
  du_er_1d: 수익률_1D
  du_diff_rt: 괴리율
  # 상태·일자
  pd_sale_yn: 상품판매여부
  pd_tr_yn: 상품거래정지여부
  pd_lstg_dt: 상품거래가능일자(상장일)
  cu_upt_dt: 변동갱신일자
  du_upt_dt: 일간갱신일자
  wu_upt_dt: 주간갱신일자

columns:
  # ── 없는 컬럼 = 대량 "데이터 미제공" (국내ETF엔 있으나 해외엔 부재) ──
  _absent_columns:
    korean_name: 국내ETF엔 있으나 해외ETF엔 없는 컬럼
    answer_policy: "위험등급·1년/YTD/기간수익률 질의는 해외ETF 대상 시 '데이터 미제공' 명시. 국내ETF로 유도하거나 확인 불가 안내."
    note: "pd_risk_nm·pd_risk_cd(위험등급), du_er_1y·du_er_ytd·du_er_1m/3m/6m(기간수익률) 컬럼 자체가 스키마에 없음. du_er_1d 는 있으나 전부 0."

  # ── 상장시장 (101·102 세부코드) ──
  pd_exg_mkt_cd:
    korean_name: 거래소코드
    missing_reason: present
    answer_policy: "AMX/NAS/NYS는 미국 주요 3시장. 101·102는 미국 소형/신규 상장 세부코드로 취급(전부 pd_mkt_id='US')."
    note: "AMX 4,241 / NAS 1,296 / NYS 78 / 102 22 / 101 9. 101·102(31건)는 교차대조상 미국 소형·신규 상장 ETF(티커 접미어 .O/.K). 정확한 시장명은 코드북④ 대상이나 영향 작음."
    value_semantics:
      AMX: NYSE Arca (미국)                # 🔴 2026-08-20 정정 — 코드북 market.csv 검증(VOO·SPY·IVV 전부 NYSE Arca 상장, 커밋 e7c609b)이 yaml 에 미전파돼 있었음. 'NYSE American' 은 AMEX 오독의 잔재
      NAS: NASDAQ (미국)
      NYS: NYSE (미국)
      "101": 미국 소형/신규 상장(세부, 9건)
      "102": 미국 소형/신규 상장(세부, 22건)
    # ✅ 검토(이병철/08-21): AMX=NYSE Arca 정정 재확인 — VOO·SPY·IVV(전부 실세계 NYSE Arca 상장) 3건 모두 DB에서 AMX. 정정 타당, yaml 전파 확인.

  # ── 기초지수 (센티넬) ──
  cu_base_index:
    korean_name: 기초지수
    missing_reason: missing
    answer_policy: "기초지수 질의는 센티넬 제외 후 유효 2,933건(51.9%) 한정 + 모수 명시."
    trap: "센티넬 문자열 — 'Index is not provided by Management Company' 1,984건 + 'Index is not available on Lipper Database' 721건. IS NULL 로는 안 잡힘."
    note: distinct 1,733종으로 보이나 절반이 센티넬. 실질 수록 2,933건(51.9%).

  # ── 수익률 (1일만, 전부 0) ──
  du_er_1d:
    korean_name: 1일수익률
    missing_reason: missing
    answer_policy: "'데이터 미제공'. 해외ETF는 유일한 수익률 컬럼(du_er_1d)이 전부 0. 수익률 질의 답변 불가."
    note: 유효 5,388건 전부 0. 기간수익률 컬럼은 아예 없음.
    unit: percent

  # ── 총보수 (국내와 대조 — 깨끗) ──
  cu_charge_rt:
    korean_name: 총보수요율
    missing_reason: present
    answer_policy: "결측 0% — 보수 질의에 신뢰도 높게 답변 가능. 0값 363건(레버리지/인버스/ETN 위주)만 개별 주의."
    note: "국내ETF와 정반대. 중앙값 0.49%, max 2.50%. 0값 363건 중 ETN 51건. 단위 USD 기준 아님(요율 %)."
    unit: percent

  du_last_aum:
    korean_name: 최종AUM
    missing_reason: present
    answer_policy: "AUM 질의 답변 가능(결측 3.3%). 단위 USD. 국내ETF(KRW)와 통합 정렬 금지 — 7/11 환율(코드북⑤) 확정 전까지 상품군별로 분리 제시."
    note: "단위 USD 확정 (VOO $995B·SPY $783B 실제값 대조 + pd_trd_ccy 전부 USD). 국내ETF는 KRW라 숫자 직접 비교 시 순위 역전(함정②)."
    unit: usd
    layer:
      scale: USD (달러)
      cross_sort: "국내ETF du_last_aum(KRW)와 나란히 정렬 불가. VOO $995B > KODEX200 28.4조원(≈$200억)인데 숫자만 보면 KODEX가 28배 커 보임."

  # ── 실시간 (국내와 달리 채워짐) ──
  ru_mkt_price:
    korean_name: 현재가
    missing_reason: present
    answer_policy: "결측 0.2% — 종가로 백필된 값. 참고용."
    note: 국내ETF는 100% 결측이나 해외는 종가(du_clpr)로 채워짐.

  # ── 100%/고결측 ──
  cu_lev_fector:
    korean_name: 레버리지배수
    missing_reason: missing
    answer_policy: "레버리지/인버스 판별은 cu_inverse_short_yn='Y'(171건) + 상품명(Ultra/2X/Bull/Bear)으로 대체. cu_lev_fector 는 100% 결측이라 못 씀."
    note: 100% 결측. 국내ETF는 유효했으나 해외는 전무.
  du_diff_rt:
    korean_name: 괴리율
    missing_reason: missing
    answer_policy: "'데이터 미제공'."
    note: 99.9% 결측.
  du_last_nav:
    korean_name: 최종NAV
    missing_reason: missing
    answer_policy: "NAV 질의는 유효 약 12%만. 모수 명시."
    note: 87.9% 결측.

  # ── 식별자 중복 (2026-08-18 감사 신설) ──
  _identifier_dup:
    korean_name: ISIN·Lipper 중복 주의
    evidence_grade: A
    trap: >-
      🔴 pd_isin_cd 중복 50종 · pd_lipper_id 중복 50종 (각각 한 값이 2개 상품).
      "해외가 식별자가 낫다(ISIN/Lipper/CIK)" 는 결측률 이야기이지 유일성 이야기가 아니다.
    answer_policy: >-
      ISIN·Lipper 로 조인·단건 조회 시 2건이 나올 수 있다 — pd_itm_no 를 기본 키로 쓰고,
      ISIN 검색 결과가 복수면 티커를 병기해 모두 제시할 것.
    applies_to:
    - pd_isin_cd
    - pd_lipper_id

  # ── 핵심ETF여부 (2026-08-18 감사 신설 — 사용 불가) ──
  wu_core_yn:
    korean_name: 핵심ETF여부
    missing_reason: missing
    answer_policy: "🔴 '핵심 ETF' 질의에 이 컬럼 사용 금지 — 98.2% 결측에 유효값이 전부 'N'(Y 는 0건)이라 판별 정보가 없다. '데이터 미제공'."
    note: 유효 103건 전부 'N'. 컬럼명과 달리 핵심 여부를 담고 있지 않다.

  # ── 상장일 위장결측 (2026-08-20 신설 — NEXT_STEPS §4.2 기록 지시 이행) ──
  pd_lstg_dt:
    korean_name: 상품거래가능일자(상장일)
    missing_reason: mixed
    trap: "'00000000' 8건 — 선행 0 손실이 아니라 날짜 위장결측. IS NULL 로 안 잡히고 상장일 정렬 시 최솟값(1900년대처럼) 으로 밀려 올라옴."
    answer_policy: "상장일 필터·정렬 시 pd_lstg_dt != '00000000' 제외. 해당 8건은 '상장일이 수록되어 있지 않습니다'로 답변."
    # ✅ 검토(이병철/08-21): 재확인 일치 — pd_lstg_dt='00000000' 정확히 8건. 위장결측(IS NULL 미포착) 판정 타당.

  # ── 거래대금·거래량 0값 (2026-08-18 감사 신설) ──
  du_val_1d:
    korean_name: 일거래대금
    missing_reason: present
    answer_policy: "거래대금·거래량 Top-N 시 0값 187건(미거래 상품, du_val=du_vol 동시 0) 제외 여부를 모수와 함께 밝힐 것."
    note: 0값 187건은 du_vol_1d 와 정확히 동일 상품 — 당일 미거래로 해석. 결측 0.2%.
    applies_to:
    - du_val_1d
    - du_vol_1d

  # ── 운용사 (영문) ──
  cu_fund_mgmt_co:
    korean_name: 운용사
    missing_reason: present
    trap: "영문 372종(BlackRock Fund Advisors 등). 국내ETF(한글 약칭)와 표기 체계 완전히 다름 → 교차질의 매핑 필요."
    answer_policy: 운용사 질의는 영문 기준. 국내 운용사명과 매핑은 워크샵 결정(§F-2).
    note: BlackRock 497·First Trust 316·Tidal 298. 결측 0.1%.

# ── ETF/ETN 구분 ──
product_group:
  column: pd_grp_no
  values:
    ETF: 5587
    ETN: 59
  secondary: cu_etn_yn='Y' (59건), cu_inverse_short_yn='Y' (171건, 인버스/숏)
  note: "ETN 1.0%로 국내(30.7%)보다 경미. ETF 전용 질의는 pd_grp_no='ETF'."

# ── 정규화 ──
normalization:
  trim_columns:
  - pd_nm
  - pd_abrv_nm
  - cu_fund_mgmt_co
  - cu_base_index
  - wu_inv_ast_type
  - wu_inv_rgn
  language_note: "자산군·지역이 영문. 국내ETF(한글)와 교차 시 매핑 테이블 필요 (주식↔Equity, 미국↔United States of America). → 워크샵 §F-2."

# ── 정보량 0 컬럼 (2026-08-18 감사 신설 — 필터·답변 축으로 쓰지 말 것) ──
constant_columns:
  _note: distinct 1 (유효분 기준). 필터로 쓰면 항상 전량 또는 0건.
  pd_sale_yn: "전부 1(판매중) — 국내ETF 와 달리 판매완료 0건. '판매중만' 규칙이 해외에선 no-op"
  pd_tr_yn: "전부 0(거래정상) — '거래정상' 규칙도 no-op"
  pd_trd_ccy: "전부 USD"
  pd_mkt_id: "전부 US"
  du_er_1d: "유효 5,388건 전부 0 (columns.du_er_1d)"
  du_base_dt_match_yn: "전부 N"
  du_clpr_src: "전부 pd65n101.tday_clpr (출처 상수)"
  cu_index_tracking_yn: "유효 2,360건 전부 Y — 추종/비추종 판별 정보 없음 (결측 58.2%)"

# ── 쿼리 가드레일 ──
query_rules:
  ETF만: pd_grp_no = 'ETF'
  ETN만: pd_grp_no = 'ETN'
  기초지수유효: "cu_base_index NOT LIKE '%not provided%' AND cu_base_index NOT LIKE '%not available%'"
  인버스숏: cu_inverse_short_yn = 'Y'
  판매중만: pd_sale_yn = '1'     # ⚠️ 해외는 전부 판매중이라 no-op (constant_columns) — 국내와의 대칭 유지용
  거래정상: pd_tr_yn = '0'       # ⚠️ 동일 — no-op

# ── 국내ETF 대비 비대칭 요약 (교차질의 주의) ──
domestic_asymmetry:
  해외에_없는_것: [위험등급, 기간수익률(1일제외), axis정답축]
  해외가_나은_것: [총보수(결측0%), AUM(결측3.3%), 식별자(ISIN/Lipper/CIK)]
  언어차이: 자산군·지역 영문 (국내는 한글)
  지역입도: 59종 국가단위 (국내는 11종 대분류)
