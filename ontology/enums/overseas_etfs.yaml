# ─────────────────────────────────────────────────────────────────────────────
# 답변 생성 규약 — loader.answer_context() 가 답변 단계에 싣는다.
# 🔴 국내ETF 와 비대칭이 심하다. 국내 규칙을 그대로 옮겨 말하면 대부분 틀린다.
answer_rules:
  - 🔴 최우선 — 조회 결과에 없는 상품명·수치·날짜를 만들지 않는다(환각 = 대회 최대 감점). 칸이 비어 있으면 '수록되지 않음' 이라 말한다.
  - '🔴 기간 수익률이 없다. 해외ETF 수익률 컬럼은 `du_er_1d`(1일) **하나뿐**이고 국내에 있는 1m·3m·6m·ytd·1y 가 전부 없다. ''1년 수익률 좋은 미국 ETF'' 같은 질의에는 ''이 데이터셋에는 해외ETF 의 기간 수익률이 수록되지 않았습니다(1일 수익률만 제공)'' 로 답한다. 1일 수익률로 순위를 매겨 ''수익률 상위'' 라 말하지 않는다. 주최 답변 OQ-2 로 ''해외 ETF 는 제외해도 무방'' 확정.'
  - '🔴 위험등급 컬럼이 없다. 국내의 `pd_risk_nm`(1~6등급) 에 해당하는 것이 해외에는 없으므로 ''안전한 해외 ETF'' 를 등급으로 답할 수 없다. 자산군(wu_inv_ast_type)·레버리지 여부로 답하되 **무엇을 기준으로 골랐는지 반드시 밝힌다.**'
  - '총보수(cu_charge_rt)는 유효 5,618 / 6,037(93%)로 국내(67건, 3.8%)와 정반대다. 해외는 총보수를 정상적으로 말해도 된다 — 국내용 ''수록되지 않음'' 문구를 그대로 쓰지 않는다. 결측 419건만 미수록으로 말한다.'
  - '🔴 레버리지 배수(`cu_lev_fector`)가 5,136/6,037(85%) 결측이다. 값이 있는 901건은 부호가 정상이라 믿을 수 있으나(2.0 677 · -2.0 92 · 3.0 60 · -3.0 34), 결측 행을 ''레버리지 아님'' 으로 말하면 안 된다. 이름의 `2X`·`3X`·`Ultra` 를 함께 본다.'
  - '인버스·숏 판정은 `cu_inverse_short_yn` 플래그가 정본이다(국내와 달리 정상 작동). 다만 이름만으로 걸리는 5건이 있으므로 query_rules.인버스숏 조건을 그대로 쓴다. `UltraShort + Bond/Treasury` 는 방향이 아니라 **만기가 짧다**는 뜻이고, `BullBear`(WBI 3종)는 양방향이 아니라 **하락장 방어형 롱 펀드**다 — 둘 다 인버스라 말하지 않는다.'
  - '`Daily` 가 이름에 있으면(688건) 일간 재조정 상품이다. ''N배 수익'' 이 아니라 **하루 단위** 배수이며 장기 보유 시 복리 이탈이 생긴다는 점을 한 줄 덧붙인다.'
  - '🔴 구성종목을 말할 때 ISIN 으로 붙인 결과를 쓰지 않는다. `ext_ovs_etf_holdings.isin` 은 **그 ETF 자신의 ISIN** 이라 조인하면 남의 종목이 붙는다 — 실측 오배정 8건(FILL.K 가 POWR 의 구성종목 69행을 받았고 SPDR S&P500 도 포함). 티커 조인만 쓴다(query_rules.ISIN조인금지).'
  - '기준일을 병기한다. 종가 기준일(du_clpr_base_dt)이 상품마다 다르다 — 2026-08-21 이 5,687건이지만 **313건은 8월 이전**이고 가장 오래된 것은 2025-07-28 이다. 오래된 행은 그 날짜를 그대로 말하고 최신 시세처럼 말하지 않는다.'
  - 상품명은 키가 아니다 — 중복 28건이 있다. 상품을 특정할 때는 종목코드(pd_itm_no)를 함께 적는다. ISIN 도 키가 아니다(6,037행 vs distinct 5,962 · NULL 12).
  - '통화는 사실상 전부 USD 다(6,025 / INR 1건 · 결측 11). 금액을 말할 때 달러임을 밝히고, 국내ETF(원화)와 한 표에 섞어 크기를 비교하지 않는다. 유일한 INR 상품 `TBF`(Tata Aggressive Hybrid)는 인도 루피 표시다.'
  - '해외ETF 테이블에도 ETN 65건이 섞여 있다(pd_grp_no). ''ETF'' 를 물었으면 5,972건만으로 답한다. 🔴 이름의 `ETN` 으로 세지 말 것 — 부분일치 71건 중 12건이 오탐이다.'
  - '운용전략을 말할 때 `cu_strtegy` 를 범주로 쓰지 않는다. 국내는 4개짜리 범주값이지만 해외는 **고유값 5,943개의 자유서술 영문 산문**(펀드 운용목표 문장)이다. 인용할 거면 요약해서 말하고, ''전략 = 액티브'' 같은 분류로 쓰지 않는다.'
  - '🔴 영문 약어를 부분일치로 세어 답하지 않는다. ''AI ETF 몇 개'' 에 865 라고 답하면 811건이 오탐이다(Ch**ai**nlink·D**ai**ly). 정답은 54건이다. `TR` 은 1,593 중 14건만 진짜다. query_rules.단어경계_필수 형식을 쓴다.'
  - '한글로 물어도 상품명은 전부 영문이다(한글 0 / 6,037). 상품명을 한글로 번역해 말하지 말고 원문 그대로 적되, 필요하면 괄호로 뜻을 덧붙인다.'
  - 추천·랭킹 답변은 기본 5개, 질문에 개수가 있으면 그 개수까지. 정렬 기준(순자산 큰 순 등)을 한 마디 밝힌다. 조회 결과에 없는 상품을 예로 들지 않는다.
  - '`레버리지`·`인버스`(cu_lev_fector 결측이면 이름의 2X·3X·Ultra·Bear·Short) 상품이 답변 목록에 있으면 붙인다: ''레버리지·인버스 상품은 일간 수익률을 배수로 추종해 장기 보유 시 지수 등락률과 크게 달라질 수 있습니다.'' 조건이 아니면 붙이지 않는다. 서버 실측 2026-09-01: "미국 반도체 ETF" 답변에 SOXL(3x)·SOXS(-3x)·TSXU·TSXD·XSEM(2x)·USD(2x) 가 섞였는데 문구가 없었다.'
  - '보수 수치에 ''높은''·''낮은'' 같은 판단을 붙이지 않는다 — 수치를 그대로 말한다. 서버 실측 2026-09-01: 0.99% 를 근거 없이 ''높은 보수'' 라고 단정했다.'
  - '🔴 `pd_us_cik` 는 SEC 등록번호(CIK)다 — 시가총액·규모·금액으로 말하지 않는다. 서버 실측 2026-09-01: VOO 의 CIK 36405 가 "시가총액 36405백만 달러" 로 나갔다(실제 순자산 약 9,973억 달러). 규모는 du_last_aum 만 쓴다.'
  - '해외ETF 에 **추적오차 컬럼은 없다.** du_er_1d 는 1일 수익률이고 du_diff_rt 는 종가-NAV 괴리율이다 — 어느 쪽도 추적오차로 말하지 않는다. 추적오차를 물으면 "수록되어 있지 않습니다". 서버 실측 2026-09-01: du_er_1d 0.39 가 "추적오차 0.39%" 로 나갔다.'
  - '수치는 조회 값 **그대로** 옮긴다 — 자릿수·단위를 임의로 바꾸지 않는다. 서버 실측 2026-09-01: 거래량 10,712,821 이 "107,128,210 주" 로 10배 커졌다. 날짜(pd_lstg_dt=설정일)는 YYYY-MM-DD 로 읽어 말하되 **조회에 없는 날짜를 만들지 않는다** — 설정일 2000-04-30 창작 실측.'

