# ── 상수 컬럼 위반 게이트 (2026-08-30 R-5 ① 층 · src/runtime/gate.py ④) ──
# 이 테이블 하나로 라우팅됐을 때, triggers(정규식) 가 질문에 있으면 HCX 호출 0회로 기각한다.
# 🔴 경계식 필수 — '유로스탁스50' 은 지수명이지 통화가 아니다. gold ETF-O-015·016 이 이 게이트의 회귀다.
gate_constants:
- column: pd_trd_ccy
  value: USD
  triggers:
  - '\bEUR\b'
  - '유로(?!스탁|존|피안)\s*(?:\(EUR\))?\s*(?:로|화로|표시로)?\s*(?:거래|결제|표시|매매)'
  - '\bJPY\b'
  - '엔화?\s*(?:로|표시)?\s*(?:거래|결제)'
  - '원화\s*(?:로|표시)?\s*(?:거래|결제)'
  - '\bKRW\b'
  - '위안\s*(?:로|화로)?\s*(?:거래|결제)'
  answer: "해외 ETF 마스터의 거래통화(pd_trd_ccy)는 전부 USD 입니다. USD 이외 통화로 거래되는 해외 ETF 는 수록되어 있지 않습니다."
- column: pd_mkt_id
  value: US
  triggers:
  - '한국\s*거래소'
  - '\bKRX\b'
  - '(?:코스피|코스닥|국내)\s*(?:시장\s*)?(?:에\s*)?상장'
  - '(?:런던|도쿄|홍콩|프랑크푸르트|파리|상하이|유럽)\s*(?:증권)?\s*거래소'
  answer: "해외 ETF 마스터는 전부 미국 시장(AMX·NAS·NYS) 상장 상품입니다. 다른 거래소에 상장된 해외 ETF 는 수록되어 있지 않습니다."

# ── 쿼리 가드레일 ──
query_rules:
  ETF만: pd_grp_no = 'ETF'
  ETN만: pd_grp_no = 'ETN'
  기초지수유효: "cu_base_index NOT LIKE '%not provided%' AND cu_base_index NOT LIKE '%not available%'"
  보수유효: >-
    cu_charge_rt > 0
    총보수 **정렬·필터·Top-N**('수수료 저렴한 해외 ETF' 등)에만 반드시 넣는다.
    0값 419건(레버리지/인버스/ETN 위주)은 '보수 0' 이 아니라 미수록 — 없으면 0값 행들이
    '가장 저렴' 으로 도배된다(2026-08-31 paired 실측 ETF-O-020). 모수 명시.
    🔴 **보수를 묻지 않은 질의에는 걸지 않는다.** 서버 실측 2026-09-01 —
    "미국 반도체 ETF 알려줘" 에 이 조건이 붙어 SSG(ProShares UltraShort Semiconductors,
    보수 미수록)가 목록에서 **말없이 빠졌다**(18→17건). 미수록은 제외 사유가 아니라
    "보수 미수록" 으로 표기할 사유다. cu_fund_mgmt_co 존재 조건도 같다 — 묻지 않았으면 걸지 않는다.
    형식(보수 Top-N): `SELECT TRIM(pd_abrv_nm) AS 티커, pd_nm AS 상품명, cu_charge_rt AS 연간보수율pct
    FROM overseas_etfs WHERE pd_grp_no='ETF' AND cu_charge_rt > 0 ORDER BY cu_charge_rt ASC, du_last_aum DESC LIMIT <N+여유>`
    🔴 **동률을 자르지 않는다** — 최저 0.01% 가 **6개 동률**인데 LIMIT 5 로 자르면 1개(VEXC,
    Vanguard EM Ex-China)가 말없이 빠진다(서버 실측 2026-09-01). N개를 물어도 N위와 동률인 행은
    모두 싣고 동률임을 밝히거나, 최소한 "0.01% 동률이 6개" 라고 말한다. 2차 정렬(du_last_aum DESC)로
    동률 내 순서를 고정해 재현 가능하게 한다.
    답변에 **모수를 밝힌다** — "연간보수율이 수록된 ETF 5,604개 중"(실측 2026-09-01).
  ISIN조인금지:
    triggers: [ISIN, 편입, 보유, 담은, 담고, 구성, 포함, 들어]
    text: >-
      🔴 pd_isin_cd·pd_lipper_id 는 단독 조인·단건 조회 키로 쓰지 않는다 — 각각 63종이 2개 상품에 걸린다(같은 ISIN 이 OEUR.K/OEFA.K 둘 다).
      조인·단건 조회 키는 pd_itm_no. ISIN 검색 결과가 복수면 티커를 병기해 모두 제시한다. (리드 확답 2026-08-31, B-3)
  # 🆕 2026-08-31 리드 확답(ask_lead §3) — "○○ 담은 상품" 질의에 같은 발행사의 **회사채**가 섞여 나올 수 있다.
  #    ㉡ closure 확장으로 Sec_lei_* 법인 노드 아래 주식·채권이 함께 매달린다
  #    (예: NVIDIA — 주식 Sec_o_67066G104 · 회사채 Sec_o_67066GAF1, CUSIP 발행사부(6자리)가 같다).
  #    회의 공통 패턴("빼지 않고 알린다")대로 **제외하지 않는다** — 발행사 기준으로는 맞는 답이다.
  #    대신 결과에 채권이 섞이면 답변에 밝힌다: "이 중 N건은 ○○ 주식이 아니라 ○○가 발행한 채권을 담은 상품입니다."
  #    판별: ext_ovs_etf_holdings 에서 CUSIP 9자리 중 발행사부(앞 6자)가 같고 발행물부(7~8자)가 다르면 별개 증권이며,
  #          holding_name 에 만기·이율 표기(예: 'NVIDIA Corp 3.5% 2040')가 있으면 채권이다.
  종목질의_회사채포함:
    triggers: [편입, 보유, 담은, 담고, 구성, 포함, 들어, 채권]
    text: "발행사(Sec_lei_*·Sec_m_*) 후손 확장 결과에 채권이 섞이면 제외하지 말고 답변에 밝힌다"
  # 🔴 2026-08-27 C절 검토 — 플래그만 믿으면 인버스를 놓친다.
  #    실측: cu_inverse_short_yn 이 NULL 인데 cu_lev_fector < 0 (인버스 확정) 3건
  #          — SSPC·SKDD·SPCQ (전부 배수 -2.0, 이름도 '2X Short').
  #          이름에 'Inverse'/'2X Short' 인데 플래그 없는 것 5건 추가.
  #    → 플래그 OR 음수배수 OR 상품명 병행. 183 → 191건 (기존 Y 183 누락 0 · 오탐 0 검증).
  #    ⚠️ 오탐 제외 필수 — 이름에 Short/Bear 가 들어가도 인버스가 아닌 것들이다.
  #       · 'Short Duration/Term/Trm' · 'UltraShort + Income/Bond/Treasury/Municipal/Fixed'
  #         → 여기서 Short 는 방향이 아니라 **만기가 짧다**(초단기 채권)는 뜻.
  #       · 'BullBear' (WBI BullBear 3종 — WBIF·WBIG·WBIL)
  #         → 양방향이 아니라 **하락장 방어 기능을 얹은 상승 추종 액티브 주식펀드**.
  #           근거: 셋 다 wu_inv_ast_type='Equity' · cu_strtegy 원문 "invests at least 80% of its
  #           net assets in the equity securities ... while also seeking to protect principal
  #           during unfavorable market conditions" · cu_lev_fector 전부 NULL.
  인버스숏: >-
    cu_inverse_short_yn = 'Y' OR cu_lev_fector < 0
    OR pd_nm LIKE '%Inverse%' OR pd_nm LIKE '%X Short %' OR pd_nm LIKE '%Daily Short%'
    OR (pd_nm LIKE '%Bear%' AND pd_nm NOT LIKE '%BullBear%')
    OR (pd_nm LIKE '%UltraShort%' AND pd_nm NOT LIKE '%Income%' AND pd_nm NOT LIKE '%Bond%'
        AND pd_nm NOT LIKE '%Treasury%' AND pd_nm NOT LIKE '%Municipal%' AND pd_nm NOT LIKE '%Fixed%')
    🔴 이 조건을 **통째로** 쓴다 — `cu_inverse_short_yn='Y'` 하나로 줄이면 **8건을 놓친다**
    (실측 183 vs 191 · 2026-09-01): QBER·SNK·METQ·VYLD·YQQQ·SSPC·SKDD·SPCQ —
    플래그가 비었는데 배수가 음수이거나 이름이 '2X Short'·'Inverse' 인 진짜 인버스들이다.
    서버 실측 2026-09-01 — "해외 인버스 ETF 3개" 가 플래그만 걸었다.
    (이 경고는 원래 yaml 주석에 있었다 — 주석은 프롬프트에 실리지 않아 플래너가 못 봤다. 본문으로 승격.)
    🔴 질문이 "인버스 **ETF**" 면 `AND pd_grp_no = 'ETF'` 를 함께 건다 —
    플래그 'Y' 인 183건 중 **ETN 이 17건** 섞여 있다(국내 인버스와 같은 함정).
    ⚠️ UltraShort 예외를 빼면 오탐 103건 — 'UltraShort Bond/Treasury' 는 방향이 아니라 만기가 짧다는 뜻이고,
    BullBear(WBI 3종)는 하락장 방어형 롱 펀드다.
  레버리지:
    triggers: [레버리지, 2X, 3X, 2배, 3배, Ultra, 배수, 따블, 더블]
    text: >-
      cu_lev_fector IS NOT NULL AND ABS(cu_lev_fector) <> 1
      🔴 NULL 5,136건(85%)은 '미수록' 이지 **1배 확정이 아니다** — 결측 행을 '레버리지 아님' 으로
      말하지 않는다(이름의 2X·3X·Ultra 를 함께 본다).
      이 조건에 걸리는 상품은 **빼지 않는다** — 살 수 있는 정상 상품이고 배수는 사실이다.
      결과에 인버스가 섞이면 레버리지_인버스혼입경고 대로 답변에 밝힌다.
  # 🆕 2026-08-29 회의 결정 — 공통 패턴 "살 수 없는 건 제외, 살 수는 있는데 위험한 건 알린다".
  #    `레버리지` 901건 중 **131건(14%)이 인버스**다(EDZ -3.0 · SRTY.K -3.0 등).
  #    "레버리지 ETF 알려줘" 에 하락 베팅 상품이 섞여 나간다.
  #    🔴 빼지 않는다 — 인버스도 살 수 있는 정상 상품이고 배수는 사실이다.
  #    대신 답변에 인버스가 포함되면 밝힌다 —
  #    "이 중 N건은 지수가 **내릴 때** 수익이 나는 인버스 상품입니다. 방향이 반대이니 확인하세요."
  #    국내(domestic_etfs.레버리지_인버스혼입경고)와 같은 방침. 부호 소실은 국내만의 문제다(해외는 부호 정상).
  레버리지_인버스혼입경고: >-
    cu_lev_fector IS NOT NULL AND ABS(cu_lev_fector) <> 1
    AND (cu_inverse_short_yn = 'Y' OR cu_lev_fector < 0
         OR pd_nm LIKE '%Inverse%' OR pd_nm LIKE '%X Short %' OR pd_nm LIKE '%Daily Short%'
         OR (pd_nm LIKE '%Bear%' AND pd_nm NOT LIKE '%BullBear%'))
  상장일유효: pd_lstg_dt <> 0
  판매중만: pd_sale_yn = 1       # ⚠️ 해외는 유효분 전부 판매중이라 no-op (constant_columns) — 국내와의 대칭 유지용
  거래정상: pd_tr_yn = 0         # ⚠️ 동일 — no-op
  # (a) 구매가능 — 주최 공지(8/24): 상장폐지·리스팅종료 외 전 종목 "구매가능" 가정.
  #     해외ETF 마스터엔 상폐 컬럼이 없고 수록 = 현재 리스팅 (1차 대비 소멸 20건이 곧 상폐분) → 수록 전건 구매가능.
  구매가능: >-
    1 = 1
    해외ETF 는 상장폐지 필터 컬럼이 없고 유효분 전부 판매중이라 조건이 없다(1=1).
    구매 가능 여부를 물으면 "마스터에 수록된 종목 = 구매 가능(주최 기준)" 으로 답한다.
  # (b) 0/결측 — 주최 공지: 0·결측은 의도된 값 → 조회 시 빼거나 "없다" 응답.
  #     수치 정렬·필터 기본은 `col IS NOT NULL AND col <> 0`. 예외(0 이 실제값)는 아래 zero_is_value 컬럼만.
  수치정렬기본: "{col} IS NOT NULL AND {col} <> 0"
  # 🔴 2026-08-26 — zero_is_value 예외 전량 해제. 주최 답변: "수익률·총보수 같은 컬럼을 질의했을 때
  #     그 컬럼의 값이 0 인 행들은 아예 포함하지 않는 게 맞다 (값이 0 이니 당연히 기준이 없음)".
  #     du_er_1d(125) · du_vol_1d(91) · du_val_1d(91) 의 0 은 '보합·미거래' 라는 관측 사실이지만
  #     랭킹·필터 축으로는 쓰지 않는다. 개별 조회 시에만 사실대로 서술 가능.
  zero_is_value: {}             # 예외 없음
  zero_is_missing:              # 0 = 미수록 → 정렬·필터 제외 + "수록 없음" 응답
    cu_charge_rt: 419건 (레버리지/인버스/ETN 위주 — 보수 0 아님)
    du_last_aum: 11건
    pd_lstg_dt: 11건 (날짜 위장결측)
  # (c) 환율 — du_last_aum 은 USD. 국내ETF(KRW)·펀드(KRW) 와 통합 정렬 시
  #     ontology/codebooks/fx_rate.csv (8/21 기준으로 교체 예정) 로 환산해 단위·환율·기준일을 답변에 명시.
  #     환산 미적용이면 통합 정렬 금지 — 상품군별 분리 제시.
  통합정렬환율:
    triggers: [원화, 환율, 통합, 함께, 국내, 비교, 합쳐]
    text: >-
      du_last_aum * fx_rate(USD→KRW, fx_rate.csv)
      🔴 국내(원화)와 해외(달러)를 **한 표로 정렬하려면 환산이 선행**돼야 한다 —
      환산을 안 했으면 통합 정렬 금지, 상품군별로 분리해 제시한다.
  단어경계_필수: >-
    🔴 영문 약어를 `LIKE '%AI%'` 로 걸면 안 된다. 실측 오탐이 압도적이다 —
    `AI` 부분일치 865건 중 **811건(94%)이 오탐**이고(Ch**ai**nlink · D**ai**ly · C**a**l**i**fornia 등),
    `US` 는 1,330건 중 **652건(49%)이 오탐**이다(Pl**us** · Tr**us**t · Foc**us** 등).
    SQLite 에는 정규식 `\b` 가 없으므로 **구분자를 공백으로 바꾼 뒤 공백으로 감싸** 비교한다:
    `' '||replace(replace(replace(replace(pd_nm,'-',' '),'&',' '),'(',' '),')',' ')||' ' LIKE '% AI %'`
    이 형식은 정규식 단어경계와 **누락 0 · 오탐 0 으로 일치**한다(AI 54건 · US 677건, 2026-08-31 실측).
    3글자 이상(Oil·Gold·Bond 등)은 부분일치로도 오탐이 거의 없어 그대로 써도 된다.
  상품명조회: >-
    🔴 해외는 국내와 정반대다. `pd_abrv_nm` 이 이름이 아니라 **티커**다 —
    6,037건 전건이 `pd_itm_no` 에서 `.K`/`.O` 를 뗀 것과 일치한다(AAUA / AAUA.K).
    약어명이 정식명 안에 든 것은 117/6,037 뿐이라 국내처럼 약어명으로 이름 조회를 하면 안 된다.
    형식 — 티커로 물으면 `TRIM(pd_abrv_nm) = 'VOO'` (또는 pd_itm_no LIKE 'VOO.%')
    · 이름으로 물으면 `pd_nm` 을 쓰되 **공백 제거 후 LIKE** 하고 query_rules.단어경계_필수 를 함께 본다.
    ⚠️ 약어명도 키가 아니다 — 중복 6건.
  개수만_준_질의: >-
    🔴 `LIMIT N` 을 `ORDER BY` 없이 두지 않는다. 축이 문장에 없으면 기본 정렬은
    **순자산 내림차순** `ORDER BY du_last_aum DESC` 이고 답변에 그 기준을 밝힌다(국내와 동일 방침).
    서버 실측 2026-09-01 — "미국 반도체 ETF" 가 `ORDER BY pd_nm ASC`(알파벳)로 나왔다.
    이번엔 17행 전부 실려 무해했지만, 결과가 LIMIT 30 을 넘는 섹터면 **알파벳 앞쪽만 잘려 나간다**.
    ⚠️ du_last_aum 은 결측 11건이 뒤로 밀린다 — Top-N 답변에 한 줄로 밝힌다.
  개별조회_별칭:
    triggers: [정보, 뭐야, 어떤, 알려, 소개, 설명]
    text: >-
      🔴 개별 상품 정보 조회("VOO 정보 알려줘")에 **`SELECT *` 를 쓰지 않는다.**
      49개 컬럼이 암호 같은 원어 이름으로 답변기에 넘어가면 오독한다 — 서버 실측 2026-09-01, VOO 한 답변에서 4건:
      ① `pd_us_cik`(SEC 등록번호) 36405 를 **"시가총액 36405백만 달러"** 로(실제 순자산 du_last_aum ≈ 9,973억 달러)
      ② `du_er_1d`(1일 수익률) 0.39 를 **"추적오차 0.39%"** 로(해외에 추적오차 컬럼은 없다)
      ③ `du_vol_1d` 10,712,821 을 **"107,128,210 주"** 로(자릿수 10배)
      ④ 설정일을 **2000-04-30 으로 창작**(pd_lstg_dt=20100907 인데).
      형식 — 필요한 컬럼만 **AS 한글 별칭**으로:
      `SELECT pd_nm AS 상품명, TRIM(pd_abrv_nm) AS 티커, cu_base_index AS 기초지수,
      NULLIF(cu_charge_rt,0) AS 연간보수율pct, pd_lstg_dt AS 설정일, cu_fund_mgmt_co AS 운용사,
      cu_index_repl_mthd AS 복제방식, du_clpr AS 종가USD, du_vol_1d AS 일거래량주,
      du_last_aum AS 순자산USD, wu_inv_ast_type AS 자산군, wu_inv_rgn AS 투자지역
      FROM overseas_etfs WHERE TRIM(pd_abrv_nm) = '<티커>'`
      별칭이 곧 답변 어휘가 되므로 답변기가 컬럼을 헷갈릴 여지가 없다.

# ── 국내ETF 대비 비대칭 요약 (교차질의 주의) ──
domestic_asymmetry:
  해외에_없는_것: [위험등급, 연/YTD/기간수익률(1일만 있음), axis정답축, 상폐일컬럼]
  해외가_나은_것: [총보수(결측0%), AUM(결측3.4%), 식별자(ISIN/Lipper/CIK), 레버리지부호(국내는 2차에서 소실)]
  언어차이: 자산군·지역 영문 (국내는 한글)
  지역입도: 59종 국가단위 (국내는 11종 대분류)

# ── 외부 구성종목 조인 (2026-08-27 A-3-02·A-4-04 검토 확정) ──
external_join:
  ext_ovs_etf_holdings:
    # 🔴 ISIN 으로 조인하면 **다른 ETF 의 구성종목이 붙는다.**
    #    실증: FILL.K(iShares MSCI Global Energy Producers)를 ISIN 조인하면 69행이 붙는데,
    #          그 69행은 POWR(iShares US Power Infrastructure)의 구성종목이다. 전혀 다른 상품이다.
    #    원인: pd_isin_cd 가 두 상품에 걸린 케이스(A-2-03)에서 외부 데이터는 한쪽 티커만 갖고 있다.
    key: "ext_ovs_etf_holdings.etf_ticker = replace(replace(overseas_etfs.pd_itm_no,'.K',''),'.O','')"
    forbidden_key: "isin = pd_isin_cd   # 사용 금지 — 오배정 8건 확인"
    misassigned_if_isin: [CCMG.K, STXF.K, SIXG.O, GSWO.K, FILL.K, FIBR.K, IEQ, SPLG.K]
    coverage: "티커 조인 1,358 상품 / 마스터 6,037 (22.5%) · 오배정 0"
    caveat: >-
      접미어 제거 후 base 티커가 마스터에 2행인 경우 6건 — **전수 확인 결과 실제 위험 0**.
      실제로 2상품에 붙는 것은 JEMA(544행)·SHV(65행) 둘뿐이고, 둘 다 ISIN·운용사·종가·상장일이
      완전히 같고 거래소만 갈리는 **동일 상품 2회 등록**이라 같은 구성종목이 붙는 게 맞다.
      나머지 4건(JOYT·LVDS·NERD·SMCC)은 외부 데이터에 해당 티커가 **0행**이라 아무것도 붙지 않는다.
      ⚠️ SMCC 는 SMCC.K(Corgi SMCI 2x Daily, Corgi Strategies)와 SMCC.O(Defiance Leveraged Long+Income SMCI,
      Tidal Investments)로 **서로 다른 상품**이지만, 외부 수집분이 0행이라 현재 데이터에서는 배정 문제가 발생하지 않는다.
      향후 외부 데이터에 SMCC 가 들어오면 그때 배정 판단이 필요하다 —
      판단 순서: ① 외부에 티커 존재 여부 ② 구성종목 내용이 어느 상품과 맞는지 ③ seriesId/accession 으로 발행사 역추적.
    report_date: "2025-10-31 ~ 2026-06-30 (8종)"
    answer_policy: >-
      🔴 해외 구성종목 답변에는 **상품별 report_date 를 반드시 병기**한다.
      마스터 기준일(2026-08-22) 대비 **2~10개월 전**이다 — SEC N-PORT 분기공시 주기라 구조적이며 개선 불가.
      국내(1일 전)와 달리 '현재 구성' 으로 단정하면 오답. '최신 시세와 시점이 다르다' 고 밝힌다.
      분포: 2026-04-30(463) · 2026-05-31(404) · 2026-03-31(366) · 2026-06-30(98) · 2026-05-29(20) ·
      2026-01-31(1) · 2025-11-30(2) · 2025-10-31(2).

# ── 역질문 분기 — 되묻기는 답변불가 문항의 정답 형태 중 하나 (주최 확인 8/25) ──
#    국내(domestic_etfs.clarify)와 같은 방침. 여기엔 해외 전용 사례만 둔다.
clarify:
  존재하지_않는_개체:
    원칙: >-
      🔴 정확 일치가 없으면 답하지 않는다. 유사 이름으로 대체 조회해 놓고
      원래 이름으로 답하면 감점이다. 유사 후보는 버리지 말고 **역질문으로 제시**한다.
    답변형태: '"○○ 은(는) 제공 데이터에 없습니다. 혹시 △△ 를 말씀하신 건가요?"'
    실측_사례:
      티커_ZZZZ: >-
        🔴 함정 — `ZZZZ` 는 0건이지만 **`ZZZ.O` 가 실재**한다(Cyber Hornet S&P 500 and Bitcoin 75/25 Strategy ETF · 총보수 0.95%).
        앞자리가 겹친다고 붙이면 안 된다. 티커는 **완전 일치**로만 판정하고,
        유사 후보가 있으면 되묻는다.
      해외_위험등급: >-
        해외ETF 는 위험등급 컬럼 자체가 없다(_absent_columns). "위험등급 N등급인 해외ETF" 는
        등급 범위를 따지기 전에 **컬럼 부재**로 답변 불가 — 국내ETF 로 유도하거나 미제공 안내.
      해외_기간수익률: >-
        du_er_1y·ytd·1m/3m/6m 컬럼이 없다. 주최 답변(OQ-2)으로 "해외 ETF 는 제외해도 무방" 확정.
    금지: 유사도만 보고 티커·상품명을 붙이지 말 것. 접두사 일치는 근거가 아니다.
  다의어:
    안전한: 위험등급 컬럼이 없으므로 국내ETF 기준을 그대로 쓸 수 없다. 자산군·레버리지 여부로 답하되 기준을 밝힌다.
    레버리지: "🔴 배수만 보면 인버스가 섞인다(901건 중 131건). query_rules.레버리지_인버스혼입경고 참조"

