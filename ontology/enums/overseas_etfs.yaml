# ── 정보량 0 컬럼 (2026-08-18 감사 신설 — 필터·답변 축으로 쓰지 말 것) ──
constant_columns:
  _note: distinct 1 (유효분 기준). 필터로 쓰면 항상 전량 또는 0건.
  pd_sale_yn: "유효 6,023건 전부 1(판매중) — 국내ETF 와 달리 판매완료 0건. '판매중만' 규칙이 해외에선 no-op"
  pd_tr_yn: "유효 6,023건 전부 0(거래정상) — '거래정상' 규칙도 no-op"
  pd_trd_ccy: "전부 USD"
  pd_mkt_id: "전부 US"
  du_base_dt_match_yn: "유효분 전부 N — 기준일 일치 정보 없음. 답변에 '기준일 일치 여부' 서술 금지 (✅ 재검증 2026-08-25)"
  pd_lst_price: "6,022/6,037 이 0 — 액면가 정보 없음. '액면가' 질의는 '수록 없음' (✅ 재검증 2026-08-25)"
  du_clpr_src: "유효분 전부 pd65n101.tday_clpr (출처 상수)"
  cu_index_tracking_yn: "유효 2,407건 전부 Y — 추종/비추종 판별 정보 없음 (결측 60.1%)"
  cu_index_repl_mthd: "⚠️ 상수 아님(Optimized 1,826 · Swap 297 · Full 278 · Other 6) 이나 결측 60.1% — 복제방식 질의는 유효 2,407건 한정 + 모수 명시"
  _removed_2026-08-25: "du_er_1d — 1차엔 전부 0 이었으나 2차에서 유효(columns.du_er_1d). 상수 목록에서 제거."

# ── 쿼리 가드레일 ──
query_rules:
  ETF만: pd_grp_no = 'ETF'
  ETN만: pd_grp_no = 'ETN'
  기초지수유효: "cu_base_index NOT LIKE '%not provided%' AND cu_base_index NOT LIKE '%not available%'"
  인버스숏: "cu_inverse_short_yn = 'Y' OR cu_lev_fector < 0"          # 2차: cu_lev_fector 부호 정상(음수 92+34+2건)
  레버리지: "cu_lev_fector IS NOT NULL AND ABS(cu_lev_fector) <> 1"   # NULL 5,136건은 '미수록'이지 1배 확정 아님
  상장일유효: pd_lstg_dt <> 0
  판매중만: pd_sale_yn = 1       # ⚠️ 해외는 유효분 전부 판매중이라 no-op (constant_columns) — 국내와의 대칭 유지용
  거래정상: pd_tr_yn = 0         # ⚠️ 동일 — no-op
  # (a) 구매가능 — 주최 공지(8/24): 상장폐지·리스팅종료 외 전 종목 "구매가능" 가정.
  #     해외ETF 마스터엔 상폐 컬럼이 없고 수록 = 현재 리스팅 (1차 대비 소멸 20건이 곧 상폐분) → 수록 전건 구매가능.
  구매가능: "1 = 1"              # 전건. 구매 가능 여부 질의엔 "마스터에 수록된 종목 = 구매 가능(주최 기준)" 으로 답변
  # (b) 0/결측 — 주최 공지: 0·결측은 의도된 값 → 조회 시 빼거나 "없다" 응답.
  #     수치 정렬·필터 기본은 `col IS NOT NULL AND col <> 0`. 예외(0 이 실제값)는 아래 zero_is_value 컬럼만.
  수치정렬기본: "{col} IS NOT NULL AND {col} <> 0"
  zero_is_value:                # 0 을 결측으로 빼면 안 되는 컬럼 — 정렬·필터에서 0 유지
    du_er_1d: 당일 등락 없음 (125건)
    du_vol_1d: 당일 미거래 (91건, du_val_1d 동시 0)
    du_val_1d: 당일 미거래 (91건)
  zero_is_missing:              # 0 = 미수록 → 정렬·필터 제외 + "수록 없음" 응답
    cu_charge_rt: 419건 (레버리지/인버스/ETN 위주 — 보수 0 아님)
    du_last_aum: 11건
    pd_lstg_dt: 11건 (날짜 위장결측)
  # (c) 환율 — du_last_aum 은 USD. 국내ETF(KRW)·펀드(KRW) 와 통합 정렬 시
  #     ontology/codebooks/fx_rate.csv (8/21 기준으로 교체 예정) 로 환산해 단위·환율·기준일을 답변에 명시.
  #     환산 미적용이면 통합 정렬 금지 — 상품군별 분리 제시.
  통합정렬환율: "du_last_aum * fx_rate(USD→KRW, fx_rate.csv)   # 개념식 — 실제 조인은 코드북 로더 참조"

# ── 국내ETF 대비 비대칭 요약 (교차질의 주의) ──
domestic_asymmetry:
  해외에_없는_것: [위험등급, 연/YTD/기간수익률(1일만 있음), axis정답축, 상폐일컬럼]
  해외가_나은_것: [총보수(결측0%), AUM(결측3.4%), 식별자(ISIN/Lipper/CIK), 레버리지부호(국내는 2차에서 소실)]
  언어차이: 자산군·지역 영문 (국내는 한글)
  지역입도: 59종 국가단위 (국내는 11종 대분류)
