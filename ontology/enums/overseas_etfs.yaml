# overseas_etfs — 사람의 판단을 담는 파일
# 기계적 사실은 *.auto.yaml 에 있습니다. 여기엔 판정과 규칙만 씁니다.
# 런타임 가드레일이 이 파일을 읽습니다.
#
# 범위: 2단계(결측 판정 · 컬럼 판단 · 쿼리 규칙).
#   개체·관계 매핑은 4단계(워크샵 후). → docs/eda/overseas_etfs_notes.md §F 참조.
#   ⚠️ 국내ETF(domestic_etfs.yaml)와 비대칭이 큼 — 위험등급·기간수익률 컬럼 자체가 없음.
#
# 이력:
#   2026-08-25  2차 데이터(8/24 배포 · 기준일 2026-08-22, 해외 8/23 KST) 기준 갱신.
#               컬럼 구조 동일(49열) — 수치·판정만 갱신. 행 5,646→6,037 (신규 395 · 소멸 20=상폐).
#               판정 뒤집힘: du_er_1d(전부 0→97.7% 유효) · cu_lev_fector(100% 결측→14.9% 유효, 부호 정상).
#               상세: docs/DATA_V2_2026-08-24_impact.md §2.3·§6

domain: overseas_etfs

# ── 행의 낟알 (2026-08-18 감사 확정) ──
row_grain:
  구조: 행 = 상품 (pd_itm_no 완전 유일 — 6,037행 = 6,037 distinct · 2차 2026-08-22)
  evidence_grade: A
  note: >-
    🔴 유일 키는 pd_itm_no **뿐이다.** pd_isin_cd·pd_lipper_id 는 각각 63종이 2개 상품에 걸려
    (예: 같은 ISIN 이 OEUR.K/OEFA.K 두 티커에) 단독 조인 키로 쓰면 안 된다 (columns._identifier_dup).
    1차 대비 신규 395건(157건은 7/11 이후 상장) · 소멸 20건(레버리지 단기상품 상폐 — Tradr 2X Short NBIS 등).
    시세 기준일 du_clpr_base_dt = 20260821 이 5,687건이나 20260609(14)·20260728(13) 등 구식 잔존 → 답변 시 기준일 병기.

# ── 컬럼 한글명 49종 (schema_metadata 공란 대체) ──
#   36종: 국내ETF schema Sheet1_Schema 에서 매핑 (공유 컬럼)
#   13종: 해외ETF 전용 — 컬럼명 의미로 직접 확정
# ✅ 검토(이병철/08-21): 13종 자체명명 전부 값 부합 확인 — repl_mthd=Optimized/Swap/Full/Other, isin=US+10자, cik/lipper=숫자ID, trd_ccy=USD, etn/inverse/tracking/match_yn=Y/N, clpr_src=경로문자열, *_base_dt=날짜. du_opr=시가는 [저가,고가] 정합 99.77%(13/5636 경계반올림). 정정 없음.
column_korean_names:
  # 식별자
  pd_itm_no: 상품번호(티커)
  pd_itm_no_ma: 상품번호_미래에셋
  pd_isin_cd: ISIN코드                 # 해외전용
  pd_lipper_id: Lipper식별자           # 해외전용(글로벌 펀드평가사)
  pd_us_cik: 미국SEC등록번호(CIK)      # 해외전용
  pd_nm: 상품명
  pd_abrv_nm: 상품약어명
  # 분류·속성
  pd_grp_no: 상품군종류
  wu_inv_ast_type: 투자자산군
  wu_inv_rgn: 투자지역
  wu_core_yn: 핵심ETF여부
  cu_strtegy: 운용전략
  cu_lev_fector: 배수
  cu_base_index: 기초지수
  cu_etn_yn: ETN여부                   # 해외전용
  cu_inverse_short_yn: 인버스/숏여부   # 해외전용
  cu_index_repl_mthd: 지수복제방법     # 해외전용(Optimized/Swap/Full)
  cu_index_tracking_yn: 지수추종여부   # 해외전용
  # 운용사·보수
  cu_fund_mgmt_co: 운용사
  cu_charge_rt: 총보수요율
  # 시장·통화
  pd_exg_mkt_cd: 거래소코드
  pd_mkt_id: 상품거래시장코드
  pd_curr_cd: 상품통화코드
  pd_trd_ccy: 거래통화                 # 해외전용(전부 USD)
  # 가격·시세
  du_clpr: 종가
  du_clpr_base_dt: 종가기준일          # 해외전용
  du_clpr_src: 종가출처                # 해외전용
  du_opr: 시가                         # 해외전용(국내는 du_lpr)
  du_hpr: 고가
  du_lpr: 저가
  du_bpr: 기준가
  du_last_nav: 최종NAV
  du_nav_base_dt: NAV기준일            # 해외전용
  du_base_dt_match_yn: 기준일일치여부  # 해외전용
  ru_mkt_price: 현재가
  pd_lst_price: 상품액면가                # ⚠️ 전부 0 — constant_columns 참조
  # 규모·거래
  du_last_aum: 최종AUM(순자산총액)
  du_val_1d: 일거래대금
  du_vol_1d: 일거래량
  ru_mkt_volume: 거래량
  pd_lst_stk_cnt: 상품상장주식수
  # 수익률·기타
  du_er_1d: 수익률_1D
  du_diff_rt: 괴리율
  # 상태·일자
  pd_sale_yn: 상품판매여부
  pd_tr_yn: 상품거래정지여부
  pd_lstg_dt: 상품거래가능일자(상장일)
  cu_upt_dt: 변동갱신일자
  du_upt_dt: 일간갱신일자
  wu_upt_dt: 주간갱신일자

columns:
  # ── 없는 컬럼 = 대량 "데이터 미제공" (국내ETF엔 있으나 해외엔 부재) ──
  _absent_columns:
    korean_name: 국내ETF엔 있으나 해외ETF엔 없는 컬럼
    answer_policy: "위험등급·1년/YTD/기간수익률 질의는 해외ETF 대상 시 '데이터 미제공' 명시. 국내ETF로 유도하거나 확인 불가 안내."
    note: "pd_risk_nm·pd_risk_cd(위험등급), du_er_1y·du_er_ytd·du_er_1m/3m/6m(기간수익률) 컬럼 자체가 스키마에 없음. du_er_1d 는 2차부터 유효(97.7%)하나 1일치뿐 — 연/기간 수익률 대용 불가."

  # ── 상장시장 (101·102 세부코드) ──
  pd_exg_mkt_cd:
    korean_name: 거래소코드
    missing_reason: present
    answer_policy: "AMX/NAS/NYS는 미국 주요 3시장. 101·102는 미국 소형/신규 상장 세부코드로 취급(전부 pd_mkt_id='US')."
    note: "AMX 4,569 / NAS 1,359 / NYS 78 / 102 22 / 101 9 (2차). 101·102(31건)는 교차대조상 미국 소형·신규 상장 ETF(티커 접미어 .O/.K). 정확한 시장명은 코드북 market.csv 보강 대상('101'·'102' 행 추가 필요)이나 영향 작음."
    value_semantics:
      AMX: NYSE Arca (미국)                # 🔴 2026-08-20 정정 — 코드북 market.csv 검증(VOO·SPY·IVV 전부 NYSE Arca 상장, 커밋 e7c609b)이 yaml 에 미전파돼 있었음. 'NYSE American' 은 AMEX 오독의 잔재
      NAS: NASDAQ (미국)
      NYS: NYSE (미국)
      "101": 미국 소형/신규 상장(세부, 9건)
      "102": 미국 소형/신규 상장(세부, 22건)
    # ✅ 검토(이병철/08-21): AMX=NYSE Arca 정정 재확인 — VOO·SPY·IVV(전부 실세계 NYSE Arca 상장) 3건 모두 DB에서 AMX. 정정 타당, yaml 전파 확인.

  # ── 기초지수 (센티넬) ──
  cu_base_index:
    korean_name: 기초지수
    kg_entity: Index                # 2026-08-25 포인터 기입 — coverage report 추적용 (shared/index.yaml)
    missing_reason: missing
    answer_policy: "기초지수 질의는 센티넬 제외 후 유효 3,106건(51.4%) 한정 + 모수 명시."
    trap: "센티넬 문자열 — 'Index is not provided by Management Company' 2,285건 + 'Index is not available on Lipper Database' 635건 = 2,920건 (1차 2,705 → 약간 악화). IS NULL 로는 안 잡힘 (NULL 은 11건뿐)."
    note: distinct 1,850종으로 보이나 절반이 센티넬. 실질 수록 3,106건(51.4%) · 유효 distinct 1,848종. 국내ETF 와 달리 2차에서도 개선 없음.

  # ── 수익률 (1일만 — 2차부터 유효, 판정 뒤집힘 2026-08-25) ──
  du_er_1d:
    korean_name: 1일수익률
    missing_reason: mixed   # 🔧 정정(이병철/08-27) [A절]: present → mixed
    answer_policy: >-
      1일수익률 질의는 답변 가능(유효 5,898건 = 97.7%, 기준일 du_clpr_base_dt 병기).
      🔴 연/YTD/기간 수익률은 컬럼 자체가 없어 **미수록**.
      ✅ OQ-2 답변 확정(2026-08-26): 주최는 "해외 ETF 1년 수익률을 묻는 질의는 없을 예정이며,
      '~~ 종목 포함된 ETF의 1년 수익률' 질의 시 해외 ETF 는 **제외해도 무방**" 이라고 답변.
      → 교차 TOP-N 에서 해외ETF 는 **순위에서 제외**한다. 1일수익률 병기는 하지 않는다(옛 fallback 폐기).
      1일치를 연수익률로 환산·대용하지 말 것.
    trap: "1차(7/11)에선 유효분 전부 0 이라 '수익률 질의 불가' 로 판정했었다 — 2차에서 값이 채워졌으므로 옛 판정을 인용하지 말 것."
    note: >-
      2차 유효 5,898(97.7%) · NULL 14 · 0값 125. 기간수익률 컬럼은 여전히 없음 (_absent_columns).
      🔴 2026-08-26 zero_is_value 해제 — 주최 답변("수익률·총보수 컬럼 질의 시 값이 0 인 행은 아예 포함하지 않는다.
      값이 0 이니 당연히 기준이 없음")에 따라 0값 125건을 정렬·필터에서 제외한다.
      0 이 '당일 등락 없음(보합)' 이라는 관측 사실은 유지하되, 랭킹 축으로는 쓰지 않는다.
    unit: percent

    # ✅ 검토(이병철/08-27) [A절]: 🔴 결측 14건은 du_val_1d·ru_mkt_price 와 완전 동일 집합이며 14건 전부 du_clpr 도 NULL = 시세가 통째로 없음. pd_sale_yn=0 은 0건(판매중 표시)이나 실제로는 데이터 껍데기 → 어떤 질의에서도 제외.
  # ── 총보수 (국내와 대조 — 깨끗) ──
  cu_charge_rt:
    korean_name: 총보수요율
    missing_reason: present
    answer_policy: "결측 0% — 보수 질의에 신뢰도 높게 답변 가능. 0값 419건(레버리지/인버스/ETN 위주)은 '보수 0'이 아니라 미수록으로 취급해 보수 정렬·필터에서 제외하고 모수 명시."
    note: "국내ETF와 정반대. 2차: 결측 0 · 0값 419건(ETN 51건 포함) · 양수 중앙값 0.50%, max 2.50%. 단위 USD 기준 아님(요율 %)."
    unit: percent

  du_last_aum:
    korean_name: 최종AUM
    missing_reason: mixed   # 🔧 정정(이병철/08-27) [A절]: present → mixed
    answer_policy: "AUM 질의 답변 가능(결측 3.4% · 0값 11건 제외). 단위 USD. 국내ETF(KRW)와 통합 정렬 시 ontology/codebooks/fx_rate.csv(8/21 기준으로 교체 예정) 적용 — 미적용 상태면 상품군별로 분리 제시."
    note: "단위 USD 확정 (VOO $995B·SPY $783B 실제값 대조 + pd_trd_ccy 전부 USD). 국내ETF는 KRW라 숫자 직접 비교 시 순위 역전(함정②)."
    # ✅ 검토(이병철/08-21): 환율 확정(1,504.92 ECB)으로 통합 정렬 조건부 허용. 근거 — VOO는 두 환율(1,485↔1,505) 모두 KODEX200의 50배(1,498조 vs 28조)라 큰 격차엔 ±1.3% 무영향. 뒤집힘은 규모 유사($19~20B ↔ 28조원 부근) 종목만이라 5% 경계 단서로 방어. 🔧 정정: 통합 정렬 금지 → 조건부 허용(환율 병기). 최종 go 는 워크샵/리드 확인 권장(답변 행동 변경).
    unit: usd
    layer:
      scale: USD (달러)
      cross_sort: "국내ETF du_last_aum(KRW)와 나란히 정렬 불가. VOO $995B > KODEX200 28.4조원(≈$200억)인데 숫자만 보면 KODEX가 28배 커 보임."

    # ✅ 검토(이병철/08-27) [A절]: 결측 205건 — '시세 전무 14건'과 다른 집단. 205건 전부 du_clpr 유효(정상 거래중)이고 판매종료 0건 = 거래는 되나 순자산만 미수록(소형 ETF 집계 누락 추정). Top-N 에서 제외하고 모수 명시.
  # ── 실시간 (국내와 달리 채워짐) ──
  ru_mkt_price:
    korean_name: 현재가
    missing_reason: mixed   # 🔧 정정(이병철/08-27) [A절]: present → mixed
    answer_policy: "결측 0.2% — 종가로 백필된 값. '실시간'이 아니라 기준일(8/21) 종가임을 명시."
    note: 종가(du_clpr)로 채워짐. 2차부터는 국내ETF도 같은 방식으로 채워져 대칭.

    # ✅ 검토(이병철/08-27) [A절]: 결측 14건 — du_er_1d 와 동일 집합·동일 원인(시세 전무).
  # ── 레버리지 (2차부터 부분 유효 — 판정 뒤집힘 2026-08-25) ──
  cu_lev_fector:
    korean_name: 레버리지배수
    missing_reason: mixed
    answer_policy: >-
      레버리지/인버스 판별은 cu_lev_fector(유효 901건 = 14.9%, **부호 정상** — 음수 = 인버스) 와
      cu_inverse_short_yn='Y'(183건) 를 병행. 둘 다 없으면 상품명(Ultra/2X/Bull/Bear)으로 보조.
      결측 5,136건은 "배수 미수록"이지 1배(비레버리지) 확정이 아님 — 레버리지 아님 을 단정하지 말 것.
    trap: "1차(7/11)는 100% 결측이라 '못 씀' 판정이었다 — 옛 판정 인용 금지. 국내ETF 는 반대로 2차에서 부호가 소실됐으므로(domestic_etfs.yaml) 교차질의 시 도메인별 판정 규칙이 다름."
    note: "2차 분포: 2.0 677 · -2.0 92 · 3.0 60 · -3.0 34 · 1.2 25 · 1.5 6 · 기타 7 / NULL 5,136."
  du_diff_rt:
    korean_name: 괴리율
    missing_reason: missing
    answer_policy: "'데이터 미제공'."
    note: 2차에도 99.95% 결측 (유효 3건).
  du_last_nav:
    korean_name: 최종NAV
    missing_reason: missing
    answer_policy: "NAV 질의는 유효 12.6%(758건)만. 모수 명시."
    note: 87.4% 결측 (1차 87.9%).

  # ── 식별자 중복 (2026-08-18 감사 신설) ──
  _identifier_dup:
    korean_name: ISIN·Lipper 중복 주의
    evidence_grade: A
    trap: >-
      🔴 pd_isin_cd 중복 63종 · pd_lipper_id 중복 63종 (각각 한 값이 2개 상품 · 2차).
      "해외가 식별자가 낫다(ISIN/Lipper/CIK)" 는 결측률 이야기이지 유일성 이야기가 아니다.
    answer_policy: >-
      ISIN·Lipper 로 조인·단건 조회 시 2건이 나올 수 있다 — pd_itm_no 를 기본 키로 쓰고,
      ISIN 검색 결과가 복수면 티커를 병기해 모두 제시할 것.
    applies_to:
    - pd_isin_cd
    - pd_lipper_id

  # ── 핵심ETF여부 (2026-08-18 감사 신설 — 사용 불가) ──
  wu_core_yn:
