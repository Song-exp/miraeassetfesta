    korean_name: 운용전략
    missing_reason: mixed
    trap: >-
      🔴 국내ETF와 완전히 다른 자료형 — 같은 컬럼명이지만 국내는 짧은 코드값('실물복제'·'액티브'·'합성복제'·'C'=ETN),
      해외는 영문 자유서술 문단(전략 설명 풀텍스트, distinct 5,943/6,026 사실상 전건 고유).
      국내의 axis_derivation 규칙(cu_strtegy='액티브' → Active 등)을 해외에 그대로 적용하면 매칭 0건으로 조용히 실패한다.
    answer_policy: "해외ETF 운용전략은 영문 문단 원문 그대로 인용/요약만 가능. 국내처럼 Active/Passive 값매핑 아직 없음(축 미구축) — 필요시 문단 키워드('actively managed' 등) 별도 유도 필요."
    note: 결측 11건(0.2%). RAG/벡터검색 소스로 적합(자유서술).
  cu_index_repl_mthd:
    korean_name: 지수복제방법
    missing_reason: mixed
    answer_policy: "'복제방법' 질의는 Optimized/Swap/Full/Other 값 직답 가능(2026-08-21 E5 검토로 값 부합 확인됨). 결측 60.1%(3,630건)는 '데이터 미제공'."
    note: cu_index_tracking_yn 과 결측 패턴 완전 동일(둘 다 채워지거나 둘 다 비거나, 0건 불일치) — 같은 원천 메타데이터 쌍.
