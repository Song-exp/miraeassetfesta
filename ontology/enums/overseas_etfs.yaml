    missing_reason: mixed
    answer_policy: "'Y'만 존재하는 희소인코딩 — NULL 은 'N/모름'이 아니라 '이 메타데이터 자체가 미제공'(cu_index_repl_mthd 와 동시 결측)."
    note: 결측 60.1%.
  cu_inverse_short_yn:
    korean_name: 인버스숏여부
    missing_reason: mixed
    answer_policy: "희소인코딩 — 'Y'(183건)만 저장, NULL(97.0%)은 '아니오'로 해석. 인버스/숏 질의는 `cu_inverse_short_yn='Y' OR cu_lev_fector<0` 병용(레버리지 배수 컬럼이 더 결측 적음)."
    note: cu_lev_fector 는 해외ETF 전체 100% 결측이므로(별도 확인됨) 인버스 판별의 유일 수단.
  cu_etn_yn:
    korean_name: ETN여부
    missing_reason: mixed
    answer_policy: "희소인코딩 — 'Y'(65건=해외ETN 전량)만 저장, NULL(98.9%)은 ETF. 상품군 판별은 pd_grp_no 가 정본, 이 컬럼은 보조신호."
    note: pd_grp_no='ETN' 65건과 완전 일치(교차검증됨).
  du_opr:
    korean_name: 시가
    missing_reason: mixed
    answer_policy: "가격 질의 가능. 결측 0.2%(14건, ETN 계열 추정)는 '가격 미제공'."
    note: "✅ 검수(08-21): [저가,고가] 구간 정합 99.77% — 명명 타당성 확인됨."
  du_hpr:
