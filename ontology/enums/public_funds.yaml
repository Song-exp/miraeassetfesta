    발견: 종목명에 '상장지수' 인 펀드 62종목 중 23종이 domestic_etfs 에도 존재
    조인: 🔴 itm_no ∩ pd_itm_no = 0건, pd_itm_no_ma 도 0건. 종목명(공백제거) 완전일치로만 23건
