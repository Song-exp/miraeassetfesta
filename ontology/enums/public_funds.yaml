normalization:
  trim_columns:
  - itm_abrv_nm
  - itm_eng_nm
  - itm_nm
  - kofia_fd_ccd
  - ksd_itm_no
  - prfd_attr_cd
  - rptt_ksd_itm_no
  - trusc_xtn_itt_cd   # 2026-08-18 추가 — '0016022 ' 14종목. 미적용 시 수탁사 distinct 가 18 로 부풀고
                       # 8자리 종별+번호 분해가 이 값에서 깨진다 (trim 후 7자리 = 형태 이탈)

  # ── 값처럼 보이지만 결측인 것 ────────────────────────────────────────
  dummy_as_missing:
    _note: >-
      🔴 NULL 만 결측으로 보면 틀린다. 이 컬럼들의 결측 중 98~99%가 NULL 이 아니라 0패딩 더미다.
      정규화 없이 조인하면 '000000000000' 하나에 3,022종목이 뭉치고, LLM 프롬프트에 원값이
      닿으면 "등록번호는 000000000000입니다" 라고 답한다 — 환각 감점에 직결된다.
      노트북의 eff_empty() 작업 정의를 런타임으로 옮긴 것이다.
    🔴_화이트리스트_필수: >-
      🔴 patterns 를 columns 목록 **밖**의 컬럼에 적용하지 말 것. 패턴만 떼어 쓰면 정상값을 삼킨다.
      자리수가 고정된 코드 체계에서 '전부 0' 은 흔한 정상값이다 — 2026-08-18 실제로 밟은 함정:
        fd_estb_ctry_cd '000'    10,854종목  → 결측률 0.99% → 97.52% 로 뒤집힘 (정상값, 값사전 §2.2)
        pfiv_sale_cntl_tcd '00'  11,064종목  → 기본값 확정 A급 판정을 무효화 (값사전 §2.3)
        fd_set_pcd '00'             110종목  → 원본에 458행 실값 (값사전 §2.1)
      적용 대상은 아래 columns 6개뿐이며 **전부 식별 코드**다. 코드가 아닌 컬럼에는 걸지 않는다.
      ⚠️ 정규화 적용 후 결측률이 급등한 컬럼이 있으면 발견이 아니라 **오적용을 먼저 의심**할 것.
    patterns:
    - '^(KR)?0+$'
    - '^(.)\1+$'
    columns:
    - fss_itm_no
    - kofia_fd_ccd
    - rptt_ksd_itm_no
    - mtco_itm_no
    - ksd_itm_no
    - std_itm_no
    실측: >-
      fss_itm_no 결측 3,025 중 3,022 · kofia_fd_ccd 2,891 중 2,879 ·
      rptt_ksd_itm_no 487 중 478 · mtco_itm_no 62 중 61 이 더미 (종목 11,139 기준)
    sql: >-
      (C IS NULL OR C='' OR replace(replace(C,'KR',''),'0','')=''
       OR (length(C)>1 AND replace(C, substr(C,1,1), '')=''))
    sql_주의: >-
      C 를 대상 컬럼명으로 치환해 쓴다. 🔴 CAST(C AS INTEGER)=0 으로 0패딩을 판정하지 말 것 —
      SQLite 가 '00AG530'·'00EP0094' 같은 값도 0 으로 읽어 920종목을 잘못 배제한다.
      위 replace 표현은 노트북 eff_empty() 와 동일한 결과를 낸다 (2026-08-17 대조 검증).

  # ── 수치 컬럼의 0 이 위장결측인 경우 ──────────────────────────────────
  zero_as_missing:
    _note: >-
      🔴 dummy_as_missing 은 문자열 더미만 다룬다. 수치 컬럼의 0 은 검사된 적이 없었다.
      2026-08-18 신설 — 근거 상세는 docs/eda/public_funds_value_dictionary.md §7.3
      ⚠️ 원본 대조로는 갈리지 않는다(원본에도 0.0000 이다). 판정 근거는 구조 관측뿐이므로 B급이다.
      🔴 값을 고쳐 채우지 말 것. 집계·정렬에서 제외하고 모수를 밝히는 방식으로만 처리한다.
    fd_nast_suma:
      규칙: fd_nast_suma = 0 을 결측으로 취급
      영향: 종목 294 (판매중 192 · 판매완료 102)
      evidence_grade: B
      근거: >-
        ① 형제 대조 — 226종목(76.9%)은 같은 (or_co, mtco) 펀드의 다른 클래스가 0 이 아니다.
           펀드에 자산이 있는데 이 클래스만 0 이다.
        ② 성과 동반 — 판매중 192종목의 fd_yr1_ern_r 보유가 0건이다(전부 결측).
           반면 위험등급은 191/192 가 보유 → 평가는 됐는데 순자산만 0 이다.
        ③ 도메인 — 순자산 0 은 자산이 한 푼도 없는 펀드다. 판매중 상품에 192종목은 과다하다.
      answer_policy: >-
        '순자산이 가장 작은 펀드' 류 질의에서 이 294종목이 최하위를 점거한다. 정렬 전 제외할 것.
        개별 조회 시 "순자산이 수록되어 있지 않습니다" 로 답한다 — "순자산은 0원입니다" 는 금지.
      sql: (fd_nast_suma IS NULL OR fd_nast_suma = 0)
    수익률_9기간전부0:
      규칙: 9개 수익률 컬럼이 전부 0 인 종목을 수익률 결측으로 취급
      영향: 종목 69
      evidence_grade: B
      근거: 5년 누적 수익률까지 정확히 0.00 인 것은 어떤 상품에서도 불가능하다
      sql: >-
        (fd_wk1_ern_r=0 AND fd_mm1_ern_r=0 AND fd_mm3_ern_r=0 AND fd_mm6_ern_r=0
         AND fd_yr1_ern_r=0 AND fd_mm18_ern_r=0 AND fd_yr2_ern_r=0 AND fd_yr3_ern_r=0
         AND fd_yr5_ern_r=0)
    🔴_일괄배제_금지: >-
      수익률 0 을 컬럼 단위로 일괄 배제하면 안 된다. 세 갈래로 갈린다 —
        9기간 전부 0        69종목  → 위장결측 (위 규칙으로 배제)
        1주~1년 5기간 0 + 3년 비영  107종목  → 🔶 미확정. 최근 1년 완전 무변동(운용 정지 후보).
                                    값으로 두되 수익률 Top-N(최저)에서는 제외할 것
        0 과 비영이 섞임    299종목  → ✅ 정상. 단기 무변동은 MMF 등에서 정상이다. 배제 금지
      1주~1년 5기간이 0 인 228종목의 자산군은 주식형 138 · 재간접 50 · 채권혼합 16 · 채권형 10 ·
      주식혼합 7 이다. 주식형 138종목이 5기간 전부 정확히 0.00 인 것이 위장결측의 핵심 근거다.

  # ── 숫자형 표기가 흔들리는 컬럼 (저장형태가 빌드에 따라 다름) ──────────
  numeric_string_columns:
    _note: >-
      🔴 2026-08-18 감사 정정 — 전제가 빌드에 따라 다르다.
      구 dtype=str 빌드: 문자열 '6.0' 저장 → ='6' 이 0건 (이전 판정의 근거).
      현행 build_db.py 재빌드: **REAL 저장** → ='6' 도 '6.0' 도 6 도 전부 2,397행 매칭 (typeof 실측).
      🔴 어느 쪽이든 CAST(... AS INTEGER) 비교는 동일 결과를 내므로 규칙은 유지한다.
      ⚠️ 배포 서버 DB(dd9b482 md5 확인본)와 재빌드 DB 의 dtype 동일 여부는 미확인 — 워크샵 안건
      (docs/eda/public_funds_audit_2026-08-18.md §안건1).
    columns:
    - zrin_fd_ivst_risk_gcd
    - frc_bpr_itm_yn
    - hdge_fd_yn
    - ofsfd_yn
    규칙: 비교 전 CAST(컬럼 AS INTEGER) 로 맞출 것 (표기 직접 비교 금지 — 저장형태에 따라 결과가 달라진다)
    검증: >-
      2026-08-18 현행 DB — typeof(zrin_fd_ivst_risk_gcd)=real ·
      CAST=6 → 2,397행 = 338종목 (행/종목 구분 주의: 이전 문구의 '338건' 은 종목 수였다)
    대조: fd_set_pcd('00','10','20') · pfiv_sale_cntl_tcd('00','01','02') · fd_estb_ctry_cd('000','410') 는 문자열 유지됨 (0패딩 보존 대상)

  # ── 원본 따옴표로 컬럼이 밀린 행 ──────────────────────────────────────
  contaminated_rows:
    _note: >-
      🔴 따옴표(")가 섞여 값이 흩어진 행. 판매상태와 무관하다.
      🔴 2026-08-18 정정 — '적재 사고' 가 아니라 **제공 파일 자체의 사고**다.
      적재는 pd.read_excel 이고 원본 엑셀의 컬럼 순서도 알파벳순(DB와 동일)이다.
      원본 84563행을 직접 열면 값이 이미 흩어진 상태로 들어 있다.
    감지: mtco_itm_no LIKE '%"%' OR itm_no = '"'
    영향: 행 66 · 종목 9 (미래에셋글로벌포커스4.0 계열 8 + 완전 파손 1)
    결측기여: std_itm_no·or_co_xtn_itt_cd·trusc_xtn_itt_cd 결측의 100% · ksd_itm_no 의 18.8%
    처리: 집계·조회에서 배제하고 모수에 밝힐 것. 값을 고쳐 채우지 말 것
    귀속표:
      _note: >-
        완전 파손 1종목(원본 84563행)의 비어 있지 않은 값 11개가 원래 어느 컬럼의 것인지.
        형식·도메인·형제 대조로 확정했다. 근거 상세 → docs/eda/public_funds_value_dictionary.md §2.9.1
        🔴 오프셋이 일정하지 않다(-39 ~ +14) — 기계적 역변환은 불가능하다.
        이 표는 복구용이 아니라 **같은 사고를 재감지하기 위한 기록**이다.
      들어간칸_값_가야할칸:
      - [bmrk_eng_nm, '031910466590', rptt_ksd_itm_no, 형제 4종목의 rptt 와 완전 동일]
      - [bmrk_nm, K55301CE3408, std_itm_no, 형제 std 대역 K55301CE28xx~33xx]
      - [exchdg_yn, '00080008', or_co_xtn_itt_cd, 형제 전원 동일]
      - [itm_abrv_nm, 해당없음, prvo_fd_desc, 공모펀드의 유일 값]
      - [itm_eabrv_nm, 배당, int_dvd_desc, 99.9% 값]
      - [itm_eng_nm, 개인, pers_corp_desc, 3값 중 하나]
      - [itm_nm, 공모, prvo_pbff_desc, 99.8% 값]
      - [itm_no, '"', null, 🔴 식별자 파괴 지점]
      - [prfd_attr_cd, 해외, ovrs_fd_desc, 3값 중 하나]
      - [thco_sale_yn, KRZ50226929C, ksd_itm_no, KRZ 접두 = ksd 형식]
      - [zrin_fd_ivst_risk_gcd, '00020054', trusc_xtn_itt_cd, '★ 원본 정상행의 zrin_gcd 는 한 자리 숫자라 8자리 불가 · 전체 최다 수탁사(2,124종목) · 형제 전원의 trusc 가 이 값']
      - [zrin_fd_ivst_risk_grd_nm, '06', or_attr_desc, '★ 형제 전원의 or_attr_desc 가 06(파생형) · zrin_gcd 는 한 자리라 불가']
    복구가능성:
      완전파손_1종목: >-
        ❌ 불가. itm_no 가 '"' 로 파괴되어 어느 종목인지 알 수 없고,
        std_itm_no 'K55301CE3408' · ksd_itm_no 'KRZ50226929C' 가 DB 어디에도 없다(각 0종목)
        — 다른 행으로 살아있지 않은, 마스터에서 사라진 1종목이다.
        계열 번호가 KR5153470110~0122 · 0125~0129 로 0123·0124 가 비어 있으나 확정 근거는 없다.
      파손_8종목: >-
        ✅ 형제 우회 조회 가능. KR5153470111·0112·0113·0114·0122·0127·0128·0129 는
        itm_no 가 살아있고 mtco 에 따옴표만 붙었다. 같은 펀드의 정상 형제 10종목이 있고
        펀드 단위 속성은 형제 전원이 같은 값이다 —
        or_co='00080008' · trusc='00020054' · or_attr_desc='06' ·
        rptt='031910466580'(mtco 0466580군) / '031910466590'(0466590군).
        🔴 값을 채워 고치지 말고 **조회 시 같은 mtco 형제에서 조달**할 것.
        std_itm_no·ksd_itm_no 는 종목마다 달라 우회 불가.
  source_file_주의:
    _note: >-
      🔴 원본 엑셀은 결측을 문자열 'NULL' 로 쓴다 (zrin_fd_ivst_risk_gcd 18,416행).
      현재 DB 에는 문자열 'NULL' 이 값으로 남은 컬럼이 0건이다(45컬럼 전수 확인) —
      pandas 기본 na_values 가 처리했기 때문이다.
      scripts/build_db.py 가 이 기본 동작에 의존하고 있으므로
      read_excel(..., keep_default_na=False) 로 바꾸면 18,416행이 값으로 되살아나
      위험등급 distinct 가 7 → 8 이 된다. 재적재 시 이 옵션을 건드리지 말 것.

  # ── 같은 뜻인데 표기가 갈리는 값 ──────────────────────────────────────
  value_variants:
    _note: 정확일치 조회 시 누락이 발생한다. 조회 전 정규화하거나 두 표기를 모두 허용할 것
    zrin_fd_ivst_risk_grd_nm:
      매우 높은 위험: []
      높은 위험: ['높은위험']
      다소 높은 위험: []
      보통 위험: ['보통위험']
      낮은 위험: []
      매우 낮은 위험: []
    설명: 코드 7종 vs 명칭 9종의 차이는 공백 변형 2건 + 오염값 1건으로 전부 설명된다

  # ── 도메인 범위를 벗어난 값 ──────────────────────────────────────────
  invalid_values:
    _note: >-
      배제 대상. 값을 고치지 말고 걸러낸다.
      아래 5종은 전부 contaminated_rows 의 **완전 파손 1행(itm_no='"')** 에서 나온 것이며
      별개 현상이 아니다. 각 값이 원래 어느 칸의 것인지는 contaminated_rows.귀속표 참조
    zrin_fd_ivst_risk_gcd:
    - '20054.0'
    zrin_fd_ivst_risk_grd_nm:
    - '06'
    prfd_attr_cd:
    - '해외'
    exchdg_yn:
    - '00080008'
    thco_sale_yn:
    - 'KRZ50226929C'
    설명: >-
      zrin_gcd '20054' 는 등급 범위(1~6) 이탈 — 수탁사코드 00020054 가 들어온 것.
      zrin_grd_nm '06' 은 or_attr_desc 값. prfd_attr_cd '해외' 는 ovrs_fd_desc 값.
      exchdg_yn '00080008' 은 or_co_xtn_itt_cd 값. thco_sale_yn 'KRZ50226929C' 는 ksd_itm_no 값.
      🔴 exchdg_yn·thco_sale_yn 은 2026-08-18 추가 — 이전에는 미등재였고, 그 결과
      exchdg_yn distinct 3 · thco_sale_yn distinct 2 로 오염값이 정상값처럼 세어졌다

  # ── 정보량이 0인 컬럼 ────────────────────────────────────────────────
  constant_columns:
    _note: distinct 1. 필터 조건으로 쓰면 항상 전량 또는 0건이 된다. 온톨로지 속성으로 세우지 말 것
    hdge_fd_yn: "'0.0' 11,130종목 — 헤지펀드 0건"
    ofsfd_yn: "'0.0' 전 종목 — 역외펀드 0건"
query_rules:
  종목단위: GROUP BY itm_no
  펀드단위: >-
    GROUP BY or_co_xtn_itt_cd,
             CASE WHEN length(mtco_itm_no) >= 7 THEN mtco_itm_no
                  ELSE substr('0000000' || mtco_itm_no, -7) END
  펀드단위_검증: >-
    위 표현 + dummy_as_missing.sql 필터로 종목 11,069 · 합성키 4,643 — 노트북 ④-A 와 일치
    (2026-08-17 대조 검증). 🔴 substr('0000000'||m, -7) 단독은 쓰지 말 것 —
    길이 8 값('"0466580' 등)의 앞 글자를 잘라 서로 다른 펀드를 합친다 (4,642 로 어긋남).
  펀드단위_근거: >-
    🔴 GROUP BY mtco_itm_no 단독은 틀린 집계다. mtco 는 운용사 내부 번호라 전역 유일이 아니며
    65종의 값이 최대 3개 운용사에 걸친다 — 남의 운용사 펀드와 뭉친다.
    (단독 4,573 vs 합성 4,643). 또한 선행 0 손실로 길이가 4~8 로 섞여 있어 7자리 zero-pad 가
    필요하다 — 안 하면 44개 펀드가 각각 두 키로 쪼개진다 (원값 4,687 vs pad 4,643).
  판매중만: sale_yn = '판매중'
  공모만: prvo_pbff_desc = '공모'
  ETF제외: itm_nm NOT LIKE '%상장지수%'
  수익률정상: <질의 대상 기간 컬럼> > -100     # 🔴 2026-08-18 감사 개정 — 질의하는 그 컬럼에 건다
  수익률정상_개정근거: >-
    🔴 이전 규칙 'fd_yr1_ern_r > -100 AND fd_yr3_ern_r > -100' 의 두 결함 (2026-08-18 실측) —
    ① NULL 함정: 5년 수익률은 있는데 1년/3년이 NULL 인 종목이 74개 있고, SQL 에서 NULL > -100 은
       행을 탈락시키므로 5년 Top-N 에서 74종목이 부당 탈락한다.
    ② 오류값(<-100)은 mm18·yr2·yr3·yr5 4개 컬럼에 존재한다 (전부 KCGI베트남 KR515303001M 1종목 5행,
       최저 -4,381%). 고정 2컬럼 AND 로는 의도가 불투명하다.
    → ETF 의 규칙(du_er_1y > -100 단일 컬럼형)과 같은 형태로 통일: 정렬·필터에 쓰는
    바로 그 기간 컬럼에 '> -100 AND IS NOT NULL' 을 건다. 다른 기간 컬럼은 조건에 넣지 않는다.
  자산군_주식형: trim(or_attr_desc)='주식형' OR (trim(or_attr_desc) IN ('재간접','06') AND itm_nm LIKE '%(주식%')
