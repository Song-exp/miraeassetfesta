    decode_status: 1차 15축 중 대응 확정 4(V·S·N·G)·부분 8·없음 3 → 2차 명칭 컬럼으로 전면 재해독 가능(미실시)

class_hierarchy:
  note: FIBO 원칙 — 펀드 유형은 owl:Class 하위클래스이지 개체가 아님. axis_fundType(주최 측 제시)이 법적 5분류 층위와 일치.
  Fund:
    SecuritiesFund:
    - EquityFund
    - BondFund
    - EquityMixedFund
    - BondMixedFund
    MoneyMarketFund: []
    MixedAssetsFund: []
    RealEstateFund: []
    SpecialAssetsFund: []

axis_mapping:
  _note: >-
    주최 측이 1차 schema.xlsx Sheet2_Sample 로 제시한 6축. 2차 schema 파일엔 샘플 시트가 없다 — 1차 정답 라벨 100건 기준 판정 유지.
    🔴 derivation_rules.assetClass 와 층위가 다르다 — fundType 은 자본시장법 5분류, assetClass 는 실제 투자자산 축. 합치지 말 것.
  axis_fundType:
    출처: or_attr_desc
    evidence_grade: A(1차 정답 100건)
    매핑:
      SecuritiesFund: ['주식형', '채권형', '주식혼합', '채권혼합', '재간접', '파생상품', null]
      MoneyMarketFund: ['MMF']
      MixedAssetsFund: ['혼합자산']
      RealEstateFund: ['임대형', '대출형', '개발형']
      SpecialAssetsFund: ['특별자산']
    주의: >-
      '파생상품' 은 1차의 '06'. '개발형'(88행)·'기타'(170)·'해당없음'(905) 은 2차 신규 값 — 개발형 88 = 전부 사모(zrin 유형 NULL, 검수 C 2026-08-25)라 공모 모수엔 없음: 부동산 배정은 명칭 관행 추정으로 유지하되 답변엔 등장하지 않음. 기타·해당없음(전부 공모 판매완료)은 미배정(모수에서 명시).
  axis_investorEligibility:
    출처: prvo_pbff_desc
    evidence_grade: A
    매핑:
      PublicOffering: ['공모']
      PrivateOffering: ['사모']
  axis_listingType:
    출처: itm_nm (종목명 파싱)
    evidence_grade: A
    규칙: "itm_nm LIKE '%상장지수%' → Listed (236행) · 그 외 Unlisted"
  axis_redemptionType:
    출처: zrin_attr_nms                      # 🆕 2차 — 태그 '개방'(C103) / 1차 설명서 전건 개방형과 정합
    evidence_grade: A(태그 보유분)
    규칙: "',' || zrin_attr_nms || ',' LIKE '%,개방,%' → OpenEnded. '폐쇄' 태그는 2차 태그 목록에서 미확인 — 태그 없는 12,396행은 '확인 불가'"
  axis_issuanceType:
    출처: fd_set_pcd (+ zrin_attr_nms '추가'/'단위' 태그로 교차 검증 가능)
    evidence_grade: A
    매핑:
      AdditionalType: ['10']
      UnitType: ['20']
    근거: 1차 설명서 전수 교차 반례 0. ✅ 검수 C 2026-08-25 — 태그 C101=추가·C102=단위 는 codebooks/fund_attr_code.csv 검증률 1.0 으로 확정, fd_set_pcd 와 교차 — '10' 행 중 C101 10,533·C102 35 / '20' 행 중 C102 587·C101 15 (태그 보유분 기준 정합 96~98%). '00' 1,967 = 미기재 레거시(태그 없음 1,857) → '확인 불가'.
  _미확정:
    axis_classDifferentiation: >-
      1차 정답 라벨이 같은 펀드 안에서 갈렸던 축. 🆕 2차 han_clas_nm 이 있으므로 "han_clas_nm 보유 = MultiClass 후보" 로 재정의 가능.
      검수 C 2026-08-25 실측: 종류형 태그(M111) 보유 9,637행 중 han_clas_nm 있음 9,247(96%) · 판매중·공모·M111 중 결측 14행뿐 → 기본값 규칙 "M111 태그 OR han_clas_nm 보유 = MultiClass" 로 운용하고, 주최 정의(축 이름) 는 안건 1-9 와 함께 확인. 답변엔 "클래스 구분 있음/없음" 까지만.

derivation_rules:
  _note: 🔴 or_attr_desc 는 단일 축이 아님 — 자산군·운용구조·파생활용 3축 압축(1차 판정 유지). 2차는 zrin_btyp_nm 이 자산군 1순위 축이다.
  assetClass:
    축: 무엇에 투자하는가 (하위클래스 결정)
    규칙: ① zrin_btyp_nm(18종, 국내/해외 내장) ② 없으면 종목명 괄호 표기 — (주식…)→Equity, (채권…)→Bond, (주식혼합…)→EquityMixed, (채권혼합…)→BondMixed ③ 없으면 or_attr_desc 폴백
    판정률: 미산출(2차) — zrin_btyp_nm 보유 11,281/23,676 · 판매중 8,551/10,962
  isFundOfFunds:
    축: 운용 구조 (자산군과 직교)
    규칙: "zrin_attr_nms 태그 'FoFs'(M112) 또는 종목명 '재간접' 또는 or_attr_desc='재간접' (보조: zrin_fd_cmst_rt 가 높음)"
  usesDerivatives:
    축: 파생 활용 (직교)
    규칙: 종목명에 '파생' 또는 or_attr_desc='파생상품'
    해당: 2302 이상(or_attr_desc 기준)
  isMasterFeeder:
    축: 모자형 구조 (직교)
    규칙: zrin_attr_nms 태그 '자펀드'(M109) > 종목명 '증권자'/'자투자신탁' 패턴 > 1차 설명서 플래그(external_facts.is_masterfeeder)
  totalFeeApprox:
    축: 총보수 근사 (%)
    규칙: (or_co_rwrd_r + sale_co_rwrd_r + trusc_rwrd_r + ofwk_trus_rwrd_r) / 10
    주의: 🔴 기타비용(매매·중개수수료 등) 미포함 — 설명서 TER(ext_fund_page.total_fee_pct)보다 작을 수 있다. 답변에 "보수 합계 기준, 기타비용 제외" 를 명시. 보수_3종전부0 행은 제외.
  prfdAttrTag:
    축: prfd_attr_cds 한 컬럼에 2종류가 섞여 있음 — 형태로 갈라야 한다
    규칙: ① ISO 3자 대문자 → Country (investsIn)  ② <문자><3자리숫자> → FundAttribute (문자=축, 숫자=값)
    판정률: 태그 227종 = 17 + 210 (100%). 1차의 오염 '해외' 태그는 2차에 없음
    note: 2차에서는 행을 가르지 않는다(목록 컬럼). FundClass 의 다중값 관계로 모델링.

