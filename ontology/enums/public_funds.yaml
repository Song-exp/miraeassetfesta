# public_funds — 사람의 판단을 담는 파일
# 기계적 사실은 *.auto.yaml 에 있습니다. 여기엔 판정과 규칙만 씁니다.
# 런타임 가드레일이 이 파일을 읽습니다.

domain: public_funds

# ── 행의 낟알(row grain) — 이 테이블의 구조 그 자체 ──────────────────────
row_grain:
  구조: 행 = 종목(itm_no) × 속성태그(prfd_attr_cd)
  evidence_grade: A
  증명: >-
    🔑 2026-08-18 전수 증명 — 45컬럼 전부에 대해 "종목 안에서 값이 갈리는 컬럼"을 검사한 결과
    prfd_attr_cd **단 하나**였고, (itm_no, prfd_attr_cd) 조합 수가 정확히 95,619 = 전체 행수다.
    즉 이 테이블은 종목 마스터가 아니라 **종목×속성태그 롱 포맷**이며,
    행수 95,619 / 종목 11,139 = 8.6배 중복의 정체가 이것이다.
  규칙: >-
    🔴 prfd_attr_cd 를 묻는 질의가 아니라면 **모든 집계는 종목 dedup 이 선행**되어야 한다 —
    COUNT(*) 금지 → COUNT(DISTINCT itm_no) · SUM/AVG 는 종목 단위 축약 후 계산
    (fd_nast_suma 는 추가로 펀드 단위 MAX — columns.fd_nast_suma.집계함정 참조).
    이 yaml 에서 반복 정정된 '행 기준 vs 종목 기준' 수치 혼동(338건 사건 포함)의 뿌리가 이 구조다.
  answer_policy: >-
    상품 개수를 묻는 질의에 행수(95,619)를 답하면 8.6배 과대계상이다.
    상품(클래스) = 11,139종목 · 펀드 = 4,643개 (query_rules.펀드단위) 를 쓴다.

columns:
  prvo_fd_desc:
    korean_name: 사모펀드구분코드 설명
    missing_semantics:
      해당없음: not_applicable
    note: '''해당없음'' 95,451건은 prvo_pbff_desc=''공모'' 와 1:1 완전 대응. 정상 정보.'
  pers_corp_desc:
    korean_name: 개인법인구분코드 설명
    missing_semantics:
      해당없음: not_applicable
    note: '''해당없음'' 73,054건 = 개인/법인 전용이 아닌 일반 펀드. 정상 정보.'
  exchdg_yn:
    korean_name: 환헤지여부
    missing_reason: not_applicable
    answer_policy: 국내 펀드의 환헤지 문의 → '해당사항 없음'. 해외/혼합 펀드의 결측만 '확인할 수 없음'.
    note: 국내 투자 펀드는 환율 위험이 없어 환헤지 개념 자체가 없음. 국내 87.7%(29,040/33,107) 결측 vs 해외 0.8%(435/51,628).
  fd_nast_suma:
    korean_name: 펀드 순자산
    missing_reason: missing
    unit: krw
    answerable_n: 9282          # 종목 11,130(오염 배제) 중 · 0값 294 를 추가 배제하면 8,988
    evidence_grade: B
    answer_policy: >-
      순자산 Top-N 질의는 sale_yn='판매중' 으로 한정하고 모수(answerable_n)를 밝힐 것.
      🔴 0값 294종목은 zero_as_missing 으로 배제한 뒤 정렬할 것 — 안 하면 최하위를 점거한다.
      🔴 펀드 단위 집계는 **MAX** 를 쓸 것. SUM 은 3.31배 과대계상이다 (아래 집계함정 참조).
    집계함정: >-
      🔴 이 값은 '클래스별 순자산' 이 아니라 **펀드 순자산이 클래스마다 반복 기록된 것**이다.
      실측(2026-08-18) — 삼성MMF법인제1호 C·Cp 두 클래스가 모두 12,440,162,407,400 원.
      다클래스 펀드 1,513개 중 1,144개(75.6%)가 전 클래스 동일값이며,
      0 을 결측으로 정규화하면 1,234/1,502(82.2%) 로 올라간다.
      전체 SUM 1,545조 8,239억  vs  펀드별 MAX 합 466조 7,214억  →  SUM 이 3.31배 과대계상.
      ⚠️ 0 배제 후에도 값이 갈리는 다클래스 펀드가 268개 남는다 — 이 펀드들은 MAX 도 근사값이며
      클래스별 순자산인지 기록 시점 차이인지 미확정이다. 펀드 단위 순자산 답변에 이 한계를 붙일 것.
    sql_펀드단위: >-
      SELECT or_co_xtn_itt_cd, <fund_key>, MAX(fd_nast_suma)
        FROM public_funds WHERE fd_nast_suma > 0 GROUP BY 1,2
      (<fund_key> 는 query_rules.펀드단위 의 CASE 표현. 🔴 SUM 금지)
    note: >-
      결측 1,848종목(16.60%) — 판매완료 63.1% vs 판매중 1.8% (34.8배).
      ⚠️ 이전 note 의 '판매완료 59.0%(11,390/19,300) vs 판매중 1.5%' 는 **행 기준**이었다.
      2026-08-18 종목 기준으로 재산출했다. 판매중단 펀드에 집중되나 완전 대응은 아니라 missing 유지.
  zrin_fd_ivst_risk_gcd:
    korean_name: 제로인펀드투자위험등급코드
    missing_reason: missing
    answerable_n: 8565          # 종목 11,130(오염 배제) 중 결측 2,565
    unit: grade
    layer:
      scale: '1~6 (현행 DB 저장형태는 REAL 1.0~6.0 — 2026-08-18 감사 정정, normalization.numeric_string_columns 참조)'
      direction: 🔴 낮을수록 위험 (1=매우높은위험, 6=매우낮은위험) — 직관과 반대
      note: >-
        제3자 평가사(제로인) 산출. ETF·채권 테이블의 위험등급과 산출 주체·기준이 다르다.
        상품군을 넘나드는 '위험등급 3등급 상품' 질의는 서로 다른 잣대를 섞는 것이므로 근거를 밝힐 것
    결측의_축: >-
      🔴 결측의 지배 변수는 **판매상태**다 (2026-08-18 실측, 값사전 §7.4·§7.5).
        판매완료 2,693종목 중 2,546 결측 (94.5%)
        판매중   8,445종목 중    27 결측 ( 0.3%)     →  295.7배
        역방향   결측 2,573 중 2,546(99.0%)이 판매완료
      → 판매 중단 상품은 평가사가 등급을 갱신하지 않는 것으로 보인다.
      ⚠️ 완전 대응은 아니다 — 판매완료인데 등급 보유 147종목(5.5%)이 있고,
      그중 상장지수(ETF) 46종목(31.3%)이다. 전체 ETF 는 62종목(0.6%)뿐이므로 **50배 과대표집**이다.
      → ETF 계열은 다른 규칙을 따른다. ETF 관련 질의에 이 축을 적용하지 말 것.
      ⚠️ 인과로 서술 금지 — 단방향만 성립한다. sale_yn 을 직접 읽어 병렬 서술할 것.
      ⚠️ 이전 note 의 '전 운용유형에 걸쳐 7~45%' 는 틀린 게 아니라 **다른 축**을 본 것이다
      (운용유형 축에서는 흩어지고, 판매상태 축에서는 거의 완전 대응한다).
    판매중_결측_27종목:
      _note: >-
        ✅ 전수 확인 완료 (2026-08-18). 27종목 = 펀드 18개 · 평균 1.5 클래스.
        축 B(판매상태)의 마지막 예외였고, 두 조건으로 설명된다.
      evidence_grade: B
      필요조건_순자산: >-
        🔴 **27/27 전원이 순자산 150억 미만**이다 (최대 142.5억).
        판매중 & 순자산 150억 이상 5,327종목에서 등급결측은 **0건**이다.
          0~10억      721종목 → 결측 13 (1.80%)
          10~50억     947종목 → 결측  5 (0.53%)
          50~150억  1,297종목 → 결측  9 (0.69%)
          150억 이상 5,327종목 → 결측  0 (0.00%)   ← 상한
        ✅ 답변에 쓸 수 있는 긍정 사실: **순자산 150억 이상의 판매중 상품은 위험등급이 전건 수록**돼 있다.
      동반조건_신규설정: >-
        25/27 (92.6%)이 수익률 9기간 전무다 — 신규 설정 펀드.
        예외 2종목은 수익률 이력이 정상이나 순자산이 4억·13억으로 소규모다
        (KR518101007M 디더블유에스코리아채권1-1호 ClassP · KR5311791011 하나클래스원특별자산3호 C1).
      🔴_충분조건_없음: >-
        두 조건 모두 **필요조건일 뿐 충분조건이 아니다.** 최고 적중률이 4.85%다 —
          소규모(<150억)          2,965종목 중 결측 27  적중률 0.91%  포착 100.0%
          수익률 전무               925종목 중 결측 25  적중률 2.70%  포착  92.6%
          소규모 AND 수익률전무       515종목 중 결측 25  적중률 4.85%  포착  92.6%
        → '소규모 신규 펀드라서 등급이 없다' 고 서술하면 거짓이다. 같은 조건의 대다수는 등급을 보유한다.
      🔴_형제_우회_불가: >-
        형제 클래스 대조 결과 — 형제 전원 보유 **0종목** · 형제 전원 결측 14 · 형제 없음 13.
        즉 **클래스가 아니라 펀드 단위로 통째로 없다.** contaminated_rows 의 8종목처럼
        형제에서 값을 조달하는 우회가 이 컬럼에는 불가능하다.
      기각된_가설: >-
        · 미등록 펀드 → ❌ fss_itm_no·kofia_fd_ccd 를 27/27 전원 보유 (판매중 기준선 86.5%·88.1%)
        · 대체 위험 신호 보유 → ❌ prfd_attr_cd T축 7.4% · P축 7.4% (기준선 8.7% · 16.9%) — 기준선 이하
        · 운용사 관행 → ❌ 최다 운용사도 판매중 600종목 중 14종목(2.33%)뿐. 특정 펀드 2개
          (KB K-성장과지배구조30 7클래스 · KB글로벌전환사채 5클래스)에 몰린 것이 운용사 편중처럼 보인 것
        · 상품 유형 → ❌ 채권혼합 1.26% · 재간접 0.37% · 특별자산 8.33%(모수 12). 유의한 편중 없음
      answer_policy: >-
        결측 27종목은 '평가 데이터가 제공되지 않았습니다' 로 답한다 (missing 문안 그대로).
        🔴 '소규모라서' · '신규 설정이라서' 를 사유로 대지 말 것 — 충분조건이 아니다.
        모수를 밝힐 때는 판매중 8,445 중 8,418 (99.68%) 을 쓴다.
    evidence_grade: C
    answer_policy: >-
      🔴 비교 전 CAST(... AS INTEGER) 로 맞출 것 (normalization.numeric_string_columns).
      ⚠️ 2026-08-18 감사 정정 — 현행 재빌드 DB 는 REAL 저장이라 ='6' 도 2,397행이 나온다
      (이전 문구 "='6' 0건 · ='6.0' 338건" 은 구 dtype=str 빌드 기준이었고 338 은 행이 아니라 종목 수였다).
      CAST 규칙은 두 저장형태 모두에서 안전하므로 유지한다.
      🔴 숫자가 작을수록 위험이 크다(1 매우높음 ~ 6 매우낮음). 직관과 반대이므로 답변에 방향을 밝힐 것.
      위험등급 필터 질의는 모수 77,203/95,619 를 명시.
      범위 이탈값 '20054.0' 은 배제 (normalization.invalid_values).
    note: >-
      결측은 전 운용유형에 걸쳐 있음(7~45%) — 특정 유형 문제가 아니라 평가사(제로인)가 등급을
      산출하지 않은 펀드로 보임. ⚠️ '평가사가 산출하지 않았다' 는 추정이며 관측은 '유형과 무관하게 흩어짐' 까지다.
      값 7종 = 정상 6종(1.0~6.0) + 오염 1종('20054.0' — 수탁사코드 00020054 가 밀려 들어온 값).
  zrin_fd_ivst_risk_grd_nm:
    korean_name: 제로인펀드투자위험등급명
    missing_reason: missing
    evidence_grade: A
    answer_policy: >-
      🔴 등급명으로 조회하면 공백 변형 때문에 누락이 생긴다.
      '높은 위험'/'높은위험' · '보통 위험'/'보통위험' 두 표기를 모두 허용하거나
      조회 전 공백을 제거할 것 (normalization.value_variants).
      등급명보다 zrin_fd_ivst_risk_gcd 로 필터하는 편이 안전하다.
    note: >-
      명칭 9종 = 정상 7종 + 공백 변형 2종. 코드 7종과의 차이가 이것으로 전부 설명된다.
      오염 행에서는 이 칸에 or_attr_desc 값('06')이 들어가 있다 (normalization.contaminated_rows).
  fd_yr1_ern_r:
    korean_name: 펀드 1년수익률
    missing_reason: mixed
    answerable_n: 7017          # 종목 11,130(오염 배제) 중 · 기간별 값은 answerable_n_by_period
    answerable_n_by_period:
      _note: >-
        종목 단위 · 오염 9종목 배제 · 모수 11,130 (2026-08-18 실측).
        🔴 여기서 다시 zero_as_missing.수익률_9기간전부0(69종목)을 빼야 최종 유효 모수가 된다.
        Top-N·평균 질의는 이 숫자를 답변에 밝힐 것.
      fd_wk1_ern_r: 7600
      fd_mm1_ern_r: 7570
      fd_mm3_ern_r: 7497
      fd_mm6_ern_r: 7340
      fd_yr1_ern_r: 7017
      fd_mm18_ern_r: 6879
      fd_yr2_ern_r: 6360
      fd_yr3_ern_r: 6102
      fd_yr5_ern_r: 5580
    answer_policy: 수익률은 **누적**임을 답변에 명시할 것 ('3년 수익률 10.5%' 를 연 10.5% 로 오해 방지). 결측 시 패턴을 보고 응답을 가를 것 —
      신생 펀드에 '데이터 미제공' 이라고 답하면 안 된다. Top-N 은 모수를 밝히고 수익률정상 규칙(> -100)으로 오류 종목을 제외할 것.
    note: '위험등급 결측과 18,404행 동시 발생, 등급만 결측은 12행. → 수익률과 위험등급이 같은 평가 데이터 소스. / 단위 확정: 누적 수익률(연환산 아님) — 저변동군
      예측오차 누적 0.014 vs 연환산 0.048, MMF 5년 16.07% ≈ (1.03)^5. / ⚠️ 이전 note 의 ''중첩 위반 수천 건'' 은 행 기준 오독이었음.
      종목 기준으로는 127종목(1.1%)뿐이고 98.9%가 운용기간·미평가로 설명됨.'
    unit: percent_cumulative
    applies_to:
    - fd_wk1_ern_r
    - fd_mm1_ern_r
    - fd_mm3_ern_r
    - fd_mm6_ern_r
    - fd_yr1_ern_r
    - fd_mm18_ern_r
    - fd_yr2_ern_r
    - fd_yr3_ern_r
    - fd_yr5_ern_r
    missing_patterns:
      _판정근거: >-
        설정일 컬럼이 없어 중첩 패턴으로 상품 나이를 추정. 짧은 기간→긴 기간 순으로 값이 채워졌는지 본다.
        기간 순서: 1주 → 1개월 → 3개월 → 6개월 → **1년 → 18개월** → 2년 → 3년 → 5년 (1년이 18개월보다 앞)
        🔴 모수 = 11,130 (오염 9종목 배제). 결측 정의 = **NULL 만** — 0.00 은 아래 '0.00_정의영향' 참조.
