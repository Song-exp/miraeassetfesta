# ── 게이트 상수 — HCX 호출 없이 즉답 (R-5 ① 층. 2026-09-01 FND-017 실측: '연평균' 규칙이 프롬프트에
#    실렸는데 플래너는 SQL 을 만들고 답변기는 조회 결과를 두고도 "찾을 수 없다"+출처 안내 면책으로 답했다.
#    층끼리 어긋나는 케이스라 결정층 즉답으로 내린다 — 기타비용 gate_constants 승격과 동형) ──
gate_constants:
  - column: "(연평균·연환산 수익률)"
    value: "미수록"
    triggers: ["연\\s*평균", "연\\s*환산"]
    reason: "연평균·연환산 수익률은 데이터에 없음 — 수익률 8기간은 전부 누적(clarify.수익률) → HCX 없이 즉답"
    answer: "연평균(연환산) 수익률은 데이터에 수록되어 있지 않습니다. 수익률은 모두 누적 기준으로 1·3·6·18개월, 1·2·3·5년의 8개 기간이 수록되어 있습니다. 누적 수익률 기준의 조회나 순위를 원하시면 기간을 지정해 다시 질문해 주세요."

# ── 답변 규칙 — compose_answer 에만 실린다 (loader.answer_context). 조회 결과를 **어떻게 말할지** ──
# 2026-08-30 저녁 신설: columns.*.answer_policy 에 있던 규약은 답변 단계에 전달되지 않았다(채권 §3-H 와 같은 구멍).
answer_rules:
  - "수익률(fd_*_ern_r)은 전부 **누적** 수익률이다 — '3년 수익률 10.5%' 를 연 10.5% 로 말하지 않는다. 기간(1개월·3개월·6개월·18개월·1년·2년·3년·5년)을 명시한다."
  - "기간 미지정 수익률 질의('수익률 좋은 펀드' 등)는 **1년 수익률(fd_yr1_ern_r) 기준으로 답하고**, 1년 기준임을 밝힌 뒤 답 끝에 '다른 기간(1·3·6·18개월, 2·3·5년) 수익률 기준을 원하시면 말씀해 주세요' 안내를 덧붙인다 — 되묻고 끝내지 않는다 (리드 결정 2026-08-31)."
  - "답변에 실린 펀드 중 1년수익률 100% 초과 또는 태그(zrin_attr_nms)에 '레버리지'·'목표달성전환' 이 있으면 '누적 수익률이며 레버리지·전환형·기준가 변경으로 실제 투자 성과와 다를 수 있습니다. 위험등급과 기간을 함께 확인하세요.' 를 붙인다."
  - "기점 오류 3클래스(KR5157450126·KR5153450511·KR5119470012)의 18개월 이상 수익률은 값을 답하되 '기준가 산정 오류가 의심되는 값' 임을 병기한다."
  - "위험등급(zrin_fd_ivst_risk_gcd)은 제로인 평가 1~6등급으로 숫자가 **작을수록 위험**하다(1=매우높은위험, 6=매우낮은위험). 방향을 답에 밝힌다. 결측(422행)은 '평가 데이터가 제공되지 않았습니다' — '소규모라서'·'신규라서' 같은 사유를 지어내지 않는다."
  - "보수(or_co_rwrd_r·sale_co_rwrd_r·trusc_rwrd_r·ofwk_trus_rwrd_r)는 **‰(천분율)** 이다 — 값÷10 이 %. 총보수 컬럼은 없으므로 네 항목의 합을 '총보수(4항목 합)' 로 말하고, 클래스마다 다르다는 점을 밝힌다."
  - "랭킹·집계 답변은 펀드 단위 대표행이다 — 같은 펀드의 클래스가 여럿이면 '클래스 n개(예: A·C·Ce)' 를 병기하고 대표 클래스의 itm_no 를 적는다. 클래스 이름(han_clas_nm: 수수료선취/미징구·온라인/오프라인·퇴직연금)으로 어느 클래스인지 말한다."
  - "최근 분배율(fd_last_dstb_r)은 분배 유무(>0 / =0)만 말한다. 수치·순위는 단위가 확정되지 않아 말하지 않는다."
  - "기준가(bns_bpr)는 상품 간 크기 비교가 무의미하다(설정 시 1,000 기준) — 비교 요청이면 그 이유를 말하고 비교하지 않는다. 기준가를 말할 때는 fd_price_bas_dt 를 병기한다."
  - "'1주 수익률' 질의는 '이 데이터셋에는 1주 수익률이 수록되지 않았습니다' 로 답한다(fd_wk1_ern_r 전건 결측). fd_prsv_r·fd_sbpr 로는 어떤 질의에도 답하지 않는다."
  - "집계·Top-N 답변에는 모수(판매중·공모 8,969행)와 평가 기준일(fd_daily_bas_dt)을 병기한다. 기준일이 2026-08-22 보다 오래된 행이면 그 날짜를 그대로 말한다."
  - "공모 펀드에도 역외펀드(ofsfd_yn=1) 110행이 있다 — '공모에는 역외펀드가 없다' 고 말하지 않는다. 사모(prvo_pbff_desc='사모')는 기본 모수 밖이며, 종목명의 '(사)'·'사모' 표기로 공모/사모를 판정하지 않는다."
  - "종목명은 키가 아니다(45명칭 97행 중복) — 펀드를 특정할 때는 itm_no 를 함께 적는다. 영문명은 itm_eng_nm 이 실제 영문(한글 없음)일 때만 쓰고, 아니면 '영문명 미제공'."
  - "🔴 데이터에 없는 항목을 답할 때 **그 이유를 지어내지 않는다** — '개인정보 보호법상 제한'·'비공개 정책'·'소규모라서'·'신규라서' 는 전부 근거 없는 날조다. '제공된 데이터에 <항목>이 수록되어 있지 않습니다' 로만 말하고, 대체 가능한 항목이 있으면 그것을 안내한다(예: 운용역 → 운용사). 2026-08-31 실측: 펀드매니저 질의에 개인정보 보호법을 사유로 지어냈다."
  - "🔴 이름 부분일치로 **서로 다른 펀드**가 여럿 걸리면(예: 코어테크 / 차이나코어테크 / 글로벌코어테크EMP / 코어테크청년소득공제) 하나를 임의로 골라 대표로 말하지 않는다. 펀드별로 나눠 제시하고, 질문의 이름과 가장 정확히 일치하는 펀드를 먼저 놓는다. 각 펀드는 클래스 n개로 묶어 대표 클래스 itm_no 를 적는다 (2026-08-31 실측: 코어테크 질의에 글로벌코어테크EMP 값 17.41% 를 대표로 제시 — 본체는 188% 대)."
  - "조회로 확정된 수치에 '더 정확한 정보는 해당 금융기관에 문의하세요' 같은 면책을 붙이지 않는다 — 데이터에서 센 값은 그 자체로 정확하다. 불확실성을 밝혀야 하는 것은 커버리지·기준일·모수이지 값이 아니다 (2026-08-31 실측: 정확한 집계 8,528 에 금융기관 문의 권유를 덧붙임)."
  - "🔴 조회된 행을 임의로 생략하지 않는다 — 분포·목록 답변은 결과에 있는 **모든 행**을 옮긴다. 합계가 밝힌 모수와 다르면 그 차이를 설명한다. 전수를 조회하고도 '일부입니다'·'더 많을 수 있습니다' 라고 말하지 않는다 (2026-09-01 실측: 19개 유형 중 16개만 옮기고 합계 500 부족한 채 '일부' 라고 서술)."
  - "조회 결과에 없는 펀드·수치를 예로 들지 않는다."
  - "종목명에 '사모' 가 들어가도 조회 모수가 공모(prvo_pbff_desc='공모')면 **공모펀드**다 — '사모투자재간접형' 은 사모펀드에 재간접 투자하는 공모펀드라는 뜻이다. 이름만 보고 사모라고 말하지 않는다 (2026-08-31 실측: 공모 조회 결과를 '사모 헤지펀드' 로 소개)."
  - "조회된 몇 행만 보고 '모든 펀드가 ~하다' 는 전칭 서술을 하지 않는다 — 결과는 WHERE 조건으로 걸러진 부분집합이다. 서술은 '조회된 N건 기준' 으로 한정한다 (2026-08-31 실측: 1등급 필터 5행을 보고 '모든 펀드가 매우 높은 위험' 오서술)."

# ── 역질문 분기 — 되묻기는 답변불가 문항의 정답 형태 중 하나 (주최 확인 8/25). 동반 신호가 있으면 되묻지 않는다 ──
clarify:
  다의어:
    수익률: "기간 8종(1개월·3개월·6개월·18개월·1년·2년·3년·5년, 전부 누적) — 기간 미지정이면 **되묻지 말고** 1년(fd_yr1_ern_r)을 기본값으로 답하고 1년 기준임을 명시 + 다른 기간을 원하면 말해달라는 안내를 덧붙인다(리드 결정 2026-08-31, answer_rules 참조). '연평균'·'연환산' 을 물으면 데이터에 없다고 답한다."
    보수: "운용(or_co)·판매(sale_co)·수탁(trusc)·사무관리(ofwk_trus) 4항목 / 총보수(4항목 합) — 미지정이면 총보수(합)로 답하고 항목별 값을 병기. 선취·후취 수수료는 보수가 아니라 클래스 정책(han_clas_fee_type)."
    등급: "위험등급(zrin_fd_ivst_risk_gcd, 제로인 1~6) — 펀드에는 신용등급이 없다. '등급' 만 물으면 위험등급으로 답하고 그렇게 읽었음을 밝힌다."
    펀드이름: >-
      부분일치가 복수 클래스·복수 펀드에 걸리면 목록으로 되묻거나 클래스 n개로 묶는다 — 한 행을 임의로 고르지 않는다.
      🔴 브랜드·운용사 이름만으로 '~펀드'(예: '삼성 펀드')를 물으면 수백 행이 걸린다(삼성 962행/236펀드) —
      SQL 대신 "CLARIFY: '삼성' 이름의 펀드가 236개입니다. 특정 펀드명이나 유형(주식형·채권형·MMF 등)을 알려주시겠어요?"
      처럼 되묻는다. 컬럼 정의를 나열하는 답은 금지.
  사람의_선택:
    규모_MMF포함: "'규모 큰 펀드' 는 순자산(fd_nast_suma) 상위가 법인 MMF(138행, 최대 12.4조)로 채워진다 — MMF 를 포함할지 묻거나, 포함/제외 두 답을 나란히 낸다."
    클래스: "같은 펀드라도 A(선취)·C(후취)·e(온라인)·P(연금) 클래스는 보수가 다르다 — '보수 낮은 펀드' 는 어느 클래스 기준인지 밝힌다(기본: 펀드 단위 대표행 + 클래스 병기)."
    안전의_정의: "위험등급 6등급(매우낮은위험) → MMF·채권형 / 원금보존추구 태그 — 둘은 다른 개념이다."

entities:
  FundClass:
    kind: entity
    role: 주 노드
    source: itm_no
    count: 23676
    label: itm_nm
    note: >-
      판매 단위(클래스) = 행. 2차 75컬럼 중 관계 컬럼을 뺀 전부가 여기 붙음. 공모 14,716 · 판매중 10,962.
      🔴 2026-08-30 — **KG 에 FundClass 노드는 없고 `belongsToFund` edge 도 0건이다. 이것은 결함이 아니라 설계다** —
      클래스→묶음 관계를 마스터 컬럼 `rptt_ksd_itm_no` 가 이미 담고 있어 23,676 노드와 edge 를 중복 생성하지 않는다
      (`gen_fund_structure_auto.py` docstring). 클래스 단위 조회·집계는 KG 가 아니라 `itm_no` 로 한다.
  Fund:
    kind: entity
    source: (or_co_xtn_itt_cd, mtco_itm_no) 합성키
    count: 14467                 # 2026-08-31 원값 기준(zero-pad 시 14,409). 구 14,522 는 규칙 ④ 미적용 시점
    label: null
    relation: FundClass -belongsToFund-> Fund
    note: >-
      '모펀드' 가 아니다 — 클래스를 걷어낸 '펀드' 단위(운용사 내부 관리 단위). 모자형 모펀드는 이 테이블에 없다(1차 판정 유지).
      순자산은 이 단위 MAX. 🔴 count 14,467 은 더미 배제 후 원값 기준·사모 포함 — 판매중 4,340 (zero-pad 기준 14,409 · 4,305, 2026-08-31).
      🔴 **이름 충돌 주의 (2026-08-30 F-2 판정: 이름 유지 · note 로 명시)** —
      여기의 Fund(운용 단위, `(or_co_xtn_itt_cd, mtco_itm_no)` 14,467)와 **KG 의 Fund 노드는 다른 축**이다.
      KG `node_type='Fund'` 7,600 = `rptt_ksd_itm_no` 묶음 6,883 + 마스터 밖 MotherFund 717
      (`shared/fund_structure_auto.yaml`). 집계·순자산은 `(or_co, mtco)` 기준, KG 개체 조회는 `rptt` 기준으로 읽을 것.
      개체를 분리(ManagementFund/KsdFund/FundClass)하지 않는 이유 — 제출물 `.ttl` 클래스명과 제안서 도해가 함께 바뀌는데,
      이 충돌이 현재 오답을 만들고 있지 않다. 분리 검토 이력은 `공모펀드_검토_결정대기_2026-08-29.md` §3.
    용어규칙: mtco 단위는 '펀드'. '모펀드' 는 모자형에만 쓰고 이 테이블에는 없다고 명시할 것
  ShareClass:
