      · 태그로 충분: 월지급 → '분배식' · 레버리지 여부 → '레버리지' · 인버스 → '리버스' · 분할매수 → '분할매수'
      · 태그 OR 이름: 목표전환 → (태그 '목표달성전환' OR itm_nm LIKE '%목표전환%') · 인덱스 → (태그 '인덱스' OR itm_nm LIKE '%인덱스%') ·
        TDF → (태그 LIKE 'TDF%' OR itm_nm LIKE '%TDF%') · 빈티지 → 태그 'TDF2045' OR itm_nm LIKE '%2045%'
