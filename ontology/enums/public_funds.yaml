cross_domain:
  _note: 다른 상품군과의 연결. 교차질의(주최 확정 — 한 호출에서 복수 테이블)의 재료.
  상장지수_중복:
    발견: 종목명 '상장지수' 236행(2차) — domestic_etfs 와 중복 가능. 1차엔 62종목 중 23종이 ETF 마스터에도 존재
    조인: 🔴 itm_no ∩ pd_itm_no = 0건(1차). 종목명(공백제거) 일치로만 — 2차 재대조 미실시
    영향: 두 테이블을 합치면 이중 계상. 교차 Top-N 에서 query_rules.ETF제외 적용 후 ETF 마스터 쪽을 채택
  식별자_대역:
    public_funds: KR51 · KR50 · KR55 · KR52 · K55x(std)
    domestic_bonds: KR60 · KR35 · KR64 · KR61
    domestic_etfs: KR74 · KRG5 · KR70 · KR72
    note: ISIN 12자리 접두 대역이 겹치지 않아 직접 조인 불가. 앞 4자리로 상품군 판별 가능
  벤치마크_교차: bmrk_nm(389종) ↔ domestic_etfs.ref_base_index(905종) — 표기 체계 상이, 지수명 정규화 매핑 필요(codebooks/index_master 재작성 대상)
  수익률_교차: fd_yr1_ern_r(누적 1년) ↔ domestic_etfs.du_er_1y — 둘 다 1년이나 산출 주체·기준일이 다름. 해외ETF는 1년수익률 컬럼 없음(du_er_1d 뿐) → 교차 TOP-N 에서 "미수록·제외" 명시
  수탁사: trusc_xtn_itt_cd(50종)에 대응하는 컬럼이 다른 3개 테이블에 없음 — 공모펀드 전용 관계

# ── 외부 문서 추출 사실 — 2026-08-20 간이투자설명서 R3 전수 (1차 판매중 8,443건) ──
external_facts:
  source: data/external/lookups/fund_facts_from_prospectus.csv
  coverage: "1차 판매중 8,445종목 중 8,443 — 2차 판매중 10,962(사모 포함)와 모수가 다르다. itm_no 로 조인해 붙는 만큼만 사용"
  제약: "발행 시점 불변 사실만 사용 — 시계열 수치 인용 금지. 🔴 주최 데이터 우선: 마스터에 값이 있으면 마스터, 없을 때만 설명서"
  위상_2026-08-25: >-
    2차 마스터가 보수 4종·개방/단위·자펀드 태그를 직접 제공하므로 이 파일은 (a) 보수 단위 확정용 대조 자료
    (b) 마스터 결측분 보완 (c) 총보수(TER)·환매수수료 등 마스터에 없는 항목 — 로 강등. (a)는 2026-08-25 완료.
  columns:
    redemption: "개방형/폐쇄형 — 2차 태그 '개방'(C103)과 교차 검증용"
    issuance: "추가형/단위형 — fd_set_pcd·태그 C102 와 교차"
    is_masterfeeder: "문서 '모자형' 표기 — 태그 M109(자펀드) 보완용"
    fee_total_pct: >-
      클래스별 총보수(근사). ✅ 단위 대조 완료(2026-08-25, ext_fund_page 8,925건 — 비율 10.0) — 이제 "간이투자설명서 기재 총보수(TER)" 보완 인용 전용.
      마스터 4종 합÷10(derivation_rules.totalFeeApprox)은 기타비용 미포함이므로 TER 질의에는 이 값을 병기.
