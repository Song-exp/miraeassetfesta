      **대체 식별자로 제시할 수 있다** — 값사전 §7.6 의 unresolved 답변 문안 참조.
      결측 시 sale_yn 을 직접 읽어 병렬 서술할 것. 인과로 서술 금지.
    note: >-
      itm_no 와 함께 **완전 유일**한 두 식별자 중 하나 (2종목+ 가리키는 값 0건).
      길이 이탈 소수 건('PP'·'12'·'12355'·'1524')은 더미 규칙에 걸려 결측으로 처리된다.

  thco_sale_yn:
    korean_name: 당사판매여부
    missing_reason: none        # 🔴 빈칸은 결측이 아니라 값이다
    evidence_grade: A
    answerable_n: 11130
    value_semantics:
      'Y': 당사(미래에셋증권) 취급
      '': 🔴 당사 미취급 — 'N' 의 자리다. 결측이 아니다
    evidence: >-
      원본 엑셀 전수에도 'N' 이 없다 — 'Y' 91,594행 · 빈칸 4,024행 · 오염 1행(2026-08-18 확인).
      적재 사고가 아니라 소스 자체가 Y / 빈칸의 이진 구조다.
    answer_policy: >-
      🔴 **빈칸이 두 뜻을 겸한다.** 뜻을 하나로 말하지 말고 sale_yn 을 함께 읽을 것 —
        빈칸 + 판매완료  683종목 : 레거시(오래되어 진열대에서 내린 상품). 데이터가 전면적으로 얕다
        빈칸 + 판매중     11종목 : 채널 미취급. 데이터는 정상이다 (fss 결측 0건)
      ❌ "당사에서 취급하지 않는 상품이라 정보가 부족합니다" — 판매중 11종목에서 거짓이다.
         미래에셋국민참여형국민성장 4종목은 순자산 2,000.3억·위험등급 1등급까지 정상 수록돼 있다.
    결측의_대리지표: >-
      🔴 thco 단독은 데이터 품질 신호가 아니다. **(빈칸 AND sale_yn='판매완료')** 조합이
      '상품 나이' 의 대리 지표로 작동한다 (설정일 컬럼이 없어 나이를 직접 못 잰다).
      판매완료 안에서 이 조합의 독립 효과 — rptt 5.2%→55.9%(10.8배) · ksd 6.9배 · mtco 3.6배 ·
      fss/kofia 1.58배. 🔴 단 위험등급 0.86배 · 수익률 0.93배로 **역전**한다
      → 식별코드 축과 평가데이터 축은 다른 축이다 (값사전 §7.5).
    note: >-
      ⚠️ docs/domain/public_funds.md §2.3·§7.1 이 이 컬럼을 Y/N 으로 적어두었으나 N 은 없다 — 정정 대상.
      오염값 'KRZ50226929C' 1건은 ksd_itm_no 값이 들어온 것이다 (invalid_values).

  mtco_itm_no:
    korean_name: 운용사종목번호
    missing_reason: missing
    answerable_n: 11069         # 종목 11,130 중 실질결측 61 (전부 더미)
    evidence_grade: C
    evidence: 결측 62건(판매중 10건)으로 산발적. 운용사 29곳 중 25곳이 0% — 구조적 현상이 아니라 소수 데이터 결함으로 판단.
    answer_policy: >-
      결측 62건(판매중 10건)으로 소수. 펀드 단위 집계에서 이 종목들은 모수에서 빠지므로 모수를 밝힐 것.
    note: >-
      실측(2026-08-17). 선행 0 손실로 길이가 흔들리므로 zfill(7) 보정 후 사용.
      ⚠️ 단독 키로 조인 금지 — 운용사 내부 번호라 65종이 최대 3개 운용사에 걸친다.
      펀드 단위 키는 (or_co_xtn_itt_cd, mtco_itm_no) 합성키다.

  int_dvd_desc:
    korean_name: 이자배당구분코드 설명
    missing_reason: none
    evidence_grade: A
    note: >-
      2026-08-18 감사 신설 — 준상수. '배당' 99.99% vs **'이자' 10행 = 단 2종목**
      (KR5019251406 G4한바구니장기 · KR5046101001 칸서스국공채MMF법인1호, 둘 다 판매완료).
      contaminated_rows 귀속표가 이 컬럼의 99.9% 값('배당')을 인용하므로 판정 블록을 세워둔다.
    answer_policy: >-
