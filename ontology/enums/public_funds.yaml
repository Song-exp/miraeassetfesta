      #     — "수익률·총보수 같은 컬럼 질의 시 값이 0 인 행은 아예 포함하지 않는다".
    센티넬:
      fd_last_dstb_r: -100 (73행, 전부 판매완료) — 정렬 전 > -100
      수익률_8기간: < -100 은 오류값 — 2차 0건이나 규칙 유지(query_rules.수익률정상)

  # ── 숫자형 표기가 흔들리는 컬럼 ──────────────────────────────────────
  numeric_string_columns:
    _note: REAL 저장(1.0~6.0 · 0.0/1.0). 비교 전 CAST(… AS INTEGER). 0패딩 코드(fd_set_pcd·pfiv_sale_cntl_tcd·fd_estb_ctry_cd·or_co·trusc·식별번호)는 build_db CODE_COLUMNS 로 문자열 보존됨.
    columns:
    - zrin_fd_ivst_risk_gcd
    - zrin_btyp_cd
    - zrin_pcd
    - frc_bpr_itm_yn
    - hdge_fd_yn
    - ofsfd_yn
    규칙: 비교 전 CAST(컬럼 AS INTEGER)
    날짜_REAL: fd_daily_bas_dt · fd_price_bas_dt · fd_last_dstb_actg_bss_dt · fd_last_dstb_actg_eot_dt 는 yyyymmdd 가 REAL(20260821.0)로 저장 — CAST 후 문자열 비교.

  # ── 원본 따옴표 오염 (1차 사고 — 2차에서 소멸) ──────────────────────
  contaminated_rows:
    _note: >-
      ✅ 2026-08-25 — 감지 조건(mtco_itm_no LIKE '%"%' OR itm_no='"') 0행. 1차의 오염 66행/9종목·귀속표는 2차 데이터에 없다.
      감지 조건은 재적재 시 재감지용으로 유지한다.
    감지: mtco_itm_no LIKE '%"%' OR itm_no = '"'
    영향_2차: 0

  # ── 같은 뜻인데 표기가 갈리는 값 ──────────────────────────────────────
  value_variants:
    _note: 정확일치 조회 시 누락. 조회 전 정규화하거나 두 표기를 모두 허용할 것
    zrin_fd_ivst_risk_grd_nm:
      매우 높은 위험: []
      높은 위험: ['높은위험']       # 20행
      다소 높은 위험: []
      보통 위험: ['보통위험']       # 8행
      낮은 위험: []
      매우 낮은 위험: []

  invalid_values:
    _note: >-
      등재 0건 유지. 🔴 2026-08-30 C-4-03 재실측 — 구 기술 "1차 이탈값 5종 전부 소멸" 은 부정확했다. 3종만 소멸이고 2종은 남아 있으며 성격이 서로 다르다:
        · '20054.0' · '06' · '해외' → 소멸 확인.
        · '00080008' 4,536행(or_co_xtn_itt_cd) → 🔴 **이탈값이 아니다. 미래에셋자산운용**
          (codebooks/asset_manager.csv status=confirmed · 판매중 2,306). 1차가 최대 운용사 코드를 오염값으로 잘못 올렸던 것 —
          **이 값을 배제하면 미래에셋 펀드가 통째로 사라진다. 절대 필터에 걸지 말 것.**
        · 'KRZ50226929C' 1행(ksd_itm_no) → 여전히 이탈값. 단 단독 건이 아니라 KRZ 절단 계열의 일원이다
          (KRZ · KRZ500 · KRZ0 · KRZ5 … 고정 12자에서 길이 이탈 67행).
      → 교훈: 개별 값 열거는 이 데이터에 맞지 않는다(정상값을 오염으로 올리고, 같은 계열을 놓친다). 형식 이탈은 길이·형식 규칙으로 판정한다.
        미판정 상태이며 규칙안은 검토기록 `공모펀드_검토기록_2026-08-30.md` §9-2 에 있다.

  constant_columns:
    _note: >-
      2차에서 상수 컬럼 없음 — 1차의 hdge_fd_yn·ofsfd_yn 은 사모 유입으로 1 값이 생겼다(210·116행).
      🔴 2026-08-30 C-4-06 재실측 — 구 기술 "공모 한정 시 사실상 상수" 는 두 컬럼 중 하나에만 맞다:
        · hdge_fd_yn  전체 0:23,466 / 1:210  · **공모 한정 0:14,716 (전부)** → 공모 한정 상수 ✅
        · ofsfd_yn    전체 0:23,560 / 1:116  · 공모 한정 0:14,606 / **1:110** → ❌ **상수가 아니다.**
          공모·역외펀드 110행이 실재하므로 '공모에는 역외펀드가 없다' 는 취지의 답변을 하지 말 것.
        · frc_bpr_itm_yn 전체 0:23,263 / 1:413 · 공모 한정 0:14,626 / 1:90 (참고 — 원래도 상수 아님)

query_rules:
  종목단위: 행 = itm_no (dedup 불필요 — 2차)
  펀드단위: >-
    GROUP BY or_co_xtn_itt_cd,
             CASE WHEN length(mtco_itm_no) >= 7 THEN mtco_itm_no
                  ELSE substr('0000000' || mtco_itm_no, -7) END
  # 펀드단위 근거(사람용 — 프롬프트 비대상): zero-pad 7자 규약 정본은 리드 판정 08-31. 실측 — 기본모수 패딩 병합
  # 전수 대조 충돌 0건 · 짧은 mtco 7,962행 정상(가변 길이). 검증 수치(08-31 재실측): 더미 배제 후 합성키 distinct
  # 14,467(원값 · 판매중 4,340) · zero-pad 후 14,409(판매중 4,305). 구 08-25 의 14,522·4,342 는 반복문자 규칙 미적용
  # 시점, 1차의 4,643 은 1차 모수. 12자리 더미 '000000000000' 은 배제 조건에 걸린다. (audit EN-Fund/EN-Fund-pad 가 검증)
  펀드단위_근거: >-
    GROUP BY mtco_itm_no 단독은 틀린 집계 — 415종의 값이 2개 이상 운용사에 걸친다. 짧은 mtco 는 정상 값이며
    zero-pad(7자)가 정본, 길이 8+ 는 자르지 말 것. 더미 mtco(기본모수 11행)는 패딩하면 남남끼리 뭉친다 —
    itm_no 로 폴백하거나 행 단위로 둔다(역외 NULL 110행과 같은 처리).
  추천개수: "추천·상위·Top-N 질의에 개수가 없으면 LIMIT 5 (개수를 말했으면 그 수) — 답에 '상위 5개 기준' 을 밝힌다"   # 08-31 paired: 미지정 시 30행이 나가 gold(5)와 어긋났다
  # ── 범주 의미 축 — columns 판정을 규칙으로 승격 (08-31 커버리지 감사: 값 목록만 실리고 의미가 안 실리던 축) ──
  개인법인:
    triggers: [개인, 법인]
    text: >-
      pers_corp_desc 의 '해당없음'(기본모수 6,864행)은 결측이 아니라 **개인·법인 전용이 아닌 일반 펀드**다.
      '개인이 가입할 수 있는' = pers_corp_desc IN ('개인','해당없음') · '법인 전용' = '법인' ·
      '개인 전용' = '개인'. '개인'만 걸면 일반 펀드 6,864행이 통째로 빠진다. 답에 전용/일반 구분을 밝힌다.
  해외구분:
    triggers: [해외, 국내외, 글로벌]
    text: >-
      해외 투자 여부는 ovrs_fd_desc('해외' 4,483 · '국내외혼합' 878 · '국내' 3,498 — 기본모수) — '해외 투자 펀드' 는
      IN ('해외','국내외혼합') 이 기본(혼합 포함 여부를 답에 밝힌다). 세부 지역(아시아·북미 등)은 fd_ivst_rgn_desc.
  # 🔴 2026-08-31 밤 정정 — 구 '헤지펀드없음' 규칙은 **오거절을 만들던 오류**였다(리드 지적).
  #    hdge_fd_yn=1 이 판매중·공모 0행인 것은 맞지만(210행 전부 사모), 그 플래그는 "펀드 자체가
  #    사모 헤지펀드로 등록됐는가" 만 표시한다. 개인이 공모로 살 수 있는 헤지펀드는 **사모투자재간접
  #    공모펀드** 형태로 실재한다 — 실측 66행/14펀드(미래에셋헤지펀드셀렉션·타임폴리오위드타임·
  #    머스트원앤온리 등). 플래그 한 컬럼만 보고 "없다" 고 단정해 조회조차 하지 않았다.
  헤지펀드:
    triggers: [헤지펀드, 헤지 펀드, 헤지 전략, 절대수익]
    text: >-
      🔴 hdge_fd_yn 으로 풀지 말 것 — 그 플래그는 사모 등록분만 표시해 공모에서 0행이고, 그걸 근거로
      "없다" 고 답하면 오답이다. 공모로 판매되는 헤지펀드는 **사모투자재간접 공모펀드** 형태다:
      (zrin_ptn_nm = '글로벌헤지전략' OR itm_nm LIKE '%헤지펀드%' OR itm_nm LIKE '%사모투자재간접%')
      — 기본모수 실측 66행/14펀드(2026-08-31). 답변에는 "사모 헤지펀드에 재간접 투자하는 공모펀드"
      라는 구조를 밝힌다. 🔴 '인덱스헤지'·'(H)' 는 환헤지(exchdg_yn)라 헤지펀드가 아니다 —
      이름에 '헤지' 만 걸면 환헤지 상품이 섞인다. 시장중립(zrin_ptn_nm='시장중립')은 별개 전략이라
      질문이 '절대수익·시장중립' 을 명시할 때만 포함하고, 포함 여부를 답에 밝힌다.
      🔴 이 펀드들은 **공모**다 — 종목명의 '사모투자재간접형' 은 '사모펀드에 재간접 투자하는' 이라는
        투자 대상 표기이지 이 상품이 사모라는 뜻이 아니다. 실측에서 답변기가 '사모 헤지펀드를 대신
        소개한다' 고 오독했다 — 조회 모수가 공모임을 답에 분명히 밝힌다.
  # 🔴 2026-08-31 밤 신설 — 마스터 45컬럼에 없다고 '없는 정보' 로 단정하던 오거절을 막는다(리드 지적 후속).
  #    설정일·환매조건은 마스터에 없지만 **투자설명서 수집분(ext_fund_page)에 있다**. 커버리지 실측(기본모수 8,969 대비).
  설명서항목:
    triggers: [설정일, 설정된, 언제 설정, 오래된, 환매, 환매수수료, 환매 조건, 환매금지, 모펀드, 투자설명서, 설명서]
    text: >-
      마스터에 없는 아래 항목은 투자설명서 수집분 ext_fund_page 에 있다 — JOIN 으로 답한다.
      조인: ext_fund_page.itm_no = public_funds.itm_no
      🔴 두 테이블 모두 itm_no 를 가지므로 별칭을 붙이고 **모든 컬럼을 한정**한다 —
        FROM public_funds p JOIN ext_fund_page e ON e.itm_no = p.itm_no … SELECT p.itm_no, e.estb_dt
        (한정하지 않으면 'ambiguous column name: itm_no' 로 실행이 죽는다)
      · estb_dt 설정일(YYYYMMDD 문자열, 8,408행 93.7%) — '가장 오래된/신생 펀드' 는 이걸로 정렬한다
      · redemption_fee_desc 환매수수료 서술(297행 3.3% — **모수를 반드시 밝힌다**) ·
        redemption_prohibited 환매금지 여부(93.7%) · redemption_pay_rule 환매대금 지급일
      · total_fee_pct·sale_fee_pct·mgmt_fee_pct·trust_fee_pct·admin_fee_pct 설명서 보수(%, 93.7%)
        — 마스터 보수 4종(‰)과 **단위가 다르다**. 섞어 쓰지 말고 어느 출처인지 밝힌다.
      · class_desc_ko 클래스 설명(92.2%) · mgmt_co_nm 운용사명 · mother_fund_names_raw 모펀드명
      🔴 커버리지가 100% 가 아니므로 "N건 중 M건에 수록" 을 답에 밝힌다. 수록이 없는 항목
      (운용역 개인·운용 전략 서술)은 여전히 답변 불가다.
  # 🔴 2026-08-31 밤 신설(FND-030 실측) — '미래에셋증권에서 살 수 있는' 질의가 KG 의 수탁사 노드로 가서
  #    trusc_xtn_itt_cd='0016022' 0행 → "데이터에 없다" 오답. 정작 이 질문 전용 컬럼(thco_sale_yn)이 있다.
  당사판매:
    triggers: [미래에셋증권, 당사, 우리 회사, 우리회사, 살 수 있는, 판매하는, 취급, 판매사]
    text: >-
      🔴 '미래에셋증권에서 살 수 있는/취급하는' 은 **판매사** 질의다 — thco_sale_yn = 'Y' 로 푼다
      (기본모수 8,550행 · 2,908펀드. 나머지 419행은 NULL = 당사 미취급).
      미래에셋증권을 운용사(or_co_xtn_itt_cd)나 수탁사(trusc_xtn_itt_cd)로 풀면 안 된다 —
      운용은 미래에셋**자산운용**(별개 법인)이고, 수탁사 코드로 풀면 0행이 난다.
      역할 3종을 구분한다: 운용사 or_co_xtn_itt_cd · 수탁사 trusc_xtn_itt_cd · 당사 취급 thco_sale_yn.
  # 🔴 2026-09-01 신설(FND-035 실측) — "가장 많이 운용하는 운용사" 에 존재하지 않는 mtco_nm 을 쓰고
  #    재생성도 같은 컬럼을 반복해 오거절. 운용사 식별·이름·집계 단위 세 가지가 전부 어긋났다.
  운용사질의:
    triggers: [운용사, 운용하는, 자산운용, 운용회사, 운용 회사]
    text: >-
      🔴 운용사는 or_co_xtn_itt_cd(운용회사대외기관코드)로 식별한다 — 운용사 '이름' 컬럼은 마스터에
      없다. mtco_nm 은 **존재하지 않는 컬럼**이고, mtco_itm_no 는 운용사가 아니라 운용사가 매긴 펀드
      번호다. 이름은 ext_fund_page.mgmt_co_nm 으로 병기한다(코드 폭이 7·8자 혼재라 printf 정규화 —
      합병 이력으로 코드당 이름 2종인 사례 3건이 있으므로 **코드가 정본이고 이름은 참고 병기**다).
      '가장 많이 운용/펀드 수' 는 클래스 행 수(COUNT(*))가 아니라 **펀드 수**다 — 실측: 두 기준의
      순위가 다르다(펀드 수 2위 235 vs 클래스 수 2위 850). 워크드 예시(그대로 쓴다):
      SELECT printf('%08d', CAST(p.or_co_xtn_itt_cd AS INTEGER)) AS or_co, MAX(e.mgmt_co_nm) AS mgmt_nm,
      COUNT(DISTINCT CASE WHEN length(trim(p.mtco_itm_no)) >= 7 THEN trim(p.mtco_itm_no)
      ELSE substr('0000000' || trim(p.mtco_itm_no), -7) END) AS fund_cnt, COUNT(*) AS class_cnt
      FROM public_funds p LEFT JOIN ext_fund_page e ON e.itm_no = p.itm_no
      WHERE p.sale_yn = '판매중' AND p.prvo_pbff_desc = '공모'
      GROUP BY 1 ORDER BY fund_cnt DESC LIMIT 5
      — 답에는 펀드 수 기준임과 클래스 수를 병기한다(실측 1위: 823펀드/2,066클래스).
  # 🔴 2026-09-01 신설(FND-038 실측) — "공모펀드는 유형별로 몇 개씩?" 을 공모/사모 구분으로 읽고
  #    사모 1,993개까지 답에 넣었다. '유형' 은 자산 유형이지 모집 방식이 아니다.
  유형별분포:
    triggers: [유형별, 유형, 종류별, 어떤 유형, 분포, 몇 개씩]
    text: >-
      🔴 펀드의 '유형' 은 **자산 유형**이다 — 공모/사모(prvo_pbff_desc)는 모집 방식이지 유형이 아니다.
      제로인 대유형 zrin_btyp_nm 으로 GROUP BY 한다(기본모수 19종: 해외주식형 2,784 · 주식형 1,773 ·
