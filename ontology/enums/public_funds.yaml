  # 수익률기점오류_제외 — 3건 명시는 하드코딩이 아니라 검증 파이프라인의 출력이다:
  #   탐지(일반 규칙): scripts/scan_return_anomalies.py — 형제 클래스 대비 기간별 이탈 전수 스캔 (DB 갱신 때마다 재실행)
