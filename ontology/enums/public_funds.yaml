    호가 다르면 **다른 펀드**다(클래스가 아니다) — 같은 시리즈 질의는 호별로 묶어 제시.
  이름표기_구조어휘:
    triggers: [목표전환, 전환형, 인덱스, TDF, TIF, TRF, 커버드콜, 만기, 레버리지, 인버스, 월지급, 분배, 배당, 인컴, 분할매수, 빈티지]
