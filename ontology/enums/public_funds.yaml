normalization:
  trim_columns:
  - itm_abrv_nm
  - itm_eng_nm
  - itm_nm
  - kofia_fd_ccd
  - ksd_itm_no
  - rptt_ksd_itm_no
  - std_itm_no          # 2차 — '00000     ' 패딩 위장결측 145행
  - trusc_xtn_itt_cd
  - mtco_itm_no

  # ── 값처럼 보이지만 결측인 것 ────────────────────────────────────────
  dummy_as_missing:
    _note: >-
      🔴 NULL 만 결측으로 보면 틀린다. 식별 코드의 결측 대부분이 0패딩 더미다.
      정규화 없이 조인하면 '000000000000' 하나에 1만 행이 뭉치고, LLM 프롬프트에 원값이 닿으면
      "등록번호는 000000000000입니다" 라고 답한다 — 환각 감점에 직결된다.
    🔴_화이트리스트_필수: >-
      patterns 를 columns 목록 **밖**의 컬럼에 적용하지 말 것. 고정 자리수 코드에서 '전부 0' 은 흔한 정상값이다 —
      fd_estb_ctry_cd '000' 23,055 · pfiv_sale_cntl_tcd '00' 22,263 · fd_set_pcd '00' 1,967 은 값이다.
    patterns:
    - '^(KR)?0+$'
    - '^(.)\1+$'
    columns:
    - fss_itm_no
    - kofia_fd_ccd
    - rptt_ksd_itm_no
    - mtco_itm_no
    - ksd_itm_no
    - std_itm_no
    실측_2026-08-25: >-
      fss_itm_no 더미 11,611 · kofia_fd_ccd 11,431 · rptt_ksd_itm_no(NULL+더미) 1,761 · mtco_itm_no 869 · ksd_itm_no 592 · std_itm_no 145(공백 패딩 '00000')
    sql: >-
      (C IS NULL OR trim(C)='' OR replace(replace(trim(C),'KR',''),'0','')=''
       OR (length(trim(C))>1 AND replace(trim(C), substr(trim(C),1,1), '')=''))
    sql_주의: 🔴 CAST(C AS INTEGER)=0 으로 판정하지 말 것 — '00AG530' 같은 값도 0 으로 읽힌다.

  # ── 수치 컬럼의 0 처리 (주최 공지 2026-08-24: 0/결측은 의도된 값 → 빼거나 "없다"고 응답) ──
  zero_as_missing:
    _note: >-
      🔴 기본 규칙 — 수치 컬럼을 **정렬·필터·집계에 쓸 때는 IS NOT NULL AND <> 0** 을 건다. 개별 조회에서 0 은
      "수록되어 있지 않습니다" 로 답한다(값을 고쳐 채우지 말 것). 단 아래 zero_is_value 컬럼은 0 이 실제값이므로 예외.
      1차 규칙 fd_nast_suma(0값 294) · 수익률_9기간전부0(69) 은 2차에 해당 행이 0건이라 **삭제**했다.
    보수_3종전부0:
      규칙: or_co_rwrd_r=0 AND sale_co_rwrd_r=0 AND trusc_rwrd_r=0 인 행을 보수 결측으로 취급
      영향: 전체 1,081 미만 · 판매중 101 · 판매중·공모 29
      evidence_grade: B
      근거: 운용·판매·수탁이 동시에 0 인 공모펀드는 존재하지 않는다. 개별 항목 0(사무관리보수 등)은 정상값.
      sql: (or_co_rwrd_r = 0 AND sale_co_rwrd_r = 0 AND trusc_rwrd_r = 0)
    zero_is_value:
      _note: 0 이 "해당 없음/미보유" 라는 실제 정보인 컬럼. 정렬·필터에서 배제하지 말 것.
      columns:
      - zrin_dmst_stk_cmst_rt
      - zrin_dmst_bd_cmst_rt
      - zrin_ovrs_stk_cmst_rt
      - zrin_ovrs_bd_cmst_rt
      - zrin_fd_cmst_rt
      - zrin_liqt_cmst_rt
      - zrin_etc_ast_cmst_rt
      - ofwk_trus_rwrd_r
      - fd_last_dstb_r
      - prfd_attr_cnt
      - fd_mm1_ern_r          # 단기 무변동(MMF 등) 정상 — 판매중 0값 21행. 9기간 전부 0 은 2차 0건
    센티넬:
      fd_last_dstb_r: -100 (73행, 전부 판매완료) — 정렬 전 > -100
      수익률_8기간: < -100 은 오류값 — 2차 0건이나 규칙 유지(query_rules.수익률정상)

  # ── 숫자형 표기가 흔들리는 컬럼 ──────────────────────────────────────
  numeric_string_columns:
    _note: REAL 저장(1.0~6.0 · 0.0/1.0). 비교 전 CAST(… AS INTEGER). 0패딩 코드(fd_set_pcd·pfiv_sale_cntl_tcd·fd_estb_ctry_cd·or_co·trusc·식별번호)는 build_db CODE_COLUMNS 로 문자열 보존됨.
    columns:
    - zrin_fd_ivst_risk_gcd
    - zrin_btyp_cd
    - zrin_pcd
    - frc_bpr_itm_yn
    - hdge_fd_yn
    - ofsfd_yn
    규칙: 비교 전 CAST(컬럼 AS INTEGER)
    날짜_REAL: fd_daily_bas_dt · fd_price_bas_dt · fd_last_dstb_actg_bss_dt · fd_last_dstb_actg_eot_dt 는 yyyymmdd 가 REAL(20260821.0)로 저장 — CAST 후 문자열 비교.

  # ── 원본 따옴표 오염 (1차 사고 — 2차에서 소멸) ──────────────────────
  contaminated_rows:
    _note: >-
      ✅ 2026-08-25 — 감지 조건(mtco_itm_no LIKE '%"%' OR itm_no='"') 0행. 1차의 오염 66행/9종목·귀속표는 2차 데이터에 없다.
      감지 조건은 재적재 시 재감지용으로 유지한다.
    감지: mtco_itm_no LIKE '%"%' OR itm_no = '"'
    영향_2차: 0

  # ── 같은 뜻인데 표기가 갈리는 값 ──────────────────────────────────────
  value_variants:
    _note: 정확일치 조회 시 누락. 조회 전 정규화하거나 두 표기를 모두 허용할 것
    zrin_fd_ivst_risk_grd_nm:
      매우 높은 위험: []
      높은 위험: ['높은위험']       # 20행
      다소 높은 위험: []
      보통 위험: ['보통위험']       # 8행
      낮은 위험: []
      매우 낮은 위험: []

  invalid_values:
    _note: 2차에서 1차의 오염 유래 이탈값 5종('20054.0'·'06'·'해외'·'00080008'·'KRZ50226929C') 전부 소멸. 현재 등재 0건.

  constant_columns:
    _note: 2차에서 상수 컬럼 없음 — 1차의 hdge_fd_yn·ofsfd_yn 은 사모 유입으로 1 값이 생겼다(210·116행). 공모 한정 시 사실상 상수.

query_rules:
  종목단위: 행 = itm_no (dedup 불필요 — 2차)
  펀드단위: >-
    GROUP BY or_co_xtn_itt_cd,
             CASE WHEN length(mtco_itm_no) >= 7 THEN mtco_itm_no
                  ELSE substr('0000000' || mtco_itm_no, -7) END
  펀드단위_검증: >-
    2026-08-25 — 더미 배제(dummy_as_missing) 후 합성키 distinct 14,522(원값) · 판매중 4,342.
    🔴 1차의 4,643 은 1차 모수 수치다. 12자리 더미 '000000000000' 은 배제 조건에 걸린다.
  펀드단위_근거: >-
    GROUP BY mtco_itm_no 단독은 틀린 집계 — 운용사 내부 번호라 415종의 값이 2개 이상 운용사에 걸친다.
    선행 0 손실로 길이 1~7 이 섞여 7자리 zero-pad 필요. 길이 8+ 값은 자르지 말 것.
  판매중만: sale_yn = '판매중'
  구매가능: sale_yn = '판매중'          # 🆕 주최 공지 — 상폐/리스팅종료 외 전부 구매가능. 펀드는 판매완료가 그 경계
  공모만: prvo_pbff_desc = '공모'       # 🔴 2차엔 사모 8,960행 — 공모 질의 필수 필터
  기본모수: sale_yn = '판매중' AND prvo_pbff_desc = '공모'   # 집계·Top-N 기본. 모수 8,969 를 답변에 밝힐 것
  집계_TopN_필수: >-
    🔴 집계·Top-N 은 기본모수(판매중 AND 공모)로 한정한다 — 판매완료 12,714행은 평가 컬럼 99% 결측, 사모는 질의 대상 아님.
    정렬 컬럼에 'IS NOT NULL AND <> 0'(zero_is_value 컬럼 제외) + 수익률정상. 결과에 모수·기준일(fd_daily_bas_dt) 병기.
  ETF제외: itm_nm NOT LIKE '%상장지수%'   # 236행 — domestic_etfs 와 중복 가능
  수익률정상: <질의 대상 기간 컬럼> IS NOT NULL AND <질의 대상 기간 컬럼> > -100   # 질의하는 그 컬럼에만 건다
  자산군_주식형: zrin_btyp_nm IN ('주식형','해외주식형') OR (zrin_btyp_nm IS NULL AND (trim(or_attr_desc)='주식형' OR (trim(or_attr_desc) IN ('재간접','파생상품') AND itm_nm LIKE '%(주식%')))
  태그필터: "',' || prfd_attr_cds || ',' LIKE '%,<코드>,%'  또는  ',' || zrin_attr_nms || ',' LIKE '%,<명칭>,%'"
  연금가능: han_clas_policies LIKE '%퇴직연금%' OR han_clas_policies LIKE '%개인연금%'  (결측 시 itm_nm LIKE '%연금%' 보조)

entities:
  FundClass:
    kind: entity
    role: 주 노드
    source: itm_no
    count: 23676
    label: itm_nm
    note: 판매 단위(클래스) = 행. 2차 75컬럼 중 관계 컬럼을 뺀 전부가 여기 붙음. 공모 14,716 · 판매중 10,962.
  Fund:
    kind: entity
    source: (or_co_xtn_itt_cd, mtco_itm_no) 합성키
    count: 14522
    label: null
    relation: FundClass -belongsToFund-> Fund
    note: >-
      '모펀드' 가 아니다 — 클래스를 걷어낸 '펀드' 단위(운용사 내부 관리 단위). 모자형 모펀드는 이 테이블에 없다(1차 판정 유지).
      순자산은 이 단위 MAX. 🔴 count 14,522 는 더미 배제 후 원값 기준·사모 포함 — 판매중 4,342.
    용어규칙: mtco 단위는 '펀드'. '모펀드' 는 모자형에만 쓰고 이 테이블에는 없다고 명시할 것
  ShareClass:
    kind: entity
    source: itm_nm 파싱(종류X/클래스X) + han_clas_nm
    count: 195
    relation: FundClass -hasShareClass-> ShareClass
    note: >-
      🆕 2차 han_clas_nm(195종)이 클래스 체계를 직접 준다 — itm_nm 파싱(1차 112종 어휘)은 결측 보조로 강등.
      FIBO FundShareClassUnit 대응. 종류/클래스 표기 종목 5,261.
  AssetManager:
    kind: entity
    source: or_co_xtn_itt_cd
    count: 275
    label: null
    relation: Fund -managedBy-> AssetManager  (FIBO hasManagementCompany)
    note: 🔴 이름 컬럼 없음 — 코드북 ontology/codebooks/asset_manager.csv(1차 67종) 를 275종(판매중 226)으로 확장 필요
  Custodian:
    kind: entity
    source: trusc_xtn_itt_cd
    count: 50
    label: null
    relation: Fund -custodiedBy-> Custodian  (FIBO hasDepository)
    note: 🔴 이름 컬럼 없음 — 코드북 trustee.csv(1차 18종) 50종으로 확장 필요
  Benchmark:
    kind: entity
    source: bmrk_nm
    count: 389
    label: bmrk_nm
    relation: FundClass -benchmarkedTo-> Benchmark  (FIBO definesBenchmark)
    note: 복합식 파싱 전제. 국내ETF ref_base_index(2차 905종)와 교차하면 '같은 지수 추종 펀드·ETF' 질의 가능 — 표기 매핑 필요
  Country:
    kind: entity
    source: prfd_attr_cds 의 ISO 3자 태그 (17종) + fd_estb_ctry_cd(설립국 7종)
    count: 17
    relation: FundClass -investsIn-> Country · Fund -establishedIn-> Country
    note: >-
      투자국(태그)과 설립국(코드)은 다른 관계. 태그 17종: AUS BRA CHN DEU ESP FRA GBR HKG IDN IND JPN KOR MYS RUS TWN USA VNM.
      태그가 없다고 그 나라에 투자 안 하는 게 아님 — zrin_ptn_nm('중국주식' 등)·W축 태그와 병용하고 모수 명시.
  FundAttribute:
    kind: entity
    source: prfd_attr_cds 의 <문자><3자리숫자> 태그 (210종 · 축 15)
    count: 210
    label: zrin_attr_nms
    relation: FundClass -hasAttribute-> FundAttribute
    coverage: 태그 보유 11,280/23,676 (판매중 8,550/10,962)
    axis_count: 15
    note: >-
      1차 EAV 판정 유지 — 문자=축, 숫자=축 안의 값. 🆕 2차는 zrin_attr_nms 로 **명칭이 제공**되어 축 해독의 근거가 생겼다
      (단 순서 불일치 — columns.prfd_attr_cds.trap). 축별 값 수는 1차와 동일: C4 D5 E3 F7 G15 M16 N60 O10 P10 Q5 R10 S16 T11 V3 W35.
      교집합만으로 유일 확정된 20종: C102=단위 C103=개방 D102=국내위탁판매 D106=온라인전용 M101=목표달성전환 M109=자펀드
      M111=종류형 클래스펀드 M112=FoFs P104=중소형주 R107=하이일드 S108=롱/숏 S117=레버리지 V101=국내 V102=국외 V103=국내외
      W101=글로벌 W104=북미 W106=아태 (+USA=미국 VNM=베트남). 전량 `ontology/codebooks/fund_attr_code.csv` 로 도출 완료 (2026-08-25).
    decode_status: 1차 15축 중 대응 확정 4(V·S·N·G)·부분 8·없음 3 → 2차 명칭 컬럼으로 전면 재해독 가능(미실시)

