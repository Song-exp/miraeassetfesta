      모자형의 모펀드는 이 테이블에 없다 — 모투자신탁·모투자회사 표기 0건이고,
      모펀드의 집합투자증권은 자펀드만 취득 가능해 판매 상품 마스터에 없는 것이 정상이다.
      실무에서 종류형(클래스)의 상위를 관행적으로 '모펀드' 라 부르는 것과 자본시장법의
      모자형 모펀드는 다른 개체이며, 이전 기록이 둘을 섞었다.
      순자산은 이 단위 합계. 클래스 평균 2.38개 · 1클래스뿐 2,989개(64.4%).
