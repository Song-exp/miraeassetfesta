# public_funds — 사람의 판단을 담는 파일
# 기계적 사실은 *.auto.yaml 에 있습니다. 여기엔 판정과 규칙만 씁니다.
# 런타임 가드레일이 이 파일을 읽습니다.

domain: public_funds
columns:
  prvo_fd_desc:
    korean_name: 사모펀드구분코드 설명
    missing_semantics:
      해당없음: not_applicable
    note: '''해당없음'' 95,451건은 prvo_pbff_desc=''공모'' 와 1:1 완전 대응. 정상 정보.'
  pers_corp_desc:
    korean_name: 개인법인구분코드 설명
    missing_semantics:
      해당없음: not_applicable
    note: '''해당없음'' 73,054건 = 개인/법인 전용이 아닌 일반 펀드. 정상 정보.'
  exchdg_yn:
    korean_name: 환헤지여부
    missing_reason: not_applicable
    answer_policy: 국내 펀드의 환헤지 문의 → '해당사항 없음'. 해외/혼합 펀드의 결측만 '확인할 수 없음'.
    note: 국내 투자 펀드는 환율 위험이 없어 환헤지 개념 자체가 없음. 국내 87.7%(29,040/33,107) 결측 vs 해외 0.8%(435/51,628).
  fd_nast_suma:
    korean_name: 펀드 순자산
    missing_reason: missing
    answer_policy: 순자산 Top-N 질의는 sale_yn='판매중' 으로 한정하고 모수를 밝힐 것. 값은 클래스 합계이므로 GROUP BY mtco_itm_no 필요.
    note: 판매완료 59.0%(11,390/19,300) vs 판매중 1.5%(1,148/76,318). 판매중단 펀드에 집중되나 완전 대응은 아니므로 결측으로 둠.
  zrin_fd_ivst_risk_gcd:
    korean_name: 제로인펀드투자위험등급코드
    missing_reason: missing
    answer_policy: 위험등급 필터 질의는 모수 77,203/95,619 를 명시.
    note: 전 운용유형에 걸쳐 결측(7~45%). 특정 유형 문제가 아니라 평가사(제로인)가 등급을 산출하지 않은 펀드로 보임.
  fd_yr1_ern_r:
    korean_name: 펀드 1년수익률
    missing_reason: missing
    answer_policy: 수익률은 **누적**임을 답변에 명시할 것 ('3년 수익률 10.5%' 를 연 10.5% 로 오해 방지). Top-N 은 모수를 밝히고, 아래 데이터
      오류 종목을 제외할 것.
    note: '위험등급 결측과 18,404건 동시 발생, 등급만 결측은 12건뿐. → 수익률과 위험등급이 같은 평가 데이터 소스일 가능성. 기간이 길수록 결측 증가(1주 27%
      → 5년 47%)는 운용기간 때문으로 보이나 중첩 위반 수천 건이 있어 단정 불가. / 단위 확정: 누적 수익률(연환산 아님). MMF 5년 16.07% ≈ (1.03)^5=15.9%
      로 검증, MMF만 98%가 5년>3년 (주식형 15%) 로 시장 정합.'
    unit: percent_cumulative
  itm_eabrv_nm:
    korean_name: 종목영문약어명
    missing_reason: missing
    answer_policy: 영문약어 질의는 '데이터 미제공'.
    note: 99.8%(95,447/95,619) 결측, distinct 14종. 사실상 빈 컬럼.
  fd_yr3_ern_r:
    korean_name: 펀드 3년수익률
    unit: percent_cumulative
    trap: KCGI베트남증권투자신탁(KR515303001M) 5행이 -4,381% 등 -100% 미만. 원금 전액 손실이 -100% 이므로 데이터 오류. 2년·3년·5년·18개월
      컬럼 동시 발생.
    answer_policy: 수익률 Top-N(최저) 질의 시 `> -100` 조건으로 오류 종목 제외.
normalization:
  trim_columns:
  - itm_abrv_nm
  - itm_eng_nm
  - itm_nm
  - kofia_fd_ccd
  - ksd_itm_no
  - prfd_attr_cd
  - rptt_ksd_itm_no
query_rules:
  종목단위: GROUP BY itm_no
  펀드단위: GROUP BY mtco_itm_no
  판매중만: sale_yn = '판매중'
  공모만: prvo_pbff_desc = '공모'
  ETF제외: itm_nm NOT LIKE '%상장지수%'
  수익률정상: fd_yr1_ern_r > -100 AND fd_yr3_ern_r > -100
  자산군_주식형: trim(or_attr_desc)='주식형' OR (trim(or_attr_desc) IN ('재간접','06') AND itm_nm LIKE '%(주식%')
entities:
  FundClass:
    kind: entity
    role: 주 노드
    source: itm_no
    count: 11139
    label: itm_nm
    note: 판매 단위(클래스). 44컬럼 속성이 여기 붙음
  Fund:
    kind: entity
    source: mtco_itm_no
    count: 4660
    label: null
    relation: FundClass -belongsToFund-> Fund
    note: 모펀드/운용 단위. NULL 1건. 순자산은 이 단위 합계
  ShareClass:
    kind: entity
    source: itm_nm 파싱(종류X/클래스X)
    count: 112
    relation: FundClass -hasShareClass-> ShareClass
    note: 펀드 간 통용 어휘(C 614펀드·A 607펀드). FIBO FundShareClassUnit 대응
  AssetManager:
    kind: entity
    source: or_co_xtn_itt_cd
    count: 67
    label: null
    relation: Fund -managedBy-> AssetManager  (FIBO hasManagementCompany)
    note: 🔴 이름 컬럼 없음 — 코드↔이름 매핑 필요
  Custodian:
    kind: entity
    source: trusc_xtn_itt_cd
    count: 18
    label: null
    relation: Fund -custodiedBy-> Custodian  (FIBO hasDepository)
    note: 🔴 이름 컬럼 없음
  Benchmark:
    kind: entity
    source: bmrk_nm
    count: 391
    label: bmrk_nm
    relation: FundClass -benchmarkedTo-> Benchmark  (FIBO definesBenchmark)
    note: '복합식 파싱 필요: ''MSCI ACWI CR 50% + 종합채권01Y 50%'''
  Country:
    kind: entity
    source: prfd_attr_cd 국가태그 / fd_estb_ctry_cd
    count: 17
    relation: FundClass -investsIn-> Country · Fund -establishedIn-> Country
    note: 투자국(17종, 1,549종목 커버)과 설립국(410=한국)은 다른 관계
class_hierarchy:
  note: FIBO 원칙 — 펀드 유형은 owl:Class 하위클래스이지 개체가 아님. axis_fundType(주최 측 제시)이 법적 5분류 층위와 일치.
  Fund:
    SecuritiesFund:
    - EquityFund
    - BondFund
    - EquityMixedFund
    - BondMixedFund
    MoneyMarketFund: []
    MixedAssetsFund: []
    RealEstateFund: []
    SpecialAssetsFund: []
derivation_rules:
  _note: 🔴 or_attr_desc 는 단일 축이 아님 — 자산군·운용구조·파생활용 3축이 압축돼 있음. 재간접 3,022종목 중 1,604개가 실제로는 주식형. or_attr_desc='주식형'
    만 쓰면 1,461종목(25%)이 누락됨.
  assetClass:
    축: 무엇에 투자하는가 (하위클래스 결정)
    규칙: ① 종목명 괄호 표기 우선 — (주식…)→Equity, (채권…)→Bond, (주식혼합…)→EquityMixed, (채권혼합…)→BondMixed  ② 없으면 or_attr_desc
      로 폴백 (주식형/채권형/MMF/혼합자산/특별자산/임대형·대출형)
    판정률: 94.3% (10,500/11,139) · 불명 639종목
  isFundOfFunds:
    축: 운용 구조 (자산군과 직교)
    규칙: 종목명에 '재간접' 또는 or_attr_desc='재간접'
    해당: 3182
  usesDerivatives:
    축: 파생 활용 (직교)
    규칙: 종목명에 '파생' 또는 or_attr_desc='06'
    해당: 736
  isMasterFeeder:
    축: 모자형 구조 (직교)
    규칙: 종목명에 '증권자'/'자투자신탁' 패턴
    해당: 7237
