      보조로 ',' || zrin_attr_nms || ',' LIKE '%,중국,%' (제로인 국가 명칭) 또는 itm_nm LIKE 를 OR 로 더할 수 있다.
      목록에 없는 나라는 이름 검색(itm_nm LIKE)으로만 풀고, 그 사실을 답에 밝힌다.
  연금가능: han_clas_policies LIKE '%퇴직연금%' OR han_clas_policies LIKE '%개인연금%'  (결측 시 itm_nm LIKE '%연금%' 보조)
  종목명검색: >-
