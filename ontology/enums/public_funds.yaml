# public_funds — 사람의 판단을 담는 파일
# 기계적 사실은 *.auto.yaml 에 있습니다. 여기엔 판정과 규칙만 씁니다.
# 런타임 가드레일이 이 파일을 읽습니다.
#
# 이력:
#   2026-08-25  🔴 2차 데이터(8/24 배포 · 기준일 2026-08-22) 기준 재작성.
#               1차(7/11) 의 "종목×속성태그 롱 포맷"(95,619행) 구조가 사라지고 23,676행 × 75컬럼 · itm_no 유일.
#               prfd_attr_cd 삭제 → prfd_attr_cds(쉼표 목록) 로 집약. 보수 4종·클래스 체계·제로인 유형·자산구성비 신규.
#               🔴 1차 기준 수치(11,139종목·8,445 판매중·오염 9종목 등)를 인용한 다른 문서는 전부 구식이다.
#               1차 분석에서 2차로 재검증하지 못한 판정은 "(1차 실측)" 으로 표기해 남겼다.

domain: public_funds

# ── 행의 낟알(row grain) — 이 테이블의 구조 그 자체 ──────────────────────
row_grain:
  구조: 행 = 종목(itm_no) — 클래스 단위 마스터. 23,676행 = 23,676 distinct itm_no · NULL 0
  evidence_grade: A
  증명: >-
    🔑 2026-08-25 2차 데이터 실측 — itm_no 가 행 단위로 완전 유일하다 (profile_table primary_key 탐지기 확인).
    1차의 행 폭발 원인이던 prfd_attr_cd 가 삭제되고 prfd_attr_cds(쉼표 구분 목록) 로 집약됐다.
    따라서 "COUNT(*) 금지 · GROUP BY itm_no 선행" 규칙은 **폐기**한다 — 행 = 종목이다.
  std_itm_no의_위치: >-
    std_itm_no 는 클래스 묶음 키가 **아니다** — distinct 18,948 중 18,909 가 itm_no 와 1:1 이고
    2개 이상 itm_no 를 가리키는 값은 39개뿐. 결측 515 + '00000     '(패딩 위장결측) 145 = 실질 결측 660 —
    **전부 판매완료**. 펀드(클래스 묶음) 단위 키는 여전히 (or_co_xtn_itt_cd, mtco_itm_no) 합성키다 (query_rules.펀드단위).
  answer_policy: >-
    상품 개수 질의: 행수 = 종목(클래스) 수 23,676. 단 🔴 **사모 8,960행이 섞여 있다** (1차엔 168행) —
    '공모펀드' 개수는 prvo_pbff_desc='공모' 14,716, 그중 판매중 8,969. 모수를 반드시 밝힐 것.

columns:
  # ── 식별 ────────────────────────────────────────────────────────────
  std_itm_no:
    korean_name: 표준종목번호
    missing_reason: missing
    evidence_grade: A
    missing_semantics:
      '00000     ': missing          # 🔴 2차 신규 위장결측 — 5자리 0 + 공백 패딩 145행. trim 후 '00000'
    evidence: >-
      2026-08-25 실측 — NULL 515 · '00000     ' 145 = 660행, 전부 sale_yn='판매완료'. 판매중 결측 0.
      1차의 "따옴표 오염 9종목" 은 2차에서 **소멸**(contaminated_rows 감지 0행).
    answer_policy: >-
      결측 시 sale_yn 을 직접 읽어 병렬 서술 — '판매완료 상품이며 표준종목번호는 조회되지 않습니다'.
      인과로 서술 금지(판매완료 12,714 중 12,054 는 값 보유). 식별은 itm_no 로 한다.
  rptt_ksd_itm_no:
    korean_name: 대표예탁원종목번호
    missing_reason: unresolved
    evidence_grade: C
    evidence: 2026-08-25 — NULL+더미 1,761행(7.4%). 기전(미부여/말소) 미확정은 1차와 동일.
    answer_policy: >-
      결측 시 '확인할 수 없음' + sale_yn 병렬 서술. 인과 서술 금지. 대체 식별자는 ksd_itm_no(결측+더미 592, 2.5%).
    applies_to:
    - ksd_itm_no
    - rptt_ksd_itm_no
  ksd_itm_no:
    korean_name: 예탁원종목번호
    missing_reason: unresolved
    evidence_grade: C
    answer_policy: 결측·더미 592행(2.5%). 다른 코드가 빌 때 대체 식별자로 제시 가능. 더미('KR'+0패딩·길이 이탈)는 dummy_as_missing 으로 배제.
  fss_itm_no:
    korean_name: 금융감독원종목번호
    missing_reason: unresolved
    evidence_grade: C
    evidence: >-
      2026-08-25 — NULL 42 + 더미 '000000000000' 11,611 = 11,653행(49.2%). 판매완료 10,317/12,714 · 판매중 1,336/10,962(12.2%).
      판매중에서도 비므로 판매상태로 설명 불가(1차 판정 유지).
    answer_policy: 더미를 값으로 취급 금지(조인 시 한 값에 1만 행이 뭉친다). 결측 시 '확인할 수 없음'.
    applies_to:
    - fss_itm_no
    - kofia_fd_ccd
  kofia_fd_ccd:
    korean_name: 금융투자협회펀드분류코드
    missing_reason: unresolved
    evidence_grade: C
    evidence: 2026-08-25 — NULL 45 + 더미 '0'×20 11,431 = 11,476행(48.5%). 판매중 1,158/10,962. fss_itm_no 와 사실상 한 현상.
    answer_policy: >-
      더미 배제. 값이 있어도 20자리 자리별 의미 미해독(주최 코드북 미제공 확정) → 코드를 답변에 노출하지 말 것.
      분류 질의는 zrin_btyp_nm·zrin_ptn_nm·or_attr_desc 등 명칭 컬럼으로 답한다.
  mtco_itm_no:
    korean_name: 운용사종목번호
    missing_reason: missing
    evidence_grade: C
    evidence: 2026-08-25 — NULL 116 + 더미 '000000000000' 등 869행(3.7%). 길이 1~12 로 흔들림(선행 0 손실 + 12자리 더미).
    answer_policy: >-
      🔴 단독 키로 조인 금지 — 415종의 값이 2개 이상 운용사에 걸친다. 펀드 단위 키는 (or_co_xtn_itt_cd, mtco_itm_no).
      zero-pad 는 7자리 기준(길이 8 이상의 이상값은 자르지 말 것 — query_rules.펀드단위_근거).
  itm_eabrv_nm:
    korean_name: 종목영문약어명
    missing_reason: missing
    evidence_grade: A
    answerable_n: 148
    answer_policy: 결측 23,528/23,676(99.4%). 필터·조인 금지. 영문 표기는 itm_eng_nm(결측 0) 으로.

  # ── 판매·구매가능 ──────────────────────────────────────────────────
  sale_yn:
    korean_name: 판매여부
    missing_reason: none
    evidence_grade: A
    value_semantics:
      판매중: 신규 가입 가능 = 🔴 "구매가능" (주최 공지 2026-08-24 — 상폐/리스팅종료 외 전부 구매가능)
      판매완료: 신규 가입 중단. 청산·종료가 아니다 — 기존 투자자는 남아 있음
    note: >-
      2026-08-25 — 판매중 10,962 · 판매완료 12,714. 🔴 1차(판매중 76,318행/8,445종목 · 판매완료 19,300행)와 달리
      판매완료가 과반이며, 판매완료 행은 평가 컬럼(위험등급·수익률·순자산·제로인 유형)이 98~99% 결측이다.
      → query_rules.판매중만 이 모든 집계의 기본 필터다.
  thco_sale_yn:
    korean_name: 당사판매여부
    missing_reason: none        # 빈칸은 결측이 아니라 값이다 (1차 판정 유지)
    evidence_grade: A
    value_semantics:
      'Y': 당사(미래에셋증권) 취급
      null: 당사 미취급 — 'N' 의 자리. 결측이 아니다. SQL 은 IS NULL 로 걸 것
    note: >-
      2026-08-25 — Y 10,597 · NULL 13,079. NULL+판매중 2,412행 중 **사모 1,979** 가 대부분 —
      1차의 "NULL+판매중 11종목" 서술은 2차(사모 포함)에서 무효. ✅ 재검증 2026-08-25: NULL+판매중 2,412 = 사모 1,993 + 공모 419 — 공모 419 는 "당사 미취급 공모펀드"로 기본 모수에서 제외하지 말 것(판매중이면 조회 대상).
    answer_policy: 빈칸의 뜻은 sale_yn·prvo_pbff_desc 와 함께 읽을 것. "당사 미취급이라 정보가 부족" 식 인과 서술 금지.
  prvo_pbff_desc:
    korean_name: 사모공모구분코드 설명
    missing_reason: none
    evidence_grade: A
    trap: >-
      🔴 2차에 **사모 8,960행(37.8%)** 이 들어왔다 (1차 168행). '공모펀드 마스터' 라는 테이블명을 믿고 필터를
      생략하면 사모가 섞인다. 공모 질의는 query_rules.공모만 필수. 사모 하위: 일반사모 3,286 · 일반사모(2015년전) 3,607 · PEF 7 · 해당없음 2,060.
  prvo_fd_desc:
    korean_name: 사모펀드구분코드 설명
    missing_semantics:
      해당없음: not_applicable
    note: 공모 14,716행은 전부 '해당없음'. 사모 안에서만 값이 갈린다.
  pers_corp_desc:
    korean_name: 개인법인구분코드 설명
    missing_semantics:
      해당없음: not_applicable
    note: "'해당없음' 19,258 = 개인/법인 전용이 아닌 일반 펀드. 개인 1,912 · 법인 2,506."
  pfiv_sale_cntl_tcd:
    korean_name: 판매통제구분코드
    missing_reason: none
    note: "'00' 22,263 · '01' 1,378 · '02' 16 · '03' 19. 코드 의미 미제공(주최 확정) — '00'=통제없음 추정. 필터 축으로 쓰지 말 것."

  # ── 보수 (🆕 2차 신규 — 1차엔 미제공이라 설명서 파싱으로 대체했던 값) ──
  or_co_rwrd_r:
    korean_name: 집합투자업자보수 (운용보수)
    missing_reason: none
    evidence_grade: B
    unit: "‰ (값÷10 = %) — ext_fund_page 8,925건 대조로 확정 (2026-08-25)"
    unit_근거: >-
      ✅ DB ext_fund_page(미래에셋증권 웹 설명서 파싱)의 mgmt_fee_pct/sale_fee_pct/trust_fee_pct/admin_fee_pct 와
      마스터 or_co_rwrd_r/sale_co_rwrd_r/trusc_rwrd_r/ofwk_trus_rwrd_r 를 itm_no 로 조인해 8,925건 대조 —
      비율 master/web 의 중앙값·p10·p90 이 전부 정확히 10.0. 예) 미래에셋인디아솔로몬(C-I) or_co_rwrd_r 10.15 → 운용보수 1.015%.
      분포(‰): 운용 0~300(max 300 = 30% 는 이상치 후보) · 판매 0~25 · 수탁 0~7 · 사무 0~2.
    answer_policy: >-
      **% 로 환산해 서술** (값÷10). 마스터 우선 — 설명서(ext_fund_page.total_fee_pct)는 총보수(TER) 보완용.
      총보수 근사는 derivation_rules.totalFeeApprox (4종 합÷10, 기타비용 미포함 명시).
      0 은 zero_as_missing.보수_3종전부0 규칙으로 배제하되, 개별 항목 0(예: 사무관리보수 0 — 판매중 1,157행)은 "해당 보수 없음" 으로 읽는다.
    applies_to:
    - or_co_rwrd_r
    - sale_co_rwrd_r
    - trusc_rwrd_r
    - ofwk_trus_rwrd_r
  sale_co_rwrd_r:
    korean_name: 판매회사보수
    missing_reason: none
    unit: ‰ (값÷10 = %, or_co_rwrd_r 참조)
    note: 0값 2,271(판매중 756). fd_prsv_r 과 23,240/23,676(98.2%) 동일값 — 아래 fd_prsv_r 참조.
  trusc_rwrd_r:
    korean_name: 신탁업자보수 (수탁보수)
    missing_reason: none
    unit: ‰ (값÷10 = %, or_co_rwrd_r 참조)
    note: 0값 967(판매중 235). distinct 96.
  ofwk_trus_rwrd_r:
    korean_name: 일반사무관리보수
    missing_reason: none
    unit: ‰ (값÷10 = %, or_co_rwrd_r 참조)
    zero_is_value: true
    note: 0값 4,866(판매중 1,157) — 사무관리회사를 두지 않는 펀드는 0 이 정상값. 배제하지 말 것.
  fd_prsv_r:
    korean_name: 보전율
    missing_reason: unresolved
    evidence_grade: C
    trap: >-
      🔴 컬럼명(보전율)과 값이 맞지 않는다 — 98.2% 가 sale_co_rwrd_r(판매회사보수) 과 동일값이고 분포(0.1·5.0·10.0·0.3…)도 보수 형태.
      원금보전율이라면 0~100 이어야 하는데 max 25 다. 판매보수의 복제 컬럼으로 추정 — 확정 전 답변에 쓰지 말 것.
    answer_policy: "'보전율' 질의 → 이 컬럼으로 답하지 말 것. 원금보존추구 여부는 prfd_attr_cds 태그('원금보존추구')로 답한다."

  # ── 클래스 체계 (🆕 2차 신규 — 한국펀드평가 클래스 표기 추정) ──
  han_clas_nm:
    korean_name: 클래스 한글 표기
    missing_reason: missing
    evidence_grade: B
    answerable_n: 9637
    note: >-
      195종. 형식 '<수수료유형>-<채널>-<정책…>' (예: 수수료미징구-온라인-퇴직연금). 아래 3컬럼으로 분해돼 있다.
      결측 14,039(판매중 2,228 — 그중 사모 1,979 · 공모 249). 공모·판매중 기준 결측 2.8%.
    answer_policy: >-
      "온라인 클래스" "퇴직연금 전용" "선취 수수료 없는 클래스" 질의는 분해 컬럼(han_clas_fee_type / han_clas_sales_channel /
      han_clas_policies)으로 필터. 결측 시 itm_nm 의 클래스 접미(C-e, C-P 등)로 보조 추정하되 근거를 밝힐 것.
  han_clas_fee_type:
    korean_name: 클래스 수수료 부과 유형
    missing_reason: missing
    value_semantics:
      수수료미징구: 선취·후취 판매수수료 없음 (7,834)
      수수료선취: 가입 시 선취 (1,786)
      수수료후취: 환매 시 후취 (5)
  han_clas_sales_channel:
    korean_name: 클래스 판매채널
    missing_reason: missing
    value_semantics:
      오프라인: 6,048
      온라인: 3,548
      직판: 7
  han_clas_policies:
    korean_name: 클래스 부가 정책
    missing_reason: mixed
    note: >-
      쉼표 다중값 33종 — 퇴직연금 2,012 · 개인연금 1,610 · 보수체감 1,572 · 기관 330 · 랩 216 · 고액 138 · '랩,펀드' 83 …
      결측 17,408 은 "부가 정책 없음" 과 "클래스 정보 자체 결측(han_clas_nm NULL)" 이 섞여 있다 —
      han_clas_nm IS NOT NULL AND han_clas_policies IS NULL 만 '정책 없음' 으로 읽을 것.
    answer_policy: 연금 질의(퇴직연금/개인연금 가입 가능 클래스)는 LIKE '%퇴직연금%' 등 부분일치로 필터.

  # ── 제로인 유형·속성 (🆕 2차 신규) ───────────────────────────────────
  zrin_btyp_nm:
    korean_name: 제로인대유형명
    missing_reason: missing
    evidence_grade: A
    answerable_n: 11281
    value_semantics_요약: >-
      18종 — 해외주식형 3,372 · 주식형 2,149 · 해외기타 881 · 채권형 798 · 해외채권형 700 · 채권혼합형 662 ·
      해외채권혼합형 608 · 해외주식혼합형 479 · 기타 439 · 절대수익추구형 375 · 주식혼합형 234 · MMF 218 ·
