  #   🔴 스캐너 출력을 검증 없이 배제로 잇지 말 것 — 08-31 실측에서 자동 판정 5건 중 4건이 방향 오탐(중앙값 점령).
  #   런타임에 "이상치를 의심하라" 류 일반 지시를 주지 않는 이유: 판별식이 형제 그룹 통계라 단일 SQL 로 계산 불가.
