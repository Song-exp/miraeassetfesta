class_hierarchy:
  note: FIBO 원칙 — 펀드 유형은 owl:Class 하위클래스이지 개체가 아님. axis_fundType(주최 측 제시)이 법적 5분류 층위와 일치.
  Fund:
    SecuritiesFund:
    - EquityFund
    - BondFund
    - EquityMixedFund
    - BondMixedFund
    MoneyMarketFund: []
    MixedAssetsFund: []
    RealEstateFund: []
    SpecialAssetsFund: []
axis_mapping:
  _note: >-
    주최 측이 제시한 6축 (1.금융상품/PRFD01N001_공모펀드마스터_schema.xlsx · Sheet2_Sample).
    정답 라벨 100건(DB 와 100/100 매칭)과 대조해 **확정된 것만** 적는다.
    🔴 derivation_rules.assetClass 와 층위가 다르다 — 여기 fundType 은 자본시장법 5분류이고
    assetClass 는 실제 투자자산 축이다. 재간접 3,022종목은 fundType 으로는 SecuritiesFund 하나지만
    assetClass 로는 1,604개가 주식형이다. **두 축을 합치지 말 것.**
  axis_fundType:
    출처: or_attr_desc
    순도: 12/12 값이 단일 축값에 대응 (정답 100건)
    evidence_grade: A
    매핑:
      SecuritiesFund: ['주식형', '채권형', '주식혼합', '채권혼합', '재간접', '06', null]
      MoneyMarketFund: ['MMF']
      MixedAssetsFund: ['혼합자산']
      RealEstateFund: ['임대형', '대출형']
      SpecialAssetsFund: ['특별자산']
    주의: >-
      🔴 NULL 4건도 주최 측이 SecuritiesFund 로 라벨했다 — 결측을 배제하면 정답을 놓친다.
      '06' 은 도메인 문서가 "파생형 추정" 으로 적어둔 값인데 fundType 으로는 SecuritiesFund 다 (9건 전원).
  axis_investorEligibility:
    출처: prvo_pbff_desc
    순도: 3/3
    evidence_grade: A
    매핑:
      PublicOffering: ['공모', null]
      PrivateOffering: ['사모']
  axis_listingType:
    출처: itm_nm (종목명 파싱 — 코드가 아님)
    순도: 2/2
    evidence_grade: A
    규칙: "itm_nm LIKE '%상장지수%' → Listed · 그 외 Unlisted"
  axis_redemptionType:
    상태: 데이터_미제공
    evidence_grade: A
    근거: >-
      fd_set_pcd 로 유도 불가 — '10' 에서 ClosedEnded 17 / OpenEnded 76 (순도 0/2).
      or_attr_desc 로도 갈리지 않는다(주식형 5:11 혼재). 도메인 문서 §1.4 도 환매 조건 컬럼이
      없다고 적고 있다.
    처리: 온톨로지에 속성을 세우지 말고 '데이터 미제공' 으로 답한다. **유도 시도 금지**
  _미확정:
    axis_issuanceType: >-
      fd_set_pcd '10' → AdditionalType 93/93 이나 '20' 은 혼재(AdditionalType 6 : UnitType 1).
      UnitType 표본이 1건뿐이라 판정 불가.
    axis_classDifferentiation: >-
      🔴 정답 라벨이 같은 펀드 안에서 갈린다 (40묶음 중 9개). 'C'=SingleClass 인데 'C-F'=MultiClass,
      'C-E'/'C-e' 가 대소문자로 갈린다. 축 정의를 주최 측에 확인해야 한다 — 규칙을 만들기 전 단계다.
derivation_rules:
  _note: 🔴 or_attr_desc 는 단일 축이 아님 — 자산군·운용구조·파생활용 3축이 압축돼 있음. 재간접 3,022종목 중 1,604개가 실제로는 주식형. or_attr_desc='주식형'
    만 쓰면 1,461종목(25%)이 누락됨.
  assetClass:
    축: 무엇에 투자하는가 (하위클래스 결정)
    규칙: ① 종목명 괄호 표기 우선 — (주식…)→Equity, (채권…)→Bond, (주식혼합…)→EquityMixed, (채권혼합…)→BondMixed  ② 없으면 or_attr_desc
      로 폴백 (주식형/채권형/MMF/혼합자산/특별자산/임대형·대출형)
    판정률: 94.3% (10,500/11,139) · 불명 639종목
  isFundOfFunds:
    축: 운용 구조 (자산군과 직교)
    규칙: 종목명에 '재간접' 또는 or_attr_desc='재간접'
    해당: 3182
  usesDerivatives:
    축: 파생 활용 (직교)
    규칙: 종목명에 '파생' 또는 or_attr_desc='06'
    해당: 736
  isMasterFeeder:
    축: 모자형 구조 (직교)
    규칙: 종목명에 '증권자'/'자투자신탁' 패턴
    해당: 7237
  prfdAttrTag:
    축: prfd_attr_cd 한 컬럼에 3종류가 섞여 있음 — 형태로 갈라야 한다
    규칙: ① ISO 3자 대문자 → Country (investsIn)  ② <문자><3자리숫자> → FundAttribute (문자=축, 숫자=값)  ③ 그 외('해외' 1건)
      → 오염, 제외
    판정률: 국가 1,670행 + 코드형 93,948행 + 오염 1행 = 95,619 (100%)
    note: 이 컬럼이 행을 가르는 유일한 축이다 (45컬럼 중 itm_no 안에서 갈리는 건 이것뿐). 따라서 FundClass 의 스칼라 속성이 아니라 관계로 모델링해야 한다
