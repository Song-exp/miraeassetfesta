  - mtco_itm_no

  # ── 값처럼 보이지만 결측인 것 ────────────────────────────────────────
  dummy_as_missing:
    _note: >-
      🔴 NULL 만 결측으로 보면 틀린다. 식별 코드의 결측 대부분이 0패딩 더미다.
      정규화 없이 조인하면 '000000000000' 하나에 1만 행이 뭉치고, LLM 프롬프트에 원값이 닿으면
      "등록번호는 000000000000입니다" 라고 답한다 — 환각 감점에 직결된다.
    🔴_화이트리스트_필수: >-
      patterns 를 columns 목록 **밖**의 컬럼에 적용하지 말 것. 고정 자리수 코드에서 '전부 0' 은 흔한 정상값이다 —
      fd_estb_ctry_cd '000' 23,055 · pfiv_sale_cntl_tcd '00' 22,263 · fd_set_pcd '00' 1,967 은 값이다.
      🔴 **다른 도메인에 이 규칙을 복사하지 말 것** (2026-08-30 전 도메인 스캔 실측 — 무엇이 사라지는지):
        · domestic_bonds.crd_grd 'AAA' **8,722행** — 최고 신용등급이 패턴 ②(^(.)\1+$)에 걸린다. "신용등급 AAA 채권" 질의가 통째로 죽는다.
        · overseas_etfs 의 실재 티커 TTT(ProShares UltraPro Short 20+ Year Treasury) · YYY(Amplify CEF High Income) ·
          FFF(Founders 100) · VV(Vanguard Large-Cap) — 전부 실제 상장 ETF 다. 반복문자라고 더미가 아니다.
        · domestic_bonds.pd_ctry_cd 'KR' 21,881(국가코드) · pd_risk_gcd '11' 1,441(위험등급 11~16 체계) 도 정상값.
      → 규칙에 걸렸다는 것과 결측이라는 것은 다르다. 더미 후보는 반드시 이름 컬럼(pd_nm·itm_nm)과 함께 조회해 실물을 확인한 뒤 판정한다.
    patterns:
    - '^(KR)?0+$'
    - '^(.)\1+$'
    columns:
    - fss_itm_no
    - kofia_fd_ccd
    - rptt_ksd_itm_no
    - mtco_itm_no
    - ksd_itm_no
    - std_itm_no
    실측_2026-08-29: >-
      🔴 아래는 이 블록의 sql 4갈래를 **그대로 실행**한 값이다(2차 정본 23,676행 · 판매중 10,962). 어림한 정규화로 다시 세지 말 것.
      fss_itm_no 11,655(49.2%) · kofia_fd_ccd 11,476(48.5%) · rptt_ksd_itm_no 7,086(29.9%) ·
      std_itm_no 4,668(19.7%) · ksd_itm_no 2,370(10.0%) · mtco_itm_no 1,057(4.5%). 모두 NULL 포함 값이다.
      (구 실측_2026-08-25 는 1차 모수 — fss 11,611 · kofia 11,431 · rptt 1,761 · mtco 869 · ksd 592 · std 145.
       rptt·ksd·std 가 각각 5,325 · 1,778 · 4,523 행 어긋나 있었다. 규칙 ④ 반복문자 미적용이 원인으로 추정)
    sql: >-
      (C IS NULL OR trim(C)='' OR replace(replace(trim(C),'KR',''),'0','')=''
       OR (length(trim(C))>1 AND replace(trim(C), substr(trim(C),1,1), '')=''))
    sql_주의: 🔴 CAST(C AS INTEGER)=0 으로 판정하지 말 것 — '00AG530' 같은 값도 0 으로 읽힌다.

  # ── 리드 결정 2026-08-31 — §9-4 다섯 건 해소 ─────────────────────────
  code_width:
    _note: >-
      규칙 A(§9-3) 도입. 선행 0 유실로 자릿수가 짧아진 기관코드는 **결측이 아니다** —
      비교·조인·코드북 조회 전에 zfill 한다. 생성기 비대칭 주의: gen_shared_auto 수탁사 경로에는
      rjust 폴백이 있으나 운용사 경로에는 없다 — KG 재생성 묶음(P1-4)에서 두 경로를 같이 맞춘다.
    columns: {or_co_xtn_itt_cd: 8, trusc_xtn_itt_cd: 8}
    실측_2026-08-30: trusc '0016022' 202행(판매중 178 · = '00016022' 미래에셋증권) · or_co '0040106' 2행(판매중 2 · DS증권)
    sql: printf('%08d', CAST(C AS INTEGER))   # 또는 조회 전 파이썬 str.rjust(8,'0')
  malformed_as_missing:
    _note: >-
      규칙 B(§9-3) 도입. dummy_as_missing 이 못 잡는 축 — 쓰레기값('wtrewrwe'·'sdf')·절단 코드('KRZ' 계열)는
      값이 있어 보여도 식별 기능이 없다. 결측으로 보고 **노드 생성 금지** — rptt 가짜 Fund 노드 잔여 5개는
      이 규칙을 반영한 KG 재생성(P1-4 묶음)에서 자동 해소된다(§9-4-3, 별도 처리 없음).
    columns: [std_itm_no, ksd_itm_no, rptt_ksd_itm_no, fss_itm_no]   # 전부 12자 고정
    sql: (length(trim(C)) <> 12)
    실측_2026-08-30: std 127(판매중 3) · ksd 67 · rptt 16 · fss 0 = 210행
    🔴_적용금지: >-
      mtco_itm_no 는 운용사 내부번호라 가변 길이 — 짧은 값 7,962행은 정상이다(리드 판정 08-31,
      query_rules.펀드단위 참조). 기관코드(or_co·trusc)는 code_width 로 살린다. 설명 텍스트 컬럼에 걸지 말 것.
    형식정규식_기각: >-
      12자를 채운 이탈('KRdfdfsdfsdf'·'KRZdfdfdfdfd'·'kR5205A22251' 류)은 길이로 못 잡으나 소수라
      형식 정규식은 비용 대비 **기각**(리드 판정 08-31). 식별자 조인은 어차피 실물 대조(kg_alias)를 거친다.

  # ── 수치 컬럼의 0 처리 (주최 공지 2026-08-24: 0/결측은 의도된 값 → 빼거나 "없다"고 응답) ──
  zero_as_missing:
    _note: >-
      🔴 기본 규칙 — 수치 컬럼을 **정렬·필터·집계에 쓸 때는 IS NOT NULL AND <> 0** 을 건다. 개별 조회에서 0 은
      "수록되어 있지 않습니다" 로 답한다(값을 고쳐 채우지 말 것). 단 아래 zero_is_value 컬럼은 0 이 실제값이므로 예외.
      1차 규칙 fd_nast_suma(0값 294) · 수익률_9기간전부0(69) 은 2차에 해당 행이 0건이라 **삭제**했다.
