class_hierarchy:
  note: FIBO 원칙 — 펀드 유형은 owl:Class 하위클래스이지 개체가 아님. axis_fundType(주최 측 제시)이 법적 5분류 층위와 일치.
  Fund:
    SecuritiesFund:
    - EquityFund
    - BondFund
    - EquityMixedFund
    - BondMixedFund
    MoneyMarketFund: []
    MixedAssetsFund: []
    RealEstateFund: []
    SpecialAssetsFund: []
derivation_rules:
  _note: 🔴 or_attr_desc 는 단일 축이 아님 — 자산군·운용구조·파생활용 3축이 압축돼 있음. 재간접 3,022종목 중 1,604개가 실제로는 주식형. or_attr_desc='주식형'
    만 쓰면 1,461종목(25%)이 누락됨.
  assetClass:
    축: 무엇에 투자하는가 (하위클래스 결정)
    규칙: ① 종목명 괄호 표기 우선 — (주식…)→Equity, (채권…)→Bond, (주식혼합…)→EquityMixed, (채권혼합…)→BondMixed  ② 없으면 or_attr_desc
      로 폴백 (주식형/채권형/MMF/혼합자산/특별자산/임대형·대출형)
    판정률: 94.3% (10,500/11,139) · 불명 639종목
  isFundOfFunds:
    축: 운용 구조 (자산군과 직교)
    규칙: 종목명에 '재간접' 또는 or_attr_desc='재간접'
    해당: 3182
  usesDerivatives:
    축: 파생 활용 (직교)
    규칙: 종목명에 '파생' 또는 or_attr_desc='06'
    해당: 736
  isMasterFeeder:
    축: 모자형 구조 (직교)
    규칙: 종목명에 '증권자'/'자투자신탁' 패턴
    해당: 7237
  prfdAttrTag:
    축: prfd_attr_cd 한 컬럼에 3종류가 섞여 있음 — 형태로 갈라야 한다
    규칙: ① ISO 3자 대문자 → Country (investsIn)  ② <문자><3자리숫자> → FundAttribute (문자=축, 숫자=값)  ③ 그 외('해외' 1건)
      → 오염, 제외
    판정률: 국가 1,670행 + 코드형 93,948행 + 오염 1행 = 95,619 (100%)
    note: 이 컬럼이 행을 가르는 유일한 축이다 (45컬럼 중 itm_no 안에서 갈리는 건 이것뿐). 따라서 FundClass 의 스칼라 속성이 아니라 관계로 모델링해야 한다
