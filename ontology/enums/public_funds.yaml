      🔴 '배당'·'인컴' 은 투자 전략(태그 '배당주')이지 분배 방식이 아니다. 분배 방식 질의는 태그 '분배식' + fd_last_dstb_r.
      🔴 '전환형' 은 목표전환과 연금·엄브렐러 전환이 다른 개념 — 질의 어휘('목표'·'연금')로 가른다.
  이름표기_우선순위:
    triggers: [헤지, 환헤지, 재간접, 파생, 연금, 사모, 통화, 자산군, 주식형, 채권형, 혼합형, 괄호]
    text: >-
