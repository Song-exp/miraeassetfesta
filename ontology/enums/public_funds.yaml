# public_funds — 사람의 판단을 담는 파일
# 기계적 사실은 *.auto.yaml 에 있습니다. 여기엔 판정과 규칙만 씁니다.
# 런타임 가드레일이 이 파일을 읽습니다.
#
# 이력:
#   2026-08-25  🔴 2차 데이터(8/24 배포 · 기준일 2026-08-22) 기준 재작성.
#               1차(7/11) 의 "종목×속성태그 롱 포맷"(95,619행) 구조가 사라지고 23,676행 × 75컬럼 · itm_no 유일.
#               prfd_attr_cd 삭제 → prfd_attr_cds(쉼표 목록) 로 집약. 보수 4종·클래스 체계·제로인 유형·자산구성비 신규.
#               🔴 1차 기준 수치(11,139종목·8,445 판매중·오염 9종목 등)를 인용한 다른 문서는 전부 구식이다.
#               1차 분석에서 2차로 재검증하지 못한 판정은 "(1차 실측)" 으로 표기해 남겼다.

domain: public_funds

# 리드 결정 2026-08-31 (§12-6 결정 5) — 사실상 빈 컬럼·답변금지 컬럼을 스키마 프롬프트에서 제외한다.
# 스키마 서두가 "여기 없는 컬럼은 존재하지 않는다" 이므로, 제외 = 플래너가 참조 자체를 못 함.
# 질의 대응은 answer_rules('1주 수익률 미수록' 안내)와 평가문항 FND-R02 가 담당한다.
schema_exclude:
- fd_wk1_ern_r     # 1주수익률 — 23,676/23,676 전건 결측 (08-31 재실측)
- fd_prsv_r        # 답변금지 (컬럼 정책)
- fd_sbpr          # 답변금지 (컬럼 정책)
- itm_eabrv_nm     # 영문약어명 — 99.4% 결측, 영문명 안내는 itm_eng_nm 경로만(§6-1 정정)

# ── 행의 낟알(row grain) — 이 테이블의 구조 그 자체 ──────────────────────
row_grain:
  구조: 행 = 종목(itm_no) — 클래스 단위 마스터. 23,676행 = 23,676 distinct itm_no · NULL 0
  evidence_grade: A
  증명: >-
    🔑 2026-08-25 2차 데이터 실측 — itm_no 가 행 단위로 완전 유일하다 (profile_table primary_key 탐지기 확인).
    1차의 행 폭발 원인이던 prfd_attr_cd 가 삭제되고 prfd_attr_cds(쉼표 구분 목록) 로 집약됐다.
    따라서 "COUNT(*) 금지 · GROUP BY itm_no 선행" 규칙은 **폐기**한다 — 행 = 종목이다.
  std_itm_no의_위치: >-
    std_itm_no 는 클래스 묶음 키가 **아니다** — distinct 18,948 중 18,909 가 itm_no 와 1:1 이고
    2개 이상 itm_no 를 가리키는 값은 39개뿐. 결측 515 + '00000       '(패딩 위장결측) 145 = 실질 결측 660 —
    **전부 판매완료**. 펀드(클래스 묶음) 단위 키는 여전히 (or_co_xtn_itt_cd, mtco_itm_no) 합성키다 (query_rules.펀드단위).
  answer_policy: >-
    상품 개수 질의: 행수 = 종목(클래스) 수 23,676. 단 🔴 **사모 8,960행이 섞여 있다** (1차엔 168행) —
    '공모펀드' 개수는 prvo_pbff_desc='공모' 14,716, 그중 판매중 8,969. 모수를 반드시 밝힐 것.

columns:
  # ── 식별 ────────────────────────────────────────────────────────────
  itm_no:
    korean_name: 종목번호
    missing_reason: none
    note: "식별 기준 키 · 행 PK(23,676 완전 유일). 개수·조인·식별은 이 컬럼으로. (2026-08-29 B-1-60 신설 — DB 재현: count=distinct=23,676)"
  std_itm_no:
    korean_name: 표준종목번호
    missing_reason: missing
    evidence_grade: A
    missing_semantics:
      '00000       ': missing          # 🔴 2차 신규 위장결측 — 5자리 0 + 공백 7 = 12자 패딩 145행 (2026-08-31 리터럴 폭 정정). trim 후 '00000'
    evidence: >-
      2026-08-25 실측 — NULL 515 · '00000       ' 145 = 660행, 전부 sale_yn='판매완료'. 판매중 결측 0.
      1차의 "따옴표 오염 9종목" 은 2차에서 **소멸**(contaminated_rows 감지 0행).
    answer_policy: >-
      결측 시 sale_yn 을 직접 읽어 병렬 서술 — '판매완료 상품이며 표준종목번호는 조회되지 않습니다'.
      인과로 서술 금지(판매완료 12,714 중 12,054 는 값 보유). 식별은 itm_no 로 한다.
  rptt_ksd_itm_no:
    korean_name: 대표예탁원종목번호
    missing_reason: unresolved
    evidence_grade: C
    evidence: 2026-08-29 — NULL 116 + 더미 6,970 = 7,086행(29.9% · 판매중 116행 1.1%). 더미 대부분 'KR0000000000' 5,308·'000000000000' 1,645. 기전(미부여/말소)은 확정 불가 → 답변 배제(값 없으면 "확인 불가"). 검수 C. (DB 재현 확인)
    answer_policy: >-
      결측 시 '확인할 수 없음' + sale_yn 병렬 서술. 인과 서술 금지. 대체 식별자는 ksd_itm_no(결측+더미 2,370, 전체 10.0%).
    applies_to:
    - ksd_itm_no
    - rptt_ksd_itm_no
  ksd_itm_no:
    korean_name: 예탁원종목번호
    missing_reason: unresolved
    evidence_grade: C
    answer_policy: 결측·더미 2,370행(전체 10.0% · 판매중 116행 1.1%). 다른 코드가 빌 때 대체 식별자로 제시 가능. 더미('KR'+0패딩·반복문자)는 normalization.dummy_as_missing 으로 배제. (2026-08-29 DB 재현 갱신 — 구 592행/2.5%)
  fss_itm_no:
    korean_name: 금융감독원종목번호
    missing_reason: unresolved
    evidence_grade: C
    evidence: >-
      2026-08-25 — NULL 42 + 더미 '000000000000' 11,611 = 11,653행(49.2%). 판매완료 10,317/12,714 · 판매중 1,336/10,962(12.2%).
      판매중에서도 비므로 판매상태로 설명 불가(1차 판정 유지).
    answer_policy: 더미를 값으로 취급 금지(조인 시 한 값에 1만 행이 뭉친다). 결측 시 '확인할 수 없음'.
    applies_to:
    - fss_itm_no
    - kofia_fd_ccd
  kofia_fd_ccd:
    korean_name: 금융투자협회펀드분류코드
    missing_reason: unresolved
    evidence_grade: C
    evidence: 2026-08-25 — NULL 45 + 더미 '0'×20 11,431 = 11,476행(48.5%). 판매중 1,158/10,962. fss_itm_no 와 사실상 한 현상.
    answer_policy: >-
      더미 배제. 값이 있어도 20자리 자리별 의미 미해독(주최 코드북 미제공 확정) → 코드를 답변에 노출하지 말 것.
      분류 질의는 zrin_btyp_nm·zrin_ptn_nm·or_attr_desc 등 명칭 컬럼으로 답한다.
  mtco_itm_no:
    korean_name: 운용사종목번호
    missing_reason: missing
    evidence_grade: C
    evidence: 2026-08-25 — NULL 116 + 더미 '000000000000' 등 869행(3.7%). 길이 1~12 로 흔들림(선행 0 손실 + 12자리 더미).
    answer_policy: >-
      🔴 단독 키로 조인 금지 — 415종의 값이 2개 이상 운용사에 걸친다. 펀드 단위 키는 (or_co_xtn_itt_cd, mtco_itm_no).
      zero-pad 는 7자리 기준(길이 8 이상의 이상값은 자르지 말 것 — query_rules.펀드단위_근거).
  itm_eabrv_nm:
    korean_name: 종목영문약어명
    missing_reason: missing
    evidence_grade: A
    answerable_n: 148
    answer_policy: >-
      결측 23,528/23,676(99.4%). 필터·조인 금지. 🔴 "영문 표기는 itm_eng_nm(결측 0) 으로" 는 틀린 안내였다(2026-08-30 정정) —
      itm_eng_nm 은 NULL 이 0 일 뿐 실제 영문명은 27% 다(itm_eng_nm 참조). 148행 중 '상환일_2018.05.13' 류 메모 6행(전부 판매완료).

  # ── 이름 (2026-08-30 블록 ② 판정 — 검토기록 공모펀드_검토기록_2026-08-30_이름계열.md) ─────────
  itm_nm:
    korean_name: 종목명
    missing_reason: none
    evidence_grade: A
    answerable_n: 23676
    note: >-
      NULL 0 · 공백 0. 무의미값 3행('00'·'ㅊ'·'DEL', 전부 판매완료) — 이름 컬럼은 dummy_as_missing 화이트리스트 밖이라 규칙을 걸지 않고 note 로만 둔다.
      🔴 종목명은 키가 아니다 — 45명칭/97행이 중복(판매중 포함 2그룹: '마이다스블루칩배당증권투자신탁 1(주식)C1' 판매완료+판매중 재발행 ·
      '블랙록월드광업주펀드' 역외 itm_no 2개). 답변 식별은 itm_no.
    answer_policy: >-
      상품명 질의는 itm_nm LIKE 부분일치(query_rules.종목명검색). 한 펀드의 클래스(A/C/Ce…)가 각각 한 행이므로
      부분일치 결과가 복수면 "클래스 n개" 로 묶어 itm_no 를 병기한다. 영문 상품명 질의도 itm_nm 으로 푼다(itm_eng_nm 참조).
  itm_abrv_nm:
    korean_name: 종목약어명
    missing_reason: none
    evidence_grade: A
    answerable_n: 23676
    note: >-
      NULL 0. 꼬리 공백 45행(판매중 44 — 'GLV             ' 류) → normalization.trim_columns 등재로 처리.
      itm_nm 과 동일 2,389행 · itm_nm 보다 긴 값 39행. 🔴 클래스를 구분하지 못한다 — 판매중 17그룹이 약어 하나를 공유
      (다올중국플러스찬스 8클래스가 '다올중국플러스찬스증권(채권혼합)A' 하나). 오매칭 표본 1: '피델리티기간산업' 이
      '피델리티테크놀로지(판매중지)'(OS555085806M) 에도 붙어 있다.
    answer_policy: 표시·검색 보조용. 필터·조인·클래스 식별에 쓰지 말 것(같은 약어에 최대 8클래스 · 다른 펀드 1건). 검색은 itm_nm 우선.
  itm_eng_nm:
    korean_name: 종목영문명
    missing_reason: mixed
    evidence_grade: A
    answerable_n: 2424          # 판매중·공모 8,969 중 실제 영문명 2,424(27.0%) · 판매중 2,651 · 전체 6,451(27.2%)
    missing_semantics:
      itm_nm복사: 13,972행(59.0%) — 한글 종목명이 그대로 들어 있다 (판매중 6,014)
      대문자화: 2,757행 — itm_nm 을 upper() 한 값('C-Pe'→'C-PE')
      영한혼합: 318행 — 'MIRAEASSET GLOBAL SOLUTION 40 FUND1(BOND HYBRID)운용' 류
      운영메모: 177행 — '소규모해지'·'2014.12.10 소규모 임의해지 예정'·'(2014.09.01 상환. 운용사공문)' (🔴 전부 판매완료 · 판매중 0)
      무의미: 1행 — '0'
      영문실재: 6,451행 — 라틴 문자가 있고 한글이 없는 값
    sql_영문실재: (itm_eng_nm <> itm_nm AND itm_eng_nm NOT GLOB '*[가-힣ㄱ-ㅎ]*' AND itm_eng_nm GLOB '*[A-Za-z]*')   # 2026-08-30 실측 6,451 · 판매중 2,651 · 판매중·공모 2,424
    answer_policy: >-
      🔴 NULL 0 이 "영문명 있음" 이 아니다 — 73% 가 한글(복사·대문자화). 영문 상품명 질의를 itm_eng_nm LIKE 로 풀지 말 것(itm_nm 으로).
      영문명을 제시할 때는 sql_영문실재 조건을 만족하는 값만 쓰고, 아니면 "영문명 미제공" 으로 답한다. 운영메모 177행은 판매완료라 기본모수에서 빠진다.

  # ── 판매·구매가능 ──────────────────────────────────────────────────
  sale_yn:
    korean_name: 판매여부
    missing_reason: none
    evidence_grade: A
    value_semantics:
      판매중: 신규 가입 가능 = 🔴 "구매가능" (주최 공지 2026-08-24 — 상폐/리스팅종료 외 전부 구매가능)
      판매완료: 신규 가입 중단. 청산·종료가 아니다 — 기존 투자자는 남아 있음
    note: >-
      2026-08-25 — 판매중 10,962 · 판매완료 12,714. 🔴 1차(판매중 76,318행/8,445종목 · 판매완료 19,300행)와 달리
      판매완료가 과반이며, 판매완료 행은 평가 컬럼(위험등급·수익률·순자산·제로인 유형)이 98~99% 결측이다.
      → query_rules.판매중만 이 모든 집계의 기본 필터다.
  thco_sale_yn:
    korean_name: 당사판매여부
    missing_reason: none        # 빈칸은 결측이 아니라 값이다 (1차 판정 유지)
    evidence_grade: A
    value_semantics:
      'Y': 당사(미래에셋증권) 취급
      null: 당사 미취급 — 'N' 의 자리. 결측이 아니다. SQL 은 IS NULL 로 걸 것
    note: >-
      2026-08-25 — Y 10,597 · NULL 13,079. NULL+판매중 2,412행 중 **사모 1,979** 가 대부분 —
      1차의 "NULL+판매중 11종목" 서술은 2차(사모 포함)에서 무효. ✅ 재검증 2026-08-25: NULL+판매중 2,412 = 사모 1,993 + 공모 419 — 공모 419 는 "당사 미취급 공모펀드"로 기본 모수에서 제외하지 말 것(판매중이면 조회 대상).
    answer_policy: 빈칸의 뜻은 sale_yn·prvo_pbff_desc 와 함께 읽을 것. "당사 미취급이라 정보가 부족" 식 인과 서술 금지.
  prvo_pbff_desc:
    korean_name: 사모공모구분코드 설명
    missing_reason: none
    evidence_grade: A
    trap: >-
      🔴 2차에 **사모 8,960행(37.8%)** 이 들어왔다 (1차 168행). '공모펀드 마스터' 라는 테이블명을 믿고 필터를
      생략하면 사모가 섞인다. 공모 질의는 query_rules.공모만 필수. 사모 하위: 일반사모 3,286 · 일반사모(2015년전) 3,607 · PEF 7 · 해당없음 2,060.
  prvo_fd_desc:
    korean_name: 사모펀드구분코드 설명
    missing_semantics:
      해당없음: not_applicable
    note: 공모 14,716행은 전부 '해당없음'. 사모 안에서만 값이 갈린다.
  pers_corp_desc:
    korean_name: 개인법인구분코드 설명
    missing_semantics:
      해당없음: not_applicable
    note: "'해당없음' 19,258 = 개인/법인 전용이 아닌 일반 펀드. 개인 1,912 · 법인 2,506."
  pfiv_sale_cntl_tcd:
    korean_name: 판매통제구분코드
    missing_reason: none
    note: "'00' 22,263 · '01' 1,378 · '02' 16 · '03' 19. 코드 의미 미제공(주최 확정) — 검수 C 2026-08-25 — '01'~'03' 도 판매중·완료에 고루 분포해 값으로 판매가능 여부를 유추할 수 없음. 어떤 질의에도 사용 금지(배제)."

  # ── 보수 (🆕 2차 신규 — 1차엔 미제공이라 설명서 파싱으로 대체했던 값) ──
  or_co_rwrd_r:
    korean_name: 집합투자업자보수 (운용보수)
    missing_reason: none
