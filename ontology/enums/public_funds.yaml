# public_funds — 사람의 판단을 담는 파일
# 기계적 사실은 *.auto.yaml 에 있습니다. 여기엔 판정과 규칙만 씁니다.
# 런타임 가드레일이 이 파일을 읽습니다.

domain: public_funds
columns:
  prvo_fd_desc:
    korean_name: 사모펀드구분코드 설명
    missing_semantics:
      해당없음: not_applicable
    note: '''해당없음'' 95,451건은 prvo_pbff_desc=''공모'' 와 1:1 완전 대응. 정상 정보.'
  pers_corp_desc:
    korean_name: 개인법인구분코드 설명
    missing_semantics:
      해당없음: not_applicable
    note: '''해당없음'' 73,054건 = 개인/법인 전용이 아닌 일반 펀드. 정상 정보.'
  exchdg_yn:
    korean_name: 환헤지여부
    missing_reason: not_applicable
    answer_policy: 국내 펀드의 환헤지 문의 → '해당사항 없음'. 해외/혼합 펀드의 결측만 '확인할 수 없음'.
    note: 국내 투자 펀드는 환율 위험이 없어 환헤지 개념 자체가 없음. 국내 87.7%(29,040/33,107) 결측 vs 해외 0.8%(435/51,628).
  fd_nast_suma:
    korean_name: 펀드 순자산
    missing_reason: missing
    answer_policy: 순자산 Top-N 질의는 sale_yn='판매중' 으로 한정하고 모수를 밝힐 것. 값은 클래스 합계이므로 GROUP BY mtco_itm_no 필요.
    note: 판매완료 59.0%(11,390/19,300) vs 판매중 1.5%(1,148/76,318). 판매중단 펀드에 집중되나 완전 대응은 아니므로 결측으로 둠.
  zrin_fd_ivst_risk_gcd:
    korean_name: 제로인펀드투자위험등급코드
    missing_reason: missing
    answer_policy: 위험등급 필터 질의는 모수 77,203/95,619 를 명시.
    note: 전 운용유형에 걸쳐 결측(7~45%). 특정 유형 문제가 아니라 평가사(제로인)가 등급을 산출하지 않은 펀드로 보임.
  fd_yr1_ern_r:
    korean_name: 펀드 1년수익률
    missing_reason: mixed
    answer_policy: 수익률은 **누적**임을 답변에 명시할 것 ('3년 수익률 10.5%' 를 연 10.5% 로 오해 방지). 결측 시 패턴을 보고 응답을 가를 것 —
      신생 펀드에 '데이터 미제공' 이라고 답하면 안 된다. Top-N 은 모수를 밝히고 수익률정상 규칙(> -100)으로 오류 종목을 제외할 것.
    note: '위험등급 결측과 18,404행 동시 발생, 등급만 결측은 12행. → 수익률과 위험등급이 같은 평가 데이터 소스. / 단위 확정: 누적 수익률(연환산 아님) — 저변동군
      예측오차 누적 0.014 vs 연환산 0.048, MMF 5년 16.07% ≈ (1.03)^5. / ⚠️ 이전 note 의 ''중첩 위반 수천 건'' 은 행 기준 오독이었음.
      종목 기준으로는 127종목(1.1%)뿐이고 98.9%가 운용기간·미평가로 설명됨.'
    unit: percent_cumulative
    applies_to:
    - fd_wk1_ern_r
    - fd_mm1_ern_r
    - fd_mm3_ern_r
    - fd_mm6_ern_r
    - fd_yr1_ern_r
    - fd_mm18_ern_r
    - fd_yr2_ern_r
    - fd_yr3_ern_r
    - fd_yr5_ern_r
    missing_patterns:
      _판정근거: 설정일 컬럼이 없어 중첩 패턴으로 상품 나이를 추정. 11,139종목 전수 분류 (짧은 기간→긴 기간 순으로 값이 채워졌는지)
      접미결측:
        판정: not_applicable
        종목: 1994
        비율: 17.9%
        뜻: 짧은 기간부터 차례로 있고 그 뒤가 비어 있음 = 설정된 지 얼마 안 된 펀드
        근거: 위험등급·순자산 보유율 100% (정상 펀드) · 끊기는 지점이 기간 순서를 정확히 따름
        응답: '''설정 후 기간이 짧아 N년 수익률이 아직 산출되지 않았습니다'''
      전무:
        판정: missing
        종목: 3536
        비율: 31.7%
        뜻: 🔴 신생이 아님 — 평가사(제로인)가 평가하지 않은 펀드
        근거: 이 그룹만 위험등급 보유 27.3% · 순자산 47.7% · 판매중 26.2% (다른 패턴은 모두 100%/100%/98%+). 운용유형 분포는 정상 그룹과 유사
          → 상품 성격이 아니라 평가 데이터 소스가 통째로 없음
        응답: '''평가 데이터가 제공되지 않았습니다'''
      구멍:
        판정: 데이터 오류 후보
        종목: 127
        비율: 1.1%
        뜻: 중간 기간이 비어 있음 — 운용기간으로 설명되지 않음
        근거: '패턴 50종. 상위: OOOO·OOOO 11 · OOOOOOO·O 10 · OOOOOO·OO 9'
        응답: 해당 기간만 '확인할 수 없음'. 인접 기간으로 대체 추정하지 말 것
      완전:
        판정: 해당없음
        종목: 5482
        비율: 49.2%
  itm_eabrv_nm:
    korean_name: 종목영문약어명
    missing_reason: missing
    answer_policy: 영문약어 질의는 '데이터 미제공'.
    note: 99.8%(95,447/95,619) 결측, distinct 14종. 사실상 빈 컬럼.
  fd_yr3_ern_r:
    korean_name: 펀드 3년수익률
    unit: percent_cumulative
    trap: KCGI베트남증권투자신탁(KR515303001M) 5행이 -4,381% 등 -100% 미만. 원금 전액 손실이 -100% 이므로 데이터 오류. 2년·3년·5년·18개월
      컬럼 동시 발생.
    answer_policy: 수익률 Top-N(최저) 질의 시 `> -100` 조건으로 오류 종목 제외.
normalization:
  trim_columns:
  - itm_abrv_nm
  - itm_eng_nm
  - itm_nm
  - kofia_fd_ccd
  - ksd_itm_no
  - prfd_attr_cd
  - rptt_ksd_itm_no
query_rules:
  종목단위: GROUP BY itm_no
  펀드단위: GROUP BY mtco_itm_no
  판매중만: sale_yn = '판매중'
  공모만: prvo_pbff_desc = '공모'
  ETF제외: itm_nm NOT LIKE '%상장지수%'
  수익률정상: fd_yr1_ern_r > -100 AND fd_yr3_ern_r > -100
  자산군_주식형: trim(or_attr_desc)='주식형' OR (trim(or_attr_desc) IN ('재간접','06') AND itm_nm LIKE '%(주식%')
entities:
  FundClass:
    kind: entity
    role: 주 노드
    source: itm_no
    count: 11139
    label: itm_nm
    note: 판매 단위(클래스). 44컬럼 속성이 여기 붙음
  Fund:
    kind: entity
    source: mtco_itm_no
    count: 4660
    label: null
    relation: FundClass -belongsToFund-> Fund
    note: 모펀드/운용 단위. NULL 1건. 순자산은 이 단위 합계
  ShareClass:
    kind: entity
    source: itm_nm 파싱(종류X/클래스X)
    count: 112
    relation: FundClass -hasShareClass-> ShareClass
    note: 펀드 간 통용 어휘(C 614펀드·A 607펀드). FIBO FundShareClassUnit 대응
  AssetManager:
    kind: entity
    source: or_co_xtn_itt_cd
    count: 67
    label: null
    relation: Fund -managedBy-> AssetManager  (FIBO hasManagementCompany)
    note: 🔴 이름 컬럼 없음 — 코드↔이름 매핑 필요
  Custodian:
    kind: entity
    source: trusc_xtn_itt_cd
    count: 18
    label: null
    relation: Fund -custodiedBy-> Custodian  (FIBO hasDepository)
    note: 🔴 이름 컬럼 없음
  Benchmark:
    kind: entity
    source: bmrk_nm
    count: 391
    label: bmrk_nm
    relation: FundClass -benchmarkedTo-> Benchmark  (FIBO definesBenchmark)
    note: 복합식 파싱 필요. 지수를 독립 개체로 세우면 '같은 지수를 추종하는 펀드와 ETF' 교차 질의가 가능해진다 (국내 한정)
    cross_domain: 🔵 국내ETF cu_base_index 19종 중 17종이 이 컬럼과 문자열까지 동일. 해외ETF(1,733종)와는 0종 — 표기 체계가 다름
    trap: '복합식·비중 표기가 섞임: ''MSCI ACWI CR 50% + 종합채권01Y 50%'' · ''DWGRTT 90%'' · ''(MSCI China지수 × 85%)
      + (VN지수 × 15%)'' → 파싱 전제'
  Country:
    kind: entity
    source: prfd_attr_cd 의 ISO 3자 태그 (17종) + fd_estb_ctry_cd(설립국)
    count: 17
    relation: FundClass -investsIn-> Country · Fund -establishedIn-> Country
    note: 투자국과 설립국(410=한국)은 다른 관계. 커버리지 13.9% 이므로 '중국 투자 펀드' 질의 시 모수 명시 필수 — 태그가 없다고 그 나라에 투자 안 하는 게 아님
    coverage: prfd_attr_cd 행 1,670/95,619 (1.7%) · 종목 1,549/11,139 (13.9%)
    trap: '''해외'' 1건이 태그 자리에 한글로 들어 있음 (ISO 코드 아님) — 화이트리스트에서 제외'
  FundAttribute:
    kind: entity
    source: prfd_attr_cd 의 <문자><3자리숫자> 태그 (210종)
    count: 210
    label: null
    relation: FundClass -hasAttribute-> FundAttribute
    coverage: prfd_attr_cd 행 93,948/95,619 (98.3%) · 종목 11,138/11,139
    axis_count: 15
    note: 🔴 의미 미해독. 문자=축, 숫자=축 안의 값 (EAV). 축 15개가 각각 무엇인지는 원본 schema/금투협 코드표와 대조 필요. 축별 카디널리티는 axes 참조.
      값 210종을 평면 태그로 모델링하지 말 것 — 축 15개 × 값 구조여야 한다
    axes:
      C:
        값: 4
        종목: 11138
        카디널리티: 정확히 2 (고정 2슬롯)
        대응컬럼: fd_set_pcd
        순도: 0.986
