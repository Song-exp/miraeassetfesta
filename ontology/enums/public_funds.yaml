    예: '삼성KODEX200증권상장지수투자신탁[주식]: 펀드 KR5114601001 / ETF KR7069500007'
    결정필요: 같은 개체로 병합할지, 병합한다면 매핑을 무엇으로 만들지 — 워크샵
