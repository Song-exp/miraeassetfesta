# shared/asset_class — 투자자산군 개체 (횡단 층)
# 국내ETF(한글 8종) ↔ 해외ETF(영문 6종) 표기를 잇는다.
#
# 값 근거: DB distinct 전수 확인 (2026-08-18)
#   domestic_etfs.wu_inv_ast_type : 주식 1,069 · 채권 261 · 원자재 207 · 혼합자산 78 · 단기자금 42 · 통화 41 · 부동산 18 · 기타 18
#   overseas_etfs.wu_inv_ast_type : Equity 2,500 · Alternatives 1,800 · Bond 1,084 · Mixed Assets 138 · Commodity 107 · Money Market 9
#
# 🔴 Alternatives 1,800건은 국내 대응 분류 없음 — "대응 없음"을 명시하는 것까지가 데이터 (BUILD_PLAN §4.1).
#    국내 '기타' 18건과의 동치 여부는 워크샵 안건 → pending.

entity: AssetClass
description: 투자자산군 (주식/채권/원자재 등)
property: hasAssetClass

nodes:
  AssetClass_Equity:
    label_ko: 주식
    label_en: Equity
    aliases:
      - {table: domestic_etfs, column: wu_inv_ast_type, raw: "주식",   source: manual, evidence: "1,069건"}
      - {table: overseas_etfs, column: wu_inv_ast_type, raw: "Equity", source: manual, evidence: "2,500건"}
  AssetClass_Bond:
    label_ko: 채권
    label_en: Bond
    aliases:
      - {table: domestic_etfs, column: wu_inv_ast_type, raw: "채권", source: manual, evidence: "261건"}
      - {table: overseas_etfs, column: wu_inv_ast_type, raw: "Bond", source: manual, evidence: "1,084건"}
  AssetClass_Commodity:
    label_ko: 원자재
    label_en: Commodity
    aliases:
      - {table: domestic_etfs, column: wu_inv_ast_type, raw: "원자재",   source: manual, evidence: "207건"}
      - {table: overseas_etfs, column: wu_inv_ast_type, raw: "Commodity", source: manual, evidence: "107건"}
  AssetClass_Mixed:
    label_ko: 혼합자산
    label_en: Mixed Assets
    aliases:
      - {table: domestic_etfs, column: wu_inv_ast_type, raw: "혼합자산",     source: manual, evidence: "78건"}
      - {table: overseas_etfs, column: wu_inv_ast_type, raw: "Mixed Assets", source: manual, evidence: "138건"}
  AssetClass_MoneyMarket:
    label_ko: 단기자금
    label_en: Money Market
    aliases:
      - {table: domestic_etfs, column: wu_inv_ast_type, raw: "단기자금",     source: manual, evidence: "42건"}
      - {table: overseas_etfs, column: wu_inv_ast_type, raw: "Money Market", source: manual, evidence: "9건"}
  AssetClass_Currency:
    label_ko: 통화
    note: 국내ETF 에만 존재 (통화선물 ETF 41건) — 해외 분류엔 없음
    aliases:
      - {table: domestic_etfs, column: wu_inv_ast_type, raw: "통화", source: manual, evidence: "41건"}
  AssetClass_RealEstate:
    label_ko: 부동산
    note: 국내ETF 에만 존재 (리츠 18건)
    aliases:
      - {table: domestic_etfs, column: wu_inv_ast_type, raw: "부동산", source: manual, evidence: "18건"}
  AssetClass_Alternatives:
    label_ko: 대체투자
    label_en: Alternatives
    note: "🔴 해외 1,800건 — 국내 대응 분류 없음(명시). 국내 '기타' 18건과의 동치는 워크샵 안건"
    aliases:
      - {table: overseas_etfs, column: wu_inv_ast_type, raw: "Alternatives", source: manual, evidence: "1,800건 — 레버리지·인버스 등 포함 추정"}
      - {table: domestic_etfs, column: wu_inv_ast_type, raw: "기타", source: manual, evidence: "18건 — Alternatives 동치 미확정", status: pending}

absent_in:
  domestic_bonds: "자산군 컬럼 없음 — 상품 자체가 채권. 클래스 계층(DomesticBond ⊂ Bond)으로 처리"
  public_funds: "직접 자산군 컬럼 없음 — kofia_fd_ccd 20자리 파싱 또는 or_attr_desc 유도 필요 (enums §or_attr_desc: 3축 압축 — 단순 매핑 금지). 워크샵 안건"
