# shared/asset_class — 투자자산군 개체 (횡단 층)
# 국내ETF(한글 8종) ↔ 해외ETF(영문 6종) 표기를 잇는다.
#
# 값 근거: DB distinct 전수 확인 — 2차 데이터(기준일 2026-08-22) 2026-09-02 재확인. (1차 2026-08-18 수치는 괄호)
#   domestic_etfs.wu_inv_ast_type : 주식 1,015 · 채권 221 · 원자재 211 · 대체투자 132 · 혼합자산 86 · 단기자금 45 · 기타 37 · 통화 29 · 부동산 4
#                                   (1차: 주식 1,069 · 채권 261 · 원자재 207 · 혼합자산 78 · 단기자금 42 · 통화 41 · 부동산 18 · 기타 18 — 2차에 '대체투자' 신설)
#   domestic_etfs.ref_ast_type    : Equity 790 · Bond 135 · Alternatives 132 · Mixed Assets 83 · Money Market 30 · Other 19 · Commodity 19 · NULL 572
#   overseas_etfs.wu_inv_ast_type : Equity 2,595 · Alternatives 2,061 · Bond 1,112 · Mixed Assets 138 · Commodity 111 · Money Market 9 · NULL 11
#                                   (1차: Equity 2,500 · Alternatives 1,800 · Bond 1,084 · Mixed Assets 138 · Commodity 107 · Money Market 9)
#
# 🔴 해외 Alternatives 2,061건 — 2차에서 국내 '대체투자' 132건(ref_ast_type Alternatives 와 동일 행)이 생겨 대응이 생겼다.
#    국내 '기타' 37건은 대체투자와 별개 표기 → AssetClass_Other.

