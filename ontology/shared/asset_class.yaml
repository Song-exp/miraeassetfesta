# shared/asset_class — 투자자산군 개체 (횡단 층)
# 국내ETF(한글 8종) ↔ 해외ETF(영문 6종) 표기를 잇는다.
#
# 값 근거: DB distinct 전수 확인 (2026-08-18)
#   domestic_etfs.wu_inv_ast_type : 주식 1,069 · 채권 261 · 원자재 207 · 혼합자산 78 · 단기자금 42 · 통화 41 · 부동산 18 · 기타 18
#   overseas_etfs.wu_inv_ast_type : Equity 2,500 · Alternatives 1,800 · Bond 1,084 · Mixed Assets 138 · Commodity 107 · Money Market 9
#
# 🔴 Alternatives 1,800건은 국내 대응 분류 없음 — "대응 없음"을 명시하는 것까지가 데이터 (BUILD_PLAN §4.1).
#    국내 '기타' 18건과의 동치 여부는 워크샵 안건 → pending.

