# shared/currency — 통화 개체 (횡단 층)
# 4개 테이블의 통화 표기를 하나의 노드로 잇는다. 사람의 판정만 쓴다 — 기계적 사실은 DB에 있다.
#
# 규격 (ONTOLOGY_BUILD_PLAN.md §2.3):
#   nodes.<NodeId>.aliases[] : {table, column, raw, source, evidence, status}
#     status: confirmed(기본, KG에 들어감) | pending(보류 — KG 제외, 리포트에만 표시)
#   absent_in : 컬럼 자체가 없는 테이블 → .ttl 속성 부재 선언 + 런타임 즉시 기각 근거
#
# 값 근거: DB distinct 전수 확인 (2026-08-18, financial_products.db)
#   domestic_etfs.pd_curr_cd   : CURR_CD_KRW 1,732 · CURR_CD_000 1
#   public_funds.curr_cd       : KRW 95,046 · USD 572
#   domestic_bonds.CURR_CD     : KRW 42,372 · USD 19 · JPY 1 · EUR 1 · 000 1
#   overseas_etfs.pd_trd_ccy   : USD 5,646 (단일값)

entity: Currency
description: 상품의 표시/거래 통화
property: hasCurrency          # .ttl DatatypeProperty 이름

nodes:
  Curr_KRW:
    label_ko: 원화
    label_en: KRW
    aliases:
      - {table: domestic_bonds, column: CURR_CD,    raw: "KRW",         source: manual, evidence: "distinct 전수 확인 260818"}
      - {table: domestic_etfs,  column: pd_curr_cd, raw: "CURR_CD_KRW", source: manual, evidence: "distinct 전수 확인 260818 — 접두사 CURR_CD_ 붙는 표기"}
      - {table: public_funds,   column: curr_cd,    raw: "KRW",         source: manual, evidence: "distinct 전수 확인 260818"}

  Curr_USD:
    label_ko: 미국 달러
    label_en: USD
    aliases:
      - {table: domestic_bonds, column: CURR_CD,    raw: "USD", source: manual, evidence: "외화채권 19건"}
      - {table: public_funds,   column: curr_cd,    raw: "USD", source: manual, evidence: "역외펀드 572건"}
      - {table: overseas_etfs,  column: pd_trd_ccy, raw: "USD", source: manual, evidence: "해외ETF 전량 USD 5,646건"}

  Curr_JPY:
    label_ko: 일본 엔
    label_en: JPY
    aliases:
      - {table: domestic_bonds, column: CURR_CD, raw: "JPY", source: manual, evidence: "1건"}

  Curr_EUR:
    label_ko: 유로
    label_en: EUR
    aliases:
      - {table: domestic_bonds, column: CURR_CD, raw: "EUR", source: manual, evidence: "1건"}

  Curr_Unknown:
    label_ko: 통화 미상
    note: "🔴 '000' 계열은 통화가 아니라 미입력 센티넬로 의심 — 워크샵 확정 필요"
    aliases:
      - {table: domestic_bonds, column: CURR_CD,    raw: "000",         source: manual, evidence: "1건 — 센티넬 의심", status: pending}
      - {table: domestic_etfs,  column: pd_curr_cd, raw: "CURR_CD_000", source: manual, evidence: "1건 — 센티넬 의심", status: pending}

absent_in: {}   # 통화 컬럼은 4개 테이블 모두 존재
