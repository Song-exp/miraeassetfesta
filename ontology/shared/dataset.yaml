# shared/dataset — 이 적재분(스냅샷)의 범위와 기준일. **데이터가 이렇다** 는 사실이지 상품의 성질이 아니다.
#
# 왜 따로 두는가 (2026-09-04):
#   "달러 채권은 없다"·"기준일은 8/24" 같은 문장을 규칙 본문에 적으면, 적재분이 바뀌는 순간 규칙이 거짓이 된다.
#   실제로 1차 데이터에는 외화채가 21건(USD 19·JPY 1·EUR 1) 있었고 2차에서 사라졌다 — 한 번 변한 축이다.
#   그래서 "이 데이터가 담고 있는 범위" 를 여기 한 곳에 선언하고, 규칙·게이트·답변 문구는 이것을 참조한다.
#   범위가 넓어지면(외화채가 들어오면) 이 파일 한 줄만 고치면 게이트가 자동으로 막지 않는다.
#
# 소비처: src/runtime/loader.dataset_scope() → gate.DATA_CUTOFF·BUYABLE_CUTOFF·SNAPSHOT_DATE,
#         enums/<table>.yaml scope + gate_constants(scope_key).

dataset: 미래에셋 금융상품 마스터 2차 배포분
source: 주최 제공 (2026-08-25 배포 · 참여자공유용 과제설명)

dates:
  snapshot: "2026-08-21"      # 데이터 스냅샷 종가일 — 전 행 info_base_dt. remaining_days·가격·수익률의 산출 기준
  as_of: "2026-08-22"         # 주최가 밝힌 데이터 기준(토, 영업일 아님) — 데이터 설명에만 쓴다
  decision: "2026-08-24"      # 질문 시점 = 답변의 '기준일' 표기 · 구매가능(만기 경과) 판정 (리드 결정 2026-09-02)
  note: >
    셋을 구분한다. 잔존일수는 snapshot 기준 원값을 그대로 인용하고(재계산 금지), 답변의 기준일 표기와
    만기 판정(mat_dt >= decision)은 decision 을 쓴다. 서비스로 옮길 때 decision 은 '오늘' 이 된다.

external_cutoff: "2026-08-24" # 외부 수집 자료 발행일 상한 (주최 규약)
