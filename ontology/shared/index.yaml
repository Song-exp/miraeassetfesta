# shared/index — 기초지수·벤치마크 개체 (횡단 층)
# 이 축이 유일하게 "값이 그대로 일치"하는 펀드↔ETF 다리다:
# ETF cu_base_index ∩ 펀드 bmrk_nm 완전일치 17쌍 (2026-08-18 DB 대조) — 전부 등록.
# + 국내ETF 전용 2종 (iSelect K-REITs · KRX 미디어통신).
#
# 컬럼이 달라(cu_base_index vs bmrk_nm) 표기가 같아도 alias 가 필요하다 —
# "어느 테이블 어느 컬럼에서 찾나"가 KG 가 답하는 정보이기 때문 (BUILD_PLAN §3.3).
#
# ✅ 2026-08-22 해외ETF 지수 등록 (이병철) — 2종 선반영 → 61종 매핑
#   원천 codebooks/index_master.csv (base_index 정규화본). 수익률방식(TR/CR/NR)·철자변형은
#   한 노드에 alias 로 묶는다 — 'S&P 500 TR/CR/NR' → Idx_SP500 (335→387건 통합 조회).
#   🔥 3중 연결 달성: Idx_MSCI_ACWI · Idx_MSCI_EM 은 국내ETF + 펀드 + 해외ETF 가 한 노드에 매달림.
#
# 🔴 미등록 (coverage report 로 추적):
#   · 펀드 전용 벤치마크 374종 (혼합식 'KOSPI200 25% + 종합채권01Y 75%' 다수 — 합성 벤치마크 분해는 워크샵 안건)
#   · 해외ETF 긴꼬리 ~1,670종 — 각 1~8건의 니치 지수(S&P 500 Catholic Values 등). 센티넬 2종
#     ('Index is not provided…' 1,984건 · 'Index is not available…' 721건)은 제외가 정상.
#     행 기준 커버리지는 비센티넬 2,933행 중 약 1,017행(35%) — 빈발 지수는 대부분 포함.

