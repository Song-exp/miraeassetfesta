# shared/index — 기초지수·벤치마크 개체 (횡단 층)
# 이 축이 유일하게 "값이 그대로 일치"하는 펀드↔ETF 다리다:
# ETF cu_base_index ∩ 펀드 bmrk_nm 완전일치 17쌍 (2026-08-18 DB 대조) — 전부 등록.
# + 국내ETF 전용 2종 (iSelect K-REITs · KRX 미디어통신).
#
# 컬럼이 달라(cu_base_index vs bmrk_nm) 표기가 같아도 alias 가 필요하다 —
# "어느 테이블 어느 컬럼에서 찾나"가 KG 가 답하는 정보이기 때문 (BUILD_PLAN §3.3).
#
# ✅ 2026-08-22 해외ETF 지수 등록(이병철) → 🔧 2026-08-25 자동 등록으로 대체됨
#   당시 codebooks/index_master.csv 로 해외 61종을 수동 등록했으나, index_auto.yaml 의 자동 등록
#   (지수 3,151노드 + 패밀리 closure)이 같은 값을 더 넓게 덮어 raw 값 충돌(V2) 59건이 발생.
#   → 수동 중복 노드 53개 삭제. 교차질의 연결은 alias 가 아니라 **parent(자동 패밀리)** 로 유지한다:
#     Idx_MSCI_ACWI → Idx_a_83b9b8edb8 · Idx_MSCI_EM → Idx_a_c2f932ab65 · Idx_SP500TR → Idx_a_25e8381c5f
#   즉 "국내ETF+펀드(수동 노드) ↔ 해외ETF(자동 노드)" 는 같은 패밀리 아래에서 closure 로 묶인다.
#   정규화 규칙(TR/CR/NR·철자변형 → base_index)은 codebooks/index_master.csv 에 남아 있다.

