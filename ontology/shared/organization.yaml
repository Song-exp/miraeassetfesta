# shared/organization — 운용사 개체 (횡단 층)
# 이 파일은 scripts 로 codebooks/public_funds_asset_manager.derived.csv 에서 생성 후 수작업 보정한다.
# 원천 코드북이 갱신되면(외부 코드북 회신) 재생성할 것.
#
# 채택 기준: evidence A(ETF 교차검증)·B(접두 점유율 90%+)·C(구상호 혼재하나 브랜드 식별) 만 확정.
#           D(접두=상품명)·E(브랜드 미식별) 22종은 제외 — coverage report 미매핑으로 추적, 워크샵 안건.
# 🔴 미해결: former_names(동양→우리 등 구상호) 는 DB 값이 아니라 질의 표기라 kg_alias 에 못 넣음.
#           질의측 동의어 테이블(kg_synonym)이 별도로 필요 — 후속 작업.
# 🔴 미해결: domestic_bonds.PD_PBCM 발행사 8,018종은 규칙 정규화 트랙 별도 (§4.1).

