  Region_Europe:
    label_ko: 유럽
    label_en: Europe
    parent: Region_Global
    aliases:
      - {table: domestic_etfs, column: wu_inv_rgn,      raw: "유럽",   source: manual, evidence: "7건"}
      - {table: overseas_etfs, column: wu_inv_rgn,      raw: "Europe", source: manual, evidence: "41건"}
      - {table: public_funds,  column: fd_ivst_rgn_desc, raw: "유럽",   source: manual, evidence: "1,846건"}
      - {table: overseas_etfs, column: wu_inv_rgn, raw: "EuroZone", source: manual, evidence: "2건 — 유로존≠유럽(영국·스위스 제외) 미확정", status: pending}

  Region_Emerging:
    label_ko: 이머징/브릭스
    label_en: Emerging Markets
    parent: Region_Global
    note: "🔴 지리 축 아닌 시장분류 축 — 별도 축 분리 여부 워크샵 안건"
    aliases:
      - {table: domestic_etfs, column: wu_inv_rgn,      raw: "이머징/브릭스", source: manual, evidence: "5건"}
      - {table: public_funds,  column: fd_ivst_rgn_desc, raw: "이머징/브릭스", source: manual, evidence: "2,261건"}
      - {table: overseas_etfs, column: wu_inv_rgn,      raw: "Global Emerging Markets", source: manual, evidence: "175건"}
