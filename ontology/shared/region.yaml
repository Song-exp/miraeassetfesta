    label_en: Americas
    parent: Region_Global
    note: "국내 데이터가 남미·북미를 하나로 묶어 표기 — 하위에 북미/남미/미국 계층"
    aliases:
      - {table: domestic_etfs, column: wu_inv_rgn,      raw: "남미/북미", source: manual, evidence: "12건"}
      - {table: public_funds,  column: fd_ivst_rgn_desc, raw: "남미/북미", source: manual, evidence: "4,984건"}

  Region_NorthAmerica:
