      - {table: domestic_etfs,  column: pd_risk_cd,               raw: "PD_RISK_GCD_11",       source: rule, evidence: "뒤 2자리-10 규칙"}
      - {table: domestic_etfs,  column: pd_risk_nm,               raw: "매우높은위험(1등급)",   source: manual, evidence: "distinct 확인 260818"}
      - {table: public_funds,   column: zrin_fd_ivst_risk_gcd,    raw: "1.0",                  source: rule, evidence: "실수 표기"}
      - {table: public_funds,   column: zrin_fd_ivst_risk_grd_nm, raw: "매우 높은 위험",        source: manual, evidence: "distinct 확인 260818 — 띄어쓰기 표기"}
