# shared/risk_grade — 투자위험등급 개체 (횡단 층)
# 3개 테이블 × 표기 3종(정수 / PD_RISK_GCD_1X 문자열 / 실수)을 하나의 등급 노드로 잇는다.
#
# 🔴 등급 범위는 0~6 (1~5 아님) — .agents/rules/miraeasset-rules.md §4.
#    6등급(2차 실측 2026-08-25): 채권 8,929 · 국내ETF 21 / 해당없음: 채권 19건("00").
# 🔴 해외ETF는 위험등급 컬럼 자체가 없음 → absent_in. "없다"도 데이터다.
#
# 값 근거: DB distinct 전수 확인 (2026-08-18 · 채권은 2026-08-25 2차 데이터로 갱신)
#   domestic_bonds.pd_risk_gcd          : '00','11'~'16' (문자열, 2차 데이터 — 1차의 0~6 정수는 코드 이슈로 폐기. pd_risk_nm 병행 수록)
#   domestic_etfs.pd_risk_cd            : PD_RISK_GCD_11 ~ _16 (뒤 2자리 - 10 = 등급)
#   domestic_etfs.pd_risk_nm            : '매우높은위험(1등급)' 등 6종
#   public_funds.zrin_fd_ivst_risk_gcd  : 1.0~6.0 (실수) · NULL 14,987행 (2차 2026-09-02 재확인 — 1차의 오염값 20054.0 은 2차에 없음)
#   public_funds.zrin_fd_ivst_risk_grd_nm : '매우 높은 위험' 등 6종 (띄어쓰기 있음) + 띄어쓰기 없는 변형 2종('높은위험' 20행·'보통위험' 8행) = 8종

entity: RiskGrade
description: 투자위험등급 (1=매우높은위험 ~ 6=매우낮은위험, 낮을수록 위험. 0=미분류)
property: hasRiskGrade
scale: "0~6 (정수)"
direction: "낮을수록 위험 (1=매우높은위험, 6=매우낮은위험)"

# ── 테이블별 값 범위 (2026-09-02 KG 1R S6) — enum 제약은 테이블별로 선언하고 게이트 상수·ttl 제약은 여기서 생성한다(코드 상수 금지).
#    펀드·국내ETF 는 1~6 (0 없음 — 펀드 등급 미수록 422클래스는 NULL 이지 0 이 아니다) · 채권은 '00' 미분류 코드가 실재해 0~6.
#    KG-013 실측: 7등급 즉답 문구가 "0~6" · KG-014: 펀드 0등급을 정의역으로 허용해 게이트 미발동 → "0개" 단언.
value_property: riskGradeValue
range_by_table:
  public_funds:   {min: 1, max: 6, label_min: "매우 높은 위험", label_max: "매우 낮은 위험", note: "0등급 없음 — 등급 미수록 클래스는 NULL(0 아님)"}
  domestic_etfs:  {min: 1, max: 6, label_min: "매우높은위험", label_max: "매우낮은위험", note: "0등급 없음"}
  domestic_bonds: {min: 0, max: 6, label_min: "매우높은위험", label_max: "매우낮은위험", unclassified: 0, note: "0 = 미분류 코드 '00'(pd_risk_gcd) 19건 실재 — 답변 가능"}

